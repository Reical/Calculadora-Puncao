    // usuário): orient fica igual ao de secao22 (~[0,1]), mas meio[2]=90 como plantaY
    camadaXGirada: { orient: [1.833559792885353e-8, 1.0], meio: [25.0, 0.0, 90.0, 0.0, 0.0, 0.0], cauda2: 1 },
    // marca de camada (barra reta) da Seção 2.2, usada pelas camadas extras (r.Nr>3,
    // dw4_anexarCamadaExtra). orient CORRIGIDO (sessão 2026-09-09, base nova): era [~0,1]
    // (validado só pra base ANTIGA, Nr=5/25x100) — arquivo real da base NOVA (Nr=4, 25x60)
    // mostra [1,0], meio=[25,0,0,90,0,0] e cauda2=2 (esses dois batiam, só orient mudou)
    secao22Camada: { orient: [1.0, 0.0], meio: [25.0, 0.0, 0.0, 90.0, 0.0, 0.0], cauda2: 2 },
    // marca de camada (barra reta) da Seção 1.1, espelho de secao22Camada — achada sessão
    // 2026-09-09 (mesmo arquivo real Nr=4): orient=[1,0], meio=[25,0,0,90,0,0], cauda2=1
    secao11Camada: { orient: [1.0, 0.0], meio: [25.0, 0.0, 0.0, 90.0, 0.0, 0.0], cauda2: 1 },
  }[tipo];
  const cauda2 = caudaOverride != null ? caudaOverride : cfg.cauda2;
  push4(cfg.orient[0]); push4(cfg.orient[1]);
  for (const v of cfg.meio) push4(v);
  bytes.push(0, 0, cauda2, 0, 0, 0);
  return bytes;
}

function dw4_criarRetangulo1504(x, y) {
  const bytes = [0x15, 0x04];
  const push4 = (v) => {
    const buf = new ArrayBuffer(4);
    new DataView(buf).setFloat32(0, v, true);
    for (let i = 0; i < 4; i++) bytes.push(new Uint8Array(buf)[i]);
  };
  push4(x); push4(y);
  push4(0.02); push4(0.02); // raio, confirmado fixo por decodificação exata
  for (let i = 0; i < 10; i++) bytes.push(0); // 10 bytes finais, confirmados zerados
  return bytes;
}

function dw4_criarSegmento0b0d(p1x, p1y, p2x, p2y, cauda = 1) {
  // cauda NÃO é um terminador fixo como se pensava — CORRIGIDO por comparação byte a byte
  // com arquivo real salvo pelo S4CAD: tick usa 1 (valor antigo, ainda correto pra esse
  // caso), mas leque de setas usa 3. Sem esse parâmetro, os segmentos do leque criados
  // pelo código ficavam com o valor errado (nunca detectado antes por causa do bug do
  // marcador de fim, que escondia esse conteúdo do S4CAD)
  const bytes = [0x0b, 0x0d];
  const push4 = (v) => {
    const buf = new ArrayBuffer(4);
    new DataView(buf).setFloat32(0, v, true);
    for (let i = 0; i < 4; i++) bytes.push(new Uint8Array(buf)[i]);
  };
  push4(p1x); push4(p1y); push4(p2x); push4(p2y);
  bytes.push(cauda, 0);
  return bytes;
}

// variante (0b,03) do segmento acima — usada pra indicação do N1 na PLANTA BAIXA (marca
// de "leque" que aponta as camadas, igual à Seção 2.2, mas em opcode diferente e sem a
// linha final vértice→extremo). CONFIRMADO por decodificação exata comparando arquivo
// gerado x sequência de redesenho manual do usuário (passo a passo, elemento por
// elemento) — esse indicador nunca existiu no template nem era criado pelo código antes
// disso, mesmo no caso de 1 par só (bug antigo, não introduzido nesta sessão)
function dw4_criarSegmento0b03(p1x, p1y, p2x, p2y, cauda = 1) {
  const bytes = [0x0b, 0x03];
  const push4 = (v) => {
    const buf = new ArrayBuffer(4);
    new DataView(buf).setFloat32(0, v, true);
    for (let i = 0; i < 4; i++) bytes.push(new Uint8Array(buf)[i]);
  };
  push4(p1x); push4(p1y); push4(p2x); push4(p2y);
  bytes.push(cauda, 0);
  return bytes;
}

// opcode (0x0b,0x0e) — achado sessão 2026-09-25, exclusivo do template de pilar circular+radial
// (DW4_TEMPLATE_RADIAL_B64). Mesmo layout geométrico do 0b0d/0b03 (op+p1x+p1y+p2x+p2y), mas a
// cauda de 2 bytes é SEMPRE (3,2) nesse template — confirmado por decodificação exata dos 3
// arquivos reais (P10/P20/P30), nunca (cauda,0) como as outras variantes 0b0d/0b03. Usado tanto
// pros raios da "barra cobra" (achado desta sessão, ver dw4_criarRaioRadial) quanto pelas bordas
// da tabela "ARMADURA DE COLAPSO" nesse template (essas últimas não são geradas por código —
// ficam como estão no template, só a numeração da tabela precisaria de patch futuro).
function dw4_criarSegmento0b0e(p1x, p1y, p2x, p2y) {
  const bytes = [0x0b, 0x0e];
  const push4 = (v) => {
    const buf = new ArrayBuffer(4);
    new DataView(buf).setFloat32(0, v, true);
    for (let i = 0; i < 4; i++) bytes.push(new Uint8Array(buf)[i]);
  };
  push4(p1x); push4(p1y); push4(p2x); push4(p2y);
  bytes.push(3, 2);
  return bytes;
}

function dw4_criarTexto200e(x, y, texto, girado) {
  // "N1"/"N5"/"N6" etc NÃO são texto solto — são uma LEGENDA vinculada à tabela de
  // ferros do S4CAD (confirmado pelo usuário: renumerar a tabela atualiza a legenda
  // automaticamente). Faltava um campo real: 2 bytes depois do texto = ÍNDICE DO FERRO
  // (N1→1, N2→2, ..., N7→7), não um valor fixo. CONFIRMADO por decodificação exata de
  // arquivo real (comando FERRO→LEGENDA do S4CAD, não o texto comum) — sem esse campo
  // (ou com o valor errado) o S4CAD mostra "ERRO" no lugar da legenda. Derivado aqui
  // automaticamente do próprio texto ("N5" -> índice 5), já que todo uso atual é desse
  // formato
  const bytes = [0x20, 0x0e];
  const push4 = (v) => {
    const buf = new ArrayBuffer(4);
    new DataView(buf).setFloat32(0, v, true);
    for (let i = 0; i < 4; i++) bytes.push(new Uint8Array(buf)[i]);
  };
  push4(x); push4(y);
  // orient: (1,0) pro caso normal (N1), (~0,1) "girado" pro N2 — mesma convenção epsilon já
  // usada em camadaYGirada/plantaY/secao22Camada. CORRIGIDO sessão 2026-09-09 (achado com
  // arquivo real de 3 pares N2): os rótulos N2/N3/N4 do par novo usavam (1,0) por engano,
  // herdado do dw4_criarTexto200e original (só usado pra N1 até então)
  if (girado) { push4(1.833559792885353e-8); push4(1.0); }
  else { push4(1.0); push4(0.0); }
  bytes.push(0x4e); // byte fixo 'N', confirmado por decodificação exata
  const txtBytes = dw4_stringParaBytes(texto);
  bytes.push(txtBytes.length & 0xff, (txtBytes.length >> 8) & 0xff);
  for (const b of txtBytes) bytes.push(b);
  const indiceFerro = parseInt(texto.replace(/[^0-9]/g, ''), 10) || 0;
  bytes.push(indiceFerro & 0xff, (indiceFerro >> 8) & 0xff);
  return bytes;
}

// "barra cobra" radial (pilar circular, padraoArmadura="radial") — achada sessão 2026-09-25 por
// decodificação de 3 arquivos reais (P10 N=8/Nr=4, P20 N=10/Nr=4, P30 N=13/Nr=6, todos Ø40cm).
// Geometria confirmada exata: o segmento (0x0b,0x0e) começa exatamente na borda do círculo
// (raio = diâmetro/2/25) no ângulo indicado, e se estende radialmente por `comprimentoFU`
// (= (2×primeiraCamada + (Nr-1)×Sr)/25 — mesma fórmula do "comprimento total" horizontal do
// memorial, NÃO depende de N, só de Nr). O rótulo "N1" (dw4_criarTexto200e, reaproveitado sem
// alterar) fica no meio do raio (along ≈ raio + comprimentoFU/2), deslocado perpendicularmente
// por uma pequena distância pra legibilidade — sinal do deslocamento ainda não 100% derivado
// (confirmado empírico: positivo quando cos(ângulo)≥0, negativo quando cos(ângulo)<0, "flip" pra
// manter o texto legível/não de cabeça pra baixo); valor absoluto aproximado (~0,15 FU), não
// crítico — é só a posição do texto, cosmético, não afeta a geometria estrutural do raio.
function dw4_criarRaioRadial(cx, cy, anguloGraus, raioCirculoFU, comprimentoFU) {
  const rad = (anguloGraus * Math.PI) / 180;
  const cosA = Math.cos(rad);
  const sinA = Math.sin(rad);
  const pBordaX = cx + raioCirculoFU * cosA;
  const pBordaY = cy + raioCirculoFU * sinA;
  const pForaX = cx + (raioCirculoFU + comprimentoFU) * cosA;
  const pForaY = cy + (raioCirculoFU + comprimentoFU) * sinA;
  // ordem p1/p2 confirmada por decodificação exata (3 arquivos reais): ângulo < 180° grava
  // borda→fora, ângulo ≥ 180° grava fora→borda (mesma linha, S4CAD não liga pra ordem — só
  // pra bater byte a byte com o que o S4CAD real produz)
  const anguloNorm = ((anguloGraus % 360) + 360) % 360;
  const [p1x, p1y, p2x, p2y] =
    anguloNorm < 180 ? [pBordaX, pBordaY, pForaX, pForaY] : [pForaX, pForaY, pBordaX, pBordaY];
  const seg = dw4_criarSegmento0b0e(p1x, p1y, p2x, p2y);
  const along = raioCirculoFU + comprimentoFU / 2;
  const perp = cosA >= 0 ? 0.15 : -0.15;
  const labelX = cx + along * cosA - perp * sinA;
  const labelY = cy + along * sinA + perp * cosA;
  const label = dw4_criarTexto200e(labelX, labelY, "N1", false);
  return [...seg, ...label];
}

// texto (0x1f,0x1e) — achado sessão 2026-09-25, template de pilar circular+radial. Mesma família
// do TXT1f13 (op+5×float32+flag+slen+pad+texto), mas SEM o campo de índice de 2 bytes no final
// (confirmado por decodificação exata: flag=0, orient sempre (1,0), 5º float sempre 0,21 —
// provavelmente a "altura do texto"). Usado pelos números pequenos da Seção 1.1 (zigue-zague do
// estribo) e outras legendas curtas desse template.
function dw4_criarTexto1f1e(x, y, texto) {
  const bytes = [0x1f, 0x1e];
  const push4 = (v) => {
    const buf = new ArrayBuffer(4);
    new DataView(buf).setFloat32(0, v, true);
    for (let i = 0; i < 4; i++) bytes.push(new Uint8Array(buf)[i]);
  };
  push4(x); push4(y); push4(1.0); push4(0.0); push4(0.21);
  const txtBytes = dw4_stringParaBytes(texto);
  bytes.push(0, txtBytes.length & 0xff, 0);
  for (const b of txtBytes) bytes.push(b);
  return bytes;
}

// Seção 1.1 (elevação em zigue-zague da barra "cobra", pilar circular+radial) — achada sessão
// 2026-09-25 por decodificação de 3 arquivos reais (P10/P20 Nr=4, P30 Nr=6). Path em DEGRAUS
// retos, mesma lógica de pontos já usada por FerroCobraDiagram (componente de preview React,
// mantido em sincronia manual com esta função — se um mudar, o outro precisa mudar junto). Centro
// horizontal do desenho é uma constante FIXA (39,61655 — confirmada idêntica nos 2 Nr diferentes,
// não depende de diâmetro/Nr), então o desenho só cresce/encolhe simetricamente em torno desse
// ponto conforme o comprimento total muda. Nível inferior (Y_BASE) também fixo; nível superior =
// Y_BASE + alturaRamo (em FU). Posição dos rótulos de dimensão é uma aproximação (offset fixo
// abaixo/acima dos horizontais, à direita dos verticais) — cosmético, não confirmado exato como a
// geometria dos segmentos em si (mesma categoria de aproximação já usada em dw4_criarRaioRadial).
// pontos em DEGRAUS retos do zigue-zague (mesma lógica de FerroCobraDiagram, ver abaixo) — extraído
// à parte porque é reaproveitado tanto pro "Estribo" com rótulos (dw4_criarZigzagEstribo) quanto
// pelo zigue-zague duplo da malha negativa SEM rótulos (dw4_criarZigzagSemLabel, achado depois)
function dw4_pontosZigzag(xStartFU, yBaseFU, yTopFU, primeiraCamadaCm, SrCm, Nr) {
  const pontos = [[xStartFU, yBaseFU]];
  let xFU = xStartFU;
  let yFU = yBaseFU;
  for (let i = 0; i < Nr; i++) {
    xFU += (i === 0 ? primeiraCamadaCm : SrCm) / 25;
    pontos.push([xFU, yFU]);
    yFU = yFU === yBaseFU ? yTopFU : yBaseFU;
    pontos.push([xFU, yFU]);
  }
  xFU += primeiraCamadaCm / 25;
  pontos.push([xFU, yFU]);
  return pontos;
}

function dw4_criarZigzagEstribo(primeiraCamadaCm, SrCm, alturaRamoCm, Nr) {
  const CX_ESTRIBO = 39.61655;
  const Y_BASE = 3.2841;
  const comprimentoTotalCm = 2 * primeiraCamadaCm + (Nr - 1) * SrCm;
  const xStartFU = CX_ESTRIBO - comprimentoTotalCm / 25 / 2;
  const yTopFU = Y_BASE + alturaRamoCm / 25;
  const pontos = dw4_pontosZigzag(xStartFU, Y_BASE, yTopFU, primeiraCamadaCm, SrCm, Nr);

  const bytes = [];
  let camadaHoriz = 0; // índice do segmento horizontal atual (0..Nr) — usado pra saber se o texto
  // é primeiraCamadaCm (pontas) ou SrCm (meio), em vez de recalcular a partir das posições em FU
  // (arredondamento de float podia dar 1cm errado pra valores fracionários tipo 7,5 — achado
  // sessão 2026-09-26 com um pilar h=20cm/primeiraCamada=7,5cm)
  for (let i = 0; i < pontos.length - 1; i++) {
    const [x1, y1] = pontos[i];
    const [x2, y2] = pontos[i + 1];
    bytes.push(...dw4_criarSegmento0b0e(x1, y1, x2, y2));
    const horizontal = Math.abs(y2 - y1) < 1e-6;
    if (horizontal) {
      const compCm = camadaHoriz === 0 || camadaHoriz === Nr ? primeiraCamadaCm : SrCm;
      camadaHoriz++;
      const midX = (x1 + x2) / 2;
      const labelY = y1 === Y_BASE ? Y_BASE - 0.174 : yTopFU + 0.19;
      bytes.push(...dw4_criarTexto1f1e(midX, labelY, String(compCm)));
    } else {
      const compCm = Math.round(alturaRamoCm);
      const midY = (y1 + y2) / 2;
      bytes.push(...dw4_criarTexto1f1e(x1 + 0.21, midY + 0.02, String(compCm)));
    }
  }
  return bytes;
}

// zigue-zague duplo da "malha negativa" (planta baixa, achado sessão 2026-09-25 comparando P10 vs
// P30) — visualmente o MESMO desenho do Estribo (mesma altura de ramo, mesmo comprimento total),
// só que aparece 2× flanqueando o pilar (um terminando na borda esquerda do círculo, outro
// começando na borda direita), em nível Y diferente (6,7441/7,4641, achado por decodificação), e
// SEM rótulos de dimensão (confirmado: nenhum TXT1f1e nessa região nos 3 arquivos reais). As setas
// de indicação + rótulos "N1" que ficam logo depois no arquivo são CONSTANTES (coordenadas
// idênticas nos 3 arquivos reais, independente de Nr) — não precisam de nenhum patch, só ficam
// "carregadas" pro lugar certo pelo próprio splice deste bloco.
// centro fixo (planta da Seção 1.1, NÃO a planta baixa — não usar cx0/19.78 aqui, bug já cometido e
// corrigido sessão 2026-09-25) e constantes do "corte da laje" (a caixa que envolve a malha
// negativa) — achadas sessão 2026-09-26 comparando um 3º arquivo real (Ø40/h=20/Nr=4, memorial
// "MEMORIAL H 20 CM.pdf") contra o mesmo pilar em h=25: a caixa é SEMPRE centrada no mesmo Y
// (7,1041) e sua altura é exatamente h/25 FU — X da caixa é uma constante FIXA (35,9808/43,2543),
// independente de h/Nr/comprimentoRadial (achado FALSO nas rodadas 1-3: parecia coincidir com a
// ponta do zigue-zague só porque as amostras testadas até então tinham comprimentoRadial parecido).
// O zigue-zague da malha negativa fica a 0,14 FU acima da base da caixa, sempre (confirmado exato
// nos 2 h's testados: 25 e 20).
const CX_ESTRIBO = 39.61655;
function dw4_secao11CorteConstantes(hCm) {
  const boxTopY = 7.1041 + hCm / 50;
  const boxBottomY = 7.1041 - hCm / 50;
  return { boxTopY, boxBottomY, zigzagYBase: boxBottomY + 0.14 };
}

function dw4_criarZigzagMalhaNegativa(raioCirculoFU, primeiraCamadaCm, SrCm, alturaRamoCm, Nr, hCm) {
  const { zigzagYBase: Y_BASE } = dw4_secao11CorteConstantes(hCm);
  const Y_TOP = Y_BASE + alturaRamoCm / 25;
  const comprimentoTotalFU = (2 * primeiraCamadaCm + (Nr - 1) * SrCm) / 25;
  const pillarLeftFU = CX_ESTRIBO - raioCirculoFU;
  const pillarRightFU = CX_ESTRIBO + raioCirculoFU;
  const pontosEsq = dw4_pontosZigzag(pillarLeftFU - comprimentoTotalFU, Y_BASE, Y_TOP, primeiraCamadaCm, SrCm, Nr);
  const pontosDir = dw4_pontosZigzag(pillarRightFU, Y_BASE, Y_TOP, primeiraCamadaCm, SrCm, Nr);
  const bytes = [];
  for (const pontos of [pontosEsq, pontosDir]) {
    for (let i = 0; i < pontos.length - 1; i++) {
      const [x1, y1] = pontos[i];
      const [x2, y2] = pontos[i + 1];
      bytes.push(...dw4_criarSegmento0b0e(x1, y1, x2, y2));
    }
  }
  return bytes;
}

// setas de indicação ("leque") + rótulo "N1" que apontam pra ponta do zigue-zague da malha
// negativa. Achado sessão 2026-09-26, CORRIGIDO no mesmo dia após um teste de regressão: a
// 1ª hipótese (vetor fixo relativo à ponta, ou seja dependente de comprimentoRadial/Nr) batia
// exata no h=20 mas quebrava P30 (Nr=6, h=25) — P10/P20/P30 (3 arquivos reais, Nr=4 e Nr=6)
// têm a MESMA posição absoluta pro leader independente de Nr/Fk/comprimentoRadial, então na
// verdade ele só depende de h (provavelmente um elemento "de estoque" que o desenhista não
// atualiza por pilar, só por h). Reimplementado como interpolação LINEAR em h a partir de 2
// amostras (h=25 nativo, h=20 ajustado do usuário) — cada lado (esquerdo/direito) com seu
// próprio coeficiente (achado que NÃO são espelhados, provavelmente por causa da paridade do
// zigue-zague nas pontas). Só 2 amostras de h — extrapolação pra h muito diferente de 20-25 é
// especulativa, precisa de uma 3ª amostra pra confirmar linearidade.
function dw4_criarLeaderMalhaNegativa(hCm, ladoDireito) {
  const [p1xN, p1yN, p2xN, p2yN, p3xN, p3yN, dxPorH, dyPorH, dxLabel, dyLabel] = ladoDireito
    ? [43.7196, 5.9491, 43.0346, 5.9491, 42.7983, 6.7138, -0.09236, 0.02606, 0.327, 0.1524]
    : [36.5699, 5.9648, 37.3101, 5.9648, 37.5935, 6.7532, -0.1394, 0.01818, -0.3444, 0.144];
  const d = 25 - hCm;
  const dx = dxPorH * d, dy = dyPorH * d;
  const p1x = p1xN + dx, p1y = p1yN + dy;
  const p2x = p2xN + dx, p2y = p2yN + dy;
  const p3x = p3xN + dx, p3y = p3yN + dy;
  const bytes = [];
  bytes.push(...dw4_criarSegmento0b0d(p1x, p1y, p2x, p2y));
  bytes.push(...dw4_criarSegmento0b0d(p2x, p2y, p3x, p3y));
  bytes.push(...dw4_criarTexto200e(p2x + dxLabel, p2y + dyLabel, "N1", false));
  return bytes;
}

// fileira de cotas acima da caixa do "corte da laje" (mesmo detalhamento primeiraCamada/Sr do
// zigue-zague, mas como uma cota CONTÍNUA — não em degraus) — achada sessão 2026-09-26, CORRIGIDA
// 2x no mesmo dia. O 7º campo (deslocamento da linha de chamada) só usa um valor especial no
// primeiro/último registro quando o valor do trecho (primeiraCamadaCm) é FRACIONÁRIO (ex.: "7,5")
// — quando é inteiro (ex.: "10" no P30/Nr=6) o campo é sempre 0,5, igual aos do meio (achado no
// teste de regressão com P30 — a 1ª versão sempre usava o valor especial, só "batia" no h=20 por
// coincidência de lá ter dado fracionário). O valor especial em si NÃO é uma constante fixa —
// acompanha h: primeiro = -0,9256 + 0,01852×(h-20), último = 1,9256 - 0,01852×(h-20) (nota:
// primeiro+último = 1,0 sempre — achado com um 4º arquivo real, h=30, que deu -0,7404/+1,7404 em
// vez dos -0,9256/+1,9256 do h=20; só 2 pontos de h, mas o fit bate exato nos dois e o invariante
// soma=1 é um bom sinal de que é uma fórmula real, não ruído).
function dw4_criarFileiraCota(xStartFU, yTopFU, primeiraCamadaCm, SrCm, Nr, hCm) {
  const yExtFU = yTopFU + 0.25;
  const pontaFracionaria = !Number.isInteger(primeiraCamadaCm);
  const f7Primeiro = -0.9256 + 0.01852 * (hCm - 20);
  const f7Ultimo = 1.9256 - 0.01852 * (hCm - 20);
  const bytes = [];
  let x = xStartFU;
  for (let i = 0; i <= Nr; i++) {
    const compCm = i === 0 || i === Nr ? primeiraCamadaCm : SrCm;
    const x2 = x + compCm / 25;
    const f7 = i === 0 && pontaFracionaria ? f7Primeiro : i === Nr && pontaFracionaria ? f7Ultimo : 0.5;
    bytes.push(...dw4_criarCota28_06(x, yTopFU, x2, yTopFU, x2, yExtFU, String(compCm), f7));
    x = x2;
  }
  return bytes;
}

function dw4_criarCota28_06(p1x, p1y, p2x, p2y, p3x, p3y, texto, f7 = 0.5) {
  const bytes = [0x28, 0x06];
  const push4 = (v) => {
    const buf = new ArrayBuffer(4);
    new DataView(buf).setFloat32(0, v, true);
    for (let i = 0; i < 4; i++) bytes.push(new Uint8Array(buf)[i]);
  };
  push4(p1x); push4(p1y); push4(p2x); push4(p2y); push4(p3x); push4(p3y);
  push4(f7); push4(0.0);
  bytes.push(0);
  const txtBytes = dw4_stringParaBytes(texto);
  bytes.push(txtBytes.length & 0xff, (txtBytes.length >> 8) & 0xff);
  for (const b of txtBytes) bytes.push(b);
  return bytes;
}

// anexa os registros geométricos de UMA camada extra (índice 3, 4, 5...) além das 3 já
// suportadas nativamente pelo template — confirmado seguro por comparação real (S4CAD
// aceita registros novos ANEXADOS NO FINAL do arquivo, sem mexer em nada do meio)
// fórmula confirmada com 2 casos reais (N=2 e N=3): pares distribuídos a partir do
// centro, offsets em múltiplos de "largura" — N par usa múltiplos ÍMPARES (±1,±3,±5...),
// N ímpar tem um par central em 0 e os demais em múltiplos PARES (±2,±4...). Ambos os
// casos batem com a MESMA fórmula: multiplicador = 2×|distância do meio|
function dw4_offsetPar(indicePar, totalPares, larguraEstribo) {
  const meio = (totalPares - 1) / 2;
  const distanciaDoMeio = indicePar - meio;
  const sinal = Math.sign(distanciaDoMeio);
  const multiplicador = 2 * Math.abs(distanciaDoMeio);
  return sinal * multiplicador * larguraEstribo / 25;
}

// Gera TODOS os elementos de "pares extras" (N>1) pro sentido de N1 (Estribo X, cujos
// pares variam em Y). Reposiciona/mantém os 6 pontos de camada já existentes (via
// DW4_PONTOS_CAMADA_X, tratado separadamente), e GERA do zero: pontos de referência,
// retângulo "em corte" (Seção 2.2), barra reta (Seção 2.2), leque de setas e textos —
// pra CADA par de 0 a totalPares-1 (não existem no template quando totalPares=1)
// FASE 2 (base nova "DETBASEPUNCAO"): reescrita completa pra base nova. Geometria (xVertice,
// xExtremo, xBarraSecao22, xRetSecao22, offset ±0,76 dos pontos de referência, yConexao=y-0,8,
// yVertice=yConexao-0,4631, tick N5/N6) derivada de 2 arquivos reais (2 pares e 3 pares,
// desenhados à mão pelo usuário na base nova) — só validada pra pilar padrão 25x60cm; ainda
// não depende de ap/bp (ver [[dw4-base-template-migration]] memória do projeto, sessão
// 2026-09-08, pra tabela completa de achados e o que falta generalizar).
//
// MUDANÇA DE MODELO em relação à base antiga: não existe mais um "par 0 especial" que é
// reposicionado em vez de criado — confirmado com o usuário que TODOS os pares (inclusive o
// que já vem no template) precisam ocupar a posição correta de offsetsN1[i]. O par cujo
// offsetsN1[i] é exatamente o que o template já representa (índice m = floor((totalPares-1)/2),
// ex.: o par central quando totalPares é ímpar) não precisa de nenhum conteúdo novo — ele já
// é coberto pelo deslocamento uniforme aplicado em DW4_PONTOS_X (ver dw4_reposicionarTudo:
// offsetsN1[m]/25 é somado a todo Y-companion de DW4_PONTOS_X, incluindo os textos N1/N5/N6
// do próprio template — CONFIRMADO por decodificação: os 4 registros de texto "N1"/"N5"/"N6"
// do template já estão dentro de DW4_PONTOS_X). Cria-se conteúdo novo pra TODOS os outros
// índices — inclusive o que seria "i=0" na convenção antiga, quando ele não for o índice m.
function dw4_gerarParesN1(arr, cx0, cy0, totalPares, offsetsN1, deltaLarguraEstriboX, camadaXPorLado) {
  // gap "0,76"/"0,8" abaixo — achado sessão 2026-09-08 (comparação com arquivo corrigido à mão):
  // esses gaps encolhem junto com deltaLarguraEstriboX (mesma correção usada na planta baixa
  // "fixa"/DW4_PONTOS_PLANTA_LARGURA_Y_POS/NEG) — confirmado exato pra 0,76→0,36 e 0,8→0,4
  // quando deltaLarguraEstriboX=-20 (Δ=-0,4=deltaLarguraEstriboX/2/25 nos dois casos)
  const gap = deltaLarguraEstriboX / 2 / 25;
  // Seção 2.2 é uma view GIRADA: a direção Y da planta (onde os pares se distribuem) vira a
  // direção X da Seção 2.2. CONFIRMADO com 3 amostras reais (2 pares + par pos/neg de 3 pares):
  // xSecao22(par i) = xSecao22Base + off(i) — MESMO "off" usado pra Y na planta, escala 1:1 —
  // e o Y da Seção 2.2 é FIXO (não depende do par nem usa a fórmula "y±0,36" que a Seção 1.1/
  // outras partes usam). O retângulo fica sempre a ±0,76 do X da barra reta daquele par.
  const xSecao22Base = 39.6166; // X da barra reta quando off=0 (achado no próprio template)
  const ySecao22 = 4.0679; // Y da barra reta — FIXO, confirmado igual nas 4 amostras reais
  const yRetSecao22 = [4.7079, 4.1079]; // Y dos 2 níveis do retângulo — FIXO
  const xVertice = [17.3468, 22.2085]; // média dos 2 arquivos reais (22.2037/22.2132)
  const xExtremo = [16.6762, 22.879]; // média dos 2 arquivos reais (22.8742/22.8838)
  const xTick = [23.9025, 24.5505]; // vértice do "tick" N5/N6 e sua ponta horizontal
  const xTickBase = 23.22; // X de onde partem as duas diagonais do tick (ligadas a y±0,76)

  const indiceParTemplate = Math.floor((totalPares - 1) / 2);

  for (let i = 0; i < totalPares; i++) {
    if (i === indiceParTemplate) continue; // já representado pelo template + deslocamento uniforme
    const off = offsetsN1[i] / 25;
    const y = cy0 + off;
    // conexão/vértice do leque de indicação (usado pela Seção 2.2 e, mais abaixo,
    // também pela indicação do N1 na planta baixa) — CORRIGIDO pra base nova: 0,8 (não 0,4
    // como na base antiga), confirmado igual nos 2 arquivos reais (2 pares e 3 pares)
    const yConexao = y - (0.8 + gap);
    const yVertice = yConexao - 0.4631;

    // ORDEM abaixo é a sequência EXATA confirmada nos 2 arquivos reais (2 pares e 3 pares),
    // registro por registro via decodificação — não é só "que registros existem" mas também
    // "em que ordem", pra descartar qualquer chance de a ordem importar pro parser do S4CAD.
    // NENHUMA indicação 0b,03 existe no arquivo real pra pares extras — a versão anterior
    // desta função criava 6 registros 0b,03 a mais por par que NÃO deviam existir (bug real,
    // confirmado com 0 ocorrências de 0b,03 na região anexada dos arquivos reais) — REMOVIDO.

    // marcas de camada (camadaXGirada) na planta baixa — 3 por lado, mesma Y do par. NÃO
    // existia no código da base antiga pra pares extras (gap conhecido, ver memória do
    // projeto item 9 da engenharia reversa original) — confirmado que a base nova precisa
    // disso (6 registros novos por par, achados no arquivo real de 2 pares)
    for (let lado = 0; lado < 2; lado++) {
      const xCamUnicos = [...new Set(camadaXPorLado[lado])];
      for (const xCam of xCamUnicos) {
        arr.push(...dw4_criarPonto21_0e(xCam, y, 'camadaXGirada'));
      }
    }

    // pontos de referência (2, ±0,76 em Y, encolhendo com "gap" quando larguraEstribo≠2d)
    arr.push(...dw4_criarPonto21_0e(cx0, y - (0.76 + gap), 'plantaX'));
    arr.push(...dw4_criarPonto21_0e(cx0, y + (0.76 + gap), 'plantaX'));

    // leque de setas: 3 posições de camada por lado convergem no mesmo vértice,
    // que depois tem uma linha reta final até o ponto extremo
    for (let lado = 0; lado < 2; lado++) {
      for (const xCam of camadaXPorLado[lado]) {
        arr.push(...dw4_criarSegmento0b0d(xCam, yConexao, xVertice[lado], yVertice, 3));
      }
      arr.push(...dw4_criarSegmento0b0d(xVertice[lado], yVertice, xExtremo[lado], yVertice, 3));
    }

    // textos N1 (um por lado) — logo após o leque, antes do tick N5/N6 (ordem real confirmada)
    arr.push(...dw4_criarTexto200e(xVertice[0] - 0.34, yVertice + 0.16, 'N1'));
    arr.push(...dw4_criarTexto200e(xVertice[1] + 0.35, yVertice + 0.15, 'N1'));

    // "tick" que conecta o rótulo N5/N6 aos pontos de referência (±0,76) — yTick=y+0,1165
    // confirmado EXATO em 3 amostras reais (2 pares + par positivo/negativo de 3 pares)
    const yTick = y + 0.1165;
    arr.push(...dw4_criarSegmento0b0d(xTickBase, y + (0.76 + gap), xTick[0], yTick));
    arr.push(...dw4_criarSegmento0b0d(xTick[0], yTick, xTickBase, y - (0.76 + gap)));
    arr.push(...dw4_criarSegmento0b0d(xTick[0], yTick, xTick[1], yTick));

    // textos N6/N5 — offsets = média de 3 amostras reais (2 pares + par positivo/negativo de
    // 3 pares) relativos a xTick[1]/yTick — variam ±0,02-0,05 entre amostras (provavelmente
    // ruído de medição/arredondamento do texto); aproximação razoável, não byte-exata como o
    // resto desta função
    arr.push(...dw4_criarTexto200e(xTick[1] - 0.348, yTick + 0.183, 'N6'));
    arr.push(...dw4_criarTexto200e(xTick[1] - 0.336, yTick - 0.195, 'N5'));

    // Seção 2.2 (barra reta + retângulo em corte) — por último, ordem real confirmada.
    // X desloca com "off" (mesma escala da planta), Y é fixo (ver comentário no topo da função)
    const xSecao22 = xSecao22Base + off;
    arr.push(...dw4_criarPonto21_0e(xSecao22, ySecao22, 'secao22'));
    for (const yr of yRetSecao22) {
      arr.push(...dw4_criarRetangulo1504(xSecao22 - (0.76 + gap), yr));
      arr.push(...dw4_criarRetangulo1504(xSecao22 + (0.76 + gap), yr));
    }
  }
}

// Espelho de dw4_gerarParesN1 pro sentido de N2 (Estribo Y, cujos pares variam em X,
// afetando a Seção 1.1). Mesma estratégia: reposiciona os elementos do template pro par 0
// em vez de duplicar, cria novos pros pares 1+. Offsets encontrados por decodificação direta
// (mesma técnica usada pra confirmar/corrigir dw4_gerarParesN1) — MENOS testados que os de
// N1 (só verificados numa configuração de geometria até agora), recomenda-se confirmar
// visualmente no S4CAD antes de considerar definitivo
// Espelho de dw4_gerarParesN1 pro sentido N2 (Estribo Y, pares variam em X, afetam a Seção
// 1.1 em vez da 2.2). Reescrita do zero (sessão 2026-09-09) — a versão anterior era sobra da
// base ANTIGA (offsets/coordenadas fora de alcance na base nova de 6604 bytes) e ficava
// DESLIGADA de propósito em gerarArquivoS4. Constantes achadas por decodificação de 3
// arquivos reais desenhados à mão no S4CAD (2 pares N2, +Seção 1.1 do 2º par, 3 pares N2) —
// mesma técnica/mesmo indiceParTemplate de dw4_gerarParesN1 (nenhum par fica fixo quando
// totalPares>1, confirmado pelo usuário — ver memória do projeto). O arquivo de 3 pares tinha
// um desvio de desenho (~2,53cm em X / ~0,63cm em Y, provavelmente o pilar inteiro arrastado
// sem querer ao editar) — corrigido matematicamente antes de extrair as constantes abaixo;
// uma vez corrigido, bateu exato com o arquivo de 2 pares em toda a geometria relativa.
function dw4_gerarParesN2(arr, cx0, cy0, totalPares, offsetsN2, deltaLarguraEstriboY, camadaYPorLado, bpMeio, ehBorda, deltaAlturaEstriboX) {
  const gap = deltaLarguraEstriboY / 2 / 25;
  // pilar de borda (tipoPilar==="B"): o lado +Y (índice 1) é a face livre — não existe estribo
  // nenhum ali pra apontar, então o leque/camada/texto "N2" desse lado nunca deveriam ser
  // gerados (o template todo aqui foi herdado do pilar central, sempre 2 lados). CONFIRMADO
  // (sessão 2026-09-15, arquivo real AJUSTADO.DW4, teste com pares-extras=2/ap=80/bp=25): o
  // lado negativo (índice 0) sai idêntico ao já gerado; o lado positivo precisa nem existir.
  // yTickTopo/yTickVertice/yTickBase e o texto N3/N4 (fixos, calibrados só p/ pilar central)
  // também precisam de valores próprios pro caso de borda — só 1 amostra real até agora, sinalizar
  // se aparecer um 2º caso divergente.
  const ladosAtivos = ehBorda ? [0] : [0, 1];
  const xSecao11Base = 39.6165; // X da barra reta da Seção 1.1 quando off=0 (achado no template)
  // ySecao11/yRetSecao11: valores calibrados p/ pilar central. Pilar de borda usa valores PRÓPRIOS
  // (achado sessão 2026-09-15, 2º arquivo real — 100x25/2 pares: o retângulo em corte do par extra
  // saía com o tail de bytes certo mas nos níveis Y errados; PT/RECT confirmados byte-exato contra
  // AJUSTADO.DW4 real com esses valores)
  const ySecao11 = ehBorda ? 8.7641 : 8.7241; // Y — FIXO
  const yRetSecao11 = ehBorda ? [9.4041, 8.8041] : [9.4441, 8.7641]; // Y dos 2 níveis do retângulo em corte — FIXO
  // xVertice = pairX + relVertice — confirmado EXATO em 3 valores de pairX diferentes
  // (16.58/21.38/22.98), mesmo valor herdado da base antiga (relVertice[1] de lá)
  const relVertice = 1.2745361328125;
  // yVertice/yExtremo/yTick* NÃO são fixos por par — achado sessão 2026-09-10 (arquivo real
  // ajustado à mão, pilar 100x25cm, largura Y=2d): os valores abaixo foram validados com um
  // pilar de bp=60 (bpMeio=1,2); pra bp=25 (bpMeio=0,5) precisam de -0,7 (=deltaBpMeio), com
  // sinal invertido pro lado negativo. Fórmula: valor_original ± deltaBpMeio (+ pro lado
  // negativo [idx0], - pro lado positivo [idx1] e pro tick, que segue o lado positivo)
  const BP_MEIO_TEMPLATE = 1.2; // bp=60 → 60/2/25
  const deltaBpMeio = bpMeio - BP_MEIO_TEMPLATE;
  const yVertice = [-3.079 - deltaBpMeio, 3.321 + deltaBpMeio]; // idx0=lado negativo
  const yExtremo = [-3.7723 - deltaBpMeio, 4.0144 + deltaBpMeio];
  const yTickBase = 4.14 + deltaBpMeio; // Y de onde partem as 2 diagonais do tick (ligadas a x±(0.76+gap))
  const yTickVertice = 4.8528 + deltaBpMeio; // vértice do "tick" N3/N4
  const yTickTopo = 5.6 + deltaBpMeio; // ponta vertical do tick

  const indiceParTemplate = Math.floor((totalPares - 1) / 2);

  for (let i = 0; i < totalPares; i++) {
    if (i === indiceParTemplate) continue; // já representado pelo template + deslocamento uniforme
    const off = offsetsN2[i] / 25;
    const x = cx0 + off;
    // xConexao/xVertice CORRIGIDOS (sessão 2026-09-09, achado comparando com arquivo real
    // corrigido à mão): incluem "gap" também — mesmo padrão do yConexao/yVertice de N1. Não dava
    // pra distinguir isso da amostra original (gap=0 nela, único teste até então com largura
    // do Estribo Y ≠ 2d)
    const xConexao = x + 0.8 + gap;

    // marcas de camada (camadaYGirada) na planta baixa — 3 por lado, mesmo X do par
    for (const lado of ladosAtivos) {
      for (const yCam of camadaYPorLado[lado]) {
        arr.push(...dw4_criarPonto21_0e(x, yCam, 'camadaYGirada'));
      }
    }

    // pontos de referência (2, ±0,76 em X, encolhendo com "gap" quando larguraEstribo≠2d; Y fixo em
    // cy0, exceto pilar de borda: achado -1,54 flat, mesma constante já usada no par NATIVO — ver
    // bloco irmão em gerarArquivoS4/dw4_shiftPorNome)
    const cy0PlantaY = ehBorda ? cy0 - 1.54 : cy0;
    arr.push(...dw4_criarPonto21_0e(x - (0.76 + gap), cy0PlantaY, 'plantaY'));
    arr.push(...dw4_criarPonto21_0e(x + (0.76 + gap), cy0PlantaY, 'plantaY'));

    // leque de setas: 3 posições de camada por lado convergem no mesmo vértice (X único,
    // igual pros 2 lados — Y do vértice que muda por lado), depois linha reta até o extremo
    const xVertice = x + relVertice + gap;
    for (const lado of ladosAtivos) {
      for (const yCam of camadaYPorLado[lado]) {
        arr.push(...dw4_criarSegmento0b0d(xConexao, yCam, xVertice, yVertice[lado], 3));
      }
      arr.push(...dw4_criarSegmento0b0d(xVertice, yVertice[lado], xVertice, yExtremo[lado], 3));
    }

    // textos N2 (um por lado, ou só o negativo pra borda) — logo após o leque, antes do tick N3/N4
    // (mesma ordem real de N1)
    arr.push(...dw4_criarTexto200e(xVertice - 0.128, yVertice[0] - 0.35, 'N2', true));
    if (!ehBorda) arr.push(...dw4_criarTexto200e(xVertice - 0.128, yVertice[1] + 0.38, 'N2', true));

    // "tick" que conecta o rótulo N3/N4 aos pontos de referência (±(0.76+gap)) — pilar de borda
    // usa um delta flat de -3,06 (achado sessão 2026-09-15, mesma amostra real do -1,54 acima)
    const deltaTickBorda = ehBorda ? -3.06 : 0;
    const xTickMid = x + 0.069458;
    arr.push(...dw4_criarSegmento0b0d(xTickMid, yTickTopo + deltaTickBorda, xTickMid, yTickVertice + deltaTickBorda));
    arr.push(...dw4_criarSegmento0b0d(xTickMid, yTickVertice + deltaTickBorda, x - (0.76 + gap), yTickBase + deltaTickBorda));
    arr.push(...dw4_criarSegmento0b0d(xTickMid, yTickVertice + deltaTickBorda, x + (0.76 + gap), yTickBase + deltaTickBorda));

    // textos N4/N3 — offsets relativos a x, aproximados (só 1-2 amostras reais, não byte-exato).
    // Pilar de borda usa posição própria (calibrada com o mesmo arquivo real do -1,54/-3,06 acima)
    if (ehBorda) {
      arr.push(...dw4_criarTexto200e(x - 0.0698, 1.5594, 'N4', true));
      arr.push(...dw4_criarTexto200e(x + 0.2369, 1.5749, 'N3', true));
    } else {
      arr.push(...dw4_criarTexto200e(x - 0.0956, 5.2906, 'N4', true));
      arr.push(...dw4_criarTexto200e(x + 0.2283, 5.3147, 'N3', true));
    }

    // Seção 1.1 (barra reta + retângulo em corte) — por último, mesma ordem real confirmada.
    // ACHADO 2026-09-16 (arquivo real com 3 pares/tipoPilar=B, "tive que desenhar o estribo" —
    // corrupção de verdade, não só posição errada, confirmada por leitura byte a byte): o ajuste
    // de altura desse retângulo (pro Δh do pilar) rodava em gerarArquivoS4 DEPOIS desta função,
    // usando 5 offsets LITERAIS (7311/7359/7387/7415/7443) calibrados só pro caso de 1 par extra
    // (totalPares=2, uma única iteração). Com 3 pares (2 iterações extras, i=0 e i=2), esses
    // offsets literais da 2ª iteração caíam no MEIO do conteúdo de camada/plantaY já escrito por
    // ESTA função, corrompendo com valores de outra coisa (confirmado: os valores computados pra
    // camada/plantaY em si sempre estavam certos — o dano acontecia só depois, num patch
    // separado usando offset fixo). Corrigido aplicando o ajuste AQUI DENTRO, logo após criar
    // cada retângulo, usando offset relativo ao início desta mesma iteração (`dw4_offBaseSecao11`)
    // — nunca fica desatualizado, porque nenhum splice roda entre o push e o ajuste.
    const dw4_offBaseSecao11 = arr.length;
    const xSecao11 = xSecao11Base + off;
    arr.push(...dw4_criarPonto21_0e(xSecao11, ySecao11, 'secao11'));
    for (const yr of yRetSecao11) {
      arr.push(...dw4_criarRetangulo1504(xSecao11 - (0.76 + gap), yr));
      arr.push(...dw4_criarRetangulo1504(xSecao11 + (0.76 + gap), yr));
    }
    if (deltaAlturaEstriboX) {
      // achado sessão 2026-09-23 (round com 3 pares no sentido menor, ap=80): o ponto BASE
      // (dw4_offBaseSecao11+6, o "PT" de dw4_criarPonto21_0e) NÃO deve receber esse ajuste — só
      // os 4 cantos do retângulo em corte. Comparado contra AJUSTADO 1.DW4 real: os 2 pares extras
      // tinham o PT em y=8.8041 (8.7641 + deltaAlturaEstriboX/2/25, com deltaAlturaEstriboX=2cm
      // nesse teste), usuário corrigiu pra 8.7641 (ySecao11 puro, sem deslocamento nenhum) — os 4
      // RECT continuaram idênticos (esses sim precisam do ajuste, já confirmado em rounds
      // anteriores). Herdado do bloco antigo de offsets literais (pré-round-9), nunca tinha sido
      // testado com >1 par extra antes.
      for (const o of [dw4_offBaseSecao11 + 48, dw4_offBaseSecao11 + 76]) { // RECT 1/2, nível yRetSecao11[0] (~9,44)
        dw4_escreverFloat32(arr, o + 6, dw4_lerFloat32(arr, o + 6) - deltaAlturaEstriboX / 2 / 25);
      }
      for (const o of [dw4_offBaseSecao11 + 104, dw4_offBaseSecao11 + 132]) { // RECT 3/4, nível yRetSecao11[1] (~8,76)
        dw4_escreverFloat32(arr, o + 6, dw4_lerFloat32(arr, o + 6) + deltaAlturaEstriboX / 2 / 25);
      }
    }
  }
}

function dw4_anexarParExtra(arr, cx0, cy0, indicePar, totalPares, larguraEstribo, camadaXPontos, direcao) {
  // direcao: 'X' (N1, offset em Y) ou 'Y' (N2, offset em X)
  const offset = dw4_offsetPar(indicePar, totalPares, larguraEstribo);
  for (const { x, y } of camadaXPontos) {
    if (direcao === 'X') {
      arr.push(...dw4_criarPonto21_0e(x, cy0 + offset, 'plantaX'));
    } else {
      arr.push(...dw4_criarPonto21_0e(cx0 + offset, y, 'plantaY'));
    }
  }
}

function dw4_anexarCamadaExtra(arr, cx0, cy0, indice, primeiraCamadaAtual, srAtual, apMeio, bpMeio, srTexto, paresN1, offsetsN1, paresN2, offsetsN2, ehBorda) {
  // indiceParTemplateN1/offParTemplateN2: só relevantes quando pares-extras (N1 ou N2) estão
  // combinados com camadas extras (Nr>3) — achado sessão 2026-09-09 testando esse combo pela
  // primeira vez (ver memória do projeto). offParTemplateN2 é 0 quando paresN2<=1, preservando
  // o comportamento já validado do caso de par único.
  const indiceParTemplateN1 = Math.floor((paresN1 - 1) / 2);
  const offParTemplateN2 = paresN2 > 1 ? offsetsN2[Math.floor((paresN2 - 1) / 2)] / 25 : 0;
  const dist = primeiraCamadaAtual + indice * srAtual;
  const distAnterior = primeiraCamadaAtual + (indice - 1) * srAtual;
  const xLado1 = cx0 - apMeio - dist / 25;
  const xLado1Ant = cx0 - apMeio - distAnterior / 25;
  const xLadoM1 = cx0 + apMeio + dist / 25;
  const xLadoM1Ant = cx0 + apMeio + distAnterior / 25;
  const yLado1 = cy0 - bpMeio - dist / 25;
  const yLado1Ant = cy0 - bpMeio - distAnterior / 25;
  const yLadoM1 = cy0 + bpMeio + dist / 25;
  const yLadoM1Ant = cy0 + bpMeio + distAnterior / 25;
  // REMAPEADO pra base nova (sessão 2026-09-09) — achado com arquivo real (Nr=4, pilar 25x60,
  // 1 par só) comparando com D:\DETBASEPUNCAO.DW4. TUDO abaixo (tipos, âncoras X/Y, cotas) na
  // base ANTIGA estava errado — a Seção 1.1/2.2 desse template não usa xCamadaSecao22 fixo com
  // Y variando (formato antigo); usa o MESMO par de constantes-base (xSecao11Base/xSecao22Base,
  // já usados em dw4_gerarParesN1/N2 pra pares extras) com X variando por ±(apMeio/bpMeio +
  // dist/25) — mesma fórmula já usada abaixo pra planta baixa, só ancorada em outro X/Y fixo.
  // xSecao11Base/xSecao22Base NÃO deslocam por offParTemplateN2/offParTemplateN1 — tentativa
  // nesse sentido feita e REVERTIDA na sessão 2026-09-09 (mesmo dia): a hipótese era que a
  // barra principal da Seção 1.1/2.2 e suas marcas de camada deveriam acompanhar o par-template
  // reposicionado (mesmo raciocínio de DW4_OFF_PONTO_SECAO11X_NATIVO etc.). CONFIRMADO ERRADO
  // por comparação com arquivo real corrigido à mão (usuário reportou "estribos deslocados
  // 20cm pra esquerda" na Seção 1.1/2.2): depois de descontar o drift geral do arquivo (ver
  // memória do projeto), a correção residual do usuário bateu exata com o valor SEM
  // deslocamento nenhum (0,8 = 20cm/25, igual à magnitude de offParTemplateN2/N1 que estava
  // sendo aplicada por engano). Ou seja: as marcas de camada dentro da Seção 1.1/2.2 são um
  // diagrama representativo de profundidade de camada, fixo na folha, independente de qual par
  // está sendo mostrado — diferente da barra reta "secao11"/"secao22" (essa sim, tipo/posição
  // de UM par específico, e essa continua corretamente deslocada em gerarArquivoS4).
  const xSecao11Base = 39.6165; // mesma constante de dw4_gerarParesN2 (Seção 1.1, barra reta)
  const ySecao11Camada = 8.7641; // Y fixo (nível inferior do retângulo em corte)
  const xSecao22Base = 39.6165; // mesma constante de dw4_gerarParesN1 (Seção 2.2, barra reta)
  // ySecao22Camada: 4.028 confirmado pro pilar central; pilar de borda precisa de 4.068 (achado
  // sessão 2026-09-16, arquivo real Nr=7 — as marcas de camada mantidas do lado "Lado1" da Seção
  // 2.2 saíam 0,04 baixas). Só testado em borda até agora — não mexe no valor do pilar central.
  // A COTA "15" que liga cada marca à anterior NÃO acompanha esse +0,04 — achado sessão
  // 2026-09-16 (mesmo teste, 1 rodada depois: "a cota ficou desalinhada" — comparado com o real,
  // ela precisa continuar ancorada no 4.028 original, só o PONTO da marca usa o 4.068 novo).
  const ySecao22Camada = ehBorda ? 4.068 : 4.028;
  const ySecao22CamadaCota = 4.028;
  const xS11Lado1 = xSecao11Base - (apMeio + dist / 25);
  const xS11Lado1Ant = xSecao11Base - (apMeio + distAnterior / 25);
  const xS11LadoM1 = xSecao11Base + (apMeio + dist / 25);
  const xS11LadoM1Ant = xSecao11Base + (apMeio + distAnterior / 25);
  const xS22Lado1 = xSecao22Base - (bpMeio + dist / 25);
  const xS22Lado1Ant = xSecao22Base - (bpMeio + distAnterior / 25);
  const xS22LadoM1 = xSecao22Base + (bpMeio + dist / 25);
  const xS22LadoM1Ant = xSecao22Base + (bpMeio + distAnterior / 25);

  // Seção 1.1: pontos da barra reta (lado 1 e lado -1) + cotas ligando à camada anterior
  arr.push(...dw4_criarPonto21_0e(xS11Lado1, ySecao11Camada, 'secao11Camada'));
  arr.push(...dw4_criarPonto21_0e(xS11LadoM1, ySecao11Camada, 'secao11Camada'));
  arr.push(...dw4_criarCota28_06(xS11Lado1, ySecao11Camada + 0.84, xS11Lado1Ant, ySecao11Camada + 0.84, xS11Lado1Ant, ySecao11Camada + 1.09, srTexto));
  arr.push(...dw4_criarCota28_06(xS11LadoM1Ant, ySecao11Camada + 0.84, xS11LadoM1, ySecao11Camada + 0.84, xS11LadoM1, ySecao11Camada + 1.09, srTexto));

  // Seção 2.2: marca de camada (girada) + cotas (mesma lógica, eixo trocado — X varia com a
  // largura do pilar/dist, Y é fixo, já que a Seção 2.2 é uma view girada). Pilar de borda: o
  // lado "M1" (+bpMeio, face livre) não existe — mesmo raciocínio já aplicado ao Gap#2/native
  // Nr=3 (sessão 2026-09-15), agora generalizado pra cada camada extra também (achado com
  // arquivo real Nr>3/tipoPilar=B, "ajustei a seção 2.2": o lado direito dessas marcas —
  // 4 COTA "15" + os PT correspondentes — precisava ser removido, um conjunto por camada extra).
  arr.push(...dw4_criarPonto21_0e(xS22Lado1, ySecao22Camada, 'secao22Camada'));
  if (!ehBorda) arr.push(...dw4_criarPonto21_0e(xS22LadoM1, ySecao22Camada, 'secao22Camada'));
  arr.push(...dw4_criarCota28_06(xS22Lado1, ySecao22CamadaCota + 0.88, xS22Lado1Ant, ySecao22CamadaCota + 0.88, xS22Lado1Ant, ySecao22CamadaCota + 1.13, srTexto));
  if (!ehBorda) arr.push(...dw4_criarCota28_06(xS22LadoM1Ant, ySecao22CamadaCota + 0.88, xS22LadoM1, ySecao22CamadaCota + 0.88, xS22LadoM1, ySecao22CamadaCota + 1.13, srTexto));

  // Planta: só os 2 pontos em Y (opostos), tipo 'camadaYGirada' (não 'plantaY' — CORRIGIDO,
  // achado no mesmo arquivo real: orient/meio/cauda batiam com camadaYGirada, não plantaY).
  // X desloca por offParTemplateN2 (sessão 2026-09-09) — esses pontos representam o par
  // "nativo" do template (sentido N2), que quando paresN2>1 é reposicionado pra
  // cx0+offParTemplateN2 (mesmo tratamento do resto do conteúdo nativo de N2, ver bloco
  // "if (paresN2 > 1)" em gerarArquivoS4) — usar cx0 puro deixava essas marcas presas no
  // centro antigo mesmo com o par nativo já deslocado. Pilar de borda: yLadoM1 (+Y, face livre)
  // não existe — mesmo motivo do bloco Seção 2.2 acima.
  if (!ehBorda) arr.push(...dw4_criarPonto21_0e(cx0 + offParTemplateN2, yLadoM1, 'camadaYGirada'));
  arr.push(...dw4_criarPonto21_0e(cx0 + offParTemplateN2, yLado1, 'camadaYGirada'));

  // marca de camada X em planta, GIRADA — CONFIRMADO por comparação com arquivo ajustado
  // manualmente (Nr=5, pilar 25x100cm, 2 pares): a planta baixa não acompanhava o aumento de
  // camadas — só as camadas 0-2 originais do template eram replicadas por par
  // (dw4_gerarParesN1), as camadas extras (indice>=3, criadas aqui) nunca ganhavam essa marca.
  // RESTRITO ao par-template apenas (sessão 2026-09-09): na época desse teste (Nr=5, 2 pares),
  // dw4_gerarParesN1 só cobria Nr=3 por par (camadaXPorLado hardcoded), então este loop
  // precisava cobrir TODOS os pares. Agora que camadaXPorLado foi generalizado pra qualquer Nr
  // (gerarParesN1 cobre sozinho todas as camadas de cada par que ele cria), rodar este loop
  // pra todo par duplicava as marcas dos pares não-template — achado testando Nr=15+2 pares
  // (54 registros em vez de 30). Só o par-template continua precisando deste complemento, já
  // que dw4_gerarParesN1 pula esse índice de propósito (conteúdo nativo cobre só Nr=3 dele).
  for (let i = 0; i < paresN1; i++) {
    if (paresN1 > 1 && i !== indiceParTemplateN1) continue;
    // pilar de borda: -0,9 flat (achado sessão 2026-09-15, arquivo real Nr>3 — a marca nativa
    // (Nr=3, gerada em outro lugar) já usa esse valor corrigido; esta aqui (camada extra) ainda
    // usava a fórmula "crua" do pilar central)
    const yPar = cy0 + offsetsN1[i] / 25 + (ehBorda ? -0.9 : 0);
    arr.push(...dw4_criarPonto21_0e(xLado1, yPar, 'camadaXGirada', 1));
    arr.push(...dw4_criarPonto21_0e(xLadoM1, yPar, 'camadaXGirada', 1));
  }
}

function dw4_patchTextoNoOffset(arr, offset, textoEsperado, textoNovo) {
  const tam = arr[offset] | (arr[offset + 1] << 8);
  const alvo = dw4_stringParaBytes(textoEsperado);
  if (tam !== alvo.length) return false; // segurança: confirma que é mesmo o texto esperado
  for (let j = 0; j < alvo.length; j++) {
    if (arr[offset + 2 + j] !== alvo[j]) return false;
  }
  const novoBytes = dw4_stringParaBytes(textoNovo);
  const buf = new ArrayBuffer(2);
  const view = new DataView(buf);
  view.setUint16(0, novoBytes.length, true);
  arr.splice(offset, 2 + alvo.length, view.getUint8(0), view.getUint8(1), ...novoBytes);
  return true;
}

function dw4_patchTextoTodasOcorrencias(arr, textoAntigo, textoNovo, maxOcorrencias = 10) {
  let n = 0;
  let from = 0;
  while (n < maxOcorrencias) {
    const proximo = dw4_patchTextoDe(arr, textoAntigo, textoNovo, from);
    if (proximo === -1) break;
    from = proximo;
    n++;
  }
  return n;
}

function dw4_patchContorno(arr, offHachura, offContorno0c, apCm, bpCm, escala = 25) {
  const offFloatsAtual = offContorno0c + 2;
  let cx, cy;
  if (offHachura == null) {
    // base "DETBASEPUNCAO" (FASE 1): não tem hachura — usa o cx/cy que já está salvo no
    // próprio registro de contorno como âncora, em vez de calcular a partir da hachura
    cx = dw4_lerFloat32(arr, offFloatsAtual);
    cy = dw4_lerFloat32(arr, offFloatsAtual + 4);
  } else {
    const v = [];
    for (let i = 0; i < 8; i++) v.push(dw4_lerFloat32(arr, offHachura + i * 4));
    const xs = [v[0], v[2], v[4], v[6]];
    const ys = [v[1], v[3], v[5], v[7]];
    cx = (Math.min(...xs) + Math.max(...xs)) / 2;
    cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  }
  const w = apCm / escala;
  const h = bpCm / escala;
  const offFloats = offContorno0c + 2;
  const contorno = [cx, cy, 1.0, 0.0, w, h];
  for (let i = 0; i < 6; i++) dw4_escreverFloat32(arr, offFloats + i * 4, contorno[i]);
  return [cx, cy];
}

// contorno CIRCULAR do pilar na planta baixa — achado sessão 2026-09-14 a partir de 3 arquivos
// reais que o usuário preparou como "receita": pegou um desenho de pilar QUADRADO já gerado
// (30x30/40x40/50x50), apagou só o contorno na planta baixa e desenhou um círculo do mesmo
// diâmetro no lugar, mantendo TODO o resto (armadura em cruz, Seção 1.1/2.2, tabelas) idêntico
// ao do pilar quadrado equivalente — confirmado por comparação byte a byte contra uma geração
// quadrada fresca com o mesmo ap=bp: ZERO diferenças em qualquer registro, exceto o contorno.
// O que o S4CAD faz ao apagar o contorno quadrado e desenhar um círculo, nos 3 arquivos: (1)
// remove por completo o registro nativo de contorno (opcode 0x0c,0x04, DW4_OFF_CONTORNO, 28
// bytes — confirmado ausente do arquivo inteiro, busca por opcode não acha nenhuma ocorrência);
// (2) adiciona um NOVO registro no FINAL do arquivo, mesmo opcode 0x15,0x04 usado pelos
// "retângulo em corte" (RECT) espalhados pelo resto do arquivo, mas com layout de campos
// diferente — em vez de [cx,cy,1.0,0.0,w,h] (contorno quadrado) é [cx,cy,raio,raio,0.0,0.0], e a
// "tail" de 2 bytes no final é 0x03,0x00 em vez de 0x00,0x00. cx/cy sempre bateram exatos com o
// cx0/cy0 já lido do contorno quadrado antes de apagá-lo (mesmo centro, óbvio); raio bateu
// EXATO com diametro/2/escala nos 3 diâmetros testados (30→0,6; 40→0,8; 50→1,0 — sem
// arredondamento, sem offset residual).
function dw4_criarContornoCircular(cx, cy, raioCm, escala = 25) {
  const raio = raioCm / escala;
  const bytes = [0x15, 0x04];
  for (const f of [cx, cy, raio, raio, 0.0, 0.0]) {
    const buf = new ArrayBuffer(4);
    new DataView(buf).setFloat32(0, f, true);
    for (let i = 0; i < 4; i++) bytes.push(new DataView(buf).getUint8(i));
  }
  bytes.push(0x03, 0x00);
  return bytes;
}

function dw4_removerHachura(arr, offHachura) {
  // remove o registro de hachura (retângulo "40 02"+8 floats+"03 00" = 36 bytes, começando
  // 2 bytes antes do início dos floats) — confirmado seguro (é exatamente o que sobra
  // quando o usuário apaga a hachura pela interface do S4, sem corromper mais nada. Fazer
  // ISSO em vez de redimensionar evita o descompasso visual entre hachura e contorno, já
  // que ajustar só as coordenadas do retângulo não faz o S4 re-renderizar o preenchimento
  // corretamente (ver memória do projeto — ainda não decifrado como fazer isso direito)
  arr.splice(offHachura - 2, 36);
}

function dw4_removerZigzags(arr, maxBlocos = 4) {
  // remove os blocos de contorno em ziguezague (N1/N2, texto ASCII com muitos pontos) —
  // confirmado que fazem parte do que aparece visualmente junto com a "hachura" quando
  // apagada pela interface do S4. Cabeçalho fixo "41 02 00 00 40 41 00 00 00 00 00 0d",
  // seguido de 2 bytes de tamanho (LE) + o texto em si
  const cabecalho = [0x41, 0x02, 0x00, 0x00, 0x40, 0x41, 0x00, 0x00, 0x00, 0x00, 0x00, 0x0d];
  let n = 0;
  while (n < maxBlocos) {
    const idx = dw4_encontrarSequencia(arr, cabecalho);
    if (idx === -1) break;
    const tamanhoTexto = arr[idx + 12] | (arr[idx + 13] << 8);
    const tamanhoTotal = 12 + 2 + tamanhoTexto;
    arr.splice(idx, tamanhoTotal);
    n++;
  }
  return n;
}

function dw4_reposicionarTudo(arr, cx0, cy0, deltaApCm, deltaBpCm, escala = 25) {
  const dx = deltaApCm / 2 / escala;
  const dy = deltaBpCm / 2 / escala;
  for (const off of DW4_PONTOS_X) {
    const v = dw4_lerFloat32(arr, off);
    if (Math.abs(v) > 1000) continue;
    let novo = v;
    if (v > cx0 + 0.01) novo = v + dx;
    else if (v < cx0 - 0.01) novo = v - dx;
    dw4_escreverFloat32(arr, off, novo);
  }
  for (const off of DW4_PONTOS_Y) {
    const v = dw4_lerFloat32(arr, off);
    if (Math.abs(v) > 1000) continue;
    let novo = v;
    if (v > cy0 + 0.01) novo = v + dy;
    else if (v < cy0 - 0.01) novo = v - dy;
    dw4_escreverFloat32(arr, off, novo);
  }
  for (const off of DW4_PONTOS_SECAO11_POS) dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + dx);
  for (const off of DW4_PONTOS_SECAO11_NEG) dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - dx);
  for (const off of DW4_PONTOS_SECAO22_POS) dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + dy);
  for (const off of DW4_PONTOS_SECAO22_NEG) dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - dy);
}

// dw4_gerarParesN1/N2, dw4_anexarCamadaExtra etc.) AINDA SÃO OS OFFSETS DA BASE ANTIGA —
// não foram remapeados ainda (trabalho enorme, ver conversa: ~48 grupos de offsets/
// centenas de valores individuais, tudo precisa ser redescoberto igual foi feito hoje pra

// extras, leque, ticks, planta baixa e a tabela de colapso NÃO estão adaptados ainda.
// Tabela "ARMADURA DE COLAPSO" (sessão 2026-09-08) — achada na base nova por decodificação
// direta da região final do arquivo (registros de texto opcode 0x1f,0x13, um tipo de TXT
// "legenda simples" diferente do 0x20,0x0e usado pra N1-N7, sem vínculo com a tabela de
// ferros). Confirmado por posição (X,Y) de cada célula, batendo exato com a tabela renderizada
// no PDF do S4CAD. A coluna BIT (6.3/8/10/12.5/16/20) já é FIXA — igual a DIAMS_COL — não
// precisa de patch. "de"/offsets abaixo = texto original no template (pra dw4_patchTextoNoOffset
// conferir antes de trocar) e posição do prefixo de tamanho, um objeto por índice de DIAMS_COL

function gerarArquivoS4(inp, r) {
  const arr = dw4_base64ParaBytes(DW4_TEMPLATE_B64);
  // byte 0xff no final do arquivo: marcador de fim. Uma tentativa anterior de relocar esse
  // marcador (removendo aqui, recolocando só no fim, pra deixar os pares extras "visíveis"
  // antes dele) travava o S4CAD ("erro no comando 310ish", recuperação por pular bytes
  // nunca resincronizava) — mas isso era SINTOMA de um bug de codificação ainda não achado
  // (a marca de camada usava cauda=5 em vez de 1; ver dw4_criarPonto21_0e), não do
  // deslocamento do marcador em si. Confirmado reativando essa relocação DEPOIS de achar
  // e corrigir esse 4º bug: uma sequência de arquivos reais salvos pelo próprio S4CAD
  // (passo a passo, cada um só com 1 elemento a mais) mostrou que o S4CAD SEMPRE recoloca
  // esse marcador no byte literalmente final do arquivo — nunca deixa nada depois dele —
  // e nunca existe um campo de contagem/tamanho em outro lugar do cabeçalho (comparado
  // byte a byte nos 200 primeiros bytes ao longo de 6 saves consecutivos, zero diferença).
  // Removido aqui logo no início — antes de qualquer bloco que anexe conteúdo (pares
  // extras, camadas extras) — e recolocado só no final da função, depois de TUDO já ter
  // sido anexado.
  const dw4MarcadorFim = arr.pop(); // deve ser 0xff
  const DIAM_PORTA_SUPERIOR = 10; // fixo/construtivo, mesma convenção do app (não é campo do usuário)
  const H_TEMPLATE = 25; // espessura da laje usada no arquivo-modelo original

  // DESLIGADO (sessão 2026-09-10) — CAUSA CONFIRMADA de "arquivo danificado" (comando 70/71)
  // ao testar um pilar com Δh grande (h=35, Δh=+10) pela primeira vez nesta migração: o
  // offset DW4_OFF_PONTO_SECAO11_Y (5716) NÃO cai num campo Y de um record PT/RECT real —
  // os bytes vizinhos nesse offset, no template puro (nunca tocado), decodificam como texto
  // ASCII (fragmento "...2.5" bem antes do byte, sem opcode 0x21/0x15 reconhecível alinhado)
  // e não como uma coordenada plausível (lia como float denormalizado ~1.77e-38 no template
  // intocado). A validação antiga no comentário (Δh=-5 confirmado num arquivo ajustado à
  // mão) provavelmente foi feita antes de um texto anterior mudar de tamanho (mesmo
  // "byte-shift trap" de sempre — ver DW4_PONTOS_LINHA_N2 etc. abaixo) e nunca foi
  // re-verificada depois da troca de template base. Mesma categoria dos blocos já
  // desligados mais abaixo nesta função — não reativar sem remapear pra base nova via
  // arquivo real (Seção 1.1 com Δh≠0, comparando o GERADO com o ajustado à mão).
  // dw4_escreverFloat32(arr, DW4_OFF_PONTO_SECAO11_Y, dw4_lerFloat32(arr, DW4_OFF_PONTO_SECAO11_Y) + (inp.h - H_TEMPLATE) / 25);

  // deslocamento em X dos pontos "em corte" na Seção 1.1 (porta-estribo do OUTRO sentido,
  // ou seja Y/N2, já que a Seção 1.1 mostra o corte na direção X) — ligado à mudança de
  // LARGURA do Estribo Y em relação ao template (40cm). Confirmado por comparação direta e
  // CORRIGIDO pelo usuário: é a largura do Estribo Y (N2), não X (N1) como eu tinha antes
  const LARGURA_ESTRIBO_Y_TEMPLATE = 40;
  const deltaLarguraSecao11 = Math.round(r.larguraEstriboY) - LARGURA_ESTRIBO_Y_TEMPLATE;
  // CAUSA RAIZ do "comando 88"/arquivo danificado sempre que paresN1>1 (achado sessão
  // 2026-09-08): DW4_PONTOS_PLANTA_LARGURA_Y_POS/NEG usavam offsets da BASE ANTIGA, nunca
  // remapeados — ficavam em posições erradas-mas-dentro-do-alcance. REMAPEADOS pra base nova
  // (mesma sessão, rodada seguinte) a partir de diff real usuário-corrigido — reativado.
  const deltaLarguraEstriboX = Math.round(r.larguraEstriboX) - LARGURA_ESTRIBO_Y_TEMPLATE;
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_CORTE1_X, dw4_lerFloat32(arr, DW4_OFF_PONTO_CORTE1_X) + deltaLarguraSecao11 / 2 / 25);
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_CORTE2_X, dw4_lerFloat32(arr, DW4_OFF_PONTO_CORTE2_X) - deltaLarguraSecao11 / 2 / 25);
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_CORTE1B_X, dw4_lerFloat32(arr, DW4_OFF_PONTO_CORTE1B_X) + deltaLarguraSecao11 / 2 / 25);
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_CORTE2B_X, dw4_lerFloat32(arr, DW4_OFF_PONTO_CORTE2B_X) - deltaLarguraSecao11 / 2 / 25);

  // planta baixa: pontos que deslocam com a mudança de largura do Estribo X (N1) — CORRIGIDO,
  // estava invertido (usava largura do Estribo Y por engano)
  for (const off of DW4_PONTOS_PLANTA_LARGURA_Y_POS) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - deltaLarguraEstriboX / 2 / 25);
  }
  for (const off of DW4_PONTOS_PLANTA_LARGURA_Y_NEG) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + deltaLarguraEstriboX / 2 / 25);
  }
  // DESLIGADOS (sessão 2026-09-09) — CAUSA RAIZ de um novo "arquivo danificado" (comando ~69/70),
  // mesma categoria do "comando 88" original: DW4_PONTOS_LINHA_N2/PLANTA_LARGURA_X_POS/NEG/
  // ROTULO_N2_X são offsets da base ANTIGA, nunca remapeados pra base nova — ficavam dormentes
  // porque deltaLarguraSecao11 sempre foi 0 até hoje (larguraEstriboY sempre foi 2d=40=template;
  // só passou a poder ser "d" com a adição de gruposMaiorManual nesta sessão). Confirmado por
  // leitura direta: vários offsets caem em zeros suspeitos ou floats gigantes/fora do alcance
  // da base nova (ex.: 3610 lê 9.3e26, 2591 lê -1.6e20, 5444 lê 211.27 — nada disso é uma
  // coordenada real no template de 6604 bytes). Precisam da mesma rodada de arquivo real
  // (Estribo Y forçado pra "d" num pilar de 1 par só, sem pares-extras) já usada pra remapear
  // o equivalente Y (DW4_PONTOS_PLANTA_LARGURA_Y_POS/NEG) — não reativar sem isso.
  // for (const off of DW4_PONTOS_LINHA_N2) {
  //   dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + deltaLarguraSecao11 / 2 / 25);
  // }
  // for (const off of DW4_PONTOS_PLANTA_LARGURA_X_POS) {
  //   dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - deltaLarguraSecao11 / 2 / 25);
  // }
  // for (const off of DW4_PONTOS_PLANTA_LARGURA_X_NEG) {
  //   dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + deltaLarguraSecao11 / 2 / 25);
  // }
  // for (const off of DW4_PONTOS_ROTULO_N2_X) {
  //   dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + deltaLarguraSecao11 / 2 / 25);
  // }

  // pontos do estribo que parte do pilar em X — deslocam com a mudança da primeira camada
  // (0,5d, arredondado pra baixo em 0,5cm), em relação ao template (primeiraCamada=10cm)
  const PRIMEIRA_CAMADA_TEMPLATE = 10;
  const primeiraCamadaAtual = Math.floor(0.5 * r.d * 2) / 2;
  const deltaPrimeiraCamada = primeiraCamadaAtual - PRIMEIRA_CAMADA_TEMPLATE;
  // hoisted pra cá (sessão 2026-09-10, 2ª rodada) — precisa estar em escopo pros blocos de
  // "camada 2ª/3ª" logo abaixo, além do uso original mais adiante (Seção 2.2)
  const deltaSr = r.Sr - 15; // 15 = Sr do template
  // apMeio/bpMeio (metade de ap/bp em unidades de arquivo) — usados tanto pelas marcas de camada
  // dos pares extras (camadaXPorLado/camadaYPorLado, logo abaixo) quanto por dw4_anexarCamadaExtra
  // (camadas além da 3ª, mais adiante nesta função) — hoisted pra cá (sessão 2026-09-09) pra ficar
  // em escopo nos dois lugares, já que antes só existia dentro do bloco "if (r.Nr > 3)"
  const apMeio = inp.ap / 2 / 25;
  const bpMeio = inp.bp / 2 / 25;
  // distância (cm) do centro da camada de índice `indice` (0-based) até a primeira camada —
  // MESMA fórmula validada em dw4_anexarCamadaExtra pra Nr>3 (ver sessão 2026-09-09)
  const distCamada = (indice) => primeiraCamadaAtual + indice * r.Sr;
  // DESLIGADO (sessão 2026-09-12) — ESTRIBO_PARTE_X[0]=2776 NÃO é o "estribo que parte do
  // pilar" (nunca foi, apesar do nome/comentário antigo) — é o p2x do 1º SEG04 vertical
  // (registro em 2766, o tique da FACE do pilar em X), que precisa ficar SEMPRE igual ao seu
  // próprio p1x (2766+2, nunca deslocado) pra continuar vertical. Aplicar aqui -deltaPrimeiraCamada/25
  // só nesse p2x — sem tocar o p1x correspondente — inevitavelmente entorta o tique. O "typo
  // de template" documentado mais abaixo (offset 2766+10, "+0,2") era na verdade ESTA mesma
  // colisão: o +0,2 só cancelava certo quando deltaPrimeiraCamada calhava de ser exatamente 5
  // (d≈30, todo teste da sessão 2026-09-12 anterior usou isso) — usuário reportou com um pilar
  // novo (25x100) comparando h=25/30/35/40 que a linha fica reta só em h=35 (deltaPrimeiraCamada=5
  // aqui também, coincidência) e torta nos outros (deltaPrimeiraCamada=2,5/7,5/12,5): o p2x
  // media exatamente p1x + (0,2 - deltaPrimeiraCamada/25), zero só quando deltaPrimeiraCamada=5.
  // Confirmado com o template PURO: p1x já bate exato com p2x (39,1165 os dois) SEM nenhum dos
  // dois ajustes — a "correção de typo" nunca foi necessária pra base nova, só mascarava esta
  // colisão. Removidos os dois (este e o +0,2 abaixo); não reativar sem entender que ponto
  // REAL (se existir) precisa do deslocamento -deltaPrimeiraCamada/25 em X — 2776 não é ele.
  // dw4_escreverFloat32(arr, DW4_PONTOS_ESTRIBO_PARTE_X[0], dw4_lerFloat32(arr, DW4_PONTOS_ESTRIBO_PARTE_X[0]) - deltaPrimeiraCamada / 25);
  // DESLIGADOS (sessão 2026-09-10) — mesma causa confirmada do bloco DW4_PONTOS_CAMADA_X/Y
  // acima: instrumentando e comparando contra a estrutura real de registros do template puro,
  // ESTRIBO_PARTE_X[1]=3016 cai no meio do campo "meio[2]" de um PT (não um X/Y de 4 bytes
  // limpo), e PONTA_INDICACAO_X[0]/[1]=3129/3234 caem no meio do campo o2 de um TXT e do
  // p2x de um SEG, respectivamente — os 3 sempre estragavam bytes de um registro vizinho,
  // só nunca deu pra perceber porque deltaPrimeiraCamada ficava pequeno em todo teste
  // anterior desta sessão (d próximo de 20cm). Não reativar sem remapear via arquivo real
  // (pilar 1 par só, d bem diferente de 20cm).
  // dw4_escreverFloat32(arr, DW4_PONTOS_ESTRIBO_PARTE_X[1], dw4_lerFloat32(arr, DW4_PONTOS_ESTRIBO_PARTE_X[1]) + deltaPrimeiraCamada / 25);
  // dw4_escreverFloat32(arr, DW4_PONTOS_PONTA_INDICACAO_X[0], dw4_lerFloat32(arr, DW4_PONTOS_PONTA_INDICACAO_X[0]) - deltaPrimeiraCamada / 25);
  // dw4_escreverFloat32(arr, DW4_PONTOS_PONTA_INDICACAO_X[1], dw4_lerFloat32(arr, DW4_PONTOS_PONTA_INDICACAO_X[1]) + deltaPrimeiraCamada / 25);

  // "camada 2ª/3ª" nos pontos NATIVOS — sessão 2026-09-10, 2ª rodada (ver arrays acima pro
  // diagnóstico completo). deltaCm = lado*(deltaPrimeiraCamada + indice*deltaSr) — mesma
  // fórmula de DW4_PONTOS_CAMADA_X/Y (que continuam desligados acima; essa categoria de ponto
  // é diferente, offsets não colidem)
  for (const { off, indice, lado } of DW4_PONTOS_CAMADA2_PLANTA_Y) {
    const deltaCm = deltaPrimeiraCamada + indice * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * deltaCm / 25);
  }
  for (const { off, indice, lado } of DW4_PONTOS_CAMADA2_PLANTA_X) {
    const deltaCm = deltaPrimeiraCamada + indice * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * deltaCm / 25);
  }
  for (const { off, indice, lado } of DW4_PONTOS_CAMADA2_SECAO11_X) {
    const deltaCm = deltaPrimeiraCamada + indice * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * deltaCm / 25);
  }
  for (const { off, indice, lado } of DW4_PONTOS_CAMADA2_SECAO11_X_NEG) {
    const deltaCm = deltaPrimeiraCamada + indice * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * deltaCm / 25);
  }
  for (const off of DW4_PONTOS_CAMADA2_SECAO11_X_NEG_Y) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - 2 * deltaPrimeiraCamada / 25);
  }
  // pontos avulsos que deslocam por ±2×deltaPrimeiraCamada/25 (sem depender de índice/Sr)
  for (const { off, lado } of DW4_PONTOS_CAMADA2_PONTA_X) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * 2 * deltaPrimeiraCamada / 25);
  }
  for (const { off, lado } of DW4_PONTOS_CAMADA2_PONTA_Y) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * 2 * deltaPrimeiraCamada / 25);
  }
  for (const { offX, offY, ladoX, ladoY } of DW4_PONTOS_CAMADA2_SECAO11_RECT) {
    dw4_escreverFloat32(arr, offX, dw4_lerFloat32(arr, offX) + ladoX * 2 * deltaPrimeiraCamada / 25);
    dw4_escreverFloat32(arr, offY, dw4_lerFloat32(arr, offY) + ladoY * 2 * deltaPrimeiraCamada / 25);
  }
  for (const { off, lado } of DW4_PONTOS_CAMADA2_SECAO11_RECT_Y) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * 2 * deltaPrimeiraCamada / 25);
  }
  // ponto de referência do porta-estribo reto — MESMO offset de DW4_OFF_PONTO_SECAO22_X (já
  // usado logo abaixo pro delta de Δh), mas em X por 2×deltaPrimeiraCamada/25 — ~1cm de
  // resíduo não explicado ainda
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_SECAO22_X, dw4_lerFloat32(arr, DW4_OFF_PONTO_SECAO22_X) + 2 * deltaPrimeiraCamada / 25);
  // planta baixa: leque nativo (ver arrays acima). DESLIGADO (sessão 2026-09-12, novo dia) —
  // usuário reportou "problema na planta baixa" com um pilar 60x30/h=20 (Nr=15, 5 pares —
  // primeiro teste desta sessão com Nr>3 E múltiplos pares E deltaPrimeiraCamada NEGATIVO,
  // d=15,13 → primeiraCamadaAtual=7,5 → deltaPrimeiraCamada=-2,5). Comparando byte a byte o
  // arquivo gerado com o corrigido à mão: as 8 linhas do leque bateram EXATO com a fórmula
  // atual menos o termo 2×deltaPrimeiraCamada/25 (ou seja, residual=0 removendo o termo
  // inteiro, não só ajustando o coeficiente) — mesma categoria do bug de
  // DW4_PONTOS_ESTRIBO_PARTE_X[0] achado antes hoje: a validação original ("mesmo diff desta
  // rodada", sessão 2026-09-10) provavelmente usou um teste com deltaPrimeiraCamada pequeno o
  // bastante pra mascarar o erro, igual todos os outros casos dessa família descobertos hoje.
  // ATENÇÃO: isso muda a posição do leque em QUALQUER cenário já testado antes (inclusive o
  // par ap=100/bp=25/h=35 confirmado como "certo" pelo usuário na sessão anterior) — não
  // verificado ainda se a posição do leque especificamente foi olhada de perto naquele
  // arquivo (o usuário focou nas Seções 1.1/2.2), então vale reconfirmar "planta baixa" lá
  // também se surgir dúvida. Não reativar sem re-derivar a fórmula certa com pelo menos 2
  // amostras reais de deltaPrimeiraCamada diferentes (temos só 1 agora).
  // for (const off of DW4_PONTOS_CAMADA2_LEQUE_X) {
  //   dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + 2 * deltaPrimeiraCamada / 25);
  // }
  for (const { off, indice, lado } of DW4_PONTOS_CAMADA2_LEQUE_Y) {
    const deltaCm = deltaPrimeiraCamada + indice * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * deltaCm / 25);
  }
  for (const { off, indice, lado } of DW4_PONTOS_CAMADA2_LEQUE2_X) {
    const deltaCm = deltaPrimeiraCamada + indice * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * deltaCm / 25);
  }
  // Seção 1.1/2.2: grupo Δh/2/25 (ver array acima)
  for (const { off, lado } of DW4_PONTOS_CAMADA2_SECAO_DH_Y) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * (inp.h - H_TEMPLATE) / 2 / 25);
  }
  // ponto nativo 2988 (já ajustado por deltaAlturaEstriboX mais abaixo/acima, ver altura do
  // estribo) — resíduo adicional de -Δh/25 achado nesta rodada
  dw4_escreverFloat32(arr, 2988 + 6, dw4_lerFloat32(arr, 2988 + 6) - (inp.h - H_TEMPLATE) / 25);
  // Seção 1.1: os 4 SEG04 nativos (ver array acima)
  for (const { off, lado } of DW4_PONTOS_CAMADA2_SECAO_DH_Y_SEG04) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * (inp.h - H_TEMPLATE) / 2 / 25);
  }
  // REMOVIDO (sessão 2026-09-12) — este "+0,2" nunca corrigia um typo de template de verdade;
  // ver nota completa junto de DW4_PONTOS_ESTRIBO_PARTE_X[0] (logo acima) — era uma correção
  // fixa mascarando a colisão daquele mecanismo com o p2x deste mesmo registro (2766), só
  // dando zero residual quando deltaPrimeiraCamada=5. Sem os dois ajustes, p2x já bate exato
  // com p1x direto do template (verificado: 39,1165 os dois), pra qualquer deltaPrimeiraCamada.
  // planta baixa: legendas "N1"/"N2" do leque (ver arrays acima)
  for (const { off, indice, lado } of DW4_PONTOS_CAMADA2_LEGENDA_N1_X) {
    const deltaCm = deltaPrimeiraCamada + indice * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * deltaCm / 25);
  }
  for (const off of DW4_PONTOS_CAMADA2_LEGENDA_N2_X) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + 2 * deltaPrimeiraCamada / 25);
  }
  for (const { off, indice, lado } of DW4_PONTOS_CAMADA2_LEGENDA_N2_Y) {
    const deltaCm = deltaPrimeiraCamada + indice * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + lado * deltaCm / 25);
  }

  // Seção 2.2: pontos "em corte" do porta-estribo SUPERIOR deslocam em X (não Y, já que a
  // seção está no outro sentido) por -Δh/25 — offsets sempre fora do array nesse ponto da
  // função (bounds-guard sempre no-op), então inofensivos como estão; nunca confirmados
  // remapeados pra base nova, não reativar sem isso
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_CORTE2_2_SUP1_X, dw4_lerFloat32(arr, DW4_OFF_PONTO_CORTE2_2_SUP1_X) - (inp.h - H_TEMPLATE) / 25);
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_CORTE2_2_SUP2_X, dw4_lerFloat32(arr, DW4_OFF_PONTO_CORTE2_2_SUP2_X) - (inp.h - H_TEMPLATE) / 25);
  // Seção 2.2: ponto de referência do porta-estribo reto (análogo ao da Seção 1.1, mas em X)
  // — offset validado: opcode 0x21,0x0e (PT) alinhado 2 bytes antes, campo X real
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_SECAO22_X, dw4_lerFloat32(arr, DW4_OFF_PONTO_SECAO22_X) - (inp.h - H_TEMPLATE) / 25);
  // DESLIGADO (sessão 2026-09-10) — CAUSA CONFIRMADA de "arquivo danificado" (comando 70/71):
  // testando com Δh grande (h=35) pela primeira vez, quase todos os offsets deste array
  // caem literalmente DENTRO de strings de texto da tabela "ARMADURA DE COLAPSO" no template
  // puro (ex.: off=6313/6347/6441/6469/6529 decodificam como fragmentos ASCII "212 C"/"239
  // C"/"224 CM"/"207 CM"/"183" quando lidos a partir de 2 bytes antes — não há opcode PT/RECT
  // ali). Escrever um float32 ali corrompe os caracteres reais dessa tabela. Nunca foi
  // remapeado pra base nova (mesma categoria dos blocos já desligados abaixo) — não
  // reativar sem achar os offsets corretos via arquivo real (Seção 2.2 com Δh≠0).
  // for (const off of DW4_PONTOS_SECAO22_X) {
  //   dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - (inp.h - H_TEMPLATE) / 25);
  // }

  // Seção 2.2: pontos "em corte" (porta-estribo do outro sentido, X/N1) deslocam em Y por
  // causa da largura do Estribo X — confirmado por comparação: Δlargura=-10 (40->30)
  const LARGURA_ESTRIBO_X_TEMPLATE_2 = 40;
  // REMAPEADO pra base nova (sessão 2026-09-08) — ver comentário em DW4_OFF_PONTO_SECAO22_CORTE_Y1-4
  const deltaLarguraSecao22 = Math.round(r.larguraEstriboX) - LARGURA_ESTRIBO_X_TEMPLATE_2;
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_SECAO22_CORTE_Y1, dw4_lerFloat32(arr, DW4_OFF_PONTO_SECAO22_CORTE_Y1) - deltaLarguraSecao22 / 2 / 25);
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_SECAO22_CORTE_Y2, dw4_lerFloat32(arr, DW4_OFF_PONTO_SECAO22_CORTE_Y2) - deltaLarguraSecao22 / 2 / 25);
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_SECAO22_CORTE_Y3, dw4_lerFloat32(arr, DW4_OFF_PONTO_SECAO22_CORTE_Y3) + deltaLarguraSecao22 / 2 / 25);
  dw4_escreverFloat32(arr, DW4_OFF_PONTO_SECAO22_CORTE_Y4, dw4_lerFloat32(arr, DW4_OFF_PONTO_SECAO22_CORTE_Y4) + deltaLarguraSecao22 / 2 / 25);

  // DESLIGADO (sessão 2026-09-10) — CAUSA CONFIRMADA de "arquivo danificado" (comando 70/71),
  // mesmo diagnóstico do bloco DW4_PONTOS_SECAO22_X acima: testando com Δh grande (h=35)
  // pela primeira vez nesta migração, boa parte destes offsets cai dentro de texto real —
  // ex.: off=5648 decodifica como fragmento ASCII "20.0" (lista de bitolas da malha no
  // cabeçalho), off=6229/6263 como "159 CM"/"172 CM" (tabela ARMADURA DE COLAPSO) — sem
  // opcode PT/RECT/SEG alinhado. DW4_OFF_PONTO_CORTE1_Y/CORTE2_Y (0x1aae+6, 0x1aca+6) ficam
  // fora do array neste ponto da função pra base nova (bounds-guard sempre no-op, então já
  // inofensivos, mas front do mesmo grupo nunca remapeado). Alguns offsets isolados do meio
  // do array (ex. 5764/5772, dentro de um SEG real) parecem legítimos, mas não dá pra
  // separar com segurança sem remapear o array inteiro — desligado todo até fazer isso via
  // arquivo real (Seção 1.1/2.2 com Δh≠0, comparando o GERADO com o ajustado à mão).
  // for (const off of [DW4_OFF_PONTO_CORTE1_Y, DW4_OFF_PONTO_CORTE2_Y, ...DW4_PONTOS_SECAO_Y]) {
  //   dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + (inp.h - H_TEMPLATE) / 25);
  // }

  // altura do Estribo X/Y difere do template (17cm/19cm) — ajustes na Seção 1.1/2.2 (marcas
  // "cauda" ligadas a N3-N6 + barra reta nativa, e o retângulo "em corte" de 2 níveis da
  // Seção 2.2). Achado sessão 2026-09-10 (arquivo real, pilar 100x25cm, 2 pares no sentido
  // menor, largura do estribo forçada em 2d): usuário reportou "na seção também tem ajustes
  // em função da alteração da altura do estribo". Deltas e sinais resolvidos comparando o
  // arquivo GERADO (não o ajustado à mão!) com o ajustado — o arquivo ajustado pelo S4CAD
  // tinha 1 byte a mais em algum texto anterior, deslocando TODOS os offsets em +1; os
  // literais abaixo já são os do arquivo GERADO (achados refazendo a busca a partir de
  // gerado.DW4, não do ajustado — ver conversa, essa pegadinha já causou confusão 1x aqui).
  // NÃO cobre ainda o retângulo em corte da Seção 1.1 quando há par extra em N2 — esse grupo
  // mostrou TAMBÉM um deslocamento em X (~0,795) na mesma amostra que não bate só com a
  // fórmula de pares já existente (xSecao11Base+off); não mexi nele, precisa de mais um
  // teste isolado (par extra em N2 SEM alterar a altura do estribo) pra separar as 2 causas
  const ALTURA_ESTRIBO_X_TEMPLATE = 17;
  const ALTURA_ESTRIBO_Y_TEMPLATE = 19;
  const deltaAlturaEstriboX = Math.round(r.alturaEstriboX) - ALTURA_ESTRIBO_X_TEMPLATE;
  const deltaAlturaEstriboY = Math.round(r.alturaEstriboY) - ALTURA_ESTRIBO_Y_TEMPLATE;
  // resíduo adicional achado sessão 2026-09-14 (pilar 60x25, ap>bp): usuário reportou "estribo
  // diminui 1cm com porta-estribo 16/20mm, precisa de ajuste na seção 1.1/2.2" — em 2988 e nos
  // dois grupos de "retângulo em corte" (3767-3851 ligado a X, 3879-3963 ligado a Y) — NÃO em
  // N3/N4 nem nas marcas de camada 4223-4751. DUAS tentativas anteriores (histórico abaixo)
  // ficaram erradas até o usuário explicar a LÓGICA de verdade por trás do ajuste: "a lógica é
  // sempre centralizar os estribos na altura pelo centro da espessura da laje e os pontos dos
  // porta-estribo ficarem deslocados 1cm em X e Y dos cantos do retângulo em direção ao centro
  // do estribo" — ou seja, esse resíduo de 1cm (±0,5cm = ±1 unidade de delta em cada canto, os
  // ±0,02 do arquivo) só existe quando o porta-estribo é GROSSO o bastante pra "comer" da altura
  // livre do estribo (por isso nunca aparecia com porta-estribo 10/12,5mm — exatamente o que o
  // usuário já tinha dito desde o relato original do bug: "10 e 12,5 não precisa, 16 e 20
  // precisa"). TENTATIVA 1 (revertida): fórmula linear em deltaPrimeiraCamada, ajustada a 2
  // amostras — um 3º arquivo real (orientação invertida, ap<bp) derrubou a hipótese (previa
  // -0,5, o real era +1,0). TENTATIVA 2 (revertida): constante fixa =1 sempre — quebrou o caso
  // mais básico de todos (porta-estribo 10mm, h=25, a configuração "de fábrica"): usuário
  // reportou "fiz teste com... porta estribo de 10mm e ficou errado agora". Confirmado por que:
  // com porta-estribo 10mm essa mesma amostra (60x25/h=25) já tem deltaAlturaEstriboX=+2/
  // deltaAlturaEstriboY=-2 (NENHUM dos dois é zero) e mesmo assim residual=0 — prova que
  // "delta≠0" nunca foi o gatilho certo. O gatilho real é se o porta-estribo CHEGA a comprimir
  // o estribo (diamPortaInferior grande), não se alturaEstribo difere do template por outro
  // motivo. Implementado como o próprio usuário descreveu: liga só quando diamPortaInferior
  // ultrapassa a faixa "não comprime" (10/12,5mm, confirmado sem ajuste desde o relato original)
  // pra a faixa "comprime" (16/20mm, as únicas opções do dropdown — não há valor entre 12,5 e
  // 16, então o limiar exato não importa). RESSALVA: ainda não testado com Nr>3 nem múltiplos
  // pares — o "1cm" pode não bater se isso interagir com outra coisa; reverificar se aparecer
  // um arquivo real nessas condições.
  const extraResiduoEstribo = inp.diamPortaInferior >= 16 ? 1 : 0;
  // N5/N6 (barras de porta-estribo X, espelho de N3/N4) CORRIGIDO (sessão 2026-09-12, mesmo dia
  // do fix de N3/N4): usuário reportou o mesmo problema agora pro lado X ("deslocado as barras
  // do porta estribo em função do aumento da espessura na seção 1.1") — mesmo segundo termo
  // -Δh/4/25 (N6, espelhando N4) / +Δh/4/25 (N5, espelhando N3), zero quando Δh=0. Mesma
  // ressalva: coeficiente 1/4 achado numa amostra só (Δh=10, deltaAlturaEstriboX=12, variando
  // junto — ver nota de N3/N4 abaixo)
