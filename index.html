                  <div className="result-line">
                    Total: <b>{r.nGruposTotal}</b> pares ({r.gruposMenor}+{r.gruposMaior}) = <b>{r.estribosFornecidos}</b> estribos/camada
                    ({r.ramosFornecidos} ramos/camada, ≥ {r.ramosNecessarios} necessários) · <b>{r.totalBarrasPorFace}</b> barras
                    porta-estribo inferior ø{inp.diamPortaInferior} + <b>{r.totalBarrasPorFace}</b> barras superior ø10
                    (4 barras por par: 2 inferior + 2 superior amarram cada estribo)
                  </div>
                  <div className="footnote">
                    Posições dos pares do sentido menor medidas a partir de uma borda do pilar, ao longo do eixo maior —
                    dividindo o eixo maior pelo nº de pares + 1 (ex.: 2 pares → divide por 3). O par do sentido maior é
                    único e fica sempre no centro. Comprimento = dimensão do pilar + (nº de lados) × (Nr×Sr + 5cm).
                  </div>
                </>
              ) : (
                <div className="derived-note">Contorno C&apos; dispensa armadura de punção — nenhum grupo a detalhar.</div>
              )}

              <h2>Colapso progressivo</h2>
              <div className="result-line">
                As,total necessária: <b>{fmt(r.AsTotal, 3)}</b> cm²
              </div>

              {r.temArmadura ? (
                <>
                  <div className="result-line">
                    Só as barras porta-estribo <b>inferiores</b> que realmente atravessam o pilar entram na
                    conta do colapso progressivo — as superiores são só construtivas.
                    {r.barrasExcluidasLargura > 0 || r.barrasExcluidasPosicao > 0 ? (
                      <>
                        {" "}<b>{r.totalBarrasPorFace}</b> barras contam (de {r.nGruposTotal * 2} totais) —
                        {r.barrasExcluidasLargura > 0 && (
                          <span className="warn"> {r.barrasExcluidasLargura} excluídas por largura</span>
                        )}
                        {r.barrasExcluidasLargura > 0 && r.barrasExcluidasPosicao > 0 && " e "}
                        {r.barrasExcluidasPosicao > 0 && (
                          <span className="warn"> {r.barrasExcluidasPosicao} excluídas por posição</span>
                        )}
                        : a largura do par (sentido menor: {fmt(r.larguraEstriboX && r.menorEhX ? r.larguraEstriboX : r.larguraEstriboY, 1)}cm;
                        sentido maior: 2d) pode ser maior que a dimensão perpendicular do pilar (não cabe dentro
                        dele), e/ou — quando há vários pares no sentido menor — os mais externos podem ficar
                        posicionados além da própria extensão do pilar (cabem em largura, mas não atravessam
                        concreto ali).
                      </>
                    ) : (
                      <> (2 por par × {r.nGruposTotal} pares = <b>{r.totalBarrasPorFace}</b> barras)</>
                    )}
                  </div>
                  {r.maiorGrupoReposicionado && (
                    <div className="derived-note hint">
                      O par do sentido maior não cabe centralizado na dimensão do sentido da face livre — o par
                      inteiro foi deslocado pra longe dela, com a linha mais próxima a cobrimento + 2,5cm de
                      distância (dentro do pilar de verdade). A linha mais distante se estende além do próprio
                      pilar, dentro da laje do lado sem face livre — existe de verdade, mas não atravessa ESSE
                      pilar, então não conta no colapso. {r.maiorLinhasDentro === 2
                        ? "Nesse caso as 2 linhas ainda couberam dentro do pilar."
                        : r.maiorLinhasDentro === 1
                        ? "Só a linha mais próxima conta (a mais distante fica fora do pilar)."
                        : "Nenhuma das 2 linhas atravessa o pilar nesse sentido."}
                    </div>
                  )}
                  <table className="bars-table">
                    <thead>
                      <tr>
                        <th>Posição</th>
                        <th>Qtde</th>
                        <th>Bitola</th>
                        <th>Função</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td>Porta-estribo inferior</td>
                        <td>{r.totalBarrasPorFace}</td>
                        <td>{`ø ${r.diamPortaInferior}`}</td>
                        <td>definida pelo usuário — conta p/ colapso progressivo</td>
                      </tr>
                      <tr>
                        <td>Porta-estribo superior</td>
                        <td>{r.totalBarrasPorFace}</td>
                        <td>ø 10</td>
                        <td>construtiva (segura o topo do estribo)</td>
                      </tr>
                    </tbody>
                  </table>
                  <div className="result-line">
                    As efetiva (inferior) = {r.totalBarrasPorFace} × {fmt(BIT(r.diamPortaInferior), 2)} cm² = <b>{fmt(r.AsPortaInferior, 3)}</b> cm²
                  </div>
                  {r.AsFaltanteColapso > 0 ? (
                    <>
                      <VerdictBadge
                        ok={false}
                        okText="OK"
                        failText={`Porta-estribo inferior não cobre sozinho — falta ${fmt(r.AsFaltanteColapso, 3)} cm²`}
                      />
                      <div className="result-line">Barras complementares (além das porta-estribo), por bitola:</div>
                      <table className="bars-table">
                        <thead>
                          <tr>
                            <th>Diâmetro</th>
                            <th>Nº de barras extras</th>
                            <th>Comprim. mín. (X)</th>
                            <th>Comprim. mín. (Y)</th>
                          </tr>
                        </thead>
                        <tbody>
                          {r.complementoColapso.map(({ diam, n, comprimentoMinX, comprimentoMinY }) => (
                            <tr key={diam}>
                              <td>ø {diam}</td>
                              <td>{n}</td>
                              <td>{fmt(comprimentoMinX, 0)} cm</td>
                              <td>{fmt(comprimentoMinY, 0)} cm</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="footnote">
                        Comprimento mínimo = dimensão do pilar + 4d + 2×lb,nec (ancoragem reta, boa aderência,
                        NBR 6118 9.4) — garante que a barra atravessa o pilar com ancoragem suficiente nas 2 pontas.
                      </div>
                    </>
                  ) : (
                    <VerdictBadge ok={true} okText="OK — porta-estribo inferior já cobre o colapso progressivo sozinho" failText="" />
                  )}
                </>
              ) : (
                <>
                  <table className="bars-table">
                    <thead>
                      <tr>
                        <th>Diâmetro</th>
                        <th>Nº de barras</th>
                        <th>Comprim. mín. (X)</th>
                        <th>Comprim. mín. (Y)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {r.nBarras.map(({ diam, n, comprimentoMinX, comprimentoMinY }) => (
                        <tr key={diam}>
                          <td>ø {diam}</td>
                          <td>{r.AsTotal <= 0 ? "não necessita" : n}</td>
                          <td>{fmt(comprimentoMinX, 0)} cm</td>
                          <td>{fmt(comprimentoMinY, 0)} cm</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className="footnote">
                    O número de barras refere-se ao As,total, sem considerar o cruzamento com as faces. Comprimento
                    mínimo = dimensão do pilar + 4d + 2×lb,nec (ancoragem reta, boa aderência, NBR 6118 9.4) —
                    garante que a barra atravessa o pilar com ancoragem suficiente nas 2 pontas.
                  </div>
                </>
              )}
              </div>

              <h2>Arranjo da armadura de punção</h2>
              {inp.tipoPilar === "C" && inp.padraoArmadura === "radial" ? (
                <>
                <PuncaoDiagramCantoRadial
                  ativo={r.temArmadura}
                  ap={inp.ap}
                  bp={inp.bp}
                  d={r.d}
                  Nr={r.Nr}
                  Sr={r.Sr}
                  primeiraCamada={r.primeiraCamada}
                  nBarrasRadial={r.nBarrasRadial}
                  diamEstribo={inp.diamEstribo}
                />
                {r.temArmadura && (
                  <FerroCobraDiagram
                    d={r.d}
                    Nr={r.Nr}
                    Sr={r.Sr}
                    primeiraCamada={r.primeiraCamada}
                    h={inp.h}
                    cobrimento={inp.cobrimento}
                    diamNegativo={inp.diamMalha}
                    diamEstribo={inp.diamEstribo}
                  />
                )}
                </>
              ) : inp.formaCircular ? (
                <>
                <PuncaoDiagramCircular
                  ativo={r.temArmadura}
                  diametro={inp.diametro}
                  d={r.d}
                  Nr={r.Nr}
                  Sr={r.Sr}
                  primeiraCamada={r.primeiraCamada}
                  padraoArmadura={inp.padraoArmadura}
                  nBarrasRadial={r.nBarrasRadial}
                  diamEstribo={inp.diamEstribo}
                  diamPortaInferior={inp.diamPortaInferior}
                  cobrimento={inp.cobrimento}
                  h={inp.h}
                  larguraEstriboCircularManual={inp.larguraEstriboCircularManual}
                />
                {r.temArmadura && inp.padraoArmadura === "radial" && (
                  <FerroCobraDiagram
                    d={r.d}
                    Nr={r.Nr}
                    Sr={r.Sr}
                    primeiraCamada={r.primeiraCamada}
                    h={inp.h}
                    cobrimento={inp.cobrimento}
                    diamNegativo={inp.diamMalha}
                    diamEstribo={inp.diamEstribo}
                  />
                )}
                </>
              ) : (
                <PuncaoDiagram
                  ativo={r.temArmadura}
                  tipoPilar={inp.tipoPilar}
                  nome={inp.nome}
                  ap={inp.ap}
                  bp={inp.bp}
                  Nr={r.Nr}
                  diamEstribo={inp.diamEstribo}
                  diamPortaInferior={r.diamPortaInferior}
                  Sr={r.Sr}
                  primeiraCamada={r.primeiraCamada}
                  gruposMenor={r.gruposMenor}
                  gruposMaior={r.gruposMaior}
                  posicoesMenor={r.posicoesMenor}
                  posicoesMaior={r.posicoesMaior}
                  comprMenorSentido={r.comprMenorSentido}
                  comprMaiorSentido={r.comprMaiorSentido}
                  menorEhX={r.menorEhX}
                  ladosMenor={r.ladosMenor}
                  ladosMaior={r.ladosMaior}
                  comprimentoEstriboX={r.comprimentoEstriboX}
                  comprimentoEstriboY={r.comprimentoEstriboY}
                  larguraEstriboX={r.larguraEstriboX}
                  larguraEstriboY={r.larguraEstriboY}
                  alturaEstriboX={r.alturaEstriboX}
                  alturaEstriboY={r.alturaEstriboY}
                  maiorGrupoReposicionado={r.maiorGrupoReposicionado}
                  menorGrupoReposicionado={r.menorGrupoReposicionado}
                  formaCircular={inp.formaCircular}
                />
              )}

              <div className="print-bar no-print">
                <button className="print-btn" onClick={() => window.print()}>
                  🖨 Imprimir / Salvar PDF
                </button>
                {((inp.tipoPilar !== "C" && inp.padraoArmadura === "cruz") ||
                  (inp.formaCircular && inp.padraoArmadura === "radial")) &&
                  r.temArmadura && (
                  <button
                    className="print-btn"
                    style={{ marginLeft: 10, background: "#7c3aed" }}
                    onClick={() => baixarArquivoS4(inp, r)}
                    title="Experimental — baseado em engenharia reversa do formato do S4. Confira sempre o arquivo gerado antes de usar em projeto real. Se o navegador suportar (Chrome/Edge servindo a página por http/https), abre um diálogo pra você escolher a pasta e o nome do arquivo; senão baixa pro local padrão de downloads."
                  >
                    ⚗ Gerar arquivo S4 (.DW4) — experimental
                  </button>
                )}
              </div>
              {inp.tipoPilar !== "C" && !inp.formaCircular && inp.padraoArmadura === "cruz" && r.temArmadura && (
                <div className="derived-note warn no-print">
                  Gerador experimental (engenharia reversa do S4) — hoje funciona bem pra pilar/contorno/barras/comprimentos/bitolas,
                  mas a HACHURA do pilar é REMOVIDA (em vez de redimensionada — ajustar a hachura de fora do S4 ainda não
                  funciona direito, então prefiro deixar limpo pra você hachurar manualmente) e a distância independente
                  da face (0,5d) ainda não está 100% resolvida. Sempre confira o arquivo gerado no S4 antes de usar em
                  projeto real.
                </div>
              )}
              {inp.formaCircular && inp.padraoArmadura === "radial" && r.temArmadura && (
                <div className="derived-note warn no-print">
                  Gerador experimental pra pilar circular + radial (achado sessão 2026-09-25) — cobre só a PLANTA
                  BAIXA (raios da barra cobra, legenda e contorno do círculo). A Seção 1.1 (elevação em zigue-zague)
                  e a tabela ARMADURA DE COLAPSO ainda saem com os valores do arquivo-modelo (Nr=4/Fk=30tf), não do
                  seu pilar — ainda precisam de mais uma rodada. Sempre confira o arquivo gerado no S4 antes de usar
                  em projeto real.
                </div>
              )}

              <div className="no-print">
              <h2>Valores auxiliares</h2>
              <div className="aux-grid">
                <div><span>u0</span><span className="aux-val"><b>{fmt(r.u_0)}</b> cm</span></div>
                <div><span>u</span><span className="aux-val"><b>{fmt(r.u_red)}</b> cm</span></div>
                <div><span>u&apos;</span><span className="aux-val"><b>{fmt(r.u_l)}</b> cm</span></div>
                <div><span>Wpx (C)</span><span className="aux-val"><b>{fmt(r.WpxC)}</b> cm²</span></div>
                <div><span>Wpy (C)</span><span className="aux-val"><b>{fmt(r.WpyC)}</b> cm²</span></div>
                <div><span>W&apos;px (C&apos;)</span><span className="aux-val"><b>{fmt(r.Wpx)}</b> cm²</span></div>
                <div><span>W&apos;py (C&apos;)</span><span className="aux-val"><b>{fmt(r.Wpy)}</b> cm²</span></div>
                <div><span>W&apos;&apos;px (C&apos;&apos;)</span><span className="aux-val"><b>{fmt(r.Wpxl)}</b> cm²</span></div>
                <div><span>W&apos;&apos;py (C&apos;&apos;)</span><span className="aux-val"><b>{fmt(r.Wpyl)}</b> cm²</span></div>
                <div><span>ρ</span><span className="aux-val"><b>{fmt(r.rho, 4)}</b></span></div>
                <div><span>Kx</span><span className="aux-val"><b>{fmt(r.Kx, 3)}</b></span></div>
                <div><span>Ky</span><span className="aux-val"><b>{fmt(r.Ky, 3)}</b></span></div>
                <div><span>ex</span><span className="aux-val"><b>{fmt(r.ex)}</b> cm</span></div>
                <div><span>ey</span><span className="aux-val"><b>{fmt(r.ey)}</b> cm</span></div>
                <div><span>e&apos;x</span><span className="aux-val"><b>{fmt(r.exl)}</b> cm</span></div>
                <div><span>e&apos;y</span><span className="aux-val"><b>{fmt(r.eyl)}</b> cm</span></div>
                <div><span>Ms*x</span><span className="aux-val"><b>{fmt(r.Msx)}</b> tf.m</span></div>
                <div><span>Ms*y</span><span className="aux-val"><b>{fmt(r.Msy)}</b> tf.m</span></div>
                <div><span>M&apos;sx</span><span className="aux-val"><b>{fmt(r.Msxl)}</b> tf.m</span></div>
                <div><span>M&apos;sy</span><span className="aux-val"><b>{fmt(r.Msyl)}</b> tf.m</span></div>
              </div>
              </div>
            </>
          )}
          {r && (
            <div className="footnote no-print">
              Esquema em planta (na seção &quot;Contornos críticos&quot;, acima), à escala relativa (não a escala
              do desenho). Compare os valores u0/u/u&apos;&apos; com os da sua planilha do curso — os contornos
              C e C&apos; de todos os tipos de pilar (central, borda e canto) são geometricamente rigorosos
              (arco de raio 2d centrado no canto real do pilar), validados ponto a ponto contra DXFs de
              referência do escritório. Os vãos reais (quando houver furo ou corte de cunha) usam a interseção
              exata com o contorno arredondado, também validada ponto a ponto.
            </div>
          )}
        </section>
      </div>
      </div>

      {r && (
        <div className="print-only">
          <h1 className="resumo-titulo">Memorial de Cálculo — Punção (NBR 6118)</h1>
          <table className="resumo-tabela">
            <tbody>
              <tr>
                <th>Identificação</th><td>{inp.nome || "—"}</td>
                <th>Cobrimento</th><td>{fmt(inp.cobrimento, 1)} cm</td>
              </tr>
              <tr>
                <th>Dimensão do pilar</th>
                <td>
                  {inp.formaCircular
                    ? <>Ø {fmt(inp.diametro, 0)} cm</>
                    : <>{fmt(inp.ap, 0)}×{fmt(inp.bp, 0)} cm ({inp.tipoPilar === "I" ? "central" : inp.tipoPilar === "B" ? "borda" : "canto"})</>}
                </td>
                <th>fck</th><td>{fmt(inp.fck, 0)} MPa</td>
              </tr>
              <tr>
                <th>Reações de cálculo</th>
                <td>Fk={fmt(inp.Fk, 1)}tf · Mk,x={fmt(inp.Mkx, 2)} · Mk,y={fmt(inp.Mky, 2)} tf.m</td>
                <th>d</th><td>{fmt(r.d, 2)} cm</td>
              </tr>
              <tr>
                <th>Taxa de aço usada (ρ)</th><td>{fmt(r.rho, 4)}</td>
                <th>h (espessura)</th><td>{fmt(inp.h, 0)} cm</td>
              </tr>
            </tbody>
          </table>

          <table className="resumo-tabela">
            <thead>
              <tr><th>Contorno</th><th>τsd (kgf/cm²)</th><th>τ referência</th><th>Situação</th></tr>
            </thead>
            <tbody>
              <tr>
                <td>C</td><td>{fmt(r.tau_C, 2)}</td><td>τRd2 = {fmt(r.tauRd2, 2)}</td>
                <td className={r.ok_C ? "ok-txt" : "fail-txt"}>{r.ok_C ? "OK" : "EXCEDE"}</td>
              </tr>
              <tr>
                <td>C&apos;</td><td>{fmt(r.tau_Cl, 2)}</td>
                <td>{r.precisaArm ? `τRd3 = ${fmt(r.tauRd3, 2)}` : `τRd1 = ${fmt(r.tauRd1, 2)}`}</td>
                <td className={(r.precisaArm ? r.okClArm : true) ? "ok-txt" : "fail-txt"}>
                  {r.precisaArm ? (r.okClArm ? "OK c/ armadura" : "EXCEDE") : "OK sem armadura"}
                </td>
              </tr>
              {r.temArmadura && (
                <tr>
                  <td>C&apos;&apos;</td><td>{fmt(r.tau_Cll_ajustado, 2)}</td><td>τRd1 = {fmt(r.tauRd1, 2)}</td>
                  <td className={r.atendeCll_ajustado ? "ok-txt" : "fail-txt"}>{r.atendeCll_ajustado ? "OK" : "EXCEDE"}</td>
                </tr>
              )}
            </tbody>
          </table>

          <table className="resumo-tabela">
            <tbody>
              <tr>
                <th>Colapso progressivo</th>
                <td colSpan={3}>
                  As,total = <b>{fmt(r.AsTotal, 3)}</b> cm²
                  {r.AsTotal <= 0
                    ? " — não necessita"
                    : r.temArmadura
                    ? (r.AsFaltanteColapso > 0
                        ? ` — porta-estribo cobre parcialmente, falta ${fmt(r.AsFaltanteColapso, 3)} cm² (${r.complementoColapso.filter((x) => x.n > 0).map((x) => `${x.n}×ø${x.diam} — compr.mín. X=${fmt(x.comprimentoMinX, 0)}/Y=${fmt(x.comprimentoMinY, 0)}cm`).join("; ") || "—"})`
                        : ` — porta-estribo inferior já cobre sozinho`)
                    : (() => {
                        const opc = r.nBarras.find((x) => x.n > 0) || r.nBarras[0];
                        return opc
                          ? ` — ex.: ${opc.n}×ø${opc.diam} (compr.mín. X=${fmt(opc.comprimentoMinX, 0)}cm, Y=${fmt(opc.comprimentoMinY, 0)}cm)`
                          : "";
                      })()}
                </td>
              </tr>
            </tbody>
          </table>

          {r.temArmadura && (
            <table className="resumo-tabela">
              <thead>
                <tr><th colSpan={2}>Detalhes da armadura de punção</th></tr>
              </thead>
              <tbody>
                <tr>
                  <th>Porta-estribo</th>
                  <td>
                    ø {fmt(r.diamPortaInferior || inp.diamPortaInferior, 1)} —{" "}
                    {inp.tipoPilar === "C" && inp.padraoArmadura === "radial"
                      ? <>{r.nBarrasRadial} barra(s) &quot;cobra&quot;</>
                      : inp.formaCircular && inp.padraoArmadura === "radial"
                      ? <>{r.nBarrasRadial} barra(s) &quot;cobra&quot;</>
                      : inp.formaCircular
                      ? <>4 braços em cruz</>
                      : <>{r.totalBarrasPorFace} barras/face (inferior)</>}
                  </td>
                </tr>
                <tr>
                  <th>Estribo</th>
                  <td>
                    ø {inp.diamEstribo} —{" "}
                    {inp.tipoPilar === "C" && inp.padraoArmadura === "radial"
                      ? <>{r.nBarrasRadial} ramos/camada × {r.Nr} camadas = <b>{r.nBarrasRadial * r.Nr}</b> ramos no total</>
                      : inp.formaCircular && inp.padraoArmadura === "radial"
                      ? <>{r.nBarrasRadial} ramos/camada × {r.Nr} camadas = <b>{r.nBarrasRadial * r.Nr}</b> ramos no total</>
                      : inp.formaCircular
                      ? <>8 ramos/camada × {r.Nr} camadas = <b>{8 * r.Nr}</b> ramos no total</>
                      : <>{r.estribosFornecidos} estribo(s)/camada × {r.Nr} camadas = <b>{r.estribosFornecidos * r.Nr}</b> estribos ({r.ramosFornecidos * r.Nr} ramos no total)</>}
                  </td>
                </tr>
                <tr>
                  <th>Espaçamento entre camadas</th>
                  <td>
                    1ª/última = 0,5d = <b>{fmt(r.primeiraCamada, 2)}</b>cm · intermediárias = 0,75d = <b>{fmt(r.Sr, 2)}</b>cm ·{" "}
                    {r.Nr} camadas no total
                  </td>
                </tr>
                {!inp.formaCircular && !(inp.tipoPilar === "C" && inp.padraoArmadura === "radial") && (
                  <>
                    <tr>
                      <th>Comprimento porta-estribo</th>
                      <td>
                        Sentido X: <b>C={r.menorEhX ? r.comprMenorSentido : r.comprMaiorSentido}</b>cm ·{" "}
                        Sentido Y: <b>C={r.menorEhX ? r.comprMaiorSentido : r.comprMenorSentido}</b>cm
                      </td>
                    </tr>
                    <tr>
                      <th>Dimensões do estribo (b×h)</th>
                      <td>
                        Sentido X: <b>{fmt(r.larguraEstriboX, 1)}×{fmt(r.alturaEstriboX, 1)}</b>cm ·{" "}
                        Sentido Y: <b>{fmt(r.larguraEstriboY, 1)}×{fmt(r.alturaEstriboY, 1)}</b>cm
                      </td>
                    </tr>
                  </>
                )}
              </tbody>
            </table>
          )}

          <h2 className="resumo-subtitulo">Arranjo da armadura de punção</h2>
          <div className="resumo-desenho">
            {inp.tipoPilar === "C" && inp.padraoArmadura === "radial" ? (
              <>
              <PuncaoDiagramCantoRadial
                ativo={r.temArmadura}
                ap={inp.ap}
                bp={inp.bp}
                d={r.d}
                Nr={r.Nr}
                Sr={r.Sr}
                primeiraCamada={r.primeiraCamada}
                nBarrasRadial={r.nBarrasRadial}
                diamEstribo={inp.diamEstribo}
              />
              {r.temArmadura && (
                <FerroCobraDiagram
                  d={r.d}
                  Nr={r.Nr}
                  Sr={r.Sr}
                  primeiraCamada={r.primeiraCamada}
                  h={inp.h}
                  cobrimento={inp.cobrimento}
                  diamNegativo={inp.diamMalha}
                  diamEstribo={inp.diamEstribo}
                />
              )}
              </>
            ) : inp.formaCircular ? (
              <>
              <PuncaoDiagramCircular
                ativo={r.temArmadura}
                diametro={inp.diametro}
                d={r.d}
                Nr={r.Nr}
                Sr={r.Sr}
                primeiraCamada={r.primeiraCamada}
                padraoArmadura={inp.padraoArmadura}
                nBarrasRadial={r.nBarrasRadial}
                diamEstribo={inp.diamEstribo}
                diamPortaInferior={inp.diamPortaInferior}
                cobrimento={inp.cobrimento}
                h={inp.h}
                larguraEstriboCircularManual={inp.larguraEstriboCircularManual}
              />
              {r.temArmadura && inp.padraoArmadura === "radial" && (
                <FerroCobraDiagram
                  d={r.d}
                  Nr={r.Nr}
                  Sr={r.Sr}
                  primeiraCamada={r.primeiraCamada}
                  h={inp.h}
                  cobrimento={inp.cobrimento}
                  diamNegativo={inp.diamMalha}
                  diamEstribo={inp.diamEstribo}
                />
              )}
              </>
            ) : (
              <>
              <PuncaoDiagram
                ativo={r.temArmadura}
                tipoPilar={inp.tipoPilar}
                nome={inp.nome}
                ap={inp.ap}
                bp={inp.bp}
                Nr={r.Nr}
                diamEstribo={inp.diamEstribo}
                diamPortaInferior={r.diamPortaInferior}
                Sr={r.Sr}
                primeiraCamada={r.primeiraCamada}
                gruposMenor={r.gruposMenor}
                gruposMaior={r.gruposMaior}
                posicoesMenor={r.posicoesMenor}
                posicoesMaior={r.posicoesMaior}
                comprMenorSentido={r.comprMenorSentido}
                comprMaiorSentido={r.comprMaiorSentido}
                menorEhX={r.menorEhX}
                ladosMenor={r.ladosMenor}
                ladosMaior={r.ladosMaior}
                comprimentoEstriboX={r.comprimentoEstriboX}
                comprimentoEstriboY={r.comprimentoEstriboY}
                larguraEstriboX={r.larguraEstriboX}
                larguraEstriboY={r.larguraEstriboY}
                alturaEstriboX={r.alturaEstriboX}
                alturaEstriboY={r.alturaEstriboY}
                maiorGrupoReposicionado={r.maiorGrupoReposicionado}
                menorGrupoReposicionado={r.menorGrupoReposicionado}
                formaCircular={inp.formaCircular}
              />
              </>
            )}
          </div>

          <h2 className="resumo-subtitulo">Valores auxiliares</h2>
          <table className="resumo-tabela resumo-aux">
            <tbody>
              <tr>
                <th>u0</th><td>{fmt(r.u_0)} cm</td>
                <th>u</th><td>{fmt(r.u_red)} cm</td>
                <th>u&apos;&apos;</th><td>{fmt(r.u_l)} cm</td>
              </tr>
              <tr>
                <th>Wpx (C)</th><td>{fmt(r.WpxC)} cm²</td>
                <th>Wpy (C)</th><td>{fmt(r.WpyC)} cm²</td>
                <th>Kx</th><td>{fmt(r.Kx, 3)}</td>
              </tr>
              <tr>
                <th>W&apos;px (C&apos;)</th><td>{fmt(r.Wpx)} cm²</td>
                <th>W&apos;py (C&apos;)</th><td>{fmt(r.Wpy)} cm²</td>
                <th>Ky</th><td>{fmt(r.Ky, 3)}</td>
              </tr>
              <tr>
                <th>W&apos;&apos;px (C&apos;&apos;)</th><td>{fmt(r.Wpxl)} cm²</td>
                <th>W&apos;&apos;py (C&apos;&apos;)</th><td>{fmt(r.Wpyl)} cm²</td>
                <th>ex / ey</th><td>{fmt(r.ex)} / {fmt(r.ey)} cm</td>
              </tr>
              <tr>
                <th>Ms*x</th><td>{fmt(r.Msx)} tf.m</td>
                <th>Ms*y</th><td>{fmt(r.Msy)} tf.m</td>
                <th>e&apos;x / e&apos;y</th><td>{fmt(r.exl)} / {fmt(r.eyl)} cm</td>
              </tr>
            </tbody>
          </table>
        </div>
      )}

      <footer className="validation-note">
        Desenvolvido por Reyginaldo da Rosa
      </footer>
    </div>
  );
}

const css = `
  * { box-sizing: border-box; }
  .wrap {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-2: #f6f7f9;
    --line: #e2e6eb;
    --text: #1c2733;
    --text-dim: #69747f;
    --accent: #3d5166;
    --accent-2: #a5202a;
    --ok: #1f8a4c;
    --ok-bg: #e8f7ee;
    --fail: #a5202a;
    --fail-bg: #fbeaec;
    --brand-blue: #3d5166;
    --brand-red: #a5202a;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', 'Inter', system-ui, sans-serif;
    padding: 0 0 40px;
    min-height: 100%;
    border-radius: 12px;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .topbar { height: 4px; background: linear-gradient(90deg, var(--brand-blue), var(--brand-red)); }

  .hero { display: flex; align-items: flex-start; gap: 20px; padding: 20px 24px; border-bottom: 1px solid var(--line); }
  .hero-brand-block { display: flex; flex-direction: column; padding-right: 20px; border-right: 1px solid var(--line); min-width: 130px; }
  .hero-brand {
    display: flex;
    align-items: baseline;
    gap: 1px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.01em;
  }
  .hero-brand span:first-child { color: var(--brand-blue); }
  .hero-brand span:last-child { color: var(--brand-red); }
  .hero-brand-sub { font-size: 8px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim); margin-top: 3px; }
  .hero-main { flex: 1; }
  .hero-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .hero h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
  .hero-sub { color: var(--text-dim); margin: 0; font-size: 13px; }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px 18px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }
  .summary-item { display: flex; gap: 6px; align-items: baseline; }
  .summary-item .k { color: var(--text-dim); }
  .summary-item .v { color: var(--text); font-weight: 600; }

  .content { padding: 20px 24px 0; }

  .section-title {
    display: flex; align-items: center; gap: 10px;
    margin: 26px 0 14px;
  }
  .section-title:first-child { margin-top: 0; }
  .section-num {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 5px;
    background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .section-title h2 { font-size: 16px; margin: 0; font-weight: 700; color: var(--text); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 0; }
  @media (min-width: 900px) {
    .grid { grid-template-columns: 1fr 1fr; align-items: start; gap: 28px; }
  }

  .panel { background: var(--panel); padding: 0; }
  .panel h2 {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    font-weight: 700;
    margin: 20px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .panel h2:first-child { margin-top: 0; }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 12px;
  }
  .shape-toggle-title {
    grid-column: span 1;
    align-self: end;
    margin: 0 0 8px;
    padding: 0 0 8px;
    font-size: 12px;
    text-transform: uppercase;

    font-weight: 700;
    border-bottom: 1px solid var(--accent);

  }
  .shape-toggle-title:hover { opacity: 0.75; }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 11px; }
  .field-label { color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; font-size: 10.5px; }
  .field-input { display: flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .field input[type="number"], .field input[type="text"], .field select {
    background: #fff;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 7px;
    padding: 8px 9px;
    font-size: 13.5px;
    font-family: 'IBM Plex Mono', monospace;
    width: 100%;
  }
  .field-input input { border: none; border-radius: 0; flex: 1; }
  .field-unit { padding: 0 9px; color: var(--text-dim); font-size: 11px; }
  .field select { font-family: inherit; }

  .derived-note { grid-column: 1 / -1; font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .derived-note.warn, .warn { color: var(--fail); }
  .hint { font-size: 11px; opacity: 0.8; }

  .mode-toggle { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .mode-option {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 10px; cursor: pointer; background: #fff;
  }
  .mode-option.active { color: var(--accent); border-color: var(--accent); background: rgba(61,81,102,0.06); font-weight: 600; }
  .mode-option input { accent-color: var(--accent); }

  .check-row {
    display: grid;
    grid-template-columns: auto auto 16px auto 1fr;
    gap: 8px;
    align-items: baseline;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .check-label { color: var(--text-dim); }
  .check-value { font-weight: 700; }
  .check-cmp { text-align: center; color: var(--accent); }
  .check-reflabel { color: var(--text-dim); font-size: 11px; font-family: 'IBM Plex Sans', sans-serif; }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 5px 12px;
    border-radius: 999px;
    margin: 4px 0 12px;
    text-transform: uppercase;
  }
  .badge-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(31,138,76,0.35); }
  .badge-fail { background: var(--fail-bg); color: var(--fail); border: 1px solid rgba(165,32,42,0.3); }

  .result-line { font-size: 13px; margin-bottom: 10px; line-height: 1.55; }

  .bars-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 8px; }
  .bars-table th, .bars-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .bars-table th { color: var(--text-dim); font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }
  .bars-table td { font-family: 'IBM Plex Mono', monospace; }

  .footnote { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; line-height: 1.5; }

  .diagram-wrap { margin-bottom: 10px; }
  .diagram-svg { width: 100%; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .dg-col { fill: #eef1f4; stroke: var(--text); stroke-width: 2; }
  .dg-hatch { stroke: #ccd2d8; stroke-width: 1; }
  .dg-col-label { fill: var(--text); font-size: 15px; font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  .dg-edge { stroke: var(--fail); stroke-width: 3; }
  .dg-bar { stroke: var(--accent); stroke-width: 3; }
  .dg-bar-reduzido { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 6 3; opacity: 0.75; }
  .dg-label-tiny { font-size: 9px; fill: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .dg-label { fill: var(--text); font-size: 13px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .dg-label-small { fill: var(--text-dim); font-size: 11px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .dg-label-bg { fill: #ffffff; opacity: 0.88; }
  .dg-estribo { fill: none; stroke: var(--accent-2); stroke-width: 2; }
  .dg-estribo-arrow { stroke: var(--accent-2); stroke-width: 1.5; }
  .estribo-cotado-svg { width: 100%; max-width: 220px; height: auto; }
  .dg-estribo-individual { fill: none; stroke: var(--accent-2); stroke-width: 2; }
  .dg-cota-linha { stroke: var(--text-dim); stroke-width: 1; }
  .dg-cota-texto { font-size: 11px; fill: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .dg-cota-titulo { font-size: 11px; fill: var(--text); font-weight: 600; }
  .estribos-cotados-grupo { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0; }
  .dg-estribo-tick { stroke: var(--accent-2); stroke-width: 2.2; }
  .dg-estribo-tick-circ { fill: var(--accent-2); stroke: none; }
  .dg-tangente { stroke: var(--accent); stroke-width: 1.3; stroke-dasharray: 6 4; }
  .dg-furo { fill: rgba(230,140,20,0.25); stroke: #d97706; stroke-width: 2; }
  .dg-excluido { fill: none; stroke: var(--fail); stroke-width: 4; stroke-linecap: round; }
  .dg-cll-forte { fill: none; stroke: var(--fail); stroke-width: 2; stroke-dasharray: 7 4; }
  .dg-contorno-c0 { stroke: var(--text); stroke-width: 2.5; }
  .dg-contorno-c1 { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 4; }

  .aux-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .aux-grid div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 3px 0; }
  .aux-grid span { color: var(--text-dim); }
  .aux-grid .aux-val { color: var(--text); text-align: right; white-space: nowrap; }
  .aux-grid .aux-val b { color: var(--text); }

  .validation-note {
    margin-top: 24px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding: 14px 24px 0;
    border-top: 1px solid var(--line);
  }

  .print-bar { display: flex; justify-content: center; padding: 10px 0 0; }
  .print-btn {
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 9px 18px; letter-spacing: 0.02em;
  }
  .print-btn:hover { filter: brightness(1.08); }

  .print-only { display: none; }

  @media print {
    @page { size: A4; margin: 8mm; }
    .no-print { display: none !important; }
    body, .wrap { background: #fff !important; }
    .print-only {
      display: block !important;
      font-size: 8px !important;
      line-height: 1.25;
      color: #1c2733;
      font-family: inherit;
    }
    .resumo-titulo { font-size: 13px; margin: 0 0 5px; text-align: center; }
    .resumo-subtitulo { font-size: 10px; margin: 5px 0 2px; }
    .resumo-tabela { width: 100%; border-collapse: collapse; margin-bottom: 4px; font-size: 8px; }
    .resumo-tabela th, .resumo-tabela td { border: 1px solid #ccc; padding: 1px 4px; text-align: left; }
    .resumo-tabela th { background: #f2f2f2; font-weight: 600; white-space: nowrap; }
    .resumo-aux th { font-size: 7px; }
    .ok-txt { color: #1f8a4c; font-weight: 700; }
    .fail-txt { color: #a5202a; font-weight: 700; }
    .resumo-desenho { overflow: visible; }
    .resumo-desenho .diagram-svg { max-height: 140px; }
    .resumo-desenho .diagram-wrap { margin-bottom: 3px; }
    .resumo-desenho .footnote { font-size: 6.5px; line-height: 1.2; }
    a[href]:after { content: "" !important; }
  }
`;

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

</script>
</body>
</html>
