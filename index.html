<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculadora de Punção — REICAL</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root">
  <div style="font-family: sans-serif; padding: 40px; text-align: center; color: #666;">
    Carregando calculadora de punção... (se essa mensagem não sumir em alguns segundos, veja o Console do navegador — F12 — pra checar erro)
  </div>
</div>
<script>
  window.addEventListener('error', function (e) {
    document.getElementById('root').innerHTML =
      '<div style="font-family: sans-serif; padding: 40px; color: #b91c1c;"><b>Erro ao carregar:</b><br>' +
      (e.message || 'erro desconhecido') + '<br><br>Abra o Console (F12) pra mais detalhes.</div>';
  });
</script>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;


/* ==================== MOTOR DE CÁLCULO ====================
   Traduzido 1:1 das funções VBA e fórmulas da planilha
   "Cálculo_de_Punção_ALM.xlsm" (Módulo1 + aba "Punção e Colapso").
   Validado numericamente contra os 5 casos de pilar da planilha
   original (diferença < 0.01 em todas as saídas). */

const BIT_TABLE = { 5: 0.2, 6.3: 0.32, 8: 0.5, 10: 0.8, 12.5: 1.25, 16: 2, 20: 3.15, 25: 5, 32: 8 };
const DIAMS_COL = [6.3, 8, 10, 12.5, 16, 20]; // bitolas padrão pra armadura de colapso progressivo/complemento
function BIT(bitola) {
  if (BIT_TABLE[bitola] !== undefined) return BIT_TABLE[bitola];
  return (Math.PI * (bitola / 10) ** 2) / 4;
}

function normTipo(tipo) {
  const t = tipo.toUpperCase();
  return t === "CM" || t === "K" ? "C" : t;
}

function a1a2(C1, C2, d) {
  const a1 = 1.5 * d >= C1 / 2 ? C1 / 2 : 1.5 * d;
  const a2 = 1.5 * d >= C2 / 2 ? C2 / 2 : 1.5 * d;
  return [a1, a2];
}

// cheio=true usa o perímetro COMPLETO (sem o limite de 1,5d/metade do pilar), validado ponto a
// ponto contra os DXFs "com momento" do escritório — NBR permite essa versão maior quando há
// momento atuando no pilar (figura com "borda livre" + perna cheia até a face oposta).
function u0fn(C1, C2, d, tipo, cheio) {
  tipo = normTipo(tipo);
  const [a1, a2] = a1a2(C1, C2, d);
  if (tipo === "I") return 2 * C1 + 2 * C2;
  if (tipo === "B") return cheio ? C1 + 2 * C2 : 2 * a2 + C1;
  return cheio ? C1 + C2 : a1 + a2; // C
}

function uredfn(C1, C2, d, tipo, cheio) {
  tipo = normTipo(tipo);
  const [a1, a2] = a1a2(C1, C2, d);
  if (tipo === "I") return 2 * (C1 + C2) + 4 * Math.PI * d;
  if (tipo === "B") return cheio ? C1 + 2 * C2 + 2 * Math.PI * d : 2 * a2 + C1 + 2 * Math.PI * d;
  return cheio ? C1 + C2 + Math.PI * d : a1 + a2 + Math.PI * d; // C
}

// ---- Corte no contorno C'' por armadura em cruz (não cobre a diagonal/canto) ----
// Construção fornecida pelo escritório e validada ponto a ponto contra DXF de referência
// (EXEMPLO_C_2_LINHA, pilar 25x100, Nr=3): 1) traça reta ligando a ponta do último estribo de
// cada braço (menor e maior); 2) reta perpendicular a essa, partindo de cada ponta, até cruzar o
// contorno C''; 3) nesse ponto, um círculo de raio d cruza o contorno C'' de novo — esse é o
// limite do trecho a desconsiderar daquele lado do canto. Válido só pra pilar central (I).
function raioDoContornoPt(P, dir, hw, hh, r) {
  const ux = dir[0], uy = dir[1];
  let melhorT = Infinity, melhorPt = null;
  const consid = (t, pt) => {
    if (t > 1e-6 && t < melhorT) { melhorT = t; melhorPt = pt; }
  };
  if (Math.abs(ux) > 1e-12) {
    for (const sinal of [1, -1]) {
      const alvo = sinal * (hw + r);
      const t = (alvo - P[0]) / ux;
      const y = P[1] + t * uy;
      if (y >= -hh - 1e-6 && y <= hh + 1e-6) consid(t, [alvo, y]);
    }
  }
  if (Math.abs(uy) > 1e-12) {
    for (const sinal of [1, -1]) {
      const alvo = sinal * (hh + r);
      const t = (alvo - P[1]) / uy;
      const x = P[0] + t * ux;
      if (x >= -hw - 1e-6 && x <= hw + 1e-6) consid(t, [x, alvo]);
    }
  }
  if (r > 1e-9) {
    for (const cxs of [hw, -hw]) {
      for (const cys of [hh, -hh]) {
        const dx = P[0] - cxs, dy = P[1] - cys;
        const a = ux * ux + uy * uy;
        const b = 2 * (dx * ux + dy * uy);
        const c = dx * dx + dy * dy - r * r;
        const disc = b * b - 4 * a * c;
        if (disc < 0) continue;
        const sq = Math.sqrt(disc);
        for (const t of [(-b + sq) / (2 * a), (-b - sq) / (2 * a)]) {
          if (t <= 1e-6) continue;
          const pt = [P[0] + t * ux, P[1] + t * uy];
          const relx = pt[0] - cxs, rely = pt[1] - cys;
          if (Math.sign(relx) === Math.sign(cxs) && Math.sign(rely) === Math.sign(cys)) consid(t, pt);
        }
      }
    }
  }
  return melhorPt;
}

function interseccaoCirculos(c1, r1, c2, r2) {
  const dx = c2[0] - c1[0], dy = c2[1] - c1[1];
  const dist = Math.hypot(dx, dy);
  if (dist > r1 + r2 || dist < Math.abs(r1 - r2) || dist < 1e-9) return [];
  const a = (r1 * r1 - r2 * r2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const xm = c1[0] + (a * dx) / dist, ym = c1[1] + (a * dy) / dist;
  return [
    [xm + (h * dy) / dist, ym - (h * dx) / dist],
    [xm - (h * dy) / dist, ym + (h * dx) / dist],
  ];
}

function cortarComCirculoNoContorno(origem, ptContorno, hw, hh, r, d) {
  const candidatos = [];
  const linhas = [
    ["x", hw + r, -hh, hh], ["x", -(hw + r), -hh, hh],
    ["y", hh + r, -hw, hw], ["y", -(hh + r), -hw, hw],
  ];
  for (const [fixo, val, mn, mx] of linhas) {
    if (fixo === "x") {
      const dx2 = val - ptContorno[0];
      const disc = d * d - dx2 * dx2;
      if (disc < 0) continue;
      const dy2 = Math.sqrt(disc);
      for (const y of [ptContorno[1] + dy2, ptContorno[1] - dy2]) {
        if (y >= mn - 1e-6 && y <= mx + 1e-6) candidatos.push([val, y]);
      }
    } else {
      const dy2 = val - ptContorno[1];
      const disc = d * d - dy2 * dy2;
      if (disc < 0) continue;
      const dx2 = Math.sqrt(disc);
      for (const x of [ptContorno[0] + dx2, ptContorno[0] - dx2]) {
        if (x >= mn - 1e-6 && x <= mx + 1e-6) candidatos.push([x, val]);
      }
    }
  }
  if (r > 1e-9) {
    for (const cxs of [hw, -hw]) {
      for (const cys of [hh, -hh]) {
        for (const pt of interseccaoCirculos(ptContorno, d, [cxs, cys], r)) {
          const relx = pt[0] - cxs, rely = pt[1] - cys;
          if (Math.sign(relx) === Math.sign(cxs) && Math.sign(rely) === Math.sign(cys)) candidatos.push(pt);
        }
      }
    }
  }
  let melhor = null, melhorD = -1;
  for (const c of candidatos) {
    const dd = Math.hypot(c[0] - origem[0], c[1] - origem[1]);
    if (dd > melhorD) { melhorD = dd; melhor = c; }
  }
  return melhor;
}

// A e B: pontas dos últimos estribos (braço menor e maior) relevantes a UM canto (sx,sy = ±1).
// Retorna os 2 pontos de corte (lado A e lado B) no contorno C'' (hw,hh,r=2d+p).
function corteCantoCll(A, B, hw, hh, r, d) {
  const AB = [B[0] - A[0], B[1] - A[1]];
  const perp = [-AB[1], AB[0]];
  const norm = Math.hypot(perp[0], perp[1]);
  if (norm < 1e-9) return null;
  const perpU = [perp[0] / norm, perp[1] / norm];
  const buscar = (P) => {
    const c1 = raioDoContornoPt(P, perpU, hw, hh, r);
    const c2 = raioDoContornoPt(P, [-perpU[0], -perpU[1]], hw, hh, r);
    if (!c1) return c2;
    if (!c2) return c1;
    const d1 = Math.hypot(c1[0] - P[0], c1[1] - P[1]);
    const d2 = Math.hypot(c2[0] - P[0], c2[1] - P[1]);
    return d1 <= d2 ? c1 : c2;
  };
  const ptA = buscar(A);
  const ptB = buscar(B);
  if (!ptA || !ptB) return null;
  const cortA = cortarComCirculoNoContorno(A, ptA, hw, hh, r, d);
  const cortB = cortarComCirculoNoContorno(B, ptB, hw, hh, r, d);
  if (!cortA || !cortB) return null;
  return { cortA, cortB };
}

// Aplica o corte nos 4 cantos e retorna o comprimento total a descontar do u_l (contorno C''),
// pra pilar central (I) com armadura em cruz (menor + maior). posicoesMenorRel = posições dos
// pares do sentido menor, relativas ao centro (0 = centro do pilar), ao longo do eixo maior.
// Corte em cunha entre 2 raios arbitrários (não precisa ser N-fold simétrico) — usado no leque de
// canto radial pros vãos de BORDA (entre a barra mais externa de cada lado e a face do pilar,
// tratada como um "raio virtual" na mesma extensão). Mesma matemática de descontoCantosCircular,
// generalizada pra 2 ângulos quaisquer em vez de rotação fixa 2π/N.
function corteEntreDoisAngulos(angA, angB, raioArm, Rcll, d) {
  function raioNoCirculo(P, Dx, Dy) {
    const a = Dx * Dx + Dy * Dy;
    const b = 2 * (P[0] * Dx + P[1] * Dy);
    const c = P[0] * P[0] + P[1] * P[1] - Rcll * Rcll;
    const disc = b * b - 4 * a * c;
    if (disc < 0) return null;
    const t = (-b + Math.sqrt(disc)) / (2 * a);
    return [P[0] + t * Dx, P[1] + t * Dy];
  }
  function corteNoCirculo(centro, origemRef) {
    const dist = Math.hypot(centro[0], centro[1]);
    const a = (d * d - Rcll * Rcll + dist * dist) / (2 * dist);
    const h2 = d * d - a * a;
    if (h2 < 0) return null;
    const h = Math.sqrt(h2);
    const xm = (centro[0] * (dist - a)) / dist, ym = (centro[1] * (dist - a)) / dist;
    const p1 = [xm + (h * centro[1]) / dist, ym - (h * centro[0]) / dist];
    const p2 = [xm - (h * centro[1]) / dist, ym + (h * centro[0]) / dist];
    const d1 = Math.hypot(p1[0] - origemRef[0], p1[1] - origemRef[1]);
    const d2 = Math.hypot(p2[0] - origemRef[0], p2[1] - origemRef[1]);
    return d1 > d2 ? p1 : p2;
  }
  const A = [raioArm * Math.cos(angA), raioArm * Math.sin(angA)];
  const B = [raioArm * Math.cos(angB), raioArm * Math.sin(angB)];
  const AB = [B[0] - A[0], B[1] - A[1]];
  const perp = [-AB[1], AB[0]];
  const norm = Math.hypot(perp[0], perp[1]);
  if (norm < 1e-9) return null; // A e B coincidem (sem vão de verdade)
  const perpU = [perp[0] / norm, perp[1] / norm];
  const buscar = (P) => {
    const c1 = raioNoCirculo(P, perpU[0], perpU[1]);
    const c2 = raioNoCirculo(P, -perpU[0], -perpU[1]);
    if (!c1) return c2;
    if (!c2) return c1;
    const d1 = Math.hypot(c1[0] - P[0], c1[1] - P[1]);
    const d2 = Math.hypot(c2[0] - P[0], c2[1] - P[1]);
    return d1 <= d2 ? c1 : c2;
  };
  const ptA = buscar(A), ptB = buscar(B);
  const cortA = ptA ? corteNoCirculo(ptA, A) : null;
  const cortB = ptB ? corteNoCirculo(ptB, B) : null;
  if (!cortA || !cortB) return null;
  const angCortA = Math.atan2(cortA[1], cortA[0]);
  const angCortB = Math.atan2(cortB[1], cortB[0]);
  let gap = Math.abs(angCortB - angCortA);
  if (gap > Math.PI) gap = 2 * Math.PI - gap;
  // se o vão calculado (entre os cortes) for MAIOR que o vão original entre A e B, o corte não faz
  // sentido geometricamente (barras já cobrem tudo) — não exclui nada
  let vaoOriginal = Math.abs(angB - angA);
  if (vaoOriginal > Math.PI) vaoOriginal = 2 * Math.PI - vaoOriginal;
  if (gap >= vaoOriginal) return null;
  return { cortA, cortB, excluido: gap * Rcll };
}

function descontoCantosCircular(d, extensaoUltimaCamada, meiaLarguraEstribo, R, N = 4) {
  // Alcance da última camada até o CANTO (ponto mais afastado, considerando a largura do
  // estribo) — confirmado com o usuário: C'' fica 2d além desse canto, não só da distância
  // radial até o centro da camada. Pro padrão RADIAL, meiaLarguraEstribo=0 (cada barra é um
  // ponto, não um par com largura) — confirmado e validado contra DXF (raio exato, sem termo
  // de largura: R+extensaoUltimaCamada+2d).
  const raioUltimaCamada = Math.hypot(R + extensaoUltimaCamada, meiaLarguraEstribo);
  const Rcll = raioUltimaCamada + 2 * d;

  // interseção de uma reta (ponto P, direção D) com o círculo de raio Rcll centrado na origem —
  // pega a raiz mais distante de P na direção de D (t>0)
  function raioNoCirculo(P, Dx, Dy) {
    const a = Dx * Dx + Dy * Dy;
    const b = 2 * (P[0] * Dx + P[1] * Dy);
    const c = P[0] * P[0] + P[1] * P[1] - Rcll * Rcll;
    const disc = b * b - 4 * a * c;
    if (disc < 0) return null;
    const t = (-b + Math.sqrt(disc)) / (2 * a);
    return [P[0] + t * Dx, P[1] + t * Dy];
  }
  // interseção de 2 círculos — pega o ponto mais distante de "origem" (a origem do corte, pra
  // continuar "pro lado de fora", igual à construção retangular)
  function corteNoCirculo(centro, origemRef) {
    const dist = Math.hypot(centro[0], centro[1]);
    const a = (d * d - Rcll * Rcll + dist * dist) / (2 * dist);
    const h2 = d * d - a * a;
    if (h2 < 0) return null;
    const h = Math.sqrt(h2);
    const xm = (centro[0] * (dist - a)) / dist, ym = (centro[1] * (dist - a)) / dist;
    const p1 = [xm + (h * centro[1]) / dist, ym - (h * centro[0]) / dist];
    const p2 = [xm - (h * centro[1]) / dist, ym + (h * centro[0]) / dist];
    const d1 = Math.hypot(p1[0] - origemRef[0], p1[1] - origemRef[1]);
    const d2 = Math.hypot(p2[0] - origemRef[0], p2[1] - origemRef[1]);
    return d1 > d2 ? p1 : p2;
  }

  // canto do braço 1 voltado pro braço 2 (adjacente, espaçado 2π/N) — por simetria, os outros
  // vãos são rotações de 2π/N deste. Pro radial (meiaLarguraEstribo=0), A/B ficam exatamente
  // sobre a própria direção radial de cada braço, sem deslocamento tangencial algum.
  const passo = (2 * Math.PI) / N;
  const raioArm = R + extensaoUltimaCamada;
  const A =
    meiaLarguraEstribo > 1e-9
      ? [raioArm, meiaLarguraEstribo] // cruz (N=4, braços nos eixos): mantém a construção já validada
      : [raioArm, 0];
  const B =
    meiaLarguraEstribo > 1e-9
      ? [meiaLarguraEstribo, raioArm]
      : [raioArm * Math.cos(passo), raioArm * Math.sin(passo)];
  const AB = [B[0] - A[0], B[1] - A[1]];
  const perp = [-AB[1], AB[0]];
  const norm = Math.hypot(perp[0], perp[1]);
  const perpU = [perp[0] / norm, perp[1] / norm];

  const buscarNoCirculo = (P) => {
    const c1 = raioNoCirculo(P, perpU[0], perpU[1]);
    const c2 = raioNoCirculo(P, -perpU[0], -perpU[1]);
    if (!c1) return c2;
    if (!c2) return c1;
    const d1 = Math.hypot(c1[0] - P[0], c1[1] - P[1]);
    const d2 = Math.hypot(c2[0] - P[0], c2[1] - P[1]);
    return d1 <= d2 ? c1 : c2;
  };
  const ptA = buscarNoCirculo(A);
  const ptB = buscarNoCirculo(B);
  const cortA = ptA ? corteNoCirculo(ptA, A) : null;
  const cortB = ptB ? corteNoCirculo(ptB, B) : null;

  if (!cortA || !cortB) return { Rcll, totalExcluido: 0, cortes: [] };

  const angA = Math.atan2(cortA[1], cortA[0]);
  const angB = Math.atan2(cortB[1], cortB[0]);
  let gap = Math.abs(angB - angA);
  if (gap > Math.PI) gap = 2 * Math.PI - gap;
  const excluidoPorVao = gap * Rcll;

  const cortes = Array.from({ length: N }, (_, i) => {
    const rot = i * passo;
    const rotPt = ([x, y]) => [x * Math.cos(rot) - y * Math.sin(rot), x * Math.sin(rot) + y * Math.cos(rot)];
    return { cortA: rotPt(cortA), cortB: rotPt(cortB) };
  });

  return { Rcll, totalExcluido: excluidoPorVao * N, cortes };
}

function descontoCantosCll(tipoPilar, ap, bp, d, p, menorEhX, extensaoUltimaCamada, larguraEstriboMenor, larguraEstriboMaior, posicoesMenorRel, maiorPosAbsOverride) {
  const hw = ap / 2, hh = bp / 2;
  const r = 2 * d + p;
  const hwMenorArm = menorEhX ? hw : hh; // metade da dimensão na direção que o braço MENOR percorre
  const hhMenorArm = menorEhX ? hh : hw; // metade da dimensão perpendicular (onde os pares se distribuem)
  // Cantos onde o contorno C'' de fato tem arco (onde há laje dos dois lados que se encontram):
  // pilar central (I) = todos os 4; borda (B) = só o lado com laje no eixo fixo da face livre (Y);
  // canto (C) = só o único canto com laje (oposto às 2 faces livres, +X/+Y).
  const cantos =
    tipoPilar === "I" ? [[1, 1], [1, -1], [-1, 1], [-1, -1]] : tipoPilar === "B" ? [[1, -1], [-1, -1]] : [[-1, -1]];
  let totalExcluido = 0;
  const cortes = [];
  for (const [sx, sy] of cantos) {
    // ponta do braço menor mais próxima deste canto: entre os pares existentes, o mais próximo
    // do lado (sx ou sy, o que for o eixo de distribuição) deste canto
    const distribEhY = menorEhX; // se menor é X, os pares se distribuem ao longo de Y
    const ladoCorner = distribEhY ? sy : sx;
    let melhorPos = posicoesMenorRel[0], melhorDist = Infinity;
    for (const pos of posicoesMenorRel) {
      const dd = Math.abs(pos - ladoCorner * hhMenorArm);
      if (dd < melhorDist) { melhorDist = dd; melhorPos = pos; }
    }
    const bordaPar = melhorPos + ladoCorner * (larguraEstriboMenor / 2);
    // posição perpendicular da ponta do braço MAIOR: normalmente simétrica (metade da largura), mas
    // quando o par maior foi deslocado (borda/canto com dimensão apertada — ver maiorGrupoReposicionado),
    // usa a posição REAL da linha mais distante (que é a que de fato define o alcance da armadura ali),
    // não mais a posição centralizada. Validado ponto a ponto contra DXF de referência (borda 60x25).
    const bordaMaior = maiorPosAbsOverride != null ? maiorPosAbsOverride : (menorEhX ? sy : sx) * (larguraEstriboMaior / 2);
    let A, B;
    if (menorEhX) {
      A = [sx * (hwMenorArm + extensaoUltimaCamada), bordaPar];
      B = [sx * (larguraEstriboMaior / 2), maiorPosAbsOverride != null ? maiorPosAbsOverride : sy * (hhMenorArm + extensaoUltimaCamada)];
    } else {
      A = [bordaPar, sy * (hwMenorArm + extensaoUltimaCamada)];
      B = [sx * (hhMenorArm + extensaoUltimaCamada), maiorPosAbsOverride != null ? maiorPosAbsOverride : sy * (larguraEstriboMaior / 2)];
    }
      const corte = corteCantoCll(A, B, hw, hh, r, d);
      if (!corte) continue;
      const posA = posicaoNoContorno(corte.cortA[0], corte.cortA[1], hw, hh, r);
      const posB = posicaoNoContorno(corte.cortB[0], corte.cortB[1], hw, hh, r);
      let diff = posB - posA;
      const total = 4 * hw + 4 * hh + 2 * Math.PI * r;
      if (diff < 0) diff += total;
      const excluido = Math.min(diff, total - diff);
      totalExcluido += excluido;
      cortes.push({ sx, sy, cortA: corte.cortA, cortB: corte.cortB, excluido });
  }
  return { totalExcluido, cortes };
}

function uLinha(C1, C2, d, tipo, Sr, nr, cheio) {
  tipo = normTipo(tipo);
  const [a1, a2] = a1a2(C1, C2, d);
  const p = 0.5 * d + (nr - 1) * Sr;
  if (tipo === "I") return 2 * (C1 + C2) + 4 * Math.PI * d + 2 * Math.PI * p;
  if (tipo === "B") return cheio ? C1 + 2 * C2 + 2 * Math.PI * d + Math.PI * p : 2 * a2 + C1 + 2 * Math.PI * d + Math.PI * p;
  return cheio ? C1 + C2 + Math.PI * d + (Math.PI * p) / 2 : a1 + a2 + Math.PI * d + (Math.PI * p) / 2; // C
}

function WpC(C1, C2, tipo, n) {
  tipo = normTipo(tipo);
  n = n.toUpperCase();
  if (tipo === "I") return n === "X" ? (C2 ** 2) / 2 + C1 * C2 : (C1 ** 2) / 2 + C1 * C2;
  if (tipo === "B") return n === "X" ? (C2 ** 2) / 2 + (C1 * C2) / 2 : (C1 ** 2) / 4 + C1 * C2;
  return n === "X" ? (C2 ** 2) / 4 + (C1 * C2) / 2 : (C1 ** 2) / 4 + (C1 * C2) / 2; // C
}

function Wp(C1, C2, d, tipo, n) {
  tipo = normTipo(tipo);
  n = n.toUpperCase();
  if (tipo === "I")
    return n === "X"
      ? (C2 ** 2) / 2 + C1 * C2 + 4 * C1 * d + 16 * d ** 2 + 2 * Math.PI * d * C2
      : (C1 ** 2) / 2 + C1 * C2 + 4 * C2 * d + 16 * d ** 2 + 2 * Math.PI * d * C1;
  if (tipo === "B")
    return n === "X"
      ? (C2 ** 2) / 2 + (C1 * C2) / 2 + 2 * C1 * d + 8 * d ** 2 + Math.PI * d * C2
      : (C1 ** 2) / 4 + C1 * C2 + 4 * C2 * d + 8 * d ** 2 + Math.PI * d * C1;
  return n === "X"
    ? (C2 ** 2) / 4 + (C1 * C2) / 2 + 2 * C1 * d + 4 * d ** 2 + (Math.PI * d * C2) / 2
    : (C1 ** 2) / 4 + (C1 * C2) / 2 + 2 * C2 * d + 4 * d ** 2 + (Math.PI * d * C1) / 2; // C
}

function WpLinha(C1, C2, d, tipo, Sr, nr, n) {
  tipo = normTipo(tipo);
  n = n.toUpperCase();
  const p = 0.5 * d + (nr - 1) * Sr;
  if (tipo === "I")
    return n === "X"
      ? (C2 ** 2) / 2 + C2 * C1 + 4 * C1 * d + 16 * d * d + 2 * Math.PI * d * C2 + 2 * C1 * p + 16 * d * p + 4 * p * p + Math.PI * C2 * p
      : (C1 ** 2) / 2 + C1 * C2 + 4 * C2 * d + 16 * d * d + 2 * Math.PI * d * C1 + 2 * C2 * p + 16 * d * p + 4 * p * p + Math.PI * C1 * p;
  if (tipo === "B")
    return n === "X"
      ? (C2 ** 2) / 2 + C1 * C2 + 2 * C1 * d + 8 * d ** 2 + Math.PI * d * C2 + C1 * p + 8 * d * p + (Math.PI * p * C2) / 2 + 2 * p ** 2
      : (C1 ** 2) / 4 + C1 * C2 + 4 * C2 * d + 8 * d ** 2 + Math.PI * d * C1 + 2 * C2 * p + 8 * d * p + (Math.PI * p * C1) / 2 + 2 * p ** 2;
  return n === "X"
    ? (C2 ** 2) / 4 + (C2 * C1) / 2 + 2 * C1 * d + 4 * d ** 2 + (Math.PI * d * C2) / 2 + C1 * p + 4 * d * p + Math.PI * p * C2 + p * p
    : (C1 ** 2) / 4 + (C1 * C2) / 2 + 2 * C2 * d + 4 * d ** 2 + (Math.PI * d * C1) / 2 + C2 * p + 4 * d * p + Math.PI * p * C1 + p * p; // C
}

function exc(C1, C2, d, tipo, n) {
  tipo = normTipo(tipo);
  n = n.toUpperCase();
  const [a1, a2] = a1a2(C1, C2, d);
  if (tipo === "I") return 0;
  if (tipo === "B") {
    if (n === "X")
      return (C2 * a2 - a2 ** 2 + (C2 * C1) / 2 + 2 * C1 * d + 8 * d * d + Math.PI * d * C2) / (2 * a2 + C1 + 2 * Math.PI * d);
    return 0;
  }
  // C
  if (n === "X")
    return (C2 * a2 - a2 ** 2 + a1 * C2 + 4 * a1 * d + 8 * d * d + Math.PI * d * C2) / (2 * (a1 + a2 + Math.PI * d));
  return (C1 * a1 - a1 ** 2 + a2 * C1 + 4 * a2 * d + 8 * d * d + Math.PI * d * C1) / (2 * (a1 + a2 + Math.PI * d));
}

function excLinha(C1, C2, d, tipo, Sr, nr, n) {
  tipo = normTipo(tipo);
  n = n.toUpperCase();
  const [a1, a2] = a1a2(C1, C2, d);
  const p = 0.5 * d + (nr - 1) * Sr;
  if (tipo === "I") return 0;
  if (tipo === "B") {
    if (n === "X")
      return (
        (C2 * a2 - a2 ** 2 + (C2 * C1) / 2 + 2 * C1 * d + 8 * d * d + Math.PI * d * C2 + C1 * p + 8 * d * p + (Math.PI * p * C2) / 2 + 2 * p * p) /
        (2 * a2 + C1 + 2 * Math.PI * d + Math.PI * p)
      );
    return 0;
  }
  // C
  if (n === "X")
    return (
      (C2 * a2 - a2 ** 2 + a1 * C2 + 4 * a1 * d + 8 * d * d + Math.PI * d * C2 + 2 * a1 * p + 8 * d * p + (Math.PI * p * C2) / 2 + 2 * p * p) /
      (2 * (a2 + a1 + Math.PI * d + (Math.PI * p) / 2))
    );
  return (
    (C1 * a1 - a1 ** 2 + a2 * C1 + 4 * a2 * d + 8 * d * d + Math.PI * d * C1 + 2 * a2 * p + 8 * d * p + (Math.PI * p * C1) / 2 + 2 * p * p) /
    (2 * (a1 + a2 + Math.PI * d + (Math.PI * p) / 2))
  );
}

function Kfun(C1, C2, n) {
  n = n.toUpperCase();
  const r = n === "X" ? C2 / C1 : C1 / C2;
  if (r <= 0.5) return 0.45;
  if (r <= 1) return 0.15 * ((r - 0.5) / 0.5) + 0.45;
  if (r <= 2) return 0.1 * (r - 1) + 0.6;
  if (r <= 3) return 0.1 * (r - 2) + 0.7;
  return 0.8;
}

// NBR 6118, 19.5.2.6 — furo próximo ao pilar: a parcela do perímetro crítico
// "sombreada" pelo furo (entre as duas retas tangentes ao contorno do furo, partindo do
// centro do pilar) é desconsiderada. Validado geometricamente contra 9 DXFs de referência do
// escritório (pilar 25x60, d=15,13cm): as retas tangentes partem do centro do pilar, passam
// pelos 2 cantos do furo com ângulo mais extremo, e a parte do contorno retangular (mesmo que
// na realidade tenha cantos arredondados, aqui aproximado por retângulo reto — igual ao
// método usado nos DXFs de referência) entre os 2 pontos de interseção — pelo lado do furo —
// é descontada em COMPRIMENTO ABSOLUTO (não em fração), do perímetro real (u0/u/u'').
// Só se aplica se o furo estiver a menos de 8d do contorno C (face do pilar), conforme o texto
// literal da norma. Extendido pra pilar de borda/canto: a mesma matemática (baseada no
// retângulo hipotético hw×hh, igual à usada pro corte da cunha em B/C) funciona desde que a
// sombra do furo caia numa região que EXISTE de verdade no contorno B/C (não na "abertura" perto
// da face livre) — furos bem afastados da face livre (situação normal) não têm problema.
function anguloTangentes(furoX, furoY, furoLargura, furoAltura) {
  const meiaLarg = furoLargura / 2;
  const meiaAlt = furoAltura / 2;
  const cantos = [
    [furoX - meiaLarg, furoY - meiaAlt],
    [furoX + meiaLarg, furoY - meiaAlt],
    [furoX + meiaLarg, furoY + meiaAlt],
    [furoX - meiaLarg, furoY + meiaAlt],
  ];
  const angulos = cantos.map(([x, y]) => Math.atan2(y, x));
  const ordenados = [...angulos].sort((a, b) => a - b);
  let maiorGapIdx = 0;
  let maiorGap = 0;
  for (let i = 0; i < ordenados.length; i++) {
    const prox = i === ordenados.length - 1 ? ordenados[0] + 2 * Math.PI : ordenados[i + 1];
    const gap = prox - ordenados[i];
    if (gap > maiorGap) {
      maiorGap = gap;
      maiorGapIdx = i;
    }
  }
  // os 2 ângulos que cercam o maior "vão" (arco livre) são as duas retas tangentes
  const thetaLo = ordenados[(maiorGapIdx + 1) % 4];
  const thetaHi = ordenados[maiorGapIdx];
  return { thetaLo, thetaHi, setorGraus: (2 * Math.PI - maiorGap) * (180 / Math.PI) };
}

// Interseção de uma reta (do centro do pilar, ângulo theta) com o CONTORNO VERDADEIRO — cantos
// arredondados com raio r, centrados nos cantos reais do pilar (hw,hh) — não um retângulo reto
// deslocado. Valida ponto a ponto contra DXF de referência com cantos arredondados de verdade
// (MODELOS_FURAÇÃO_ARRENDODADO): a interseção com o retângulo deslocado dava um ponto errado
// (ex.: 42,77×34,22 em vez do correto 42,50×34,00 — diferença pequena mas real, especialmente
// perto dos cantos).
function raioNoContorno(theta, hw, hh, r) {
  const cosT = Math.cos(theta);
  const sinT = Math.sin(theta);
  if (r <= 1e-9) {
    // sem arredondamento: interseção direta com o retângulo hw×hh
    const candidatos = [];
    if (Math.abs(cosT) > 1e-9) {
      const t = hw / Math.abs(cosT);
      const y = t * sinT;
      if (Math.abs(y) <= hh + 1e-6) candidatos.push({ t, x: Math.sign(cosT) * hw, y });
    }
    if (Math.abs(sinT) > 1e-9) {
      const t = hh / Math.abs(sinT);
      const x = t * cosT;
      if (Math.abs(x) <= hw + 1e-6) candidatos.push({ t, x, y: Math.sign(sinT) * hh });
    }
    candidatos.sort((a, b) => a.t - b.t);
    return candidatos[0];
  }
  // trecho reto vertical (face direita/esquerda), deslocado por r
  if (Math.abs(cosT) > 1e-9) {
    const halfW = hw + r;
    const t = halfW / Math.abs(cosT);
    const y = t * sinT;
    if (Math.abs(y) <= hh + 1e-6) return { t, x: Math.sign(cosT) * halfW, y };
  }
  // trecho reto horizontal (face de cima/baixo), deslocado por r
  if (Math.abs(sinT) > 1e-9) {
    const halfH = hh + r;
    const t = halfH / Math.abs(sinT);
    const x = t * cosT;
    if (Math.abs(x) <= hw + 1e-6) return { t, x, y: Math.sign(sinT) * halfH };
  }
  // cai no arco de algum canto — identifica qual pelo quadrante e resolve a interseção com o
  // círculo (raio r, centrado no canto real do pilar)
  const ccx = Math.sign(cosT || 1) * hw;
  const ccy = Math.sign(sinT || 1) * hh;
  const B = -2 * (ccx * cosT + ccy * sinT);
  const C = ccx * ccx + ccy * ccy - r * r;
  const disc = B * B - 4 * C;
  const t = (-B + Math.sqrt(Math.max(0, disc))) / 2;
  return { t, x: t * cosT, y: t * sinT };
}

// posição (comprimento acumulado) de um ponto no contorno arredondado, pra medir/comparar
// distâncias ao longo do perímetro. Mesma volta horária usada em contornoI: começa no topo da
// face direita, desce, contorna os 4 cantos (arcos de raio r) e os 4 trechos retos.
function posicaoNoContorno(x, y, hw, hh, r) {
  const EPS = 1e-3;
  const segV = 2 * hh, segH = 2 * hw, arco = r > 1e-9 ? (Math.PI / 2) * r : 0;
  // face direita (reta), y de hh a -hh
  if (Math.abs(x - (hw + r)) < EPS && y <= hh + EPS && y >= -hh - EPS) return hh - y;
  // arco inferior-direito
  if (r > 1e-9 && Math.abs(Math.hypot(x - hw, y + hh) - r) < EPS) {
    const ang = (Math.atan2(y + hh, x - hw) * 180) / Math.PI;
    if (ang <= 1 && ang >= -91) return segV + ((0 - ang) / 90) * arco;
  }
  // face de baixo (reta), x de hw a -hw
  if (Math.abs(y - (-hh - r)) < EPS && x <= hw + EPS && x >= -hw - EPS) return segV + arco + (hw - x);
  // arco inferior-esquerdo
  if (r > 1e-9 && Math.abs(Math.hypot(x + hw, y + hh) - r) < EPS) {
    const ang = (Math.atan2(y + hh, x + hw) * 180) / Math.PI;
    return segV + arco + segH + ((-90 - ang) / 90) * arco;
  }
  // face esquerda (reta), y de -hh a hh
  if (Math.abs(x - (-hw - r)) < EPS && y <= hh + EPS && y >= -hh - EPS) return segV + 2 * arco + segH + (y + hh);
  // arco superior-esquerdo
  if (r > 1e-9 && Math.abs(Math.hypot(x + hw, y - hh) - r) < EPS) {
    const ang = (Math.atan2(y - hh, x + hw) * 180) / Math.PI;
    return 2 * segV + 2 * arco + segH + ((180 - ang) / 90) * arco;
  }
  // face de cima (reta), x de -hw a hw
  if (Math.abs(y - (hh + r)) < EPS && x <= hw + EPS && x >= -hw - EPS) return 2 * segV + 3 * arco + segH + (x + hw);
  // arco superior-direito
  if (r > 1e-9 && Math.abs(Math.hypot(x - hw, y - hh) - r) < EPS) {
    const ang = (Math.atan2(y - hh, x - hw) * 180) / Math.PI;
    return 2 * segV + 3 * arco + 2 * segH + ((90 - ang) / 90) * arco;
  }
  return 0;
}

// comprimento excluído (absoluto, em cm) do contorno com cantos arredondados (raio r, centrado
// nos cantos reais do pilar hw×hh) entre as duas retas tangentes
function comprimentoExcluido(thetaLo, thetaHi, hw, hh, r) {
  const total = 4 * hw + 4 * hh + 2 * Math.PI * r;
  const p1 = raioNoContorno(thetaLo, hw, hh, r);
  const p2 = raioNoContorno(thetaHi, hw, hh, r);
  if (!p1 || !p2) return 0;
  const pos1 = posicaoNoContorno(p1.x, p1.y, hw, hh, r);
  const pos2 = posicaoNoContorno(p2.x, p2.y, hw, hh, r);
  let diff = pos2 - pos1;
  if (diff < 0) diff += total;
  return Math.min(diff, total - diff);
}

// ponto no contorno arredondado numa dada posição (inverso de posicaoNoContorno) — usado só pra
// traçar o trecho reto entre pontos de transição; arcos são amostrados à parte em caminhoExcluido
function pontoNoContorno(pos, hw, hh, r) {
  const total = 4 * hw + 4 * hh + 2 * Math.PI * r;
  const segV = 2 * hh, segH = 2 * hw, arco = r > 1e-9 ? (Math.PI / 2) * r : 0;
  pos = ((pos % total) + total) % total;
  if (pos < segV) return [hw + r, hh - pos];
  pos -= segV;
  if (pos < arco) {
    const ang = ((0 - (pos / arco) * 90) * Math.PI) / 180;
    return [hw + r * Math.cos(ang), -hh + r * Math.sin(ang)];
  }
  pos -= arco;
  if (pos < segH) return [hw - pos, -hh - r];
  pos -= segH;
  if (pos < arco) {
    const ang = ((-90 - (pos / arco) * 90) * Math.PI) / 180;
    return [-hw + r * Math.cos(ang), -hh + r * Math.sin(ang)];
  }
  pos -= arco;
  if (pos < segV) return [-hw - r, -hh + pos];
  pos -= segV;
  if (pos < arco) {
    const ang = ((180 - (pos / arco) * 90) * Math.PI) / 180;
    return [-hw + r * Math.cos(ang), hh + r * Math.sin(ang)];
  }
  pos -= arco;
  if (pos < segH) return [-hw + pos, hh + r];
  pos -= segH;
  const ang = ((90 - (pos / arco) * 90) * Math.PI) / 180;
  return [hw + r * Math.cos(ang), hh + r * Math.sin(ang)];
}

// traça os pontos (passando pelos cantos, agora com os arcos de verdade amostrados) do trecho do
// contorno entre as 2 retas tangentes, pelo caminho mais curto (o lado do furo)
function caminhoExcluido(thetaLo, thetaHi, hw, hh, r) {
  const total = 4 * hw + 4 * hh + 2 * Math.PI * r;
  const p1 = raioNoContorno(thetaLo, hw, hh, r);
  const p2 = raioNoContorno(thetaHi, hw, hh, r);
  if (!p1 || !p2) return [];
  const pos1 = posicaoNoContorno(p1.x, p1.y, hw, hh, r);
  const pos2 = posicaoNoContorno(p2.x, p2.y, hw, hh, r);
  let diff = pos2 - pos1;
  if (diff < 0) diff += total;
  const curto = diff <= total - diff;
  const [ini, fim] = curto ? [pos1, pos2] : [pos2, pos1];
  const alvo = ini + (curto ? diff : total - diff);
  const N = 60; // amostragem fina o bastante pra desenhar os arcos suavemente
  const pontos = [];
  for (let i = 0; i <= N; i++) {
    pontos.push(pontoNoContorno(ini + ((alvo - ini) * i) / N, hw, hh, r));
  }
  return pontos;
}

// Redução por furo pra pilar CIRCULAR (validado contra DXF de referência) — bem mais simples que
// o retangular: o furo projeta uma SOMBRA ANGULAR a partir do centro do pilar (min/max ângulo
// entre os 4 cantos do furo), e o comprimento excluído de cada contorno é simplesmente esse
// ângulo (em radianos) vezes o raio daquele contorno especificamente.
function reducaoPorFuroCircular(furoX, furoY, furoLargura, furoAltura, R, d, RllBase) {
  if (!furoLargura || !furoAltura) return { excMenor: 0, excMaior: 0, excUlt: 0, dentroDoLimite: false, distancia: null };
  const xMin = furoX - furoLargura / 2, xMax = furoX + furoLargura / 2;
  const yMin = furoY - furoAltura / 2, yMax = furoY + furoAltura / 2;
  // distância do furo até a FACE do pilar (ponto do retângulo do furo mais próximo do centro,
  // menos o raio) — NBR 6118, 19.5.2.6: limite de 8d
  const nearX = Math.max(xMin, Math.min(0, xMax));
  const nearY = Math.max(yMin, Math.min(0, yMax));
  const distancia = Math.max(0, Math.hypot(nearX, nearY) - R);
  const dentroDoLimite = distancia < 8 * d;
  if (!dentroDoLimite) return { excMenor: 0, excMaior: 0, excUlt: 0, dentroDoLimite: false, distancia };

  const cantos = [[xMin, yMin], [xMax, yMin], [xMax, yMax], [xMin, yMax]];
  const angsOrdenados = cantos.map(([x, y]) => Math.atan2(y, x)).sort((a, b) => a - b);
  // Menor arco que contém os 4 cantos = complemento do MAIOR vão vazio entre pontos consecutivos
  // (incluindo o vão de "volta" do último ao primeiro, cruzando ±180°) — evita o bug de furo à
  // esquerda do pilar (cantos cruzando a descontinuidade ±180° do atan2) sendo lido como o vão
  // gigante complementar (~341°) em vez do vão real e pequeno (~19°).
  let maiorVaoVazio = -1, idxAposMaiorVao = 0;
  for (let i = 0; i < angsOrdenados.length; i++) {
    const atual = angsOrdenados[i];
    const proximo = i === angsOrdenados.length - 1 ? angsOrdenados[0] + 2 * Math.PI : angsOrdenados[i + 1];
    const vaoVazio = proximo - atual;
    if (vaoVazio > maiorVaoVazio) {
      maiorVaoVazio = vaoVazio;
      idxAposMaiorVao = i === angsOrdenados.length - 1 ? 0 : i + 1;
    }
  }
  const thetaLo = angsOrdenados[idxAposMaiorVao];
  const thetaHi = thetaLo + (2 * Math.PI - maiorVaoVazio);
  const vaoRad = thetaHi - thetaLo;

  return {
    excMenor: vaoRad * R, // contorno C (face)
    excMaior: vaoRad * (R + 2 * d), // contorno C' (2d)
    excUlt: vaoRad * RllBase, // contorno C'' (base, antes de qualquer corte de cunha)
    dentroDoLimite, distancia, thetaLo, thetaHi, vaoRad, setorGraus: (vaoRad * 180) / Math.PI,
  };
}

function reducaoPorFuro(furoX, furoY, furoLargura, furoAltura, h, ap, bp, d, p) {
  if (!furoLargura || !furoAltura) return { excMenor: 0, excMaior: 0, excUlt: 0, dentroDoLimite: false, distancia: null };
  const meiaLarg = furoLargura / 2;
  const meiaAlt = furoAltura / 2;
  // NBR 6118, 19.5.2.6: distância entre a abertura e o CONTORNO C (face do pilar) — não do
  // centro do pilar. Desconta a metade da dimensão do pilar (ap/2, bp/2) além da metade do furo.
  const dx = Math.max(0, Math.abs(furoX) - meiaLarg - ap / 2);
  const dy = Math.max(0, Math.abs(furoY) - meiaAlt - bp / 2);
  const distancia = Math.sqrt(dx * dx + dy * dy);
  // NBR 6118, 19.5.2.6: limite de 8d (não 6h) — "abertura situada a menos de 8d do contorno C"
  const dentroDoLimite = distancia < 8 * d;
  if (!dentroDoLimite) return { excMenor: 0, excMaior: 0, excUlt: 0, dentroDoLimite: false, distancia };

  const { thetaLo, thetaHi, setorGraus } = anguloTangentes(furoX, furoY, furoLargura, furoAltura);
  const hw = ap / 2, hh = bp / 2;
  const rl = 2 * d + p; // raio real do contorno C'' (igual ao usado em uLinha/ContornosDiagram) — "p" sozinho estava errado
  const excMenor = comprimentoExcluido(thetaLo, thetaHi, hw, hh, 0); // contorno C (face)
  const excMaior = comprimentoExcluido(thetaLo, thetaHi, hw, hh, 2 * d); // contorno C' (2d)
  const excUlt = comprimentoExcluido(thetaLo, thetaHi, hw, hh, rl); // contorno C'' (2d+p)
  // pontos de interseção das 2 retas tangentes com cada um dos 3 contornos, pra desenhar
  const ptC_lo = raioNoContorno(thetaLo, hw, hh, 0);
  const ptC_hi = raioNoContorno(thetaHi, hw, hh, 0);
  const ptCl_lo = raioNoContorno(thetaLo, hw, hh, 2 * d);
  const ptCl_hi = raioNoContorno(thetaHi, hw, hh, 2 * d);
  const ptCll_lo = raioNoContorno(thetaLo, hw, hh, rl);
  const ptCll_hi = raioNoContorno(thetaHi, hw, hh, rl);
  const caminhoC = caminhoExcluido(thetaLo, thetaHi, hw, hh, 0);
  const caminhoCl = caminhoExcluido(thetaLo, thetaHi, hw, hh, 2 * d);
  const caminhoCll = caminhoExcluido(thetaLo, thetaHi, hw, hh, rl);
  return {
    excMenor, excMaior, excUlt, dentroDoLimite, distancia, setorGraus, thetaLo, thetaHi,
    ptC_lo, ptC_hi, ptCl_lo, ptCl_hi, ptCll_lo, ptCll_hi,
    caminhoC, caminhoCl, caminhoCll,
  };
}

function calcPuncao(inp) {
  const {
    ap, bp, d, h, Fk, Mkx, Mky, gamaf, tipoPilar, fck, gamac,
    AsX, AsY, AswInput, Sr, Nr,
    furoAtivo, furoX, furoY, furoLargura, furoAltura,
    formaCircular, diametro,
  } = inp;

  // fywd do conector de punção (estribo), limitado por norma conforme a espessura da laje:
  // 250 MPa até h=15cm, 435 MPa a partir de h=35cm, interpolação linear entre os dois
  const fywd = h <= 15 ? 250 : h >= 35 ? 435 : 250 + ((435 - 250) * (h - 15)) / 20;

  const temMomento = Mkx !== 0 || Mky !== 0;
  let u_0, u_red, u_l, WpxC, WpyC, Wpx, Wpy, Wpxl, Wpyl, Kx, Ky, ex, ey, exl, eyl;

  if (formaCircular) {
    // Pilar CIRCULAR (NBR 6118, 19.5.2.2) — confirmado com o usuário:
    // - u0 = 2πR (face do pilar); u_red (=C') = 2π(R+2d); u_l (=C'') tratado à parte, considerando
    //   o canto (ponto mais afastado) da última camada de estribo, não só a distância radial —
    //   ajustado fora daqui, no useMemo principal (mesmo padrão do corte da cunha retangular).
    // - Wp = (D+4d)² = 4·(R+2d)² — único, usado igual nas duas direções (simetria do círculo).
    // - K = 0,6 fixo (não depende de C1/C2, que não existe pro círculo).
    // - Sem termo de excentricidade/redução (ex/ey/exl/eyl=0) — círculo não tem face livre nem
    //   assimetria direcional; Msx=Mkx e Msy=Mky diretos.
    const R = diametro / 2;
    u_0 = 2 * Math.PI * R;
    u_red = 2 * Math.PI * (R + 2 * d);
    u_l = 2 * Math.PI * (R + 2 * d + (0.5 * d + (Nr - 1) * Sr)); // placeholder simples; ajustado fora
    const WpCirc = Math.pow(diametro + 4 * d, 2);
    WpxC = WpyC = Wpx = Wpy = Wpxl = Wpyl = WpCirc;
    Kx = Ky = 0.6;
    ex = ey = exl = eyl = 0;
  } else {
    u_0 = u0fn(ap, bp, d, tipoPilar);
    u_red = uredfn(ap, bp, d, tipoPilar);
    u_l = uLinha(ap, bp, d, tipoPilar, Sr, Nr);
    WpxC = WpC(ap, bp, tipoPilar, "x");
    WpyC = WpC(ap, bp, tipoPilar, "y");
    Wpx = Wp(ap, bp, d, tipoPilar, "x");
    Wpy = Wp(ap, bp, d, tipoPilar, "y");
    Wpxl = WpLinha(ap, bp, d, tipoPilar, Sr, Nr, "x");
    Wpyl = WpLinha(ap, bp, d, tipoPilar, Sr, Nr, "y");
    Kx = Kfun(ap, bp, "x");
    Ky = Kfun(ap, bp, "y");
    ex = exc(ap, bp, d, tipoPilar, "x");
    ey = exc(ap, bp, d, tipoPilar, "y");
    exl = excLinha(ap, bp, d, tipoPilar, Sr, Nr, "x");
    eyl = excLinha(ap, bp, d, tipoPilar, Sr, Nr, "y");
  }

  // Extensão da zona armada além da face do pilar (também usada como offset do contorno C''
  // pra desconto do furo, e mais abaixo em u_linha/Wp_linha/exc_linha)
  const pFuro = 0.5 * d + (Nr - 1) * Sr;

  // NBR 6118, 19.5.2.6 — desconta do perímetro o comprimento sombreado pelo furo (absoluto, não
  // fração). Válido pra qualquer tipo retangular (I/B/C) e circular — geometria validada contra DXF.
  let furo = { excMenor: 0, excMaior: 0, excUlt: 0, dentroDoLimite: false, distancia: null };
  const u_l_bruto = u_l; // preservado ANTES do desconto do furo — necessário pra mesclar
  // corretamente com o corte da cunha depois (evita subtrair furo+cunha em separado quando os
  // vãos se sobrepõem, o que subestimaria u_l_ajustado contando a sobreposição 2x)
  if (furoAtivo && furoLargura > 0 && furoAltura > 0) {
    if (formaCircular) {
      const R = diametro / 2;
      const RllBase = R + 2 * d + pFuro; // raio base do C'' (antes de qualquer corte de cunha)
      furo = reducaoPorFuroCircular(furoX, furoY, furoLargura, furoAltura, R, d, RllBase);
    } else {
      furo = reducaoPorFuro(furoX, furoY, furoLargura, furoAltura, h, ap, bp, d, pFuro);
    }
    if (furo.dentroDoLimite) {
      u_0 = Math.max(0.1, u_0 - furo.excMenor);
      u_red = Math.max(0.1, u_red - furo.excMaior);
      u_l = Math.max(0.1, u_l - furo.excUlt);
    }
  }

  // AsX/AsY já vêm somando malha negativa + reforço local (cm²/cm de largura)
  // NBR 6118, 19.5.3.2: ρ = √(ρx·ρy) ≤ 0,02
  const rho = Math.min(0.02, Math.sqrt((AsX / h) * (AsY / h)));
  // NBR 6118, 19.5.3.2: ke = (1+√(20/d)) ≤ 2
  const ke = Math.min(2, 1 + Math.sqrt(20 / d));

  const Msx = Math.max(0, Mkx - (Math.abs(Fk) * ex) / 100);
  const Msy = Math.max(0, Mky - (Math.abs(Fk) * ey) / 100);
  const Msxl = Math.max(0, Mkx - (Math.abs(Fk) * exl) / 100);
  const Msyl = Math.max(0, Mky - (Math.abs(Fk) * eyl) / 100);

  // Contorno C
  const tau_C = ((Fk / u_0 / d) + (100 * Mkx * Kx) / WpxC / d + (100 * Mky * Ky) / WpyC / d) * gamaf * 1000;
  const tauRd2 = 1000 * 0.27 * (1 - fck / 250) * (fck / gamac / 100);
  const ok_C = tau_C <= tauRd2;

  // Contorno C'
  const tau_Cl = ((Fk / u_red / d) + (Msx * 100 * Kx) / Wpx / d + (Msy * 100 * Ky) / Wpy / d) * gamaf * 1000;
  const tauRd1 = 0.13 * ke * (100 * rho * fck) ** (1 / 3) * 10;
  const precisaArm = tauRd1 <= tau_Cl;
  const AswCalc = tauRd1 < tau_Cl ? (tau_Cl - (0.1 / 0.13) * tauRd1) / (1.5 * (d / Sr) * ((fywd * 10) / u_red / d)) : null;

  // Contorno C' com armadura
  const tauRd3 = 0.1 * ke * (100 * rho * fck) ** (1 / 3) * 10 + 1.5 * (AswInput / Sr) * fywd * (10 / u_red);
  const okClArm = tau_Cl <= tauRd3;

  // Contorno C''
  const tau_Cll = ((Fk / u_l / d) + (100 * Msxl * Kx) / (Wpxl * d) + (100 * Msyl * Ky) / (Wpyl * d)) * gamaf * 1000;
  const okCll = tau_Cll <= tauRd1;

  const p = pFuro; // extensão até a última camada (já calculada mais cedo, reaproveitada pro desconto do furo)

  // Colapso progressivo
  const AsTotal = (Fk * 1.2 * 1.5) / 4.35;
  const diamsCol = DIAMS_COL;
  const nBarras = diamsCol.map((dm) => {
    const div = BIT(dm) * (dm === 10 ? 1 : 2);
    return { diam: dm, n: div !== 0 ? Math.ceil(AsTotal / div) : null };
  });

  return {
    fywd, u_0, u_red, u_l, u_l_bruto, WpxC, WpyC, Wpx, Wpy, Wpxl, Wpyl, rho, Kx, Ky, temMomento,
    ex, ey, exl, eyl, Msx, Msy, Msxl, Msyl,
    tau_C, tauRd2, ok_C,
    tau_Cl, tauRd1, precisaArm, AswCalc,
    tauRd3, okClArm,
    tau_Cll, okCll, p,
    AsTotal, nBarras,
    furo,
  };
}

function fmt(v, casas = 2) {

}

// desenha um retângulo com cantos arredondados (raio r), em coordenadas de tela (Y cresce pra baixo),
// centrado em (cx,cy), com metade-largura/metade-altura em px halfW/halfH
// ---- Geometria dos contornos críticos (C, C', C''), pra desenho e conferência ----
// Gera pontos de arco (graus, sentido definido por fromDeg->toDeg) centrado em (cx,cy), raio r.
function arcoPontos(cx, cy, r, fromDeg, toDeg, N) {
  const pontos = [];
  for (let i = 0; i <= N; i++) {
    const deg = fromDeg + ((toDeg - fromDeg) * i) / N;
    const rad = (deg * Math.PI) / 180;
    pontos.push([cx + r * Math.cos(rad), cy + r * Math.sin(rad)]);
  }
  return pontos;
}

// Contorno pra pilar CENTRAL (I): retângulo ap×bp com cantos arredondados de raio r (r=0 = a
// face do próprio pilar). Fechado, todos os 4 lados.
function contornoI(ap, bp, r) {
  const hw = ap / 2, hh = bp / 2;
  if (r <= 1e-6) return [[hw, hh], [-hw, hh], [-hw, -hh], [hw, -hh], [hw, hh]];
  const N = 10;
  let pts = [[hw + r, hh], [hw + r, -hh]];
  pts = pts.concat(arcoPontos(hw, -hh, r, 0, -90, N));
  pts.push([-hw, -hh - r]);
  pts = pts.concat(arcoPontos(-hw, -hh, r, -90, -180, N));
  pts.push([-hw - r, hh]);
  pts = pts.concat(arcoPontos(-hw, hh, r, 180, 90, N));
  pts.push([hw, hh + r]);
  pts = pts.concat(arcoPontos(hw, hh, r, 90, 0, N));
  return pts;
}

// Contorno pra pilar de BORDA (B): aberto no lado livre (sem laje). Face livre = lado +Y (topo,
// direção bp). O arco fica centrado nos CANTOS REAIS do pilar (canto inferior-esquerdo e
// inferior-direito, do lado OPOSTO à face livre) — validado ponto a ponto contra 2 DXFs de
// referência do escritório (borda_momento/borda_sem_momento): pernas de comprimento a2 saem dos
// cantos reais na direção da face livre, arco de raio r centrado no próprio canto, trecho central
// (comprimento ap, sem redução) do lado oposto à face livre. Comprimento total = 2a2+ap+2πr
// (validado contra u0fn/uredfn). cheio=true usa a perna cheia (bp, até a face livre) em vez de a2
// — validado contra o DXF "com momento".
function contornoB(ap, bp, d, r, cheio) {
  const hw = ap / 2, hh = bp / 2;
  const a2 = cheio ? bp : Math.min(1.5 * d, hh);
  const N = 16;
  if (r <= 1e-6) {
    return [[hw, -hh + a2], [hw, -hh], [-hw, -hh], [-hw, -hh + a2]];
  }
  let pts = [[hw + r, -hh + a2], [hw + r, -hh]];
  pts = pts.concat(arcoPontos(hw, -hh, r, 0, -90, N));
  pts.push([-hw, -hh - r]);
  pts = pts.concat(arcoPontos(-hw, -hh, r, -90, -180, N));
  pts.push([-hw - r, -hh + a2]);
  return pts;
}

// Contorno pra pilar de CANTO (C): aberto nos 2 lados livres (+X e +Y, direita e topo). O arco
// fica centrado no CANTO REAL do pilar onde as 2 faces COM LAJE se encontram (canto inferior-
// esquerdo, -X/-Y) — validado ponto a ponto contra 2 DXFs de referência do escritório
// (canto_momento/canto_sem_momento, corrigido pelo usuário): perna de comprimento a1 sai do canto
// na direção +X, perna de comprimento a2 sai na direção +Y, arco de raio r centrado no canto.
// Comprimento total = a1+a2+πr (validado contra u0fn/uredfn). cheio=true usa as pernas cheias
// (ap e bp, até as faces livres) em vez de a1/a2 — validado contra o DXF "com momento".
function contornoC(ap, bp, d, r, cheio) {
  const hw = ap / 2, hh = bp / 2;
  const a1 = cheio ? ap : Math.min(1.5 * d, hw);
  const a2 = cheio ? bp : Math.min(1.5 * d, hh);
  const N = 16;
  if (r <= 1e-6) {
    return [[-hw + a1, -hh], [-hw, -hh], [-hw, -hh + a2]];
  }
  let pts = [[-hw + a1, -hh - r]];
  pts = pts.concat(arcoPontos(-hw, -hh, r, -90, -180, N));
  pts.push([-hw - r, -hh + a2]);
  return pts;
}

// Reconstrói o contorno B/C com vãos reais nos cantos cortados pela cunha (armadura em cruz) —
// diferente do contornoI (retângulo completo), contornoB/C tem só 1-2 cantos com arco de verdade,
// então em vez de reaproveitar segmentosComGaps (que assume a topologia do retângulo completo),
// reconstrói direto a partir da MESMA sequência de contornoB/C, inserindo o vão no arco do(s)
// canto(s) cortado(s). Retorna um array de trechos (cada um uma lista de pontos) — 1 trecho se não
// há corte, ou múltiplos trechos quando há vão real.
// Corta um contorno B/C já construído (lista de pontos, sequência real — não o retângulo
// hipotético completo) em 2 pontos de corte quaisquer (do furo, que pode cair em qualquer lugar
// do contorno, não só nos cantos como a cunha). Acha o índice mais próximo de cada ponto de corte
// na lista discretizada, e remove o trecho MAIS CURTO entre eles (mesmo critério do furo
// retangular — desconta o lado que o furo realmente sombreia). Retorna 1 ou 2 trechos.
function cortarContornoPorPontos(pontosContorno, ptA, ptB) {
  const distSq = (p, q) => (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2;
  let iA = 0, dA = Infinity, iB = 0, dB = Infinity;
  pontosContorno.forEach((p, i) => {
    const da = distSq(p, ptA);
    if (da < dA) { dA = da; iA = i; }
    const db = distSq(p, ptB);
    if (db < dB) { dB = db; iB = i; }
  });
  if (iA === iB) return [pontosContorno];
  const [iLo, iHi] = iA < iB ? [iA, iB] : [iB, iA];
  const trechoDentro = pontosContorno.slice(iLo, iHi + 1);
  const trechoFora = [...pontosContorno.slice(iHi), ...pontosContorno.slice(0, iLo + 1)];
  // remove o trecho mais curto (medido em nº de pontos, proxy razoável de comprimento já que a
  // amostragem ao longo do contorno é razoavelmente uniforme)
  return trechoDentro.length <= trechoFora.length ? [trechoFora] : [trechoDentro];
}

function contornoBCComCortes(tipoPilar, ap, bp, d, r, cortesCll) {
  const hw = ap / 2, hh = bp / 2;
  const N = 16;
  const anguloRel = (pt, cx, cy) => (Math.atan2(pt[1] - cy, pt[0] - cx) * 180) / Math.PI;
  const corteDoCanto = (sx, sy) => (cortesCll || []).find((c) => c.sx === sx && c.sy === sy);

  // arco [de,ate] (de > ate, sentido horário decrescente) — retorna { antes, depois } do vão;
  // "depois" vazio quando não há corte nesse canto
  function arcoComVao(cx, cy, de, ate, corte) {
    if (!corte) return { antes: arcoPontos(cx, cy, r, de, ate, N), depois: [] };
    // Proteção contra casos extremos que não convergem (Nr no máximo, camada bem maior que o
    // próprio pilar): aí o corte da cunha pode ficar desproporcional ao arco natural desse canto
    // (ex.: querendo descontar 70% de um arco de 90°), o que indica que os pontos de corte não
    // fazem mais sentido geométrico nesse contorno específico — nesse caso, desenha o arco CHEIO
    // (sem tentar recortar) em vez de produzir pedaços de linha desconectados/quebrados.
    const arcoNatural = (Math.abs(de - ate) * Math.PI * r) / 180;
    if (corte.excluido != null && corte.excluido > 0.6 * arcoNatural) {
      return { antes: arcoPontos(cx, cy, r, de, ate, N), depois: [] };
    }
    let angA = anguloRel(corte.cortA, cx, cy);
    let angB = anguloRel(corte.cortB, cx, cy);
    const normaliza = (ang) => {
      while (ang > de + 0.5) ang -= 360;
      while (ang < ate - 0.5) ang += 360;
      return ang;
    };
    angA = normaliza(angA);
    angB = normaliza(angB);
    const angPertoDe = Math.max(angA, angB);
    const angPertoAte = Math.min(angA, angB);
    return {
      antes: arcoPontos(cx, cy, r, de, angPertoDe, N),
      depois: arcoPontos(cx, cy, r, angPertoAte, ate, N),
    };
  }

  if (tipoPilar === "B") {
    const a2 = Math.min(1.5 * d, hh);
    const arcoDir = arcoComVao(hw, -hh, 0, -90, corteDoCanto(1, -1));
    const arcoEsq = arcoComVao(-hw, -hh, -90, -180, corteDoCanto(-1, -1));
    const trechos = [];
    let atual = [[hw + r, -hh + a2], [hw + r, -hh], ...arcoDir.antes];
    if (arcoDir.depois.length > 0) {
      trechos.push(atual);
      atual = [...arcoDir.depois];
    }
    atual = [...atual, ...arcoEsq.antes];
    if (arcoEsq.depois.length > 0) {
      trechos.push(atual);
      atual = [...arcoEsq.depois];
    }
    atual = [...atual, [-hw - r, -hh + a2]];
    trechos.push(atual);
    return trechos;
  }

  // tipo C: só 1 canto com arco (o "com laje", -X/-Y)
  const a1 = Math.min(1.5 * d, hw), a2c = Math.min(1.5 * d, hh);
  const arco = arcoComVao(-hw, -hh, -90, -180, corteDoCanto(-1, -1));
  const trechos = [];
  let atual = [[-hw + a1, -hh - r], ...arco.antes];
  if (arco.depois.length > 0) {
    trechos.push(atual);
    atual = [...arco.depois];
  }
  atual = [...atual, [-hw - r, -hh + a2c]];
  trechos.push(atual);
  return trechos;
}

// Constrói os trechos MANTIDOS de um contorno (hw×hh, cantos raio r), abrindo vãos reais nos
// intervalos de posição informados (cada um em [posInicio,posFim], posFim pode passar do total
// pra indicar volta). Retorna null quando não há nenhum intervalo (contorno fechado normal).
function segmentosComGaps(hw, hh, r, intervalosBrutos) {
  if (!intervalosBrutos.length) return null;
  const total = 4 * hw + 4 * hh + 2 * Math.PI * r;
  let intervalos = [];
  for (const [ini, fim] of intervalosBrutos) {
    if (fim <= total) intervalos.push([ini, fim]);
    else {
      intervalos.push([ini, total]);
      intervalos.push([0, fim - total]);
    }
  }
  intervalos.sort((a, b) => a[0] - b[0]);
  const mesclados = [];
  for (const iv of intervalos) {
    const ultimo = mesclados[mesclados.length - 1];
    if (ultimo && iv[0] <= ultimo[1] + 0.01) ultimo[1] = Math.max(ultimo[1], iv[1]);
    else mesclados.push([...iv]);
  }
  const mantidos = [];
  let cursor = 0;
  for (const [ini, fim] of mesclados) {
    if (ini > cursor) mantidos.push([cursor, ini]);
    cursor = fim;
  }
  if (cursor < total) mantidos.push([cursor, total]);
  return mantidos
    .filter(([ini, fim]) => fim - ini > 0.01)
    .map(([ini, fim]) => {
      const N = Math.max(2, Math.round(((fim - ini) / total) * 120));
      const pontos = [];
      for (let i = 0; i <= N; i++) pontos.push(pontoNoContorno(ini + ((fim - ini) * i) / N, hw, hh, r));
      return pontos;
    });
}

// intervalo de posição [início,fim] excluído por um furo, dados os 2 pontos de interseção da
// tangente com o contorno em questão (já calculados em reducaoPorFuro)
function intervaloDeFuro(ptLo, ptHi, hw, hh, r) {
  if (!ptLo || !ptHi) return null;
  const xy = (pt) => (Array.isArray(pt) ? pt : [pt.x, pt.y]);
  const [ax, ay] = xy(ptLo);
  const [bx, by] = xy(ptHi);
  const posA = posicaoNoContorno(ax, ay, hw, hh, r);
  const posB = posicaoNoContorno(bx, by, hw, hh, r);
  const total = 4 * hw + 4 * hh + 2 * Math.PI * r;
  let diff = posB - posA;
  if (diff < 0) diff += total;
  const curto = diff <= total - diff;
  const inicio = curto ? posA : posB;
  const comprimento = curto ? diff : total - diff;
  return [inicio, inicio + comprimento];
}

function ContornosDiagram({
  ap, bp, d, p, tipoPilar, u_0, u_red, u_l, temMomento, cortesCll, u_l_ajustado,
  furoAtivo, furoX, furoY, furoLargura, furoAltura, furo, formaCircular, diametro, RcllCircular, padraoArmadura,
}) {
  const r2d = 2 * d;
  const rp = 2 * d + p;
  const hw = ap / 2, hh = bp / 2;
  const furoValido = !formaCircular && furoAtivo && furo && furo.dentroDoLimite;

  let cFace, cRed, cL, segCircular = null, segFaceCircular = null, segRedCircular = null;
  let furoValidoCirc = false;
  if (formaCircular) {
    const Rf = diametro / 2;
    const N = 64;
    const circPontos = (raio) => Array.from({ length: N + 1 }, (_, i) => {
      const a = (2 * Math.PI * i) / N;
      return [raio * Math.cos(a), raio * Math.sin(a)];
    });
    // arco com 1 vão real (usado por C e C' — só o furo afeta esses dois; a cunha só afeta o C'')
    const arcoComUmVao = (raio, thetaLo, thetaHi) => {
      const N2 = 48;
      let a = thetaLo, b = thetaHi;
      if (a > b) [a, b] = [b, a];
      const de = b, ate = a + 2 * Math.PI;
      return Array.from({ length: N2 + 1 }, (_, i) => {
        const ang = de + ((ate - de) * i) / N2;
        return [raio * Math.cos(ang), raio * Math.sin(ang)];
      });
    };
    furoValidoCirc = furoAtivo && tipoPilar === "I" && furo && furo.dentroDoLimite && furo.thetaLo != null;
    cFace = furoValidoCirc ? arcoComUmVao(Rf, furo.thetaLo, furo.thetaHi) : circPontos(Rf);
    cRed = furoValidoCirc ? arcoComUmVao(Rf + r2d, furo.thetaLo, furo.thetaHi) : circPontos(Rf + r2d);
    if (furoValidoCirc) {
      segFaceCircular = [cFace];
      segRedCircular = [cRed];
    }
    // Rcll (raio do C'') não é simplesmente Rf+rp pro circular (ver descontoCantosCircular) — usa
    // o valor real calculado (RcllCircular), não uma aproximação via u_l_ajustado/2π (que dava um
    // raio menor que o real, já que u_l_ajustado é o comprimento DEPOIS de descontar os vãos).
    const Rcll = RcllCircular != null ? RcllCircular : u_l / (2 * Math.PI);
    // reconstrói o círculo com vãos reais, usando os ângulos exatos de cada corte
    if (cortesCll && cortesCll.length) {
      const arcoEntreAngulos = (a1, a2) => {
        const N2 = 24;
        return Array.from({ length: N2 + 1 }, (_, i) => {
          const a = a1 + ((a2 - a1) * i) / N2;
          return [Rcll * Math.cos(a), Rcll * Math.sin(a)];
        });
      };
      // Escolhe sempre o vão MAIS CURTO entre os 2 ângulos de cada corte — evita o bug de tratar
      // um vão pequeno que cruza a descontinuidade ±180° do atan2 (ex: 177,98° e -177,98°, vão real
      // de ~4°) como se fosse o vão enorme do lado de fora (~356°), que produzia uma forma tipo
      // espiral no desenho.
      const anguloCurtoContorno = (angA, angB) => {
        let diff = angB - angA;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        return diff >= 0 ? [angA, angA + diff] : [angB, angB - diff];
      };
      const angulos = cortesCll
        .map(({ cortA, cortB }) => anguloCurtoContorno(Math.atan2(cortA[1], cortA[0]), Math.atan2(cortB[1], cortB[0])))
        .sort((x, y) => x[0] - y[0]);
      segCircular = [];
      for (let i = 0; i < angulos.length; i++) {
        const [, fimVao] = angulos[i];
        const [inicioProxVao] = angulos[(i + 1) % angulos.length] || angulos[0];
        const inicioAjustado = i === angulos.length - 1 ? inicioProxVao + 2 * Math.PI : inicioProxVao;
        segCircular.push(arcoEntreAngulos(fimVao, inicioAjustado));
      }
    } else {
      cL = circPontos(Rcll);
    }
  } else if (tipoPilar === "I") {
    cFace = contornoI(ap, bp, 0);
    cRed = contornoI(ap, bp, r2d);
    cL = contornoI(ap, bp, rp);
  } else if (tipoPilar === "B") {
    cFace = contornoB(ap, bp, d, 0);
    cRed = contornoB(ap, bp, d, r2d);
    cL = contornoB(ap, bp, d, rp);
  } else {
    cFace = contornoC(ap, bp, d, 0);
    cRed = contornoC(ap, bp, d, r2d);
    cL = contornoC(ap, bp, d, rp);
  }

  // Vãos reais nos 3 contornos: pela cunha da armadura em cruz (só C'', tipo I com armadura) e/ou
  // pelo furo na laje (C, C' e C'', só tipo I) — os dois podem coexistir no mesmo contorno C''.
  const intervalosFace = [];
  const intervalosRed = [];
  const intervalosL = [];
  if (furoValido) {
    const ivFace = intervaloDeFuro(furo.ptC_lo, furo.ptC_hi, hw, hh, 0);
    if (ivFace) intervalosFace.push(ivFace);
    const ivRed = intervaloDeFuro(furo.ptCl_lo, furo.ptCl_hi, hw, hh, r2d);
    if (ivRed) intervalosRed.push(ivRed);
    const ivL = intervaloDeFuro(furo.ptCll_lo, furo.ptCll_hi, hw, hh, rp);
    if (ivL) intervalosL.push(ivL);
  }
  if (tipoPilar === "I" && cortesCll && cortesCll.length) {
    for (const { cortA, cortB } of cortesCll) {
      const iv = intervaloDeFuro(cortA, cortB, hw, hh, rp);
      if (iv) intervalosL.push(iv);
    }
  }
  const segFace = formaCircular
    ? segFaceCircular
    : tipoPilar === "I"
    ? segmentosComGaps(hw, hh, 0, intervalosFace)
    : furoValido
    ? cortarContornoPorPontos(cFace, [furo.ptC_lo.x, furo.ptC_lo.y], [furo.ptC_hi.x, furo.ptC_hi.y])
    : null;
  const segRed = formaCircular
    ? segRedCircular
    : tipoPilar === "I"
    ? segmentosComGaps(hw, hh, r2d, intervalosRed)
    : furoValido
    ? cortarContornoPorPontos(cRed, [furo.ptCl_lo.x, furo.ptCl_lo.y], [furo.ptCl_hi.x, furo.ptCl_hi.y])
    : null;
  let segL = formaCircular
    ? segCircular
    : tipoPilar === "I"
    ? segmentosComGaps(hw, hh, rp, intervalosL)
    : cortesCll && cortesCll.length
    ? contornoBCComCortes(tipoPilar, ap, bp, d, rp, cortesCll)
    : null;
  if (!formaCircular && tipoPilar !== "I" && furoValido) {
    // furo também pode cortar o C'' em B/C — aplica em cima do(s) trecho(s) que a cunha já deixou
    // (ou no contorno inteiro, se não havia armadura/cunha ainda)
    const base = segL && segL.length ? segL : [cL];
    segL = base.flatMap((trecho) =>
      cortarContornoPorPontos(trecho, [furo.ptCll_lo.x, furo.ptCll_lo.y], [furo.ptCll_hi.x, furo.ptCll_hi.y])
    );
  }

  // a1/a2 podem "saturar" no próprio meio do pilar quando 1,5d excede a metade da dimensão —
  // nesse caso o contorno C (face) toca o eixo central do pilar, o que é matematicamente correto
  // (norma limita em min(1,5d, metade da dimensão)) mas pode parecer estranho visualmente.
  const a1Satura = tipoPilar !== "I" && Math.min(1.5 * d, ap / 2) >= ap / 2 - 0.05;
  const a2Satura = tipoPilar !== "I" && Math.min(1.5 * d, bp / 2) >= bp / 2 - 0.05;

  const maiorExtensaoBase = Math.max(ap / 2 + rp, bp / 2 + rp);
  const maiorExtensaoFuro = furoAtivo && furoLargura && furoAltura
    ? Math.max(Math.abs(furoX) + furoLargura / 2, Math.abs(furoY) + furoAltura / 2)
    : 0;
  const maiorExtensao = Math.max(maiorExtensaoBase, maiorExtensaoFuro) * 1.15;
  const W = 560, DESENHO_H = 460, LEGENDA_H = furoAtivo ? 128 : 98, H = DESENHO_H + LEGENDA_H;
  const cx = W / 2, cy = DESENHO_H / 2;
  const scale = Math.min(W, DESENHO_H) / 2 / maiorExtensao;
  const toPx = ([x, y]) => [cx + x * scale, cy - y * scale];
  const pathStr = (pontos, fechar) => {
    const d2 = pontos.map(toPx).map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    return fechar ? d2 + " Z" : d2;
  };
  const colPontos = formaCircular
    ? Array.from({ length: 33 }, (_, i) => {
        const a = (2 * Math.PI * i) / 32;
        return [(diametro / 2) * Math.cos(a), (diametro / 2) * Math.sin(a)];
      })
    : [[ap / 2, bp / 2], [-ap / 2, bp / 2], [-ap / 2, -bp / 2], [ap / 2, -bp / 2], [ap / 2, bp / 2]];

  // retas tangentes do furo, estendidas até um pouco além do contorno mais externo
  let tanLo = null, tanHi = null, furoPontos = null;
  if (furoValido || furoValidoCirc) {
    if (formaCircular) {
      // circular: usa o ângulo da sombra (thetaLo/thetaHi) direto — não tem "tangente" no sentido
      // retangular, é a reta radial na direção de cada canto extremo do furo
      const raioExterno = diametro / 2 + rp;
      tanLo = [raioExterno * Math.cos(furo.thetaLo), raioExterno * Math.sin(furo.thetaLo)];
      tanHi = [raioExterno * Math.cos(furo.thetaHi), raioExterno * Math.sin(furo.thetaHi)];
    } else {
      // pára exatamente no contorno mais externo (C''), onde a tangente de fato corta o perímetro —
      // continuar além disso só polui o desenho sem ajudar a ver onde o vão realmente começa
      tanLo = [furo.ptCll_lo.x, furo.ptCll_lo.y];
      tanHi = [furo.ptCll_hi.x, furo.ptCll_hi.y];
    }
    furoPontos = [
      [furoX - furoLargura / 2, furoY - furoAltura / 2],
      [furoX + furoLargura / 2, furoY - furoAltura / 2],
      [furoX + furoLargura / 2, furoY + furoAltura / 2],
      [furoX - furoLargura / 2, furoY + furoAltura / 2],
      [furoX - furoLargura / 2, furoY - furoAltura / 2],
    ];
  }

  const yLegBase = DESENHO_H + (tipoPilar !== "I" ? 64 : 26);
  const passo = 16;
  let linha = 0;
  const yLeg = () => yLegBase + passo * linha++;

  return (
    <div className="diagram-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} className="diagram-svg">
        {/* área do desenho — livre de texto */}
        {segL ? segL.map((pontos, i) => <path key={"l" + i} d={pathStr(pontos)} className="dg-cll-forte" />) : <path d={pathStr(cL)} className="dg-cll-forte" />}
        {segRed ? (
          segRed.map((pontos, i) => <path key={"r" + i} d={pathStr(pontos)} className="dg-contorno-c1" fill="none" />)
        ) : (
          <path d={pathStr(cRed)} className="dg-contorno-c1" fill="none" />
        )}
        <path d={pathStr(colPontos)} className="dg-col" />
        {tipoPilar === "B" && (
          <line
            x1={toPx([-ap / 2 - 6, bp / 2])[0]} y1={toPx([-ap / 2 - 6, bp / 2])[1]}
            x2={toPx([ap / 2 + 6, bp / 2])[0]} y2={toPx([ap / 2 + 6, bp / 2])[1]}
            className="dg-edge"
          />
        )}
        {tipoPilar === "C" && (
          <>
            <line
              x1={toPx([ap / 2, -bp / 2 - 6])[0]} y1={toPx([ap / 2, -bp / 2 - 6])[1]}
              x2={toPx([ap / 2, bp / 2 + 6])[0]} y2={toPx([ap / 2, bp / 2 + 6])[1]}
              className="dg-edge"
            />
            <line
              x1={toPx([-ap / 2 - 6, bp / 2])[0]} y1={toPx([-ap / 2 - 6, bp / 2])[1]}
              x2={toPx([ap / 2 + 6, bp / 2])[0]} y2={toPx([ap / 2 + 6, bp / 2])[1]}
              className="dg-edge"
            />
          </>
        )}
        {segFace ? (
          segFace.map((pontos, i) => <path key={"f" + i} d={pathStr(pontos)} className="dg-contorno-c0" fill="none" />)
        ) : (
          <path d={pathStr(cFace)} className="dg-contorno-c0" fill="none" />
        )}
        {(furoValido || furoValidoCirc) && (
          <>
            <line x1={toPx([0, 0])[0]} y1={toPx([0, 0])[1]} x2={toPx(tanLo)[0]} y2={toPx(tanLo)[1]} className="dg-tangente" />
            <line x1={toPx([0, 0])[0]} y1={toPx([0, 0])[1]} x2={toPx(tanHi)[0]} y2={toPx(tanHi)[1]} className="dg-tangente" />
            <path d={pathStr(furoPontos)} className="dg-furo" />
          </>
        )}

        {/* linha separando desenho da legenda */}
        <line x1={20} y1={DESENHO_H + 6} x2={W - 20} y2={DESENHO_H + 6} className="dg-hatch" />

        {/* legenda, numa banda abaixo do desenho, sem sobrepor nada */}
        {tipoPilar !== "I" && (
          <text x={20} y={26} className="dg-label-small" style={{ fill: "var(--accent)" }}>
            Face(s) livre(s) (linha vermelha no desenho): {tipoPilar === "B" ? "lado +Y (topo, direção b)" : "lados +X e +Y (direita e topo)"}
            · perímetro reduzido (u*) — Wp1/Wp2 (termo de momento) usa o perímetro completo à parte
          </text>
        )}
        {(a1Satura || a2Satura) && (
          <text x={20} y={44} className="dg-label-small" style={{ fill: "var(--accent-2)" }}>
            {a1Satura && a2Satura
              ? "a1 e a2 saturam no eixo do pilar (1,5d ≥ metade da dimensão nos dois sentidos)"
              : a1Satura
              ? "a1 satura no eixo X do pilar (1,5d ≥ ap/2) — contorno C toca o canto real do pilar"
              : "a2 satura no eixo Y do pilar (1,5d ≥ bp/2) — contorno C toca o canto real do pilar"}
          </text>
        )}
        <text x={20} y={yLeg()} className="dg-label-small">— contorno C (face do pilar)</text>
        <text x={20} y={yLeg()} className="dg-label-small">▬▬ contorno C&apos; (2d) · <span style={{ color: "var(--fail)" }}>▬▬ C&apos;&apos; (2d+p)</span></text>
        {cortesCll && cortesCll.length > 0 && (
          <text x={20} y={yLeg()} className="dg-label-small" style={{ fill: "var(--fail)" }}>
            {padraoArmadura === "radial"
              ? <>vãos no C&apos;&apos; = pequenos trechos entre barras radiais adjacentes (praticamente cheio com barras suficientes)</>
              : <>vãos no C&apos;&apos; = trechos descontados pela armadura em cruz (não cobre os cantos/diagonal)</>}
          </text>
        )}
        {furoAtivo && (
          <text x={20} y={yLeg()} className="dg-label-small" style={{ fill: "var(--accent)" }}>
            {furoValido || furoValidoCirc
              ? <>Furo (laranja) a <b>{fmt(furo.distancia, 1)}</b>cm da face — setor sombreado {fmt(furo.setorGraus, 1)}° · vão = trecho descontado em cada contorno</>
              : <>Furo a {fmt(furo && furo.distancia, 1)}cm da face — fora do limite de 8d, sem redução</>}
          </text>
        )}
      </svg>
    </div>
  );
}

// Desenho do arranjo de armadura de punção pra pilar CENTRAL CIRCULAR — cobre os 2 padrões
// validados contra DXF de referência: EM CRUZ (4 braços nos eixos, cada um 2 linhas de porta-
// estribo + estribo perpendicular em cada camada, igual ao retangular mas radiando de um
// círculo) e RADIAL (N barras "cobra" — uma barra contínua em zigue-zague por braço, aqui
// representada em planta como uma única linha radial com um traço em cada camada, já que o
// zigue-zague em si é em elevação, não em planta).
// Desenho de DETALHE (elevação) da barra "cobra" — a barra individual do padrão radial, fora do
// contexto do pilar (é a mesma peça pra qualquer posição radial). Reconstrói exatamente a
// sequência validada contra o DXF de referência: 1º/último segmento horizontal = 0,5d; segmentos
// verticais (1 ramo de estribo cada) = h-2cob-diâmetro(s) das barras negativas; segmentos
// horizontais intermediários = 0,75d (mesma convenção de Sr já usada) — zigue-zague conectando
// as Nr camadas.
function FerroCobraDiagram({ d, Nr, Sr, primeiraCamada, h, cobrimento, diamNegativo, diamEstribo }) {
  const alturaRamo = Math.floor((h - 2 * cobrimento - diamNegativo / 10) * 2) / 2;
  const seg0 = primeiraCamada; // 1º/último segmento — validado = 0,5d (primeiraCamada já é isso)
  const segMeio = Sr; // segmento intermediário — validado = 0,75d (Sr já é essa convenção)

  // monta a sequência de pontos como DEGRAUS retos (segmento horizontal, depois vertical, alternando)
  // — não diagonais. x cresce da esquerda pra direita; y alterna entre 0 (apoio) e alturaRamo (topo).
  const pontos = [[0, 0]];
  let x = 0, y = 0;
  for (let i = 0; i < Nr; i++) {
    x += i === 0 ? seg0 : segMeio; // segmento horizontal (reto, mesma altura y)
    pontos.push([x, y]);
    y = alturaRamo - y; // segmento vertical (reto, mesmo x, sobe ou desce)
    pontos.push([x, y]);
  }
  x += seg0; // segmento horizontal final (0,5d), formando o "pé" de apoio
  pontos.push([x, y]);
  const comprimentoTotal = x;

  const margem = 30;
  const escala = Math.min(6, 560 / comprimentoTotal);
  const W = comprimentoTotal * escala + margem * 2;
  const H = alturaRamo * escala + margem * 2 + 40;
  const toPx = ([px, py]) => [margem + px * escala, H - margem - 40 - py * escala];
  const pathStr = pontos.map(toPx).map(([px, py], i) => `${i === 0 ? "M" : "L"}${px.toFixed(1)},${py.toFixed(1)}`).join(" ");

  return (
    <div className="diagram-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} className="diagram-svg">
        <path d={pathStr} className="dg-bar" fill="none" strokeWidth="3" />
        {/* cotas de cada segmento — deslocadas conforme a posição real (topo/base/vertical) */}
        {pontos.slice(0, -1).map((p, i) => {
          const [x1, y1] = p, [x2, y2] = pontos[i + 1];
          const comp = Math.hypot(x2 - x1, y2 - y1);
          const isHoriz = Math.abs(y2 - y1) < 0.01;
          const [px1, py1] = toPx(p), [px2, py2] = toPx(pontos[i + 1]);
          const midX = (px1 + px2) / 2, midY = (py1 + py2) / 2;
          if (isHoriz) {
            const noTopo = y1 > alturaRamo / 2;
            return (
              <text key={i} x={midX} y={noTopo ? midY - 10 : midY + 18} textAnchor="middle" className="dg-label-tiny">
                {fmt(comp, 2)}
              </text>
            );
          }
          return (
            <text key={i} x={midX + 8} y={midY} className="dg-label-tiny">
              {fmt(comp, 2)}
            </text>
          );
        })}
      </svg>
      <div className="footnote">
        Barra &quot;cobra&quot; individual (elevação — o zigue-zague acontece na espessura da laje, não em
        planta): {Nr} ramos de estribo ø{diamEstribo} (cada segmento vertical), comprimento total ={" "}
        <b>{fmt(comprimentoTotal, 1)}</b>cm. 1º/último trecho horizontal = 0,5d ={" "}
        {fmt(seg0, 2)}cm (apoia a ferragem no fundo da laje); trechos intermediários = 0,75d ={" "}
        {fmt(segMeio, 2)}cm; altura do ramo = h − 2×cobrimento − diâmetro das negativas ={" "}
        {fmt(alturaRamo, 2)}cm.
      </div>
    </div>
  );
}

// Desenho do arranjo de armadura de punção pra pilar de CANTO com padrão RADIAL (leque a partir
// do canto com laje) — validado ponto a ponto contra DXF de referência. Cada barra é uma reta do
// canto LIVRE (oposto) até sua ponta no arco da última camada; as camadas intermediárias de cada
// barra ficam onde essa reta cruza os arcos das camadas menores (não na mesma direção angular da
// ponta, já que a reta não sai do canto com laje, sai do canto livre).
function PuncaoDiagramCantoRadial({ ativo, ap, bp, d, Nr, Sr, primeiraCamada, nBarrasRadial, diamEstribo }) {
  if (!ativo) {
    return <div className="derived-note">Contorno C&apos; dispensa armadura de punção — nenhum arranjo a desenhar.</div>;
  }
  const hw = ap / 2, hh = bp / 2;
  const canto = [-hw, -hh]; // canto COM laje (referência dos arcos de camada e do C'')
  const livre = [hw, hh]; // canto LIVRE (de onde as barras "saem"/convergem)
  const extensaoUltimaCamada = primeiraCamada + (Nr - 1) * Sr;
  const N = Math.max(1, nBarrasRadial);

  // ângulo entre pontas de barras adjacentes: corda=d no raio da última camada (confirmado
  // contra DXF — não é 2d como no redondo, é d)
  const passoAngular = 2 * Math.asin(Math.min(1, d / (2 * extensaoUltimaCamada)));
  const angCentral = (5 * Math.PI) / 4; // 225° — direção do canto livre pro canto com laje

  // ângulos de cada barra, simétricos ao redor do central (ímpar: 1 central + resto nos 2 lados;
  // par: nenhuma barra exatamente no centro, pares simétricos)
  const angulos =
    N % 2 === 1
      ? Array.from({ length: N }, (_, i) => angCentral + (i - (N - 1) / 2) * passoAngular)
      : Array.from({ length: N }, (_, i) => angCentral + (i - (N - 1) / 2) * passoAngular);

  // interseção do segmento ponta->livre com a face do pilar (quadrado hw×hh) — a barra pára exatamente
  // onde cruza a face, não continua até o canto livre (que é só a referência de direção, não faz
  // parte física da barra)
  function pontoNaFace(ponta, livre) {
    const dx = livre[0] - ponta[0], dy = livre[1] - ponta[1];
    const arestas = [
      [[hw, -hh], [hw, hh]], // face direita (+X)
      [[-hw, hh], [hw, hh]], // face de cima (+Y)
      [[-hw, -hh], [-hw, hh]], // face esquerda (-X)
      [[-hw, -hh], [hw, -hh]], // face de baixo (-Y)
    ];
    let melhorT = null, melhorPt = null;
    for (const [[ax, ay], [bx, by]] of arestas) {
      const ex = bx - ax, ey = by - ay;
      const denom = dx * ey - dy * ex;
      if (Math.abs(denom) < 1e-9) continue;
      const t = ((ax - ponta[0]) * ey - (ay - ponta[1]) * ex) / denom;
      const s = ((ax - ponta[0]) * dy - (ay - ponta[1]) * dx) / denom;
      if (t >= -0.001 && t <= 1.001 && s >= -0.001 && s <= 1.001) {
        if (melhorT === null || t < melhorT) {
          melhorT = t;
          melhorPt = [ponta[0] + t * dx, ponta[1] + t * dy];
        }
      }
    }
    return melhorPt || livre;
  }

  const barras = angulos.map((ang) => {
    const ponta = [canto[0] + extensaoUltimaCamada * Math.cos(ang), canto[1] + extensaoUltimaCamada * Math.sin(ang)];
    // Todas as barras têm o MESMO tamanho e mesma quantidade de ramos que a central — as camadas
    // ficam a distâncias FIXAS da ponta, medidas ao longo da PRÓPRIA reta da barra (não pela
    // interseção com os arcos concêntricos, que dava segmentos de comprimento diferente pra cada
    // barra já que só a reta central passa pelo canto). Confirmado pelo usuário.
    const dir = [(livre[0] - ponta[0]) / Math.hypot(livre[0] - ponta[0], livre[1] - ponta[1]), (livre[1] - ponta[1]) / Math.hypot(livre[0] - ponta[0], livre[1] - ponta[1])];
    const camadas = Array.from({ length: Nr - 1 }, (_, i) => {
      const distDaPonta = extensaoUltimaCamada - (primeiraCamada + i * Sr);
      return [ponta[0] + distDaPonta * dir[0], ponta[1] + distDaPonta * dir[1]];
    });
    camadas.push(ponta);
    // a barra pára na FACE do pilar — não entra nele nem continua até o canto livre (só a
    // direção de "livre" é usada como referência angular, confirmado pelo usuário)
    const pontaNaFace = pontoNaFace(ponta, livre);
    return { ponta, camadas, pontaNaFace };
  });

  const raioCll = 2 * d + extensaoUltimaCamada;
  const W = 640, H = 640;
  const margem = 1.15;
  const scale = Math.min(W, H) / (2 * raioCll * margem);
  // desloca o centro na direção do leque (225°, rumo ao canto com laje) pra caber tudo — pilar
  // fica perto de um canto do desenho, arco/leque ocupam o resto
  const deslocX = raioCll * 0.55 * Math.cos((5 * Math.PI) / 4);
  const deslocY = raioCll * 0.55 * Math.sin((5 * Math.PI) / 4);
  const cx = W / 2 - deslocX * scale;
  const cy = H / 2 + deslocY * scale;
  const toPx = ([x, y]) => [cx + x * scale, cy - y * scale];
  const pathStr = (pontos) => pontos.map(toPx).map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");

  const colPontos = [[hw, hh], [-hw, hh], [-hw, -hh], [hw, -hh], [hw, hh]];
  const arcoCll = Array.from({ length: 33 }, (_, i) => {
    const ang = Math.PI + (i / 32) * (Math.PI / 2);
    return [canto[0] + raioCll * Math.cos(ang), canto[1] + raioCll * Math.sin(ang)];
  });

  return (
    <div className="diagram-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} className="diagram-svg">
        <path d={pathStr(colPontos)} className="dg-col" />
        <path d={pathStr(arcoCll)} className="dg-cll-forte" fill="none" />
        {barras.map((barra, bi) => (
          <g key={bi}>
            <path d={pathStr([barra.pontaNaFace, barra.ponta])} className="dg-bar" fill="none" />
            {barra.camadas.map((p, ci) => {
              const [px, py] = toPx(p);
              return <circle key={ci} cx={px} cy={py} r={3} className="dg-estribo-tick-circ" />;
            })}
          </g>
        ))}
      </svg>
      <div className="footnote">
        Padrão RADIAL de canto: {N} barra(s) reta(s) saindo do canto livre até a ponta no arco da última
        camada (raio {fmt(extensaoUltimaCamada, 1)}cm do canto com laje), espaçadas por corda d entre pontas
        ({fmt((passoAngular * 180) / Math.PI, 1)}° de passo angular). Cada barra fornece {Nr} ramos de
        estribo ø{diamEstribo} — 1 por camada (círculo), nas interseções com os arcos das camadas
        intermediárias. O contorno C&apos;&apos; é um arco de 90° cheio (raio {fmt(raioCll, 1)}cm) — sem
        corte de cunha nesse padrão.
      </div>
    </div>
  );
}

function PuncaoDiagramCircular({ ativo, diametro, d, Nr, Sr, primeiraCamada, padraoArmadura, nBarrasRadial, diamEstribo, diamPortaInferior, cobrimento, h }) {
  if (!ativo) {
    return <div className="derived-note">Contorno C&apos; dispensa armadura de punção — nenhum arranjo a desenhar.</div>;
  }
  const radial = padraoArmadura === "radial";
  const R = diametro / 2;
  const extensaoUltimaCamada = primeiraCamada + (Nr - 1) * Sr;
  const extensaoPorLado = extensaoUltimaCamada + 5;
  const N = radial ? Math.max(1, nBarrasRadial) : 4;

  const W = 640, H = 640;
  const maiorExtensao = (R + extensaoPorLado) * 1.15;
  const scale = Math.min(W, H) / 2 / maiorExtensao;
  const cx = W / 2, cy = H / 2;
  const toPx = ([x, y]) => [cx + x * scale, cy - y * scale];
  const pathStr = (pontos) => pontos.map(toPx).map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");

  const meiaLargura = radial ? 0 : d; // radial: barra é 1 ponto; cruz: par com 2d de largura (±d)
  // Igual ao retangular: um par de braços opostos fica na camada de cima (altura cheia, só
  // desconta cobrimento) e o outro par fica embaixo (desconta também o diâmetro do porta-
  // estribo do par de cima) — confirmado pelo usuário. Alterna por índice do braço (0,2=cheia;
  // 1,3=reduzida) já que não há um "sentido maior" fixo pro círculo (simétrico).
  const diamPortaSuperior = 10;
  const alturaMaiorCirc = h - 2 * cobrimento;
  const alturaMenorCirc = h - 2 * cobrimento - diamPortaSuperior / 10 - diamPortaInferior / 10;

  const bracos = Array.from({ length: N }, (_, i) => (2 * Math.PI * i) / N);

  return (
    <div className="diagram-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} className="diagram-svg">
        <circle cx={cx} cy={cy} r={R * scale} className="dg-col" />
        {bracos.map((ang, bi) => {
          const cosA = Math.cos(ang), sinA = Math.sin(ang);
          const perpX = -sinA, perpY = cosA;
          const rIni = R, rFim = R + extensaoPorLado;
          const p0 = [rIni * cosA + meiaLargura * perpX, rIni * sinA + meiaLargura * perpY];
          const p1 = [rFim * cosA + meiaLargura * perpX, rFim * sinA + meiaLargura * perpY];
          const p0b = [rIni * cosA - meiaLargura * perpX, rIni * sinA - meiaLargura * perpY];
          const p1b = [rFim * cosA - meiaLargura * perpX, rFim * sinA - meiaLargura * perpY];
          return (
            <g key={bi}>
              <path d={pathStr([p0, p1])} className={radial ? "dg-bar" : bi % 2 === 0 ? "dg-bar" : "dg-bar-reduzido"} />
              {!radial && <path d={pathStr([p0b, p1b])} className={bi % 2 === 0 ? "dg-bar" : "dg-bar-reduzido"} />}
              {Array.from({ length: Nr }).map((_, i) => {
                const rc = R + primeiraCamada + i * Sr;
                const pc = [rc * cosA + meiaLargura * perpX, rc * sinA + meiaLargura * perpY];
                const pcb = [rc * cosA - meiaLargura * perpX, rc * sinA - meiaLargura * perpY];
                return radial ? (
                  <circle key={i} cx={toPx(pc)[0]} cy={toPx(pc)[1]} r={3} className="dg-estribo-tick-circ" />
                ) : (
                  <line key={i} x1={toPx(pc)[0]} y1={toPx(pc)[1]} x2={toPx(pcb)[0]} y2={toPx(pcb)[1]} className="dg-estribo-tick" />
                );
              })}
