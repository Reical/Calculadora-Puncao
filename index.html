  const deltaZigzag = novoZigzag.length - TAM_BLOCO_ZIGZAG_NATIVO;

  // zigue-zague duplo da malha negativa (flanqueando o pilar, sem rótulos) — bloco nativo cobre
  // Nr=4 (2×9 segmentos), substituído do zero pra qualquer Nr/h (ver dw4_criarZigzagMalhaNegativa
  // — Y_BASE agora depende de h, achado sessão 2026-09-26).
  const OFF_MALHA_ZIGZAG_NATIVO = 2913 + deltaCotaRow + deltaColapso + deltaZigzag;
  const TAM_BLOCO_MALHA_ZIGZAG_NATIVO = 360; // 2×9×20B SEG0b0e (Nr=4 nativo, sem rótulos)
  const novoZigzagMalha = dw4_criarZigzagMalhaNegativa(raioCirculoFU, r.primeiraCamada, r.Sr, alturaRamo, Nr, inp.h);
  arr.splice(OFF_MALHA_ZIGZAG_NATIVO, TAM_BLOCO_MALHA_ZIGZAG_NATIVO, ...novoZigzagMalha);
  const deltaZigzagMalha = novoZigzagMalha.length - TAM_BLOCO_MALHA_ZIGZAG_NATIVO;

  // setas de indicação + rótulos "N1" que apontam pra ponta de cada zigue-zague da malha negativa
  // (ver dw4_criarLeaderMalhaNegativa) — bloco nativo tem 2 setas (4 segmentos) + 2 rótulos,
  // substituído do zero por interpolação em h (NÃO depende de Nr/comprimentoRadial, ver comentário
  // da função — 1ª versão dependia da ponta e regrediu no teste com P30/Nr=6).
  const OFF_LEADER_NATIVO = 3273 + deltaCotaRow + deltaColapso + deltaZigzag + deltaZigzagMalha;
  const TAM_BLOCO_LEADER_NATIVO = 130; // 4×20B SEG0b0d + 2×25B TXT200e "N1"
  const novoLeader = [
    ...dw4_criarLeaderMalhaNegativa(inp.h, true),
    ...dw4_criarLeaderMalhaNegativa(inp.h, false),
  ];
  arr.splice(OFF_LEADER_NATIVO, TAM_BLOCO_LEADER_NATIVO, ...novoLeader);
  const deltaLeader = novoLeader.length - TAM_BLOCO_LEADER_NATIVO;

  // raios da "barra cobra" — bloco nativo de 8 raios (P10 tem N=8) substituído do zero por N =
  // r.nBarrasRadial raios recalculados pra qualquer N/Nr (não reaproveita conteúdo nativo, ver
  // dw4_criarRaioRadial) — offset/tamanho do bloco nativo confirmados por decodificação exata;
  // offset ajustado por TODOS os deltas acima (rodam antes e podem mudar de tamanho)
  const OFF_RAIOS_NATIVOS = 3403 + deltaCotaRow + deltaColapso + deltaZigzag + deltaZigzagMalha + deltaLeader;
  const TAM_BLOCO_RAIOS_NATIVOS = 360; // 8 raios × (20B SEG0b0e + 25B TXT200e "N1")
  const novosRaios = [];
  for (let k = 0; k < N; k++) {
    const angulo = (k * 360) / N;
    novosRaios.push(...dw4_criarRaioRadial(cx0, cy0, angulo, raioCirculoFU, comprimentoRadialFU));
  }
  arr.splice(OFF_RAIOS_NATIVOS, TAM_BLOCO_RAIOS_NATIVOS, ...novosRaios);

  // legenda solta "N1 {N}#{diam}\tC={C}" (mesma convenção descoberta pro "N1/N2 malha" da borda,
  // ver dw4_pilar_borda_progress round 11) — busca por conteúdo, imune ao splice acima já que a
  // legenda fica ANTES do bloco de raios no arquivo
  const diamTxt = (d) => (Number.isInteger(d) ? `${d}.0` : String(d));
  const C = Math.round(comprimentoRadialCm + alturaRamo * Nr);
  dw4_patchTexto(arr, "N1 8#8.0\tC=137", `N1 ${N}#${diamTxt(inp.diamEstribo)}\tC=${C}`);

  // cabeçalho: byte 98 = N (nBarrasRadial) cru, bytes 109/122/126 = C (comprimento) cru, cada um
  // 1 byte só — CUIDADO: satura em 255 (não testado além disso)
  arr[98] = N & 0xff;
  const cByte = Math.min(255, Math.max(0, Math.round(C)));
  arr[109] = cByte;
  arr[122] = cByte;
  arr[126] = cByte;

  // nome do pilar — existem 2 ocorrências nativas de "P10" no template (offsets originais 633 e
  // 880). CORRIGIDO sessão 2026-09-26: a 1ª (633) NÃO é um campo fixo/ignorável como se pensava
  // nas rodadas 1-3 (P20/P30, ambos h=25, ficaram com essa ocorrência intocada em "P10" — mas
  // isso era só o usuário não tendo corrigido esse detalhe específico na hora, não uma limitação
  // de verdade do S4CAD) — um 3º arquivo real (h=20cm) mostrou o usuário corrigindo essa MESMA
  // ocorrência pra "P1" (nome do pilar) E deslocando o Y dela (8,5827→8,4827 pra h=20, achado:
  // Y = 8,0827 + h/50 — mesma família de fórmula "+h/50" da caixa do corte da laje). Patch de Y
  // primeiro (em-lugar, offset fixo, seguro rodar a qualquer momento), texto por último (troca as
  // 2 ocorrências, muda de tamanho e desloca tudo que vem depois).
  dw4_escreverFloat32(arr, 633 + 6, 8.0827 + inp.h / 50);
  dw4_patchTextoIsoladoTodasOcorrencias(arr, "P10", inp.nome || "P1");

  return arr;
}

// Gera o .DW4 e salva. Usa a File System Access API (window.showSaveFilePicker) quando
// disponível, abrindo o diálogo nativo "Salvar como" pra o usuário escolher pasta/nome — só
// funciona em navegador Chromium servindo a página por http(s) (não funciona abrindo o HTML
// direto via file://, que é como este app normalmente é aberto — nesse caso cai no fallback
// abaixo, que sempre funcionou: baixa pro local padrão de downloads do navegador).
async function baixarArquivoS4(inp, r) {
  const arr = inp.formaCircular && inp.padraoArmadura === "radial" ? gerarArquivoS4CircularRadial(inp, r) : gerarArquivoS4(inp, r);
  const b64 = dw4_bytesParaBase64(arr);
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], { type: "application/octet-stream" });
  const nomeArquivo = `${inp.nome || "P1"}_puncao.DW4`;

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: nomeArquivo,
        types: [{ description: "Arquivo S4CAD", accept: { "application/octet-stream": [".DW4"] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return; // usuário cancelou o diálogo — não faz nada
      // qualquer outro erro (API bloqueada, sem permissão, etc.) cai no fallback abaixo
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nomeArquivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function App() {
  const [inp, setInp] = useState({
    nome: "P1",
    ap: 25,
    bp: 60,
    h: 25,
    cobrimento: 3,
    Fk: 0,
    Mkx: 0,
    Mky: 0,
    gamaf: 1.4,
    tipoPilar: "I",
    formaCircular: false,
    diametro: 40,
    padraoArmadura: "cruz",
    fck: 30,
    gamac: 1.4,
    diamMalha: 8,
    espMalha: 40,
    considerarMalha: true,
    diamReforcoX: 12.5,
    espReforcoX: 20,
    qtdReforcoX: 1,
    diamReforcoY: 12.5,
    espReforcoY: 20,
    qtdReforcoY: 1,
    diamEstribo: 8,
    diamPortaInferior: 10,
    gruposMenorManual: null,
    gruposMaiorManual: null,
    larguraEstriboXManual: null,
    larguraEstriboYManual: null,
    larguraEstriboCircularManual: null,
    estabilidadeDependePuncao: true,
    furoAtivo: false,
    furoX: 0,
    furoY: 0,
    furoLargura: 20,
    furoAltura: 20,
  });

  const set = (k) => (v) => setInp((prev) => ({ ...prev, [k]: v }));
  // Pilar circular: mantém ap=bp=diâmetro sempre sincronizados, já que o resto do pipeline
  // (detalhamento, Nr/Sr, braços em cruz) trata a seção como um "quadrado" simétrico de lado
  // igual ao diâmetro — só as fórmulas de u0/u_red/u_l/Wp (em calcPuncao) e o desenho tratam o
  // caso circular de fato como círculo.
  const setDiametro = (v) => setInp((prev) => ({ ...prev, diametro: v, ap: v || prev.ap, bp: v || prev.bp }));
  const setFormaCircular = (checked) =>
    setInp((prev) => ({
      ...prev,
      formaCircular: checked,
      ap: checked ? prev.diametro : prev.ap,
      bp: checked ? prev.diametro : prev.bp,
    }));

  const r = useMemo(() => {
    try {
      // Bitola efetiva por direção: a maior entre a malha negativa (se considerada) e o reforço local
      // (malha e reforço são montados no mesmo nível, então é a bitola maior desse conjunto
      // que governa a posição da camada naquela direção — não muda entre "com/sem reforço").
      const diamMalhaConsiderada = inp.considerarMalha ? inp.diamMalha : 0;
      const diamEfX = Math.max(diamMalhaConsiderada, inp.diamReforcoX);
      const diamEfY = Math.max(diamMalhaConsiderada, inp.diamReforcoY);

      // Área de aço por cm de largura em cada direção: malha negativa (se considerada) + reforço local
      const AsMalha = inp.considerarMalha ? BIT(inp.diamMalha) / inp.espMalha : 0;
      const AsX = AsMalha + (inp.qtdReforcoX * BIT(inp.diamReforcoX)) / inp.espReforcoX;
      const AsY = AsMalha + (inp.qtdReforcoY * BIT(inp.diamReforcoY)) / inp.espReforcoY;

      // Altura útil automática: a maior bitola sempre fica por cima (mais afastada da face,
      // portanto mais crítica) — d = h - cobrimento - φmenor - φmaior/2 (mm -> cm)
      const diamMin = Math.min(diamEfX, diamEfY);
      const diamMax = Math.max(diamEfX, diamEfY);
      const d = inp.h - inp.cobrimento - diamMin / 10 - diamMax / 20;
      // Sr adota o máximo normativo (0,75d), arredondado SEMPRE PRA BAIXO em múltiplos de 0,5cm
      const Sr = Math.floor(0.75 * d * 2) / 2;

      // 1ª passada: só pra saber se o contorno C' precisa de armadura e quanto (AswCalc não depende do Asw informado)
      const base = calcPuncao({ ...inp, AsX, AsY, d, Sr, AswInput: 0 });

      // Nr (nº de camadas) é calculado automaticamente: mínimo normativo de 3, subindo até o contorno
      // C'' passar — considerando TAMBÉM o corte da cunha por armadura em cruz (pilar central), não só
      // o C'' "cheio". Como o detalhamento (grupos/posições) e o corte da cunha dependem de Nr (a
      // extensão até a última camada muda com Nr), o loop inteiro (detalhamento + corte) roda de novo
      // a cada tentativa de Nr, em vez de decidir Nr só com o C'' sem o desconto.
      const ladosMenor = inp.tipoPilar === "I" ? 2 : 1;
      const ladosMaior = inp.tipoPilar === "C" ? 1 : 2;
      const pisoEstribosPorCamada = ladosMaior + ladosMenor; // 1 par em cada sentido (o mínimo buildable)
      // menorEhX decide qual eixo (X ou Y) recebe o "papel" de sentido menor (ladosMenor/gruposMenor/
      // etc). Pro tipo I é numérico (ap<=bp) — não tem face livre, então não importa qual eixo é
      // fisicamente maior/menor, só a distribuição de pares importa. Pro tipo B, a face livre do
      // contorno (contornoB) é SEMPRE fixa no eixo Y (+Y, topo) — então o papel de "sentido menor"
      // (1 lado só) tem que ser SEMPRE Y, mesmo que ap<bp numericamente (senão o desenho do arranjo
      // fica com a face livre no eixo errado, incoerente com o contorno crítico).
      const menorEhX = inp.tipoPilar === "B" ? false : inp.ap <= inp.bp;
      // menorDim/maiorDim refletem o PAPEL de cada eixo (não só o valor numérico), pra que as fórmulas
      // de comprimento (comprMenorSentido/comprMaiorSentido) usem a dimensão certa mesmo quando o papel
      // foi fixado (tipo B) em vez de vir da comparação numérica.
      const menorDim = menorEhX ? inp.ap : inp.bp;
      const maiorDim = menorEhX ? inp.bp : inp.ap;
      const diamPortaSuperior = 10;
      // A barra do sentido MAIOR fica na camada externa (não precisa "passar por cima" da outra
      // camada) — altura cheia, só desconta cobrimento. A do sentido MENOR fica na camada interna,
      // por isso desconta também os diâmetros dos porta-estribo superior e inferior empilhados.
      const alturaEstriboMaior = inp.h - 2 * inp.cobrimento;
      const alturaEstriboMenor = inp.h - 2 * inp.cobrimento - diamPortaSuperior / 10 - inp.diamPortaInferior / 10;
      const alturaEstriboX = menorEhX ? alturaEstriboMenor : alturaEstriboMaior;
      const alturaEstriboY = menorEhX ? alturaEstriboMaior : alturaEstriboMenor;

      const NR_MAX_TESTADO = 15;
      const MAIOR_BITOLA_PILAR_CM = 2.5; // maior bitola tipicamente detalhada na armadura longitudinal do pilar
      const ehRadial = (inp.formaCircular || inp.tipoPilar === "C") && inp.padraoArmadura === "radial";
      const ehRadialCantoRet = ehRadial && !inp.formaCircular;
      let Nr = ehRadial ? 4 : 3; // radial exige mínimo 4 camadas (armadura em "cobra", confirmado pelo usuário)
      let nBarrasRadial = 0, nBarrasRadialMax = 0;
      let final, AswEfetiva = 0, ramosNecessarios = null, origemArmadura = null, temArmadura = false;
      let AswObrigatoriaTotal = null, estribosTotalDemanda = null, pisoEstribosTotal = null, estribosTotalFinal = null;
      let gruposMenor = 0, gruposMaior = 0, nGruposTotal = 0, estribosFornecidos = 0, ramosFornecidos = 0, gruposMenorAuto = 0, gruposMaiorAuto = 0;
      let comprMenorSentido = null, comprMaiorSentido = null, posicoesMenor = [], posicoesMaior = [];
      let primeiraCamada, extensaoUltimaCamada, extensaoPorLado;
      let larguraEstriboMenor, larguraEstriboMaior, larguraEstriboX, larguraEstriboY;
      let comprimentoEstriboX, comprimentoEstriboY;
      let u_l_ajustado = null, tau_Cll_ajustado = null, atendeCll_ajustado = null, cortesCll = null;
      let maiorGrupoReposicionado = false;
      let maiorLinhasDentro = 2;
      let menorGrupoReposicionado = false;
      let RcllCircular = null;
      let menorLinhasDentro = 2;
      let atende = false;

      while (!atende && Nr <= NR_MAX_TESTADO) {
        final = calcPuncao({ ...inp, AsX, AsY, d, Sr, Nr, AswInput: 0 });

        AswEfetiva = 0;
        ramosNecessarios = null;
        origemArmadura = null;
        AswObrigatoriaTotal = null;
        estribosTotalDemanda = null;
        pisoEstribosTotal = null;
        estribosTotalFinal = null;

        if (base.precisaArm) {
          ramosNecessarios = Math.ceil(base.AswCalc / BIT(inp.diamEstribo));
          AswEfetiva = ramosNecessarios * BIT(inp.diamEstribo);
          origemArmadura = "necessaria";
        } else if (inp.estabilidadeDependePuncao && inp.Fk > 0) {
          // NBR 6118, 19.5.3.5 — Armadura de punção obrigatória: quando a estabilidade global da
          // estrutura depende da resistência da laje à punção, deve haver armadura mesmo com τSd<τRd1,
          // equilibrando no mínimo 50% de Fsd: Asw,min = Fsd/(2·fywd). Esse valor é a área TOTAL exigida
          // (convenção do escritório) — vira nº de estribos TOTAL, comparado contra o piso mínimo TOTAL
          // (Nr×lados) da configuração do pilar; o que for maior prevalece.
          const Fsd_kgf = inp.Fk * inp.gamaf * 1000;
          const fywd_kgf_cm2 = base.fywd * 10;
          AswObrigatoriaTotal = Fsd_kgf / (2 * fywd_kgf_cm2);
          if (AswObrigatoriaTotal > 0) {
            const ramosTotalDemanda = Math.ceil(AswObrigatoriaTotal / BIT(inp.diamEstribo));
            estribosTotalDemanda = Math.ceil(ramosTotalDemanda / 2);
            pisoEstribosTotal = Nr * pisoEstribosPorCamada;
            estribosTotalFinal = Math.max(estribosTotalDemanda, pisoEstribosTotal);
            const estribosPorCamada = Math.ceil(estribosTotalFinal / Nr);
            ramosNecessarios = estribosPorCamada * 2;
            AswEfetiva = ramosNecessarios * BIT(inp.diamEstribo);
            origemArmadura = "obrigatoria";
          }
        }
        temArmadura = origemArmadura !== null;

        // 1ª camada de estribo fica a 0,5d da face do pilar; camadas seguintes espaçadas de Sr entre si.
        primeiraCamada = Math.floor(0.5 * d * 2) / 2;
        extensaoUltimaCamada = primeiraCamada + (Nr - 1) * Sr;
        extensaoPorLado = extensaoUltimaCamada + 5; // + 5cm de folga (metade dos 10cm da fórmula de comprimento)

        gruposMenor = 0;
        gruposMaior = 0;
        nGruposTotal = 0;
        estribosFornecidos = 0;
        ramosFornecidos = 0;
        comprMenorSentido = null;
        comprMaiorSentido = null;
        posicoesMenor = [];
        posicoesMaior = [];

        // ---- Algoritmo de detalhamento (decodificado a partir dos DXFs de referência do escritório) ----
        // Cada "par" = 2 linhas de porta-estribo em planta (2 inferiores + 2 superiores empilhadas).
        // Um par que atravessa o pilar numa direção monta 1 ESTRIBO por camada em cada LADO que cruza.
        // No pilar central (I) todo par tem 2 lados. No de borda (B), a face livre fica no sentido MENOR
        // (só 1 lado nesse sentido); no de canto (C), os 2 sentidos têm face livre (1 lado cada). O
        // sentido MAIOR sempre tem exatamente 1 par fixo (centralizado); o excedente vai pro sentido
        // MENOR, distribuído ao longo do eixo maior.
        if (temArmadura && ehRadialCantoRet) {
          // Padrão RADIAL em pilar de CANTO retangular (leque a partir do canto com laje,
          // validado contra DXF de referência): cada barra é uma reta do canto livre oposto até
          // sua ponta no arco da última camada, fornecendo Nr ramos (1 por camada cruzada).
          // O C'' aqui É afetado pelo nº de barras (confirmado pelo usuário): com poucas barras,
          // sobra um vão de cada lado (entre a barra mais externa e a face do pilar) que precisa
          // do MESMO corte em cunha do redondo — mais barras fecham esse vão. Por isso, igual ao
          // redondo, testa aumentar o nº de barras (até o máximo) antes de aceitar que precisa
          // subir Nr.
          // Nº máximo de barras = comprimento do arco de 90° da última camada dividido por d
          // (não 2d — o espaçamento aqui é por corda d entre pontas, confirmado pelo usuário),
          // arredondado pra BAIXO (floor) — confirmado com exemplo numérico do usuário
          // (130/15,13=8,59 → máximo 8, não 9). Diferente do redondo (que usa ceil, já confirmado
          // antes) — aqui é mais conservador: não força uma barra a mais que não cabe de verdade
          // respeitando o espaçamento mínimo d.
          const RCanto = extensaoUltimaCamada;
          nBarrasRadialMax = Math.floor(((Math.PI / 2) * extensaoUltimaCamada) / d);
          nBarrasRadial = Math.min(Math.ceil(ramosNecessarios / Nr), nBarrasRadialMax);
          AswEfetiva = nBarrasRadial * Nr * BIT(inp.diamEstribo);
          final = calcPuncao({ ...inp, AsX, AsY, d, Sr, Nr, AswInput: AswEfetiva });

          const passoTeste = 2 * Math.asin(Math.min(1, d / (2 * RCanto)));
          const angCentralTeste = (5 * Math.PI) / 4;
          const RcllTeste = 2 * d + extensaoUltimaCamada;
          for (let nTeste = nBarrasRadial; nTeste <= nBarrasRadialMax; nTeste++) {
            const angs = Array.from({ length: nTeste }, (_, i) => angCentralTeste + (i - (nTeste - 1) / 2) * passoTeste);
            const cInf = corteEntreDoisAngulos(Math.PI, Math.min(...angs), RCanto, RcllTeste, d);
            const cSup = corteEntreDoisAngulos(Math.max(...angs), (3 * Math.PI) / 2, RCanto, RcllTeste, d);
            const excluido = [cInf, cSup].filter(Boolean).reduce((s, c) => s + c.excluido, 0);
            const u_l_teste = Math.max(0.1, (Math.PI / 2) * RcllTeste - excluido);
            const tau_teste =
              ((inp.Fk / u_l_teste / d) + (100 * final.Msxl * final.Kx) / (final.Wpxl * d) + (100 * final.Msyl * final.Ky) / (final.Wpyl * d)) *
              inp.gamaf *
              1000;
            nBarrasRadial = nTeste;
            if (tau_teste <= final.tauRd1) break;
          }
          AswEfetiva = nBarrasRadial * Nr * BIT(inp.diamEstribo);
          final = calcPuncao({ ...inp, AsX, AsY, d, Sr, Nr, AswInput: AswEfetiva });
        } else if (temArmadura && ehRadial) {
          // Padrão RADIAL (armadura em "cobra", validado contra DXF de referência): cada barra
          // fornece Nr ramos de estribo (1 por segmento vertical/camada) — não usa porta-estribo
          // + estribo fechado separados. Nº de barras = ceil(ramos necessários / Nr), com um
          // MÍNIMO de 8 barras (confirmado pelo usuário — poucas barras deixam o corte da cunha
          // entre elas exagerado, derrubando o C'' ajustado sem necessidade real), limitado pelo
          // nº máximo que cabe fisicamente ao redor do pilar: comprimento de arco da última
          // camada dividido por 2d, arredondado pra cima — confirmado pelo usuário.
          const R = inp.diametro / 2;
          const MIN_BARRAS_RADIAL = 8;
          nBarrasRadialMax = Math.ceil((2 * Math.PI * (R + extensaoUltimaCamada)) / (2 * d));
          const nBarrasNecessarias = Math.max(MIN_BARRAS_RADIAL, Math.ceil(ramosNecessarios / Nr));
          nBarrasRadial = Math.min(nBarrasNecessarias, nBarrasRadialMax);
          AswEfetiva = nBarrasRadial * Nr * BIT(inp.diamEstribo);
          final = calcPuncao({ ...inp, AsX, AsY, d, Sr, Nr, AswInput: AswEfetiva });

          // Antes de aceitar que precisa subir Nr (mais camadas), tenta primeiro aumentar o nº de
          // barras (até o máximo que cabe fisicamente) — mais barras reduzem o corte da cunha entre
          // elas, aumentando o C'' ajustado, o que pode já resolver sem precisar de mais camadas.
          // Confirmado pelo usuário: distribuir mais barras primeiro, só sobe Nr se nem o máximo
          // de barras resolver.
          for (let nTeste = nBarrasRadial; nTeste <= nBarrasRadialMax; nTeste++) {
            const desconto = descontoCantosCircular(d, extensaoUltimaCamada, 0, R, nTeste);
            const u_l_teste = Math.max(0.1, 2 * Math.PI * desconto.Rcll - desconto.totalExcluido);
            const tau_teste =
              ((inp.Fk / u_l_teste / d) + (100 * final.Msxl * final.Kx) / (final.Wpxl * d) + (100 * final.Msyl * final.Ky) / (final.Wpyl * d)) *
              inp.gamaf *
              1000;
            nBarrasRadial = nTeste;
            if (tau_teste <= final.tauRd1) break; // já resolveu com esse nº de barras — pára aqui
          }
          AswEfetiva = nBarrasRadial * Nr * BIT(inp.diamEstribo);
          final = calcPuncao({ ...inp, AsX, AsY, d, Sr, Nr, AswInput: AswEfetiva });
        } else if (temArmadura) {
          const estribosNecessarios = Math.ceil(ramosNecessarios / 2); // 1 estribo = 2 ramos
          gruposMaiorAuto = 1;
          // Nº de pares do sentido maior pode ser definido manualmente também (mesma lógica do
          // menor abaixo) — normalmente fica sempre em 1 (par único centralizado), mas pode ser
          // forçado pra bater com um projeto já detalhado. Nunca desce abaixo de 1.
          gruposMaior = inp.gruposMaiorManual ? Math.max(1, inp.gruposMaiorManual) : gruposMaiorAuto;
          const gruposMenorAutoCalc = Math.max(1, Math.ceil((estribosNecessarios - ladosMaior * gruposMaior) / ladosMenor));
          gruposMenorAuto = gruposMenorAutoCalc;
          // Nº de pares do sentido menor pode ser definido manualmente (ex.: pra bater com um projeto
          // já detalhado) — se informado, usa esse valor em vez do automático. Nunca desce abaixo de 1.
          gruposMenor = inp.gruposMenorManual ? Math.max(1, inp.gruposMenorManual) : gruposMenorAutoCalc;
          nGruposTotal = gruposMenor + gruposMaior;
          estribosFornecidos = ladosMaior * gruposMaior + ladosMenor * gruposMenor;
          ramosFornecidos = estribosFornecidos * 2;
          // Ramos fornecidos podem exceder o exigido (arredondamento pro piso mínimo de pares) —
          // recalcula a Asw efetiva real que vai ser verificada no contorno C' com armadura.
          AswEfetiva = ramosFornecidos * BIT(inp.diamEstribo);

          comprMenorSentido = Math.round(menorDim + ladosMenor * extensaoPorLado);
          comprMaiorSentido = Math.round(maiorDim + ladosMaior * extensaoPorLado);

          // Largura do próprio estribo: 2d por padrão, exceto quando o sentido precisa de mais de 1
          // par (nesse caso 1d — validado ponto a ponto contra DXF pro menor; mesma regra aplicada
          // ao maior por consistência). Pode ser sobrescrita manualmente por sentido (X e Y
          // independentes) — ex.: pra bater com um projeto já detalhado que usa d em vez de 2d num
          // sentido específico. Calculada ANTES do posicionamento dos pares porque o espaçamento
          // entre eles depende do valor final da largura (ver abaixo).
          const larguraEstriboMenorAuto = gruposMenor > 1 ? Math.floor(d * 2) / 2 : Math.floor(2 * d * 2) / 2;
          const larguraEstriboMaiorAuto = gruposMaior > 1 ? Math.floor(d * 2) / 2 : Math.floor(2 * d * 2) / 2;
          const larguraXManual = inp.larguraEstriboXManual === 1 ? d : inp.larguraEstriboXManual === 2 ? 2 * d : null;
          const larguraYManual = inp.larguraEstriboYManual === 1 ? d : inp.larguraEstriboYManual === 2 ? 2 * d : null;
          larguraEstriboX = larguraXManual != null ? larguraXManual : menorEhX ? larguraEstriboMenorAuto : larguraEstriboMaiorAuto;
          larguraEstriboY = larguraYManual != null ? larguraYManual : menorEhX ? larguraEstriboMaiorAuto : larguraEstriboMenorAuto;
          larguraEstriboMenor = menorEhX ? larguraEstriboX : larguraEstriboY;
          larguraEstriboMaior = menorEhX ? larguraEstriboY : larguraEstriboX;

          // Pares do sentido menor: quando só 1 par, fica centralizado. Quando precisa de mais de 1
          // par, ficam centrados em múltiplos de 2×larguraEstriboMenor ao longo do eixo maior —
          // validado ponto a ponto contra DXF de referência (2 e 3 pares, largura automática = d,
          // logo espaçamento = 2d nesse caso — bate com a fórmula antiga usada até então). Usar a
          // largura real (em vez de sempre "2*d") faz o espaçamento acompanhar quando a largura é
          // forçada manualmente pra um valor diferente do automático — confirmado pelo usuário
          // (espaçamento = 2× a largura do estribo, sempre).
          posicoesMenor =
            gruposMenor === 1
              ? [maiorDim / 2]
              : Array.from(
                  { length: gruposMenor },
                  (_, i) => maiorDim / 2 + (i - (gruposMenor - 1) / 2) * 2 * larguraEstriboMenor
                );
          // Pares do sentido maior: mesma regra do menor acima (nenhum par fica "fixo" quando há
          // mais de 1 — todos se distribuem simetricamente em múltiplos de 2×larguraEstriboMaior).
          // Confirmado pelo usuário (não é "1 fixo no centro + extras ao redor" como pareceu num
          // teste inicial desenhado à mão no S4CAD — ver memória do projeto).
          posicoesMaior =
            gruposMaior === 1
              ? [menorDim / 2]
              : Array.from(
                  { length: gruposMaior },
                  (_, i) => menorDim / 2 + (i - (gruposMaior - 1) / 2) * 2 * larguraEstriboMaior
                );

          // Quando o par do sentido maior (largura larguraEstriboMaior) não cabe centralizado na dimensão apertada do
          // sentido da face livre (pilar de borda ou canto) — o par inteiro desliza pra longe da face
          // livre, de modo que a linha mais próxima dela fique exatamente a cobrimento + 2,5cm (maior
          // bitola tipicamente detalhada num pilar) de distância — dentro do pilar de verdade. A linha
          // mais distante (a 2d dali) pode se estender além do próprio pilar — normal, pois do OUTRO
          // lado (sem face livre) sempre tem laje ali. Só conta no colapso progressivo a linha que de
          // fato atravessa o CONCRETO do pilar (cai dentro de [0,menorDim]).
          // Cuidado com a orientação: "pos=0" corresponde à face livre no eixo Y (topo, +Y — fixo pros
          // 2 tipos), mas corresponde ao lado SEM face livre no eixo X (já que a face livre do X é
          // +X, que fica em pos=menorDim, não pos=0) — por isso a fórmula inverte conforme menorEhX.
          // Validado ponto a ponto contra 2 DXFs de referência (borda: eixo Y, próxima=5,5/distante=
          // 35,5; canto: eixo X, próxima=19,5/distante=-10,5 em pos, batendo com 7,0/-23,0 absolutos).
          maiorGrupoReposicionado = false;
          maiorLinhasDentro = 2;
          if ((inp.tipoPilar === "B" || inp.tipoPilar === "C") && larguraEstriboMaior > menorDim) {
            const distanciaFaceLivre = inp.cobrimento + MAIOR_BITOLA_PILAR_CM;
            let linhaProxima, linhaDistante;
            if (menorEhX) {
              // posicoesMaior nesse caso é posição no eixo X; face livre do X fica em pos=menorDim
              linhaProxima = menorDim - distanciaFaceLivre;
              linhaDistante = linhaProxima - larguraEstriboMaior;
            } else {
              // posicoesMaior nesse caso é posição no eixo Y; face livre do Y fica em pos=0
              linhaProxima = distanciaFaceLivre;
              linhaDistante = linhaProxima + larguraEstriboMaior;
            }
            posicoesMaior = [(linhaProxima + linhaDistante) / 2];
            maiorGrupoReposicionado = true;
            maiorLinhasDentro =
              (linhaProxima >= -0.01 && linhaProxima <= menorDim + 0.01 ? 1 : 0) +
              (linhaDistante >= -0.01 && linhaDistante <= menorDim + 0.01 ? 1 : 0);
          }

          // Mesma situação pro par do sentido MENOR — só existe no pilar de CANTO, já que é o único
          // tipo onde o eixo do sentido menor TAMBÉM tem face livre (no de borda, o sentido menor é
          // sempre o eixo Y fixo, que já é tratado acima como "maior" quando é o caso de precisar
          // deslocar — o eixo do menor em B nunca tem face livre). Só tratado aqui o caso de 1 par
          // único (gruposMenor>1 distribuídos ao longo do eixo maior fica pra outra hora, se precisar).
          menorGrupoReposicionado = false;
          menorLinhasDentro = 2;
          if (inp.tipoPilar === "C" && gruposMenor === 1 && larguraEstriboMenor > maiorDim) {
            const distanciaFaceLivre = inp.cobrimento + MAIOR_BITOLA_PILAR_CM;
            let linhaProxima, linhaDistante;
            if (menorEhX) {
              // posicoesMenor nesse caso é posição no eixo Y; face livre do Y fica em pos=0
              linhaProxima = distanciaFaceLivre;
              linhaDistante = linhaProxima + larguraEstriboMenor;
            } else {
              // posicoesMenor nesse caso é posição no eixo X; face livre do X fica em pos=maiorDim
              linhaProxima = maiorDim - distanciaFaceLivre;
              linhaDistante = linhaProxima - larguraEstriboMenor;
            }
            posicoesMenor = [(linhaProxima + linhaDistante) / 2];
            menorGrupoReposicionado = true;
            menorLinhasDentro =
              (linhaProxima >= -0.01 && linhaProxima <= maiorDim + 0.01 ? 1 : 0) +
              (linhaDistante >= -0.01 && linhaDistante <= maiorDim + 0.01 ? 1 : 0);
          }

          // O porta-estribo (superior e inferior) que atravessa o pilar precisa ter comprimento
          // suficiente pra ancoragem do colapso progressivo. Quando o sentido tem os 2 lados (lados=2,
          // sempre com laje nas 2 pontas), usa o mínimo simétrico de sempre: dimensão + 4d + 2×lb,nec
          // (ancoragem reta nas 2 pontas) — aplicado incondicionalmente, mesmo quando o par foi
          // reposicionado (confirmado pelo usuário com arquivo real de borda: o reposicionamento só
          // move a POSIÇÃO do par pra longe da face livre, não isenta a barra da ancoragem normal do
          // lado oposto). Quando o sentido tem só 1 lado (lados=1 — face livre em borda/canto), a barra
          // para exatamente na face livre sem ancoragem ali, então o comprimento é menor: só uma
          // ancoragem (2d+lb,nec) do lado com laje, mais a dimensão do pilar até 1 cobrimento da face
          // livre (não a dimensão inteira) — fórmula e regra confirmadas pelo usuário com arquivo real
          // de borda 1/2/3 pares (C=96 pro sentido Y/lados=1, constante nos 3 arquivos).
          const lbNecPortaInf = lbBasico(inp.diamPortaInferior, inp.fck, inp.gamac);
          // ACHADO 2026-09-16 (arquivo real ap=80/bp=25, Nr=7 — usuário aumentou a barra do
          // porta-estribo à mão e explicou a regra): quando há MUITAS camadas (Nr grande), a
          // ancoragem reta (2d+lb,nec) deixa de ser o fator que governa — a barra precisa chegar
          // até a ÚLTIMA camada de estribo, não só até uma ancoragem mínima. Regra do usuário:
          // dimensão - cobrimento + distância da última camada (extensaoUltimaCamada) + 5cm de
          // folga. Usa o MAIOR dos 2 (mesmo padrão já usado no lados=2, "Math.max" — preserva o
          // C=96 já confirmado em real S4CAD pro caso Nr=3, onde a ancoragem reta ainda governa).
          const comprPortaEstriboMenorNr = Math.round(menorDim - inp.cobrimento + extensaoPorLado);
          const comprPortaEstriboMaiorNr = Math.round(maiorDim - inp.cobrimento + extensaoPorLado);
          comprMenorSentido =
            ladosMenor === 1
              ? Math.max(Math.round(2 * d + lbNecPortaInf + menorDim - inp.cobrimento), comprPortaEstriboMenorNr)
              : Math.max(comprMenorSentido, Math.round(menorDim + 4 * d + 2 * lbNecPortaInf));
          comprMaiorSentido =
            ladosMaior === 1
              ? Math.max(Math.round(2 * d + lbNecPortaInf + maiorDim - inp.cobrimento), comprPortaEstriboMaiorNr)
              : Math.max(comprMaiorSentido, Math.round(maiorDim + 4 * d + 2 * lbNecPortaInf));

          final = calcPuncao({ ...inp, AsX, AsY, d, Sr, Nr, AswInput: AswEfetiva });
        } else {
          // Sem armadura: ainda assim calcula a largura "hipotética" (2d, respeitando o override
          // manual por sentido se houver) — usada só de forma informativa/estimada, já que sem
          // camadas não há par de verdade a desenhar.
          const larguraXManual = inp.larguraEstriboXManual === 1 ? d : inp.larguraEstriboXManual === 2 ? 2 * d : null;
          const larguraYManual = inp.larguraEstriboYManual === 1 ? d : inp.larguraEstriboYManual === 2 ? 2 * d : null;
          larguraEstriboX = larguraXManual != null ? larguraXManual : Math.floor(2 * d * 2) / 2;
          larguraEstriboY = larguraYManual != null ? larguraYManual : Math.floor(2 * d * 2) / 2;
          larguraEstriboMenor = menorEhX ? larguraEstriboX : larguraEstriboY;
          larguraEstriboMaior = menorEhX ? larguraEstriboY : larguraEstriboX;
        }

        comprimentoEstriboY = larguraEstriboY > 0 ? Math.ceil(2 * (alturaEstriboY + larguraEstriboY)) : null;
        comprimentoEstriboX = larguraEstriboX > 0 ? Math.ceil(2 * (alturaEstriboX + larguraEstriboX)) : null;

        // Corte no contorno C'' pela armadura em cruz (não cobre a diagonal/canto) — pra todos os
        // tipos de pilar com armadura efetivamente colocada (central: 4 cantos; borda: 2 cantos do
        // lado com laje; canto: 1 único canto com laje). Construção validada contra DXFs de
        // referência (central e borda). Gera uma versão AJUSTADA de u_l/tau_Cll/atendeCll — a
        // original (sem o corte) continua disponível em final.u_l/tau_Cll/okCll pra comparação.
        u_l_ajustado = null;
        tau_Cll_ajustado = null;
        atendeCll_ajustado = null;
        cortesCll = null;
        if (temArmadura && ehRadialCantoRet) {
          // Canto radial retangular: C'' é um arco de 90° — CHEIO só quando há barras suficientes
          // pra cobrir até perto das faces do pilar (180°/270°). Com poucas barras, sobra um vão
          // de cada lado (entre a barra mais externa e a face) que precisa do MESMO corte em
          // cunha do redondo (perpendicular + círculo raio d) — confirmado pelo usuário: "se for
          // 1 barra só, estende a linha até o C'' e traça arco raio d, fazendo o corte" — mais
          // barras fecham esse vão (ficam a uma corda d uma da outra, então o corte desaparece
          // quando o leque já cobre até perto das faces).
          const NCanto = Math.max(1, nBarrasRadial);
          const passoCanto = 2 * Math.asin(Math.min(1, d / (2 * extensaoUltimaCamada)));
          const angCentralCanto = (5 * Math.PI) / 4;
          const angulosCanto = Array.from({ length: NCanto }, (_, i) => angCentralCanto + (i - (NCanto - 1) / 2) * passoCanto);
          const angMin = Math.min(...angulosCanto), angMax = Math.max(...angulosCanto);
          const RcllCanto = 2 * d + extensaoUltimaCamada;

          const corteInf = corteEntreDoisAngulos(Math.PI, angMin, extensaoUltimaCamada, RcllCanto, d);
          const corteSup = corteEntreDoisAngulos(angMax, (3 * Math.PI) / 2, extensaoUltimaCamada, RcllCanto, d);
          cortesCll = [corteInf, corteSup].filter(Boolean).map(({ cortA, cortB }) => ({ cortA, cortB }));
          const excluidoCanto = [corteInf, corteSup].filter(Boolean).reduce((s, c) => s + c.excluido, 0);

          u_l_ajustado = Math.max(0.1, (Math.PI / 2) * RcllCanto - excluidoCanto);
          tau_Cll_ajustado =
            ((inp.Fk / u_l_ajustado / d) + (100 * final.Msxl * final.Kx) / (final.Wpxl * d) + (100 * final.Msyl * final.Ky) / (final.Wpyl * d)) *
            inp.gamaf *
            1000;
          atendeCll_ajustado = tau_Cll_ajustado <= final.tauRd1;
        } else if (temArmadura && inp.formaCircular) {
          // Pilar circular: CRUZ usa largura de braço 2d (1 par por braço, sempre 4 braços nos
          // eixos) — RADIAL usa largura 0 (cada barra é 1 ponto, sem largura própria) e o número
          // real de braços (nBarrasRadial), não fixo em 4. Corte da cunha com geometria circular
          // própria, generalizada pra N braços — validado ponto a ponto contra DXF (cruz N=4,
          // radial N=8 e N=12).
          const meiaLarguraCircular = ehRadial ? 0 : larguraEstriboMenor / 2;
          const nBracosCircular = ehRadial ? Math.max(1, nBarrasRadial) : 4;
          const desconto = descontoCantosCircular(d, extensaoUltimaCamada, meiaLarguraCircular, inp.diametro / 2, nBracosCircular);
          cortesCll = desconto.cortes;

          // Furo na laje (pilar circular): sombra angular própria (min/max ângulo dos 4 cantos do
          // furo, visto do centro) — validado contra DXF. Mescla com os vãos da cunha quando se
          // sobrepõem (evita contar a sobreposição 2x) — confirmado no DXF: a sombra do furo
          // "engoliu" parte do vão da cunha de um dos braços, virando um vão único maior.
          // Vãos angulares de cada corte da cunha, escolhendo sempre o caminho MAIS CURTO entre os
          // 2 ângulos (evita o bug de considerar o vão "por fora", passando por ±180°, quando os
          // 2 pontos do corte caem em lados opostos dessa descontinuidade do atan2 — isso fazia um
          // vão pequeno de ~20° virar um vão enorme de ~340° por engano, só pra certos números de
          // barra específicos onde a rotação fazia um corte cair perto dessa linha).
          const anguloCurto = (angA, angB) => {
            let diff = angB - angA;
            while (diff > Math.PI) diff -= 2 * Math.PI;
            while (diff < -Math.PI) diff += 2 * Math.PI;
            return diff >= 0 ? [angA, angA + diff] : [angB, angB - diff];
          };
          let intervalosAngulares = cortesCll.map(({ cortA, cortB }) => {
            const a = Math.atan2(cortA[1], cortA[0]), b = Math.atan2(cortB[1], cortB[0]);
            return anguloCurto(a, b);
          });
          let furoCircular = { dentroDoLimite: false };
          if (inp.furoAtivo && inp.furoLargura > 0 && inp.furoAltura > 0) {
            const RllBase = desconto.Rcll;
            furoCircular = reducaoPorFuroCircular(inp.furoX, inp.furoY, inp.furoLargura, inp.furoAltura, inp.diametro / 2, d, RllBase);
            if (furoCircular.dentroDoLimite) intervalosAngulares.push([furoCircular.thetaLo, furoCircular.thetaHi]);
          }
          intervalosAngulares.sort((a, b) => a[0] - b[0]);
          const intervalosMesclados = [];
          let atual = null;
          for (const [ini, fim] of intervalosAngulares) {
            if (!atual) atual = [ini, fim];
            else if (ini <= atual[1]) atual[1] = Math.max(atual[1], fim);
            else {
              intervalosMesclados.push(atual);
              atual = [ini, fim];
            }
          }
          if (atual) intervalosMesclados.push(atual);
          const anguloExcluidoTotal = intervalosMesclados.reduce((soma, [ini, fim]) => soma + (fim - ini), 0);

          // Reconverte os intervalos MESCLADOS (cunha + furo, já unidos onde se sobrepõem) de volta
          // pra pontos — usado tanto no desenho (ContornosDiagram) quanto como resultado exposto.
          // Sem isso, o desenho só mostraria os vãos da cunha, sem refletir a sombra do furo
          // quando ela se funde com um vão existente.
          cortesCll = intervalosMesclados.map(([ini, fim]) => ({
            cortA: [desconto.Rcll * Math.cos(ini), desconto.Rcll * Math.sin(ini)],
            cortB: [desconto.Rcll * Math.cos(fim), desconto.Rcll * Math.sin(fim)],
          }));
          RcllCircular = desconto.Rcll;

          u_l_ajustado = Math.max(0.1, 2 * Math.PI * desconto.Rcll - anguloExcluidoTotal * desconto.Rcll);
          tau_Cll_ajustado =
            ((inp.Fk / u_l_ajustado / d) + (100 * final.Msxl * final.Kx) / (final.Wpxl * d) + (100 * final.Msyl * final.Ky) / (final.Wpyl * d)) *
            inp.gamaf *
            1000;
          atendeCll_ajustado = tau_Cll_ajustado <= final.tauRd1;
        } else if (temArmadura) {
          const posicoesMenorRel = posicoesMenor.map((pp) => pp - maiorDim / 2);
          // Quando o par maior foi deslocado (borda/canto apertado), a ponta do braço maior usada
          // na construção do corte é a da linha mais DISTANTE da face livre (é ela que de fato
          // define o alcance real da armadura ali) — não mais a posição centralizada. Convertida de
          // volta pra coordenada absoluta (relativa ao centro do pilar), invertendo o mesmo if/else
          // de orientação usado ao montar posicoesMaior.
          let maiorPosAbsOverride = null;
          if (maiorGrupoReposicionado) {
            const farPos = menorEhX ? posicoesMaior[0] - d : posicoesMaior[0] + d;
            maiorPosAbsOverride = menorEhX ? -menorDim / 2 + farPos : menorDim / 2 - farPos;
          }
          const desconto = descontoCantosCll(
            inp.tipoPilar, inp.ap, inp.bp, d, final.p, menorEhX, extensaoUltimaCamada,
            larguraEstriboMenor, larguraEstriboMaior, posicoesMenorRel, maiorPosAbsOverride
          );
          cortesCll = desconto.cortes;

          // Mescla o(s) vão(s) da cunha com o vão do furo (se houver e se sobrepuserem) por
          // POSIÇÃO ao longo do perímetro real, usando a mesma função já validada (intervaloDeFuro)
          // que escolhe o caminho mais curto — evita subtrair furo+cunha em separado, o que
          // subestimaria u_l_ajustado contando a sobreposição 2x quando os vãos coincidem.
          const hwL = inp.ap / 2, hhL = inp.bp / 2, rpL = 2 * d + final.p;
          let intervalosPosicao = cortesCll
            .map(({ cortA, cortB }) => intervaloDeFuro(cortA, cortB, hwL, hhL, rpL))
            .filter(Boolean);
          if (final.furo && final.furo.dentroDoLimite && final.furo.ptCll_lo && final.furo.ptCll_hi) {
            const ivFuro = intervaloDeFuro(final.furo.ptCll_lo, final.furo.ptCll_hi, hwL, hhL, rpL);
            if (ivFuro) intervalosPosicao.push(ivFuro);
          }
          intervalosPosicao.sort((a, b) => a[0] - b[0]);
          const posMescladas = [];
          let posAtual = null;
          for (const [ini, fim] of intervalosPosicao) {
            if (!posAtual) posAtual = [ini, fim];
            else if (ini <= posAtual[1]) posAtual[1] = Math.max(posAtual[1], fim);
            else {
              posMescladas.push(posAtual);
              posAtual = [ini, fim];
            }
          }
          if (posAtual) posMescladas.push(posAtual);
          const excluidoMesclado = posMescladas.reduce((soma, [ini, fim]) => soma + (fim - ini), 0);

          u_l_ajustado = Math.max(0.1, final.u_l_bruto - excluidoMesclado);
          tau_Cll_ajustado =
            ((inp.Fk / u_l_ajustado / d) + (100 * final.Msxl * final.Kx) / (final.Wpxl * d) + (100 * final.Msyl * final.Ky) / (final.Wpyl * d)) *
            inp.gamaf *
            1000;
          atendeCll_ajustado = tau_Cll_ajustado <= final.tauRd1;
        }

        // Exige o C'' ajustado sempre que ele de fato existe (qualquer tipo de pilar com armadura e
        // cunha calculada) — nos demais casos, o critério de parada continua sendo só o C'' original.
        // Pro radial, TAMBÉM exige que o nº de barras necessárias caiba no máximo físico (senão,
        // mesmo que o τ do C'' passasse, faltaria capacidade de fato) — confirmado pelo usuário.
        const capacidadeRadialOk = !ehRadial || nBarrasRadial * Nr >= ramosNecessarios;
        atende = temArmadura && u_l_ajustado !== null ? final.okCll && atendeCll_ajustado && capacidadeRadialOk : final.okCll;
        if (!atende) {
          // radial: sempre par (4,6,8...) — a barra "cobra" apoia no fundo da laje pela ponta
          // horizontal; com Nr ímpar essa ponta ficaria em cima, errado.
          const incremento = ehRadial ? 2 : 1;
          // Se o PRÓXIMO Nr passaria do máximo testado, não incrementa — sai do loop mantendo Nr
          // no último valor REALMENTE calculado (senão o Nr reportado ficava maior que o usado de
          // fato em final/tau_Cll_ajustado, mostrando um valor que nunca foi testado de verdade).
          if (Nr + incremento > NR_MAX_TESTADO) break;
          Nr += incremento;
        }
      }
      const atendeCll = final.okCll;

      // Porta-estribos: total de barras inferiores = 2 por grupo × nº de grupos.
      // Bitola inferior é definida pelo usuário (10/12.5/16/20) — só essas barras entram no colapso
      // progressivo; se não bastarem, calcula o complemento (barras extras) por bitola candidata.
      // Duas checagens de "a barra passa mesmo pelo pilar":
      // 1) largura do par (2d, ou 1d quando gruposMenor>1) maior que a dimensão perpendicular a ele
      //    → as 2 linhas paralelas do porta-estribo não cabem dentro do pilar nesse sentido.
      // 2) quando há vários pares no sentido menor (distribuídos ao longo do eixo maior), os mais
      //    externos podem ficar posicionados ALÉM da extensão do próprio pilar no sentido maior —
      //    mesmo cabendo em largura, não atravessam concreto ali, então também não contam.
      const parMenorCabe = larguraEstriboMenor <= maiorDim;
      // maiorLinhasDentro (0, 1 ou 2) já foi calculado no bloco de posicionamento acima: quantas das 2
      // linhas do par do sentido maior de fato atravessam o concreto do pilar (caem dentro de
      // [0,menorDim]) — normal = 2; quando o par precisa deslizar pra longe da face livre, a linha mais
      // distante pode acabar fora do pilar (real, existe na laje, mas não passa POR ESSE pilar), então
      // só a mais próxima conta.
      const gruposMenorDentro = posicoesMenor.filter((pos) => pos >= -0.01 && pos <= maiorDim + 0.01).length;
      let totalBarrasPorFace = 0;
      let barrasExcluidasLargura = 0;
      let barrasExcluidasPosicao = 0;
      let AsPortaInferior = null;
      let AsFaltanteColapso = null;
      let complementoColapso = [];
      if (temArmadura) {
        const barrasMenor = menorGrupoReposicionado ? menorLinhasDentro : parMenorCabe ? gruposMenorDentro * 2 : 0;
        const barrasMaior = gruposMaior * maiorLinhasDentro;
        totalBarrasPorFace = barrasMenor + barrasMaior;
        barrasExcluidasPosicao = parMenorCabe ? (gruposMenor - gruposMenorDentro) * 2 : 0;
        barrasExcluidasLargura = nGruposTotal * 2 - totalBarrasPorFace - barrasExcluidasPosicao;
        AsPortaInferior = totalBarrasPorFace * BIT(inp.diamPortaInferior);
        AsFaltanteColapso = Math.max(0, final.AsTotal - AsPortaInferior);
        const dimXc = inp.formaCircular ? inp.diametro : inp.ap;
        const dimYc = inp.formaCircular ? inp.diametro : inp.bp;
        complementoColapso = DIAMS_COL.map((dm) => {
          const div = BIT(dm) * (dm === 10 ? 1 : 2);
          const lbNec = lbBasico(dm, inp.fck, inp.gamac);
          return {
            diam: dm,
            n: AsFaltanteColapso > 0 ? Math.ceil(AsFaltanteColapso / div) : 0,
            lbNec,
            comprimentoMinX: dimXc + 4 * d + 2 * lbNec,
            comprimentoMinY: dimYc + 4 * d + 2 * lbNec,
          };
        });
      }

      return {
        ...final, AswEfetiva, ramosNecessarios, Sr, d, AsX, AsY, primeiraCamada,
        AswObrigatoriaTotal, estribosTotalDemanda, pisoEstribosTotal, estribosTotalFinal,
        diamPortaInferior: inp.diamPortaInferior, AsPortaInferior, totalBarrasPorFace, barrasExcluidasLargura, barrasExcluidasPosicao,
        AsFaltanteColapso, complementoColapso,
        gruposMenor, gruposMaior, nGruposTotal, estribosFornecidos, ramosFornecidos, gruposMenorAuto, gruposMaiorAuto, menorEhX, ladosMenor, ladosMaior, Nr, atendeCll, maiorGrupoReposicionado, maiorLinhasDentro, menorGrupoReposicionado, menorDim, nBarrasRadial, nBarrasRadialMax, ehRadial, RcllCircular,
        temArmadura, origemArmadura,
        comprMenorSentido, comprMaiorSentido, posicoesMenor, posicoesMaior,
        alturaEstriboY, alturaEstriboX, larguraEstriboX, larguraEstriboY, comprimentoEstriboY, comprimentoEstriboX,
        u_l_ajustado, tau_Cll_ajustado, atendeCll_ajustado, cortesCll,
      };
    } catch {
      return null;
    }
  }, [inp]);

  const espacamentoMax = r ? 0.75 * r.d : 0;

  return (
    <div className="wrap">
      <style>{css}</style>
      <div className="topbar no-print" />

      <header className="hero">
        <div className="hero-brand-block">
          <div className="hero-brand">
            <span>REIC</span><span>AL</span>
          </div>
          <div className="hero-brand-sub">PROJETOS ESTRUTURAIS<br />E FUNDAÇÕES</div>
        </div>
        <div className="hero-main">
          <div className="hero-eyebrow">Memorial de Cálculo</div>
          <h1>Verificação à Punção — Pilar {inp.nome || "—"}</h1>
          <p className="hero-sub">NBR 6118 · contornos C, C&apos; e C&apos;&apos; · colapso progressivo</p>
        </div>
      </header>

      <div className="summary-bar">
        <div className="summary-item"><span className="k">b×h</span><span className="v">{inp.ap}×{inp.bp}cm</span></div>
        <div className="summary-item"><span className="k">Tipo</span><span className="v">{inp.tipoPilar}</span></div>
        <div className="summary-item"><span className="k">Fck</span><span className="v">{inp.fck}MPa</span></div>
        <div className="summary-item"><span className="k">Fk</span><span className="v">{inp.Fk}tf</span></div>
        <div className="summary-item"><span className="k">Mk,x</span><span className="v">{inp.Mkx}tf·m</span></div>
        <div className="summary-item"><span className="k">Mk,y</span><span className="v">{inp.Mky}tf·m</span></div>
        <div className="summary-item"><span className="k">Nr</span><span className="v">{r ? r.Nr : "—"}</span></div>
        <div className="summary-item"><span className="k">d</span><span className="v">{r ? fmt(r.d, 1) : "—"}cm</span></div>
      </div>

      <div className="content">
      <div className="grid no-print">
        {/* ---------------- COLUNA DE ENTRADA ---------------- */}
        <section className="panel">
          <div className="section-title">
            <span className="section-num">1</span>
            <h2>Dados de entrada</h2>
          </div>
          <h2>Dados do pilar</h2>
          <div className="field-grid">
            <label className="field">
              <span className="field-label">Identificação</span>
              <input type="text" value={inp.nome} onChange={(e) => set("nome")(e.target.value)} />
            </label>
            <SelectField
              label="Posição do pilar"
              value={inp.tipoPilar}
              onChange={(v) =>
                setInp((prev) => ({
                  ...prev,
                  tipoPilar: v,
                  formaCircular: v === "I" ? prev.formaCircular : false,
                  padraoArmadura: v === "C" ? "radial" : prev.tipoPilar === "C" ? "cruz" : prev.padraoArmadura,
                }))
              }
              options={[
                { value: "I", label: "I — Interno" },
                { value: "B", label: "B — Borda" },
                { value: "C", label: "C — Canto" },
              ]}
            />
            {inp.tipoPilar === "I" && (
              <h2 className="shape-toggle-title" onClick={() => setFormaCircular(!inp.formaCircular)} title="Clique pra alternar entre seção retangular e circular">
                {inp.formaCircular ? "Circular ⬤" : "Retangular ▭"}
              </h2>
            )}
            {inp.formaCircular && inp.tipoPilar === "I" ? (
              <h2
                className="shape-toggle-title"
                onClick={() => set("padraoArmadura")(inp.padraoArmadura === "cruz" ? "radial" : "cruz")}
                title="Clique pra alternar entre armadura em cruz e radial"
              >
                {inp.padraoArmadura === "radial" ? "Radial ✳" : "Em cruz ✚"}
              </h2>
            ) : null}
            <NumberField label="h (espessura)" value={inp.h} onChange={set("h")} unit="cm" />
            {inp.formaCircular && inp.tipoPilar === "I" ? (
              <NumberField label="Diâmetro" value={inp.diametro} onChange={setDiametro} unit="cm" />
            ) : inp.tipoPilar === "I" ? (
              <NumberField label="b (dir. X)" value={inp.ap} onChange={set("ap")} unit="cm" />
            ) : (
              <NumberField label="Cobrimento" value={inp.cobrimento} onChange={set("cobrimento")} unit="cm" step="0.1" />
            )}
            {!inp.formaCircular && inp.tipoPilar === "I" && (
              <NumberField label="h (dir. Y)" value={inp.bp} onChange={set("bp")} unit="cm" />
            )}
            {inp.tipoPilar !== "I" && (
              <>
                <NumberField label="b (dir. X)" value={inp.ap} onChange={set("ap")} unit="cm" />
                <NumberField label="h (dir. Y)" value={inp.bp} onChange={set("bp")} unit="cm" />
              </>
            )}
            {inp.tipoPilar === "I" && (
              <NumberField label="Cobrimento" value={inp.cobrimento} onChange={set("cobrimento")} unit="cm" step="0.1" />
            )}
            <NumberField label="Fk (reação)" value={inp.Fk} onChange={set("Fk")} unit="tf" />
            <NumberField label="Mk,x" value={inp.Mkx} onChange={set("Mkx")} unit="tf.m" />
            <NumberField label="Mk,y" value={inp.Mky} onChange={set("Mky")} unit="tf.m" />
            <div className="derived-note">γf = <b>1,4</b> (combinações normais, NBR 6118)</div>
          </div>

          <h2>Furo na laje (NBR 19.5.2.6)</h2>
          <div className="mode-toggle">
            <label className={`mode-option ${inp.furoAtivo ? "active" : ""}`}>
              <input
                type="checkbox"
                checked={inp.furoAtivo}
                onChange={(e) => set("furoAtivo")(e.target.checked)}
              />
              Tem furo próximo ao pilar
            </label>
          </div>
          {inp.furoAtivo && (
            <>
              <div className="field-grid">
                <NumberField label="Centro X (a partir do centro do pilar)" value={inp.furoX} onChange={set("furoX")} unit="cm" />
                <NumberField label="Centro Y (a partir do centro do pilar)" value={inp.furoY} onChange={set("furoY")} unit="cm" />
                <NumberField label="Largura do furo (dir. X)" value={inp.furoLargura} onChange={set("furoLargura")} unit="cm" />
                <NumberField label="Altura do furo (dir. Y)" value={inp.furoAltura} onChange={set("furoAltura")} unit="cm" />
              </div>
              {r && r.furo && (
                <div className="derived-note">
                  {r.furo.dentroDoLimite ? (
                    <>
                      Furo a <b>{fmt(r.furo.distancia, 1)}</b> cm da face do pilar (limite 8d = {fmt(8 * r.d, 1)} cm),
                      setor sombreado de <b>{fmt(r.furo.setorGraus, 1)}°</b> — desconta{" "}
                      <b>{fmt(r.furo.excMenor, 1)}cm</b> de u0, <b>{fmt(r.furo.excMaior, 1)}cm</b> de u
                      e <b>{fmt(r.furo.excUlt, 1)}cm</b> de u&apos;&apos;
                    </>
                  ) : (
                    <>Furo a {fmt(r.furo.distancia, 1)} cm da face do pilar — fora do limite de 8d ({fmt(8 * r.d, 1)} cm), não reduz o perímetro</>
                  )}
                </div>
              )}
              <div className="derived-note hint">
                Retas tangentes do centro do pilar aos 2 cantos do furo com ângulo mais extremo; desconta o
                comprimento do contorno retangular entre as duas interseções, pelo lado do furo (validado
                contra 9 DXFs de referência). Não recalcula Wp/W&apos;p com a geometria exata do furo. O
                desenho com o furo e os vãos nos contornos aparece na seção &quot;Contornos críticos&quot;, mais abaixo.
              </div>
            </>
          )}

          <h2>Concreto</h2>
          <div className="field-grid">
            <SelectField
              label="fck"
              value={inp.fck}
              onChange={(v) => set("fck")(parseFloat(v))}
              options={FCKS.map((f) => ({ value: f, label: `${f} MPa` }))}
            />
            <div className="derived-note">γc = <b>1,4</b> (concreto, NBR 6118)</div>
            <div className="derived-note">
              Conector de punção: estribo — fywd = <b>{fmt(r ? r.fywd : (inp.h <= 15 ? 250 : inp.h >= 35 ? 435 : 250 + ((435 - 250) * (inp.h - 15)) / 20), 1)}</b> MPa
              <br />
              <span className="hint">250 MPa até h=15cm, 435 MPa a partir de h=35cm, interpolado entre os dois</span>
            </div>
          </div>

          <h2>Armadura longitudinal — malha negativa</h2>
          <div className="mode-toggle">
            <label className={`mode-option ${inp.considerarMalha ? "active" : ""}`}>
              <input
                type="checkbox"
                checked={inp.considerarMalha}
                onChange={(e) => set("considerarMalha")(e.target.checked)}
              />
              Pilar tem malha negativa
            </label>
          </div>
          {inp.considerarMalha ? (
            <div className="field-grid">
              <SelectField
                label="ø malha"
                value={inp.diamMalha}
                onChange={(v) => set("diamMalha")(parseFloat(v))}
                options={DIAMS.map((d) => ({ value: d, label: `ø ${d}` }))}
              />
              <NumberField label="Espaçamento" value={inp.espMalha} onChange={set("espMalha")} unit="cm" />
              <div className="derived-note">Mesma malha nos dois sentidos (X e Y)</div>
            </div>
          ) : (
            <div className="derived-note">
              Malha negativa desconsiderada — a taxa de aço usa só o reforço na região do pilar.
            </div>
          )}

          <h2>Reforço na região do pilar</h2>
          <div className="field-grid">
            <NumberField label="Qtde X (barras/grupo)" value={inp.qtdReforcoX} onChange={set("qtdReforcoX")} min="1" step="1" />
            <SelectField
              label="ø reforço X"
              value={inp.diamReforcoX}
              onChange={(v) => set("diamReforcoX")(parseFloat(v))}
              options={DIAMS.map((d) => ({ value: d, label: `ø ${d}` }))}
            />
            <NumberField label="Espaçamento reforço X" value={inp.espReforcoX} onChange={set("espReforcoX")} unit="cm" />
            <div />
            <NumberField label="Qtde Y (barras/grupo)" value={inp.qtdReforcoY} onChange={set("qtdReforcoY")} min="1" step="1" />
            <SelectField
              label="ø reforço Y"
              value={inp.diamReforcoY}
              onChange={(v) => set("diamReforcoY")(parseFloat(v))}
              options={DIAMS.map((d) => ({ value: d, label: `ø ${d}` }))}
            />
            <NumberField label="Espaçamento reforço Y" value={inp.espReforcoY} onChange={set("espReforcoY")} unit="cm" />
          </div>
          <div className="derived-note hint">
            Ex.: nervurada com 2 barras de 16mm a cada 80cm → Qtde=2, ø=16, espaçamento=80
          </div>

          <div className="derived-note">
            As,x total = malha + reforço = <b>{fmt(r ? r.AsX : null, 3)}</b> cm²/cm
            <br />
            As,y total = malha + reforço = <b>{fmt(r ? r.AsY : null, 3)}</b> cm²/cm
            <br />
            d (altura útil) = h - cobrimento - φmenor - φmaior/2 = <b>{fmt(r ? r.d : null, 2)}</b> cm
            <br />
            <span className="hint">Malha e reforço montados no mesmo nível — a bitola maior desse conjunto que governa o d</span>
          </div>

          <h2>Armadura transversal (punção)</h2>
          <div className="field-grid">
            <div className="derived-note">
              Sr (espaçamento entre camadas): <b>{fmt(r ? r.Sr : espacamentoMax, 2)}</b> cm
              <br />
              <span className="hint">Adota sempre o máximo normativo: 0,75d</span>
            </div>
            <div className="derived-note">
              Nr (nº de camadas): <b>{r ? r.Nr : 3}</b>
              <br />
              <span className="hint">
                Calculado automaticamente — mínimo {r && r.ehRadial ? 4 : 3}
                {r && r.ehRadial ? " (sempre par: 4, 6, 8...)" : ""}, sobe até atender o contorno C&apos;&apos;
                {r && r.ehRadial ? " e caber a capacidade necessária" : ""}
              </span>
            </div>
            {r && r.ehRadial && r.temArmadura && (
              <div className={`derived-note ${r.nBarrasRadial >= r.nBarrasRadialMax ? "warn" : ""}`}>
                Nº de barras radiais: <b>{r.nBarrasRadial}</b> (máximo que cabe: {r.nBarrasRadialMax})
                {r.nBarrasRadial >= r.nBarrasRadialMax && (
                  <>
                    {" "}— no limite físico ao redor do pilar; se precisar de mais capacidade, aumente Nr ou a
                    bitola do estribo.
                  </>
                )}
              </div>
            )}
          </div>

          <div className="field-grid">
            <NumberField
              label="Nº de pares no sentido menor (opcional)"
              value={inp.gruposMenorManual || ""}
              onChange={(v) => set("gruposMenorManual")(v ? Math.round(v) : null)}
              placeholder="automático"
            />
            <NumberField
              label="Nº de pares no sentido maior (opcional)"
              value={inp.gruposMaiorManual || ""}
              onChange={(v) => set("gruposMaiorManual")(v ? Math.round(v) : null)}
              placeholder="automático (1)"
            />
          </div>
          {inp.gruposMenorManual > 0 && r && r.temArmadura && (
            <div className={`derived-note ${inp.gruposMenorManual < r.gruposMenorAuto ? "warn" : "hint"}`}>
              {inp.gruposMenorManual < r.gruposMenorAuto
                ? `Atenção: o cálculo automático pediria ${r.gruposMenorAuto} par(es) — usar ${inp.gruposMenorManual} pode deixar a armadura insuficiente pro contorno C'.`
                : `Usando ${inp.gruposMenorManual} par(es) definido(s) manualmente (automático seria ${r.gruposMenorAuto}).`}
            </div>
          )}
          {inp.gruposMaiorManual > 0 && r && r.temArmadura && (
            <div className="derived-note hint">
              Usando {inp.gruposMaiorManual} par(es) no sentido maior definido(s) manualmente (automático seria {r.gruposMaiorAuto}).
            </div>
          )}
          <div className="derived-note hint">
            Deixe em branco pra calcular automaticamente. Preencha só se quiser forçar um nº específico
            de pares no sentido menor (ex.: pra bater com um arranjo já detalhado).
          </div>

          {inp.formaCircular && inp.padraoArmadura === "cruz" ? (
            <div className="field-grid">
              <label className="field">
                <span className="field-label">Largura do estribo (braços)</span>
                <select
                  value={inp.larguraEstriboCircularManual ?? ""}
                  onChange={(e) => set("larguraEstriboCircularManual")(e.target.value ? Number(e.target.value) : null)}
                >
                  <option value="">Automático (2d)</option>
                  <option value="1">d</option>
                  <option value="2">2d</option>
                </select>
              </label>
            </div>
          ) : inp.formaCircular ? null : (
            <div className="field-grid">
              <label className="field">
                <span className="field-label">Largura do estribo sentido X</span>
                <select
                  value={inp.larguraEstriboXManual ?? ""}
                  onChange={(e) => set("larguraEstriboXManual")(e.target.value ? Number(e.target.value) : null)}
                >
                  <option value="">Automático (2d, ou d se &gt;1 par no menor)</option>
                  <option value="1">d</option>
                  <option value="2">2d</option>
                </select>
              </label>
              <label className="field">
                <span className="field-label">Largura do estribo sentido Y</span>
                <select
                  value={inp.larguraEstriboYManual ?? ""}
                  onChange={(e) => set("larguraEstriboYManual")(e.target.value ? Number(e.target.value) : null)}
                >
                  <option value="">Automático (2d, ou d se &gt;1 par no menor)</option>
                  <option value="1">d</option>
                  <option value="2">2d</option>
                </select>
              </label>
            </div>
          )}
          <div className="derived-note hint">
            Padrão é 2d nos dois sentidos (ou d no sentido menor quando precisa de mais de 1 par). Force
            manualmente só se quiser um valor diferente num sentido específico — os dois sentidos são
            independentes, não precisa ser a mesma largura nos dois.
          </div>

          <div className="mode-toggle">
            <label className={`mode-option ${inp.estabilidadeDependePuncao ? "active" : ""}`}>
              <input
                type="checkbox"
                checked={inp.estabilidadeDependePuncao}
                onChange={(e) => set("estabilidadeDependePuncao")(e.target.checked)}
              />
              Estabilidade global depende da punção (laje lisa/cogumelo)
            </label>
          </div>
          <div className="derived-note hint">
            NBR 6118, 19.5.3.5 — se marcado, exige armadura mínima obrigatória mesmo com τSd&lt;τRd1,
            equilibrando 50% de Fsd: Asw,min (total) = Fsd/(2·fywd), dividida pelo nº de camadas
          </div>

          {r && r.temArmadura && (
            <div className="field-grid">
              <SelectField
                label="ø do estribo"
                value={inp.diamEstribo}
                onChange={(v) => set("diamEstribo")(parseFloat(v))}
                options={DIAMS_ESTRIBO.map((d) => ({ value: d, label: `ø ${d}` }))}
              />
              <SelectField
                label="ø porta-estribo inferior"
                value={inp.diamPortaInferior}
                onChange={(v) => set("diamPortaInferior")(parseFloat(v))}
                options={[10, 12.5, 16, 20].map((d) => ({ value: d, label: `ø ${d}` }))}
              />
              <div className="derived-note">
                {r.origemArmadura === "obrigatoria" && (
                  <>Armadura obrigatória (NBR 19.5.3.5) — contorno C&apos; passa sem exigir, mas a estabilidade global depende da punção.<br /></>
                )}
                Ramos necessários / camada (NBR): <b>{r.ramosNecessarios}</b><br />
                Estribos adotados / camada: <b>{r.estribosFornecidos}</b> ({r.ramosFornecidos} ramos)<br />
                Asw efetiva resultante: <b>{fmt(r.AswEfetiva, 3)}</b> cm²
              </div>
              <div className="derived-note">
                Estribo sentido Y: altura = {fmt(r.alturaEstriboY, 1)} cm × largura = {fmt(r.larguraEstriboY, 1)} cm
                {r.comprimentoEstriboY ? ` (C=${r.comprimentoEstriboY} cm)` : ""}
                <br />
                Estribo sentido X: altura = {fmt(r.alturaEstriboX, 1)} cm × largura = {fmt(r.larguraEstriboX, 1)} cm
                {r.comprimentoEstriboX ? ` (C=${r.comprimentoEstriboX} cm)` : ""}
                {(r.larguraEstriboX <= 0 || r.larguraEstriboY <= 0) && (
                  <span className="warn"> — largura negativa: pilar pequeno demais pro cobrimento/folga adotados</span>
                )}
              </div>
              {!r.atendeCll && (
                <div className="derived-note warn">
                  Contorno C&apos;&apos; não atendido nem com {r.Nr} camadas (limite testado) — revise bitola do
                  estribo, cobrimento ou dimensões do pilar.
                </div>
              )}
              {r.atendeCll && r.atendeCll_ajustado === false && (
                <div className="derived-note warn">
                  Contorno C&apos;&apos; passa sem o corte da cunha, mas <b>não passa</b> considerando o corte da
                  armadura em cruz nos cantos, nem com {r.Nr} camadas (limite testado) — aumentar Nr não resolve
                  sozinho aqui, porque o corte cresce quase na mesma proporção que o contorno. Considere estender
                  a armadura também na diagonal, aumentar a bitola/nº de ramos, ou revisar as dimensões do pilar.
                </div>
              )}
            </div>
          )}
        </section>

        {/* ---------------- COLUNA DE RESULTADOS ---------------- */}
        <section className="panel results">
          {r && (
            <>
              <div className="section-title">
                <span className="section-num">2</span>
                <h2>Resultados</h2>
              </div>
              <div className="aux-grid" style={{ marginBottom: 16 }}>
                <div><span>u0 (contorno C)</span><span className="aux-val"><b>{fmt(r.u_0, 2)}</b> cm</span></div>
                <div><span>u (contorno C&apos;)</span><span className="aux-val"><b>{fmt(r.u_red, 2)}</b> cm</span></div>
                <div><span>u&apos;&apos; (contorno C&apos;&apos;)</span><span className="aux-val"><b>{fmt(r.u_l, 2)}</b> cm</span></div>
              </div>

              <div className="no-print">
              <h2>Contornos críticos (conferência)</h2>
              {inp.furoAtivo && inp.tipoPilar === "I" && r.furo && r.furo.dentroDoLimite && (
                <div className="derived-note hint">
                  Este esquema mostra o perímetro cheio (sem o furo) — o desconto do furo é mostrado à parte, na
                  seção "Furo na laje". Os valores de u0/u/u&apos;&apos; acima JÁ SAEM com o desconto aplicado.
                </div>
              )}
              <ContornosDiagram
                ap={inp.ap}
                bp={inp.bp}
                d={r.d}
                p={r.p}
                tipoPilar={inp.tipoPilar}
                u_0={r.u_0}
                u_red={r.u_red}
                u_l={r.u_l}
                temMomento={r.temMomento}
                cortesCll={r.cortesCll}
                u_l_ajustado={r.u_l_ajustado}
                furoAtivo={inp.furoAtivo}
                furoX={inp.furoX}
                furoY={inp.furoY}
                furoLargura={inp.furoLargura}
                furoAltura={inp.furoAltura}
                furo={r.furo}
                formaCircular={inp.formaCircular}
                diametro={inp.diametro}
                RcllCircular={r.RcllCircular}
                padraoArmadura={inp.padraoArmadura}
              />
              </div>

              <h2>Verificação do contorno C</h2>
              <CheckRow label="τsd" value={r.tau_C} cmp={r.tau_C <= r.tauRd2 ? "<" : ">"} refVal={r.tauRd2} refLabel="τRd2 (kgf/cm²)" />
              <VerdictBadge ok={r.ok_C} okText="OK" failText="BUMMM!!! — esmagamento da biela" />

              <h2>Verificação do contorno C&apos;</h2>
              <CheckRow label="τsd" value={r.tau_Cl} cmp={r.tau_Cl <= r.tauRd1 ? "<" : ">"} refVal={r.tauRd1} refLabel="τRd1 (kgf/cm²)" />
              {r.precisaArm ? (
                <>
                  <VerdictBadge ok={false} okText="OK" failText="NECESSITA DE ARMADURA DE PUNÇÃO" />
                  <div className="result-line">
                    Asw necessária (mínima teórica): <b>{fmt(r.AswCalc, 3)}</b> cm²
                    <br />
                    {r.ehRadial ? (
                      <>
                        Arranjo adotado: <b>{r.nBarrasRadial} barras &quot;cobra&quot;</b> × {r.Nr} camadas = {" "}
                        <b>{r.nBarrasRadial * r.Nr}</b> ramos ø {inp.diamEstribo} (Asw efetiva = <b>{fmt(r.AswEfetiva, 3)}</b> cm²)
                      </>
                    ) : (
                      <>
                        Arranjo adotado: <b>{r.estribosFornecidos} estribos ø {inp.diamEstribo}</b> / camada
                        ({r.ramosFornecidos} ramos, Asw efetiva = <b>{fmt(r.AswEfetiva, 3)}</b> cm²)
                      </>
                    )}
                  </div>
                </>
              ) : (
                <VerdictBadge ok={true} okText="OK — dispensa armadura de punção" failText="" />
              )}
              {!r.precisaArm && r.origemArmadura === "obrigatoria" && (
                <div className="result-line">
                  Ainda assim, a NBR 6118 (19.5.3.5) exige armadura mínima obrigatória, pois a estabilidade
                  global depende da punção: Asw,min (total) = Fsd/(2·fywd) = <b>{fmt(r.AswObrigatoriaTotal, 3)}</b> cm²
                  <br />
                  Demanda: {fmt(r.AswObrigatoriaTotal, 3)}cm² ÷ {fmt(BIT(inp.diamEstribo), 2)}cm² = <b>{r.estribosTotalDemanda * 2}</b> ramos
                  → <b>{r.estribosTotalDemanda}</b> estribos no total
                  <br />
                  Piso mínimo buildable ({inp.tipoPilar}, {r.Nr} camadas): <b>{r.pisoEstribosTotal}</b> estribos no total
                  <br />
                  Adotado: max({r.estribosTotalDemanda}, {r.pisoEstribosTotal}) = <b>{r.estribosTotalFinal}</b> estribos no total
                  {r.ehRadial ? (
                    <>
                      {" "}÷ {r.Nr} camadas → <b>{r.nBarrasRadial} barras &quot;cobra&quot;</b> × {r.Nr} camadas ={" "}
                      <b>{r.nBarrasRadial * r.Nr}</b> ramos ø {inp.diamEstribo} (Asw efetiva ={" "}
                      <b>{fmt(r.AswEfetiva, 3)}</b> cm²)
                    </>
                  ) : (
                    <>
                      {" "}÷ {r.Nr} camadas = <b>{r.estribosFornecidos} estribos ø {inp.diamEstribo}</b> / camada
                      ({r.ramosFornecidos} ramos, Asw efetiva = <b>{fmt(r.AswEfetiva, 3)}</b> cm²/camada)
                    </>
                  )}
                </div>
              )}

              {r.temArmadura && (
                <>
                  <h2>Verificação do contorno C&apos; com armadura</h2>
                  <CheckRow label="τsd" value={r.tau_Cl} cmp={r.okClArm ? "<" : ">"} refVal={r.tauRd3} refLabel="τRd3 (kgf/cm²)" />
                  <VerdictBadge ok={r.okClArm} okText="OK" failText="BUMMM!!! — aumentar bitola, pernas ou camadas" />
                </>
              )}

              <h2>Verificação do contorno C&apos;&apos;</h2>
              <CheckRow label="τsd" value={r.tau_Cll} cmp={r.okCll ? "<" : ">"} refVal={r.tauRd1} refLabel="τRd1 (kgf/cm²)" />
              <VerdictBadge
                ok={r.okCll}
                okText="OK"
                failText="AUMENTAR O NÚMERO DE CAMADAS"
              />
              {r.u_l_ajustado !== null && r.u_l_ajustado !== undefined && (
                <>
                  <div className="derived-note">
                    Armadura em cruz não cobre os cantos (diagonal) — descontando os trechos do contorno C&apos;&apos;
                    onde nem o braço menor nem o maior alcançam (construção validada contra DXF de referência):
                    u&apos;&apos; ajustado = <b>{fmt(r.u_l_ajustado, 1)}</b> cm (era {fmt(r.u_l, 1)} cm sem o desconto)
                  </div>
                  <CheckRow label="τsd (ajustado)" value={r.tau_Cll_ajustado} cmp={r.atendeCll_ajustado ? "<" : ">"} refVal={r.tauRd1} refLabel="τRd1 (kgf/cm²)" />
                  <VerdictBadge
                    ok={r.atendeCll_ajustado}
                    okText="OK (considerando o corte da cunha)"
                    failText="BUMMM!!! — o corte da cunha faz faltar contorno C'' — aumentar o número de camadas"
                  />
                </>
              )}

              <div className="no-print">
              <h2>Detalhamento em pares (2 inferior + 2 superior)</h2>
              {r.temArmadura ? (
                <>
                  <div className="result-line">
                    Necessário <b>{r.ramosNecessarios}</b> ramos/camada = <b>{Math.ceil(r.ramosNecessarios / 2)}</b> estribos/camada
                    (2 ramos = 1 estribo, peça fechada) — cada par (2 porta-estribo inferior + 2 superior,
                    atravessando o pilar numa direção) monta 1 estribo por camada em cada lado que cruza. No pilar
                    central os dois sentidos têm 2 lados; em borda/canto, o sentido com face livre só conta 1 lado
                    (a barra para na face, sem estender). O sentido maior sempre recebe exatamente 1 par fixo,
                    centralizado; o excedente necessário é resolvido com pares no sentido menor. Arranjo adotado:
                  </div>
                  <table className="bars-table">
                    <thead>
                      <tr>
                        <th>Sentido</th>
                        <th>Pares</th>
                        <th>Lados</th>
                        <th>Barras inf. + sup.</th>
                        <th>Comprimento</th>
                        <th>Posições (perpendicular)</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td>Menor ({r.menorEhX ? "a" : "b"})</td>
                        <td>{r.gruposMenor}</td>
                        <td>{r.ladosMenor}</td>
                        <td>{r.gruposMenor * 2} + {r.gruposMenor * 2}</td>
                        <td>{r.comprMenorSentido} cm</td>
                        <td>{r.posicoesMenor.map((p) => fmt(p, 1)).join(" / ")}</td>
                      </tr>
                      <tr>
                        <td>Maior ({r.menorEhX ? "b" : "a"})</td>
                        <td>{r.gruposMaior}</td>
                        <td>{r.ladosMaior}</td>
                        <td>{r.gruposMaior * 2} + {r.gruposMaior * 2}</td>
                        <td>{r.comprMaiorSentido} cm</td>
                        <td>centro ({fmt(r.posicoesMaior[0], 1)})</td>
                      </tr>
                    </tbody>
                  </table>
