  dw4_escreverFloat32(arr, 2718 + 6, dw4_lerFloat32(arr, 2718 + 6) + deltaAlturaEstriboX * 0.75 / 25 - (inp.h - H_TEMPLATE) / 4 / 25); // N6
  dw4_escreverFloat32(arr, 4175 + 6, dw4_lerFloat32(arr, 4175 + 6) - deltaAlturaEstriboX * 0.75 / 25 + (inp.h - H_TEMPLATE) / 4 / 25); // N5
  // N3/N4 (barras de porta-estribo Y) CORRIGIDO (sessão 2026-09-12): a fórmula acima
  // (deltaAlturaEstriboY*0.75/25) foi calibrada numa amostra sem Δh (h=25, só a altura do
  // estribo variando) — usuário reportou "faltou deslocar as barras de porta estribo pra
  // posição correta" num teste com h=35 (Δh=10) E deltaAlturaEstriboY=8 ao mesmo tempo:
  // resíduo de exatamente -0,10 (2,5cm) em N4 e +0,10 em N3 sobre o valor já calculado pela
  // fórmula antiga, ou seja, falta um segundo termo -Δh/4/25 (N4) / +Δh/4/25 (N3) — zero
  // quando Δh=0, então não deveria afetar a calibração antiga. Coeficiente 1/4 achado só por
  // esta amostra (Δh=10, deltaAlturaEstriboY=8, variando juntos — não dá pra separar as duas
  // causas com um teste só); não reativar/ajustar mais sem outro arquivo real, idealmente com
  // Δh≠0 e alturaEstribo=template (isolando só o efeito do Δh)
  dw4_escreverFloat32(arr, 3623 + 6, dw4_lerFloat32(arr, 3623 + 6) + deltaAlturaEstriboY * 0.75 / 25 - (inp.h - H_TEMPLATE) / 4 / 25); // N4
  dw4_escreverFloat32(arr, 3671 + 6, dw4_lerFloat32(arr, 3671 + 6) - deltaAlturaEstriboY * 0.75 / 25 + (inp.h - H_TEMPLATE) / 4 / 25); // N3
  dw4_escreverFloat32(arr, 3719 + 6, dw4_lerFloat32(arr, 3719 + 6) - deltaAlturaEstriboX / 2 / 25); // barra reta nativa
  for (const o of [3879, 3935]) { // retângulo em corte, nível superior (Y~4,7)
    dw4_escreverFloat32(arr, o + 6, dw4_lerFloat32(arr, o + 6) - (deltaAlturaEstriboY + extraResiduoEstribo) / 2 / 25);
  }
  for (const o of [3907, 3963]) { // retângulo em corte, nível inferior (Y~4,1)
    dw4_escreverFloat32(arr, o + 6, dw4_lerFloat32(arr, o + 6) + (deltaAlturaEstriboY + extraResiduoEstribo) / 2 / 25);
  }
  // achado sessão 2026-09-10, rodada seguinte (usuário ajustou Seção 1.1/2.2 de novo, mesmo
  // caso de teste): faltavam as marcas de camada NATIVAS de N2 perto de Y~8,76/4,03 (uma por
  // camada, Nr=3 → 3 pontos por lado) e mais um grupo de 4 RECT (retângulo em corte da Seção
  // 1.1 pro par extra em N2) — mesma fórmula/coeficiente já usados acima, só que ligados a
  // deltaAlturaEstriboX em vez de deltaAlturaEstriboY. Resíduo pequeno (~0,01, não corrigido
  // ainda) em X nesses mesmos pontos — não bate com nenhuma fórmula óbvia, deixado de lado
  // por enquanto (efeito visual mínimo, ~0,25cm)
  for (const o of [4223, 4271, 4319, 4367, 4415, 4463]) { // camada nativa N2, Y~8,76
    dw4_escreverFloat32(arr, o + 6, dw4_lerFloat32(arr, o + 6) - deltaAlturaEstriboX / 2 / 25);
  }
  for (const o of [4511, 4559, 4607, 4655, 4703, 4751]) { // camada nativa N2, Y~4,03
    dw4_escreverFloat32(arr, o + 6, dw4_lerFloat32(arr, o + 6) + deltaAlturaEstriboX / 2 / 25);
  }
  dw4_escreverFloat32(arr, 2988 + 6, dw4_lerFloat32(arr, 2988 + 6) + (deltaAlturaEstriboX + extraResiduoEstribo) / 2 / 25);
  for (const o of [3851, 3767]) { // retângulo em corte Secao 1.1 (par nativo), nível Y~8,76
    dw4_escreverFloat32(arr, o + 6, dw4_lerFloat32(arr, o + 6) + (deltaAlturaEstriboX + extraResiduoEstribo) / 2 / 25);
  }
  for (const o of [3823, 3795]) { // retângulo em corte Secao 1.1 (par nativo), nível Y~9,44
    dw4_escreverFloat32(arr, o + 6, dw4_lerFloat32(arr, o + 6) - (deltaAlturaEstriboX + extraResiduoEstribo) / 2 / 25);
  }
  // 7311/7359/7387/7415/7443 (par NOVO de N2, criado por dw4_gerarParesN2) ainda não
  // existem no array neste ponto — o ajuste deles fica logo depois da chamada de
  // dw4_gerarParesN2 mais abaixo (ver "ajuste de altura pro retângulo em corte Secao 1.1
  // do par novo")

  // ajusta o contorno do pilar e reposiciona as barras usando os offsets ORIGINAIS —
  // a remoção da hachura (que desloca tudo que vem depois dela) só acontece no FINAL,
  // depois de todo o resto já ter sido feito nas posições originais
  // FASE 1 (base nova): sem hachura, usa null (dw4_patchContorno lê cx/cy do próprio
  // registro de contorno). Trocar por DW4_OFF_HACHURA se voltar a usar a base antiga.
  const [cx0, cy0] = dw4_patchContorno(arr, null, DW4_OFF_CONTORNO, inp.ap, inp.bp);
  dw4_reposicionarTudo(arr, cx0, cy0, inp.ap - 25, inp.bp - 60);

  // Pilar de borda: o marcador "N2" (indicação do estribo no sentido Y) do lado +Y não deve
  // existir — esse lado é a face livre (sem laje), não tem estribo nenhum ali pra apontar. O
  // template (herdado do pilar central) sempre desenha os 2 grupos, incluindo os 3 pontos PT
  // extras (0.9/1.5/2.1) exclusivos desse grupo. CONFIRMADO com arquivo real hand-corrigido pelo
  // usuário (AJUSTADO.DW4, sessão 2026-09-15): o S4CAD de verdade REMOVE esses registros de
  // verdade (arquivo 8 registros mais curto), não deixa "em branco" no lugar — por isso a
  // remoção de verdade (arr.splice) acontece só no FINAL da função, ver bloco perto de
  // `arr.push(dw4MarcadorFim)`, junto com o pilar circular (mesmo motivo: mexer nesses offsets
  // bem cedo desalinharia tudo que vem depois). Os blocos de deslocamento de N1/N3-N4/N5-N6/RECT
  // logo abaixo continuam usando os offsets ORIGINAIS (pré-splice) normalmente, já que rodam
  // ANTES da remoção final.

  // Pilar de borda: quando o par do sentido maior precisa ser REPOSICIONADO (não cabe
  // centralizado no sentido apertado da face livre — mesma condição de maiorGrupoReposicionado
  // usada acima pro comprimento do porta-estribo X), os elementos VISUAIS que "seguem" essa
  // caixa de estribo — o marcador N1 (seta+texto apontando o Estribo X) e os 6 pontos-âncora
  // dele — também precisam se deslocar em Y. O template não faz isso sozinho (só a posição
  // "de verdade", posicoesMaior, já é calculada certa). Fórmula empírica confirmada com 2
  // arquivos reais (pilar 100x25 e 60x30, ambos 1 par no sentido maior, h=25/Nr=3): o
  // deslocamento em cm é (menorDim/2 − posicoesMaior[0]) + 3,5 — o termo entre parênteses é a
  // diferença entre o centro "não reposicionado" e o centro real (já usada implicitamente no
  // comprMaiorSentido acima); o "+3,5" é um resíduo sem explicação limpa encontrada ainda, mas
  // bateu EXATO nos 2 arquivos (deslocamento de -9,5cm em bp=25, -7,0cm em bp=30). NÃO
  // verificado fora desses 2 casos — se usar Nr≠3, h≠25 ou gruposMaior>1 (vários pares no
  // sentido maior, hoje nem gerado pelo código), reverificar do zero antes de confiar.
  // Também desloca (separadamente) o marcador N3/N4 (aponta os porta-estribo Y) — esse desloca
  // MUITO mais (na casa de -76cm) e varia pouco com bp: -76,5cm em bp=25, -76,0cm em bp=30 (só
  // 2 pontos, ajuste linear exato nos 2: 0,1×bp − 79). Coeficiente "0,1" pequeno demais pra vir
  // de alguma fórmula geométrica óbvia (d/lb/Sr não bateram) — aceito como ajuste empírico por
  // enquanto, sem explicação de origem confirmada.
  if (inp.tipoPilar === "B") {
    const menorDimAtual = r.menorEhX ? inp.ap : inp.bp;
    if (r.maiorGrupoReposicionado && r.posicoesMaior && r.posicoesMaior.length === 1) {
      const boxShiftCm = menorDimAtual / 2 - r.posicoesMaior[0];
      const n1ShiftFU = (boxShiftCm + 3.5) / 25;
      const dw4_deslocarYN1 = (offCampoY) => {
        dw4_escreverFloat32(arr, offCampoY, dw4_lerFloat32(arr, offCampoY) + n1ShiftFU);
      };
      for (const offPt of [1268, 1316, 1364, 1412, 1460, 1508, 2122, 2170]) dw4_deslocarYN1(offPt + 6);
      for (const offTxt of [1556, 1661]) dw4_deslocarYN1(offTxt + 6);
      for (const offSeg of [1581, 1601, 1621, 1641, 1686, 1706, 1726, 1746]) {
        dw4_deslocarYN1(offSeg + 6);
        dw4_deslocarYN1(offSeg + 14);
      }
      // marcador N5/N6 (aponta os porta-estribo X, mesma família "Estribo X" do N1) usa
      // EXATAMENTE o mesmo deslocamento do N1 (confirmado exato nos 2 arquivos reais, sem
      // resíduo — ao contrário do N1 não precisou de nenhum termo extra tipo "+3,5")
      for (const offSeg of [2532, 2552, 2572]) {
        dw4_deslocarYN1(offSeg + 6);
        dw4_deslocarYN1(offSeg + 14);
      }
      for (const offTxt of [2592, 2617]) dw4_deslocarYN1(offTxt + 6);
    }
    const n3n4ShiftFU = (0.1 * menorDimAtual - 79) / 25;
    const dw4_deslocarYN3N4 = (offCampoY) => {
      dw4_escreverFloat32(arr, offCampoY, dw4_lerFloat32(arr, offCampoY) + n3n4ShiftFU);
    };
    for (const offSeg of [2422, 2442, 2462]) {
      dw4_deslocarYN3N4(offSeg + 6);
      dw4_deslocarYN3N4(offSeg + 14);
    }
    for (const offTxt of [2482, 2507]) dw4_deslocarYN3N4(offTxt + 6);

    // 2 pontos PT (offsets originais 1862/1910, x=20.54/19.02, antes do bloco N3-N6 — sem
    // precisar de shiftPorNome) que não se encaixam em nenhuma das famílias acima. ACHADO
    // 2026-09-16 (2º arquivo real, Nr=7, comprimento do porta-estribo Y corrigido de C=96 pra
    // C=127 no round anterior): o -1,54 usado até aqui era só válido pra C=96 — na real, o
    // deslocamento é "0,38 - compY/50" (achado comparando os 2 valores reais: C=96→-1,54,
    // C=127→-2,16, mesma âncora 0,38 nos 2 — mesmo padrão do ponto "bordo livre" corrigido logo
    // abaixo, em Gap#2). compY ainda não foi calculado nesse ponto da função — usa r.comprMenorSentido/
    // r.comprMaiorSentido direto (mesma fonte, ver definição de "compY" mais abaixo).
    const dw4_compYAntesDoCalculo = Math.round(r.menorEhX ? r.comprMaiorSentido : r.comprMenorSentido);
    const dw4_deltaPontosBordoLivre = 0.38 - dw4_compYAntesDoCalculo / 50;
    dw4_escreverFloat32(arr, 1862 + 6, dw4_lerFloat32(arr, 1862 + 6) + dw4_deltaPontosBordoLivre);
    dw4_escreverFloat32(arr, 1910 + 6, dw4_lerFloat32(arr, 1910 + 6) + dw4_deltaPontosBordoLivre);
  }

  // PENDENTE: pares extras de estribo (fórmula já validada, ver memória do projeto —
  // dw4_offsetPar) — tentativa de integração aqui causou corrupção de dados por conflito
  // de ordem com reposicionarTudo/remoção de hachura. Revertido até investigar com calma.

  dw4_escreverFloat32(arr, DW4_PONTOS_ESTRIBO_PARTE_Y[0], dw4_lerFloat32(arr, DW4_PONTOS_ESTRIBO_PARTE_Y[0]) - deltaPrimeiraCamada / 25);
  dw4_escreverFloat32(arr, DW4_PONTOS_ESTRIBO_SECAO11_X[0], dw4_lerFloat32(arr, DW4_PONTOS_ESTRIBO_SECAO11_X[0]) - deltaPrimeiraCamada / 25);
  dw4_escreverFloat32(arr, DW4_PONTOS_ESTRIBO_SECAO11_X[1], dw4_lerFloat32(arr, DW4_PONTOS_ESTRIBO_SECAO11_X[1]) + deltaPrimeiraCamada / 25);
  for (const off of DW4_PONTOS_COTA_SECAO11_ESQ) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - deltaPrimeiraCamada / 25);
  }
  for (const off of DW4_PONTOS_COTA_SECAO11_DIR) {
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + deltaPrimeiraCamada / 25);
  }
  dw4_escreverFloat32(arr, DW4_PONTOS_ESTRIBO_SECAO22_Y[0], dw4_lerFloat32(arr, DW4_PONTOS_ESTRIBO_SECAO22_Y[0]) - deltaPrimeiraCamada / 25);
  dw4_escreverFloat32(arr, DW4_PONTOS_ESTRIBO_SECAO22_Y[1], dw4_lerFloat32(arr, DW4_PONTOS_ESTRIBO_SECAO22_Y[1]) + deltaPrimeiraCamada / 25);
  // outras camadas do estribo em X na planta (não a primeira) — deslocam com ΔprimeiraCamada
  // (mesma base de todas) MAIS ΔSr proporcional ao índice da camada (2ª, 3ª...)
  // (deltaSr hoisted mais acima nesta função, sessão 2026-09-10 2ª rodada)
  for (const { off, indice, lado } of DW4_PONTOS_CAMADA_SECAO22_Y) {
    const indiceEfetivo = Math.min(indice, r.Nr - 1);
    const deltaTotal = deltaPrimeiraCamada + indiceEfetivo * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - lado * deltaTotal / 25);
  }
  for (const { off, indice, lado } of DW4_PONTOS_BARRA_SECAO22_Y) {
    const indiceEfetivo = Math.min(indice, r.Nr - 1);
    const deltaTotal = deltaPrimeiraCamada + indiceEfetivo * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - lado * deltaTotal / 25);
  }
  // DESLIGADOS (sessão 2026-09-10) — CAUSA CONFIRMADA de "arquivo danificado" (comando 70/71)
  // num pilar de 1 par só (Nr=3, Sr=22,5, d=30). Instrumentando dw4_escreverFloat32 e
  // conferindo cada offset contra a estrutura real de registros do template puro: vários
  // offsets destas duas listas NÃO caem no campo X/Y de 4 bytes de um registro de ponto —
  // caem no campo "cauda" de 2 bytes de um SEG (ex.: off=2824 = 2806+18, a cauda do SEG
  // 0b,04 que começa em 2806, não um novo ponto) ou dentro da string/índice de um TXT (ex.:
  // off=2595/2615 caem dentro do registro TXT "N6" @2592, sobrescrevendo o índice de
  // vínculo com a tabela de ferragem; off=2635/2700 caem dentro do TXT "N5" @2617). Escrever
  // um float32 (4 bytes) nesses pontos sempre estraga o opcode do PRÓXIMO registro — mas em
  // todo teste anterior desta sessão isso passou despercebido porque deltaTotal (=
  // deltaPrimeiraCamada + índice×deltaSr) ficava perto de 0 (Sr sempre "coincidia" com os
  // 15cm do template) — um "reencode quase idêntico" inofensivo, mesma categoria dos blocos
  // de Δh já desligados acima. Este foi o primeiro teste com Sr bem diferente de 15 (22,5) E
  // primeira camada bem diferente de 10cm (d=30 → camada=30), expondo o desalinhamento.
  // Os offsets SÃO usados de novo mais abaixo (pontosN1_X_replicar/pontosN2_Y_replicar,
  // dentro de paresN1>1/paresN2>1) — não removidos daqui, só o loop incondicional. Não
  // reativar sem remapear via arquivo real (pilar 1 par só, Sr bem diferente de 15).
  // for (const { off, indice, lado } of DW4_PONTOS_CAMADA_X) {
  //   const indiceEfetivo = Math.min(indice, r.Nr - 1);
  //   const deltaTotal = deltaPrimeiraCamada + indiceEfetivo * deltaSr;
  //   dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - lado * deltaTotal / 25);
  // }
  // for (const { off, indice, lado } of DW4_PONTOS_CAMADA_Y) {
  //   const indiceEfetivo = Math.min(indice, r.Nr - 1);
  //   const deltaTotal = deltaPrimeiraCamada + indiceEfetivo * deltaSr;
  //   dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - lado * deltaTotal / 25);
  // }

  // PARES EXTRAS (mais de 1 par no sentido menor/maior) — fórmula confirmada com 3 casos
  // reais (N=2 e N=3, mapeados exaustivamente elemento por elemento). Reativado após
  // investigação completa — gruposMenor/gruposMaior fazem parte do CÁLCULO NORMAL da
  // punção (não é uma feature "opcional"), então isso precisa funcionar sempre que N>1
  const paresN1 = r.menorEhX ? (r.gruposMenor || 1) : (r.gruposMaior || 1);
  const paresN2 = r.menorEhX ? (r.gruposMaior || 1) : (r.gruposMenor || 1);
  // offsets (distância do centro) usando as posições JÁ CALCULADAS e validadas pelo próprio
  // app (r.posicoesMenor/r.posicoesMaior, as mesmas usadas na visualização/animação que já
  // funciona corretamente) — evita reconstruir a fórmula de espaçamento, que usa 2×d (não a
  // largura do estribo, que muda pra 1d quando há mais de 1 par)
  const maiorDim = Math.max(inp.ap, inp.bp);
  const menorDim = Math.min(inp.ap, inp.bp);
  const posN1 = (r.menorEhX ? r.posicoesMenor : r.posicoesMaior) || [maiorDim / 2];
  const posN2 = (r.menorEhX ? r.posicoesMaior : r.posicoesMenor) || [menorDim / 2];
  const baseN1 = r.menorEhX ? maiorDim / 2 : menorDim / 2;
  const baseN2 = r.menorEhX ? menorDim / 2 : maiorDim / 2;
  const offsetsN1 = posN1.map(p => p - baseN1);
  const offsetsN2 = posN2.map(p => p - baseN2);
  // as 6 marcas de camada (X variando) MAIS a primeira camada (idx=0, que é a raiz do
  // bug: não estava sendo deslocada pelo par, ficando sempre no centro) — reposiciona o
  // par 0 e replica pros demais. IMPORTANTE: o template tem DUAS fileiras sobrepostas por
  // par — uma "principal" (ESTRIBO_PARTE + metade de CAMADA_X, em Y=cy0) e outra de
  // "ponta de indicação" (PONTA_INDICACAO + a outra metade de CAMADA_X, em Y=cy0-0.4).
  // CONFIRMADO pelo usuário (comparação com arquivo ajustado manualmente): só a fileira
  // PRINCIPAL deve ser replicada por par extra — a de "ponta de indicação" é única por
  // todo o desenho, não por par (replicá-la também duplicava a indicação, mostrando 12
  // marcas em vez de 6 no par novo). Os offsets de CAMADA_X vêm na ordem [4 primeiros =
  // fileira principal, 4 últimos = fileira de ponta de indicação], confirmado empiricamente
  const pontosN1_X = [
    ...DW4_PONTOS_ESTRIBO_PARTE_X, ...DW4_PONTOS_PONTA_INDICACAO_X,
    ...DW4_PONTOS_CAMADA_X.map(p => p.off),
  ];
  const pontosN1_X_replicar = [...DW4_PONTOS_ESTRIBO_PARTE_X, ...DW4_PONTOS_CAMADA_X.slice(0, 4).map(p => p.off)];
  const pontosN2_Y = [
    ...DW4_PONTOS_ESTRIBO_PARTE_Y, ...DW4_PONTOS_PONTA_INDICACAO_Y,
    ...DW4_PONTOS_CAMADA_Y.map(p => p.off),
  ];
  const pontosN2_Y_replicar = [...DW4_PONTOS_ESTRIBO_PARTE_Y, ...DW4_PONTOS_CAMADA_Y.slice(0, 4).map(p => p.off)];
  if (paresN1 > 1) {
    // FASE 2 (base nova): todo o bloco antigo que ficava aqui (offsetPar0 aplicado a
    // DW4_OFF_TICK_SECAO11/PONTO_SECAO11_TICK/BARRA_N6_SECAO11/pontosN1_X — todos offsets da
    // base ANTIGA) foi REMOVIDO — são posições inválidas na base nova (6604 bytes, layout
    // diferente) e escrever nelas corrompia o arquivo (foi exatamente o que quebrou o
    // primeiro teste com Fk alto o suficiente pra precisar de >1 par). Substituído pelo
    // deslocamento uniforme de DW4_PONTOS_X (ver dw4_reposicionarTudo) — CONFIRMADO que já
    // cobre os textos N1/N5/N6 do próprio template (ver memória do projeto, sessão
    // 2026-09-08) — e por dw4_gerarParesN1, reescrita pra criar TODOS os pares que não sejam
    // o índice já representado pelo template (ver comentário da própria função).
    const indiceParTemplate = Math.floor((paresN1 - 1) / 2);
    for (const xOff of DW4_PONTOS_X) {
      const yOff = xOff + 4;
      dw4_escreverFloat32(arr, yOff, dw4_lerFloat32(arr, yOff) + offsetsN1[indiceParTemplate] / 25);
    }
    // Seção 2.2 do par NATIVO (representado pelo template + indiceParTemplate, não por
    // dw4_gerarParesN1) também precisa do mesmo deslocamento em X que os pares novos recebem
    // via "off" dentro de dw4_gerarParesN1 — achado sessão 2026-09-08 (2 pares, indiceParTemplate=0,
    // offsetsN1[0]≠0): sem isso a Seção 2.2 do par nativo fica na posição do template original
    // (off=0), errada quando o par que ele representa não é o centralizado
    const offParTemplate = offsetsN1[indiceParTemplate] / 25;
    for (const off of [DW4_OFF_PONTO_SECAO22_X, DW4_OFF_PONTO_SECAO22_CORTE_Y1, DW4_OFF_PONTO_SECAO22_CORTE_Y2, DW4_OFF_PONTO_SECAO22_CORTE_Y3, DW4_OFF_PONTO_SECAO22_CORTE_Y4]) {
      dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + offParTemplate);
    }
    // marcas de camada NATIVAS (Nr=3) da Seção 2.2 (DW4_PONTOS_SECAO22CAMADA_NATIVO_X) —
    // NÃO deslocam com offParTemplate. Tentativa de deslocá-las feita e REVERTIDA na sessão
    // 2026-09-09 (mesmo dia): confirmado com arquivo real corrigido à mão que essas marcas são
    // um diagrama de profundidade fixo na folha, independente do par mostrado — ver comentário
    // detalhado em dw4_anexarCamadaExtra (mesma constante xSecao22Base, mesma reversão).
    // "plantaX" do par nativo — mesmo tratamento "off ± gap" do par novo (ver dw4_gerarParesN1)
    const gapParTemplate = deltaLarguraEstriboX / 2 / 25;
    dw4_escreverFloat32(arr, DW4_OFF_PLANTAX_TEMPLATE_NEG_Y, dw4_lerFloat32(arr, DW4_OFF_PLANTAX_TEMPLATE_NEG_Y) + offParTemplate - gapParTemplate);
    dw4_escreverFloat32(arr, DW4_OFF_PLANTAX_TEMPLATE_POS_Y, dw4_lerFloat32(arr, DW4_OFF_PLANTAX_TEMPLATE_POS_Y) + offParTemplate + gapParTemplate);
    // camadaXPorLado: generalizado pra qualquer Nr (sessão 2026-09-09) — mesma fórmula "X = cx0
    // ∓ (apMeio + dist/25)" já validada em dw4_anexarCamadaExtra (fix de Nr>3, confirmado com
    // arquivos reais Nr=4 e Nr=6). Antes disso, era hardcoded com valores lidos de 2 arquivos
    // reais válidos só pra Nr=3 — o lado "near" (índice 0, cx0-...) já batia exato com essa
    // fórmula; o lado "far" (cx0+...) tinha um resíduo de ~0,0095 unidades de arquivo, dentro da
    // mesma faixa de ruído de arredondamento (~0,005-0,01) já documentada e tida como
    // desprezível em vários outros pontos deste arquivo (ver memória do projeto) — não byte-
    // exato pro far side, mas a diferença é imperceptível na escala de impressão (1:25).
    const camadaXPorLado = [
      Array.from({ length: r.Nr }, (_, indice) => cx0 - (apMeio + distCamada(indice) / 25)),
      Array.from({ length: r.Nr }, (_, indice) => cx0 + (apMeio + distCamada(indice) / 25)),
    ];
    dw4_gerarParesN1(arr, cx0, cy0, paresN1, offsetsN1, deltaLarguraEstriboX, camadaXPorLado);
  }
  // FASE 3 (base nova, sessão 2026-09-09): pares extras em N2 (sentido Y do Estribo, pares
  // variando em X, afetam a Seção 1.1) — mesmo tratamento de dw4_gerarParesN1 acima, com os
  // papéis de X/Y trocados. offsetsN2/deltaLarguraSecao11 já computados mais acima nesta função.
  if (paresN2 > 1) {
    const indiceParTemplateN2 = Math.floor((paresN2 - 1) / 2);
    const offParTemplateN2 = offsetsN2[indiceParTemplateN2] / 25;
    const gapParTemplateN2 = deltaLarguraSecao11 / 2 / 25;
    // Seção 1.1 do par NATIVO precisa do mesmo deslocamento em X que os pares novos recebem
    // via "off" dentro de dw4_gerarParesN2 (espelho do tratamento da Seção 2.2 em N1 acima).
    // CORRIGIDO (sessão 2026-09-09, achado com arquivo de teste isolado — só os 4 pontos do
    // retângulo movidos): o retângulo (CORTE1-4) também precisa encolher/esticar com "gap"
    // (mesma lógica ±(0.76+gap) usada em dw4_gerarParesN2 pro par novo) — só deslocar o centro
    // por offParTemplateN2 mantinha a largura sempre em 2×0,76 do template, nunca aplicando o
    // gap. O ponto NATIVO (barra reta) não leva gap, só o retângulo (2 lados: CORTE1/2 do lado
    // +0,76, CORTE3/4 do lado -0,76).
    dw4_escreverFloat32(arr, DW4_OFF_PONTO_SECAO11X_NATIVO, dw4_lerFloat32(arr, DW4_OFF_PONTO_SECAO11X_NATIVO) + offParTemplateN2);
    for (const off of [DW4_OFF_PONTO_SECAO11X_CORTE1, DW4_OFF_PONTO_SECAO11X_CORTE2]) {
      dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + offParTemplateN2 + gapParTemplateN2);
    }
    for (const off of [DW4_OFF_PONTO_SECAO11X_CORTE3, DW4_OFF_PONTO_SECAO11X_CORTE4]) {
      dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) + offParTemplateN2 - gapParTemplateN2);
    }
    // marcas de camada NATIVAS (Nr=3) da Seção 1.1 (DW4_PONTOS_SECAO11CAMADA_NATIVO_X) — NÃO
    // deslocam com offParTemplateN2. Tentativa de deslocá-las feita e REVERTIDA na sessão
    // 2026-09-09 (mesmo dia): confirmado com arquivo real corrigido à mão que essas marcas são
    // um diagrama de profundidade fixo na folha, independente do par mostrado — ver comentário
    // detalhado em dw4_anexarCamadaExtra (mesma constante xSecao11Base, mesma reversão).
    // "plantaY" do par nativo — mesmo tratamento "off ± gap" do par novo (ver dw4_gerarParesN2)
    dw4_escreverFloat32(arr, DW4_OFF_PLANTAY_TEMPLATE_NEG_X, dw4_lerFloat32(arr, DW4_OFF_PLANTAY_TEMPLATE_NEG_X) + offParTemplateN2 - gapParTemplateN2);
    dw4_escreverFloat32(arr, DW4_OFF_PLANTAY_TEMPLATE_POS_X, dw4_lerFloat32(arr, DW4_OFF_PLANTAY_TEMPLATE_POS_X) + offParTemplateN2 + gapParTemplateN2);
    // resto do conteúdo nativo de N2 (planta baixa) — achado sessão 2026-09-09 comparando com
    // arquivo real corrigido à mão (ver comentário nas constantes acima). NÃO usa DW4_PONTOS_X
    // (mecanismo do N1, removido daqui — estava deslocando conteúdo do N1 por engano).
    for (const off of DW4_PONTOS_CAMADA_Y_GIRADA_NATIVO_X) {
      dw4_escreverFloat32(arr, off + 2, dw4_lerFloat32(arr, off + 2) + offParTemplateN2);
    }
    for (const off of DW4_PONTOS_LEQUE_N2_NATIVO) {
      dw4_escreverFloat32(arr, off + 2, dw4_lerFloat32(arr, off + 2) + offParTemplateN2 + gapParTemplateN2);
      dw4_escreverFloat32(arr, off + 10, dw4_lerFloat32(arr, off + 10) + offParTemplateN2 + gapParTemplateN2);
    }
    dw4_escreverFloat32(arr, DW4_OFF_TICK_N2_NATIVO_VERTICAL + 2, dw4_lerFloat32(arr, DW4_OFF_TICK_N2_NATIVO_VERTICAL + 2) + offParTemplateN2);
    dw4_escreverFloat32(arr, DW4_OFF_TICK_N2_NATIVO_VERTICAL + 10, dw4_lerFloat32(arr, DW4_OFF_TICK_N2_NATIVO_VERTICAL + 10) + offParTemplateN2);
    dw4_escreverFloat32(arr, DW4_OFF_TICK_N2_NATIVO_NEG + 2, dw4_lerFloat32(arr, DW4_OFF_TICK_N2_NATIVO_NEG + 2) + offParTemplateN2);
    dw4_escreverFloat32(arr, DW4_OFF_TICK_N2_NATIVO_NEG + 10, dw4_lerFloat32(arr, DW4_OFF_TICK_N2_NATIVO_NEG + 10) + offParTemplateN2 - gapParTemplateN2);
    dw4_escreverFloat32(arr, DW4_OFF_TICK_N2_NATIVO_POS + 2, dw4_lerFloat32(arr, DW4_OFF_TICK_N2_NATIVO_POS + 2) + offParTemplateN2);
    dw4_escreverFloat32(arr, DW4_OFF_TICK_N2_NATIVO_POS + 10, dw4_lerFloat32(arr, DW4_OFF_TICK_N2_NATIVO_POS + 10) + offParTemplateN2 + gapParTemplateN2);
    for (const off of DW4_PONTOS_TEXTO_N2_NATIVO_X) {
      dw4_escreverFloat32(arr, off + 2, dw4_lerFloat32(arr, off + 2) + offParTemplateN2 + gapParTemplateN2);
    }
    for (const off of DW4_PONTOS_TEXTO_N3N4_NATIVO_X) {
      dw4_escreverFloat32(arr, off + 2, dw4_lerFloat32(arr, off + 2) + offParTemplateN2);
    }
    // camadaYPorLado: generalizado pra qualquer Nr (sessão 2026-09-09), mesmo princípio de
    // camadaXPorLado acima — "Y = cy0 ∓ (bpMeio + dist/25)". Diferente de camadaXPorLado, os
    // valores hardcoded originais (Nr=3) batiam EXATOS com essa fórmula nos dois lados (near e
    // far), sem nenhum resíduo — então aqui não há nem a pequena imprecisão do lado N1.
    const camadaYPorLado = [
      Array.from({ length: r.Nr }, (_, indice) => cy0 - (bpMeio + distCamada(indice) / 25)),
      Array.from({ length: r.Nr }, (_, indice) => cy0 + (bpMeio + distCamada(indice) / 25)),
    ];
    dw4_gerarParesN2(arr, cx0, cy0, paresN2, offsetsN2, deltaLarguraSecao11, camadaYPorLado, bpMeio, inp.tipoPilar === "B", deltaAlturaEstriboX);
    // ajuste de altura pro retângulo em corte Secao 1.1 do par NOVO (criado agora mesmo,
    // acima) — mesma lógica/coeficiente do par nativo, só que esses offsets só existem
    // DEPOIS de dw4_gerarParesN2 rodar (achado sessão 2026-09-10: tentar aplicar isso antes
    // da chamada acima virava no-op silencioso, porque o array ainda não tinha esse conteúdo)
  }
  for (const { off, indice, lado } of DW4_PONTOS_CAMADA_SECAO11_X) {
    const indiceEfetivo = Math.min(indice, r.Nr - 1);
    const deltaTotal = deltaPrimeiraCamada + indiceEfetivo * deltaSr;
    dw4_escreverFloat32(arr, off, dw4_lerFloat32(arr, off) - lado * deltaTotal / 25);
  }

  // cotas de texto da Seção 1.1 (distância da primeira camada + cota adjacente que absorve
  // a diferença) — patch por OFFSET conhecido (não busca por conteúdo, já que "10"/"15"
  // aparecem em várias outras seções do arquivo). Ordem DESCENDENTE de offset, pra não
  // invalidar posições menores quando o texto muda de tamanho
  const fmtCota = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1));
  const cotaCamada = fmtCota(primeiraCamadaAtual);
  const cotaAdjacente = fmtCota(r.Sr);
  // Seção 2.2 primeiro (offsets maiores) — ordem decrescente evita invalidar offsets menores
  dw4_patchTextoNoOffset(arr, 8519, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, 8480, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, 8441, "10", cotaCamada);
  dw4_patchTextoNoOffset(arr, 8402, "10", cotaCamada);
  dw4_patchTextoNoOffset(arr, 8363, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, 8324, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, 8285, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, 8246, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, 8207, "10", cotaCamada);
  dw4_patchTextoNoOffset(arr, 8168, "10", cotaCamada);
  dw4_patchTextoNoOffset(arr, 8129, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, 8090, "15", cotaAdjacente);
  // cotas de texto NATIVAS (Nr=3) da Seção 1.1/2.2, um nível mais interno que as de cima —
  // achadas sessão 2026-09-09 (arquivo real corrigido à mão, usuário reportou "valor da cota
  // errado"): opcodes 0x28,0x06 em offsets estáveis (mesmo cabeçalho fixo do template das
  // marcas de camada nativas, ver DW4_PONTOS_SECAO11CAMADA_NATIVO_X acima). Confirmado com
  // vários testes (par único, Nr>3 isolado, pares-extras num só sentido — todos corretos) que
  // o BUG só aparece com pares-extras nos DOIS sentidos simultaneamente (Nr=15, 2+2 pares):
  // duas cotas adjacentes trocam de valor entre si ("10"↔"15"), sem causa raiz identificada
  // com certeza (suspeita não confirmada: alguma interação de comprimento de texto entre os
  // patches de N3-N6/25x60 mais abaixo, que só muda de tamanho nesse combo específico). Em vez
  // de perseguir a causa, corrige direto pela GEOMETRIA da própria cota (p2x-p1x, convertido
  // pra cm) — o vão sempre bate com primeiraCamadaAtual OU r.Sr, então o texto certo é sempre
  // determinável independente de como ele ficou errado. Roda incondicional (sem custo quando
  // já está certo) e é seguro (confere opcode e tamanho de string antes de escrever).
  // NOTA sessão 2026-09-11: este array tinha um off-by-one (opcode 0x28,0x06 real fica em
  // off+1). CORRIGIR o off-by-one sozinho não bastou — reativar o mecanismo passou a escrever
  // "10" (não "15" nem "22.5") nessas 12 cotas, e um arquivo real corrigido à mão (Seção 1.1)
  // não tem MAIS esse grupo de 12 registros na posição nativa — só sobra UM grupo de 12 cotas
  // "22.5"/"15" no lugar que hoje corresponde aos offsets antigos DW4_PATCH_COTA_SECAO_OFFSETS
  // (ver abaixo, ainda por remapear pra base nova). Suspeita não confirmada: os dois grupos
  // (nativo aqui + old-offset lá embaixo) podem ser o MESMO conteúdo conceitual, um deles
  // sobrando/duplicado — não mexer aqui sem entender a relação entre os dois primeiro.
  // Off-by-one corrigido pra referência futura, mas o mecanismo continua DESLIGADO até
  // entender por que dá "10" em vez do valor certo.
  const OFFSETS_COTA_CAMADA_NATIVA_SECAO = [];
  for (const off of OFFSETS_COTA_CAMADA_NATIVA_SECAO) {
    const opOk = arr[off] === 0x28 && arr[off + 1] === 0x06;
    const strlen = arr[off + 35] | (arr[off + 36] << 8);
    const p1x = dw4_lerFloat32(arr, off + 2);
    const p2x = dw4_lerFloat32(arr, off + 10);
    const vaoCm = Math.abs(p2x - p1x) * 25;
    const correto = Math.abs(vaoCm - primeiraCamadaAtual) < Math.abs(vaoCm - r.Sr) ? cotaCamada : cotaAdjacente;
    if (!opOk) continue;
    if (strlen !== 2) continue;
    const bytesNovo = dw4_stringParaBytes(correto);
    if (bytesNovo.length !== 2) continue;
    arr[off + 37] = bytesNovo[0];
    arr[off + 38] = bytesNovo[1];
  }
  // DESLIGADOS (sessão 2026-09-10) — mesma causa confirmada do bloco X acima: [0]=2635 cai
  // exatamente no byte "flag" de um TXT (estraga flag+len+pad+1º char da string), [1]=2700
  // cai numa região sem nenhum registro catalogado (nem PT/RECT/SEG/TXT/COTA alinhado por
  // perto). Não reativar sem remapear via arquivo real (pilar 1 par só, d bem diferente de
  // 20cm — ver DW4_PONTOS_PONTA_INDICACAO_X acima pro mesmo diagnóstico em X).
  // dw4_escreverFloat32(arr, DW4_PONTOS_PONTA_INDICACAO_Y[0], dw4_lerFloat32(arr, DW4_PONTOS_PONTA_INDICACAO_Y[0]) - deltaPrimeiraCamada / 25);
  // dw4_escreverFloat32(arr, DW4_PONTOS_PONTA_INDICACAO_Y[1], dw4_lerFloat32(arr, DW4_PONTOS_PONTA_INDICACAO_Y[1]) + deltaPrimeiraCamada / 25);

  // Tabela "ARMADURA DE COLAPSO" — dados calculados (r.complementoColapso, mesma ordem de
  // DIAMS_COL). BIT já é fixo no template (igual DIAMS_COL), só QUANT/COMP(X)/COMP(Y) mudam.
  // Precisa rodar ANTES dos patches de texto por busca (P1/25x60/inferiro logo abaixo), já
  // que esses podem mudar de tamanho e invalidariam os offsets fixos daqui — mesma cautela já
  // usada pras cotas da Seção 1.1 acima. Ordem decrescente de offset dentro de cada tabela.
  if (r.complementoColapso && r.complementoColapso.length === DW4_TABELA_COLAPSO.length) {
    const celulasColapso = [];
    DW4_TABELA_COLAPSO.forEach((cel, i) => {
      const dado = r.complementoColapso[i];
      celulasColapso.push({ off: cel.compYOff, de: cel.compYDe, novo: `${Math.round(dado.comprimentoMinY)} CM` });
      celulasColapso.push({ off: cel.compXOff, de: cel.compXDe, novo: `${Math.round(dado.comprimentoMinX)} CM` });
      celulasColapso.push({ off: cel.quantOff, de: cel.quantDe, novo: String(dado.n) });
    });
    celulasColapso.sort((a, b) => b.off - a.off);
    for (const { off, de, novo } of celulasColapso) {
      dw4_patchTextoNoOffset(arr, off, de, novo);
    }
  }

  // Q= (byte[5]) representa o TOTAL de estribos da barra, não só Nr (camadas) — precisa
  // multiplicar por quantos estribos existem POR camada em cada sentido (pode ser mais que
  // 2 se houver múltiplos pares no sentido menor). Replica a mesma lógica de PuncaoDiagram
  const diamTxt = (d) => (Number.isInteger(d) ? `${d}.0` : String(d));
  const estribosXPorCamada = (r.menorEhX ? r.gruposMenor * r.ladosMenor : r.gruposMaior * r.ladosMaior);
  const estribosYPorCamada = (r.menorEhX ? r.gruposMaior * r.ladosMaior : r.gruposMenor * r.ladosMenor);
  const qtdEstriboX = estribosXPorCamada * r.Nr;
  const qtdEstriboY = estribosYPorCamada * r.Nr;
  const larguraEstriboXArred = Math.round(r.larguraEstriboX);
  const alturaEstriboXArred = Math.round(r.alturaEstriboX);
  const larguraEstriboYArred = Math.round(r.larguraEstriboY);
  const alturaEstriboYArred = Math.round(r.alturaEstriboY);
  const compEstriboX = Math.round(2 * (larguraEstriboXArred + alturaEstriboXArred) + 17);
  const compEstriboY = Math.round(2 * (larguraEstriboYArred + alturaEstriboYArred) + 17);
  dw4_patchEstribo(arr, DW4_OFF_N1, qtdEstriboX, r.Sr, larguraEstriboXArred, alturaEstriboXArred, inp.diamEstribo, inp.h, 11.2);
  dw4_patchEstribo(arr, DW4_OFF_N2, qtdEstriboY, r.Sr, larguraEstriboYArred, alturaEstriboYArred, inp.diamEstribo, inp.h, 9.2);
  // legenda solta "N1/N2 #Øc/Sr <TAB> C=.. Q=.." desenhada do lado da Seção 2.2 — achado sessão
  // 2026-09-23 (já tinha aparecido sem investigar na rodada 4 de 2026-09-15, mesmos valores
  // C=131→135/C=135→91 num teste totalmente diferente — ap=80/3-pares aqui vs ap=100/2-pares lá,
  // confirmando que não depende de ap/pares, só de h/cobrimento/diamEstribo/Nr, que coincidiram
  // nos 2 testes). Esse texto é SOLTO, nunca esteve vinculado aos campos estruturais que
  // dw4_patchEstribo grava (aqueles já iam certos pra TABELA do S4CAD) — sempre saía com o
  // default cru do template (C=131 Q=6 / C=135 Q=6), que só bate com a realidade por coincidência
  // quando a caixa do Estribo X/Y tem exatamente as dimensões do template. Corrigido reescrevendo
  // com os MESMOS C/Q já calculados acima pra dw4_patchEstribo.
  const dw4_novoTextoN1Malha = `N1 #${diamTxt(inp.diamEstribo)}c/${Math.round(r.Sr)}\tC=${compEstriboX} Q=${qtdEstriboX}`;
  const dw4_novoTextoN2Malha = `N2 #${diamTxt(inp.diamEstribo)}c/${Math.round(r.Sr)}\tC=${compEstriboY} Q=${qtdEstriboY}`;
  dw4_patchTexto(arr, "N1 #8.0c/15\tC=131 Q=6", dw4_novoTextoN1Malha);
  dw4_patchTexto(arr, "N2 #8.0c/15\tC=135 Q=6", dw4_novoTextoN2Malha);

  const compY = Math.round(r.menorEhX ? r.comprMaiorSentido : r.comprMenorSentido);
  const compX = Math.round(r.menorEhX ? r.comprMenorSentido : r.comprMaiorSentido);
  // N3=inferior Y, N4=superior Y, N5=inferior X, N6=superior X — só inferior usa a bitola
  // do usuário; superior é sempre construtivo (10mm), mesma convenção do app
  dw4_patchComprimento(arr, DW4_OFF_N3, compY, inp.diamPortaInferior);
  dw4_patchComprimento(arr, DW4_OFF_N4, compY, DIAM_PORTA_SUPERIOR);
  dw4_patchComprimento(arr, DW4_OFF_N5, compX, inp.diamPortaInferior);
  dw4_patchComprimento(arr, DW4_OFF_N6, compX, DIAM_PORTA_SUPERIOR);
  const qtdPortaX = 2 * paresN1;
  const qtdPortaY = 2 * paresN2;
  dw4_patchQtdPortaEstribo(arr, DW4_OFF_N3, qtdPortaY);
  dw4_patchQtdPortaEstribo(arr, DW4_OFF_N4, qtdPortaY);
  dw4_patchQtdPortaEstribo(arr, DW4_OFF_N5, qtdPortaX);
  dw4_patchQtdPortaEstribo(arr, DW4_OFF_N6, qtdPortaX);

  // índice numérico do pilar (byte[27] de cada registro 0x07, originalmente 0x01 em
  // todos) — controla a identificação do pilar na TABELA do S4 (ex: "P1"→"P5"). Confirmado
  // por comparação isolada (usuário editou manualmente todas as barras da tabela P1->P5):
  // byte[27] muda de 1 pra 5 em TODOS os 7 registros N1-N7. bytes[3]/[4] NÃO devem ser
  // mexidos (controlam outra coisa — "Agr"/"Rep" — e já causaram bug quando alterados)
  const numeroPilar = (() => {
    const m = String(inp.nome || "").match(/\d+/);
    const n = m ? parseInt(m[0], 10) : 1;
    return n >= 1 && n <= 255 ? n : 1;
  })();
  for (const off of [DW4_OFF_N1, DW4_OFF_N2, DW4_OFF_N3, DW4_OFF_N4, DW4_OFF_N5, DW4_OFF_N6, DW4_OFF_N7]) {
    if (off != null) arr[off + 27] = numeroPilar;
  }

  // textos de comprimento (modelo original: N3/N4 C=207, N5/N6 C=172) — do FIM pro COMEÇO
  // do arquivo, pra não invalidar os offsets dos textos anteriores quando o tamanho muda
  // (diamTxt já definido mais acima, reaproveitado aqui pra legenda N3-N6)
  // quantidade de barras de N3-N6 dobra (2 -> 4 -> ...) por par extra: cada par de estribo
  // precisa da sua própria porta-estribo (superior+inferior), não compartilha com os outros
  // pares. Confirmado por comparação com arquivo de referência ajustado manualmente (2 pares)
  // — qtdPortaX/qtdPortaY já calculados acima (usados também pro byte[5] estrutural)
  const dw4_novoTextoN6 = `N6 ${qtdPortaX}#${diamTxt(DIAM_PORTA_SUPERIOR)} C=${compX}`;
  const dw4_novoTextoN5 = `N5 ${qtdPortaX}#${diamTxt(inp.diamPortaInferior)} C=${compX}`;
  const dw4_novoTextoN4 = `N4 ${qtdPortaY}#${diamTxt(DIAM_PORTA_SUPERIOR)} C=${compY}`;
  const dw4_novoTextoN3 = `N3 ${qtdPortaY}#${diamTxt(inp.diamPortaInferior)} C=${compY}`;
  dw4_patchTexto(arr, "N6 2#10.0 C=172", dw4_novoTextoN6);
  dw4_patchTexto(arr, "N5 2#10.0 C=172", dw4_novoTextoN5);
  dw4_patchTexto(arr, "N4 2#10.0 C=207", dw4_novoTextoN4);
  dw4_patchTexto(arr, "N3 2#10.0 C=207", dw4_novoTextoN3);
  // pilar circular: legenda "#{diâmetro}" em vez de "{ap}x{bp}" — confirmado nos 3 arquivos
  // reais de pilar redondo (30/40/50cm): o byte literal é ASCII '#' (0x23), não um símbolo Ø
  // de verdade — a fonte do S4CAD que renderiza esse glyph como Ø, então "#" é o texto certo
  // a gravar (visto igual nos 3 diâmetros testados). `dw4_novoLabelApBp` (usado pra achar o
  // bloco de cota da Seção 1.1/2.2 dinamicamente, ver mais abaixo) tem a MESMA condicional,
  // já que precisa buscar exatamente o texto que foi gravado aqui.
  dw4_patchTexto(arr, "25x60", inp.formaCircular ? `#${inp.diametro}` : `${inp.ap}x${inp.bp}`);
  dw4_patchTextoIsoladoTodasOcorrencias(arr, "25", String(inp.h));
  // a cota "25"→h acima só troca o TEXTO — a linha em si (COTA 0x28,0x06) continua do
  // tamanho fixo do template (25cm), então pra h≠25 o desenho mostrava uma linha de 25cm
  // rotulada com o h real (inconsistente). Achado sessão 2026-09-11 comparando um arquivo
  // real onde o usuário reverteu o texto pra "25" achando estranho a linha não ter mudado.
  // CORRIGIDO (sessão 2026-09-12): a suposição original de que p1y (topo) fica FIXO estava
  // errada — descobrimos depois (mesma rodada, fix da caixa da Seção 2.2) que o topo da caixa
  // que essa cota mede TAMBÉM se desloca, por +Δh/2/25 (não fica parado), enquanto a base
  // desce por -Δh/2/25 (metade do delta cada lado, não o delta inteiro só embaixo) — mesma
  // convenção simétrica já usada pra caixa. Com p1y fixo, a linha tinha o comprimento certo
  // (35cm) mas na posição errada (não alinhada com a caixa/seção da laje, que sobe por cima) —
  // exatamente o que o usuário reportou ("cota da espessura da laje ficou desalinhada com a
  // seção da laje"). Confirmado com arquivo real: p1y bate exato com +Δh/2/25, p2y/p3y com
  // -Δh/2/25 (mesmos valores da caixa vizinha). As 2 ocorrências (Seção 1.1 e 2.2) são as
  // mesmas 2 cotas "25" isoladas de sempre
  for (const off of [2949, 4799]) {
    const deltaH25Metade = (inp.h - H_TEMPLATE) / 2 / 25;
    dw4_escreverFloat32(arr, off + 6, dw4_lerFloat32(arr, off + 6) + deltaH25Metade); // p1y
    dw4_escreverFloat32(arr, off + 14, dw4_lerFloat32(arr, off + 14) - deltaH25Metade); // p2y
    dw4_escreverFloat32(arr, off + 22, dw4_lerFloat32(arr, off + 22) - deltaH25Metade); // p3y
  }
  dw4_patchTextoTodasOcorrencias(arr, "inferiro", "inferior");
  if (inp.nome && inp.nome !== "P1") {
    dw4_patchTextoIsoladoTodasOcorrencias(arr, "P1", inp.nome);
    dw4_patchTextoIsoladoTodasOcorrencias(arr, "PUNCAO P1", `PUNCAO ${inp.nome}`);
  }

  // remove a hachura e os blocos de ziguezague por último (depois de tudo que dependia
  // da posição original deles) — FASE 1 (base nova): a base "DETBASEPUNCAO" já não tem
  // hachura nem ziguezague (usuário apagou antes de salvar), então pula os dois. Restaurar
  // as duas chamadas se voltar a usar a base antiga.
  // dw4_removerHachura(arr, DW4_OFF_HACHURA);
  // dw4_removerZigzags(arr);

  // camadas além da 3ª (que o template já suporta nativamente) — anexadas no FINAL do
  // arquivo, confirmado seguro por comparação real (S4CAD aceita registros novos
  // anexados sem quebrar a leitura, desde que nada no meio seja alterado)
  if (r.Nr > 3) {
    for (let indice = 3; indice < r.Nr; indice++) {
      dw4_anexarCamadaExtra(arr, cx0, cy0, indice, primeiraCamadaAtual, r.Sr, apMeio, bpMeio, fmtCota(r.Sr), paresN1, offsetsN1, paresN2, offsetsN2, inp.tipoPilar === "B");
    }
  }

  // ajuste de altura pro retângulo em corte Secao 1.1 do(s) par(es) novo(s) de N2: MOVIDO pra
  // dentro de dw4_gerarParesN2 (sessão 2026-09-16, achado com 3 pares — ver comentário lá).
  // Antes rodava aqui com 5 offsets fixos calibrados só pro caso de exatamente 1 par extra;
  // quebrava (corrompia registros de outra iteração) com 2+ pares extras (totalPares>=3).

  // Seção 2.2: cotas de camada nativas — MESMO grupo conceitual do bloco desligado
  // OFFSETS_COTA_CAMADA_NATIVA_SECAO (mais acima), mas agora com offsets confirmados por um
  // arquivo real (sessão 2026-09-12: usuário reportou "as cotas do estribos da seção 2.2 tb
  // estavam errados" — só a caixa de y≈4,908/5,158, offsets 5130-5325; a caixa irmã de
  // y≈9,604/9,854 em 4896-5091 já mostrava o mesmo texto nos dois arquivos, não mexida aqui
  // por falta de evidência). Rodando aqui no FINAL (não junto do bloco desligado lá em cima)
  // pelo MESMO motivo do bloco de pares N2 logo acima: dw4_patchTextoNoOffset usa arr.splice,
  // então pode mudar o tamanho do texto ("15"->"22.5", 2 pra 4 chars) — só é seguro depois que
  // TUDO que usa offset fixo ≥ 5130 já rodou (o único caso: offset 7311+ acima, só quando
  // paresN2>1). Ordem DESCENDENTE (maior offset primeiro), mesma razão do bloco de offsets
  // antigos (8090-8519) mais acima: não invalidar os offsets menores do próprio grupo antes de
  // usá-los. dw4_patchTextoNoOffset já confere o texto atual antes de trocar (no-op seguro se
  // não bater, ex. se algum dia a caixa de Seção 1.1 precisar disso também com texto diferente)
  // GEOMETRIA das mesmas 6 cotas (sessão 2026-09-12, rodada seguinte): usuário confirmou "o
  // valor da cota esta certa, mas a posição não esta alinhada com os estribos" — o fix acima
  // só trocava o TEXTO; a LINHA (p1x/p2x/p3x) continuava no vão do template (Sr=15, sempre
  // 0,6 de vão), agora rotulada "22.5" mas com só 0,6 (15cm) de vão real — mesma categoria do
  // bug do h-cota (sessão 2026-09-11). Recalculado por FÓRMULA (não por delta sobre o valor do
  // template, já que o vão certo depende de r.Sr multiplicativamente, não aditivamente):
  // borda do pilar (lida de DW4_OFF_PONTO_SECAO22_X, já com todos os deltas de pilar/Δh
  // aplicados até aqui) ± bpMeio dá a face do pilar; cada cota seguinte se afasta por
  // distCamada(indice)/25 (mesma função já usada por camadaXPorLado/camadaYPorLado). Y de
  // todas as 6 (p1y/p2y/p3y) sobe por +Δh/2/25, igual à borda de cima da caixa (mesmo grupo
  // Δh já corrigido antes nesta sessão). Verificado com o arquivo real: bate exato (36,717/
  // 37,617/38,517/39,117/40,117/40,717/41,617/42,517)
  // localização DINÂMICA do bloco de 12 cotas acima (Seção 1.1 + 2.2) — achado sessão
  // 2026-09-14 (usuário reportou "pilares com dimensão menor que 100cm não está cotando os
  // estribos", testes E40 H50/H80/H110/H150, ap=25 fixo): o registro COTA(0x28,0x06) desse
  // bloco começa IMEDIATAMENTE após o texto "{ap}x{bp}" no arquivo, sem nenhum byte de gap
  // (confirmado por hex dump). Os offsets hardcoded usados originalmente (4896 em diante) só
  // batiam pro comprimento de label com que esse bloco foi calibrado na sessão 2026-09-12 —
  // qualquer "ap x bp" de comprimento DIFERENTE (ex: "25x80"=5 chars vs "25x110"=6 chars)
  // desalinha o grupo inteiro: a escrita de geometria vira lixo (floats desalinhados, ~1e-28) e
  // os patches de texto (protegidos por conferência prévia) silenciosamente não fazem nada,
  // deixando "15"/"10" do template. Localiza "{ap}x{bp}" (já trocado, ver dw4_patchTexto "25x60"
  // mais acima) AQUI — depois de TODOS os patches de texto anteriores (N3-N6, "25"→h, P1→nome,
  // inferiro→inferior) já terem rodado — e não logo após a troca do label, porque o patch de
  // nome do pilar (P1→nome) roda DEPOIS do label e tem uma ocorrência bem perto (offset ~4865
  // no template), então localizar cedo demais ainda ficava sujeito a esse deslocamento (achado
  // testando com nome="P41": o fix funcionava pra ap/bp mas quebrava de novo com a legenda
  // trocada). Localizando aqui, depois de tudo, é imune a qualquer comprimento de texto anterior
  // nesta função. Stride de 39 bytes por registro (12 registros consecutivos, sem gap entre os
  // dois grupos) confirmado idêntico em todos os arquivos de teste.
  const dw4_novoLabelApBp = inp.formaCircular ? `#${inp.diametro}` : `${inp.ap}x${inp.bp}`;
  const dw4_idxLabelApBp = dw4_encontrarSequencia(arr, dw4_stringParaBytes(dw4_novoLabelApBp));
  const dw4_primeiroOffsetCota = dw4_idxLabelApBp !== -1 ? dw4_idxLabelApBp + dw4_novoLabelApBp.length : 4896;
  const dw4_offCota = (indiceRegistro) => dw4_primeiroOffsetCota + indiceRegistro * 39;
  // correção do MESMO tipo de bug pra DW4_OFF_PONTO_SECAO22_X/SECAO11X_NATIVO — achado sessão
  // 2026-09-14 (usuário reportou "quando mudamos a legenda do pilar o arquivo fica com bug",
  // testes P1/P10/P145/P99: P1 abre certo, P10 abre com uma linha roxa/diagonal e trava ao
  // editar, P145 dá erro de leitura no S4 e trava ao imprimir, P99 nem abre). Causa: o patch
  // `P1→nome` (mais abaixo, `dw4_patchTextoIsoladoTodasOcorrencias`) tem 3 ocorrências isoladas
  // no arquivo, em posições ORIGINAIS (nome="P1") estáveis: 2947, 3545, 4863 — confirmado nos 4
  // arquivos de teste do usuário (idênticos exceto o nome). As escritas em
  // DW4_OFF_PONTO_SECAO22_X (3721) e DW4_OFF_PONTO_SECAO11X_NATIVO (2990) — mais acima nesta
  // função, linhas ~3467-3803 — rodam ANTES do patch de nome, então gravam certo. Mas a LEITURA
  // final (linhas abaixo, usada pra calcular a geometria das cotas de estribo) roda DEPOIS do
  // patch de nome — nesse momento essas duas posições fixas já mudaram: 3721 está depois das 2
  // primeiras ocorrências de "P1" (2947 e 3545), 2990 está depois só da 1ª (2947). Ler no offset
  // velho pega bytes de outro registro (geometria virando lixo, exatamente como no bug da cota
  // antes de ser corrigido) — some daí a "linha roxa"/corrupção que piora com o nome mais longo.
  // Corrigido deslocando a leitura pelo mesmo delta que o patch de nome introduziu antes desse
  // ponto (2 ocorrências pra SECAO22_X, 1 pra SECAO11X_NATIVO).
  // Resíduo do bug#3 que ACABOU acontecendo (sessão do pilar de borda): N3-N6 "C=XXX" saindo com
  // um dígito a mais/menos que os defaults do template (C=207/C=207/C=172/C=172, todos originais
  // de 3 dígitos) — ex.: pilar de borda com C=96 (2 dígitos) no sentido com face livre — desloca
  // tudo que vem depois desse bloco de texto (offset original 3036, o mais cedo dos 4 registros
  // N3-N6), incluindo a 2ª/3ª ocorrência de "P1" (3545/4863) e a leitura de SECAO22_X (3721).
  // Corrigido somando o delta de comprimento real de cada um dos 4 textos (novo - template
  // original) à mesma lógica de shift, condicionado a offsetOriginal vir depois do bloco N3-N6.
  const DW4_POS_P1_OCORRENCIAS = [2947, 3545, 4863];
  const DW4_ORIG_OFF_N3A_N6_TEXTO = 3036;
  // offset original (fix4_original.DW4) do registro TXT200e "N1 #8.0c/15\tC=131 Q=6" — a legenda
  // solta da malha N1/N2 corrigida acima, mesma classe de bug (ver comentário lá)
  const DW4_ORIG_OFF_N1N2_MALHA_TEXTO = 606;
  const dw4_deltaNome = inp.nome && inp.nome !== "P1" ? String(inp.nome).length - 2 : 0;
  const dw4_deltaN1N2Malha =
    (dw4_novoTextoN1Malha.length - "N1 #8.0c/15\tC=131 Q=6".length) +
    (dw4_novoTextoN2Malha.length - "N2 #8.0c/15\tC=135 Q=6".length);
  const dw4_deltaN3aN6 =
    (dw4_novoTextoN3.length - "N3 2#10.0 C=207".length) +
    (dw4_novoTextoN4.length - "N4 2#10.0 C=207".length) +
    (dw4_novoTextoN5.length - "N5 2#10.0 C=172".length) +
    (dw4_novoTextoN6.length - "N6 2#10.0 C=172".length);
  const dw4_shiftPorNome = (offsetOriginal) =>
    dw4_deltaNome * DW4_POS_P1_OCORRENCIAS.filter((p) => p < offsetOriginal).length +
    (offsetOriginal > DW4_ORIG_OFF_N1N2_MALHA_TEXTO ? dw4_deltaN1N2Malha : 0) +
    (offsetOriginal > DW4_ORIG_OFF_N3A_N6_TEXTO ? dw4_deltaN3aN6 : 0);

  // Pilar de borda: indicador de corte "2" (registro nunca catalogado antes, opcode 0x1f,0x14 —
  // irmão do TXT1f13 só que com 1 no lugar de 0x13, mesmo layout: op+5 floats+flag+slen+pad+texto)
  // que aponta a Seção 2.2 na planta baixa — só o de cima (Y>0, offset original 4149, achado
  // decodificando o template puro via window.__DW4_TEMPLATE_B64) precisa mover; o de baixo
  // (Y<0, offset original 4103) fica parado nos 2 arquivos reais comparados. Achado sessão
  // 2026-09-23 (P1_puncao(7), 3 pares) e RE-CONFIRMADO com o par P1_puncao(6)/round 10 (mesma
  // config, achado retroativamente — "mover a posição da legenda na planta baixa" era ESTE
  // registro, nunca antes decodificado). 2 amostras reais, mesma config nominal (ap=80/bp=25/
  // h=25/Fk=25/Nr=3/3 pares), pequena variação entre elas (Y: -20,98cm vs -22,03cm; X: +0,47cm vs
  // +0,73cm) — provavelmente imprecisão de arraste manual no S4CAD, não uma dependência real de
  // outra variável (não bate com boxShiftCm nem nenhuma constante já usada no arquivo). Usando a
  // MÉDIA das 2 amostras como constante fixa até um 3º arquivo real confirmar/refinar — bug
  // cosmético (só a legenda, não afeta tabela nem geometria estrutural), risco baixo.
  if (inp.tipoPilar === "B") {
    const dw4_offIndicacaoSecao22 = 4149 + dw4_shiftPorNome(4149);
    dw4_escreverFloat32(arr, dw4_offIndicacaoSecao22 + 2, dw4_lerFloat32(arr, dw4_offIndicacaoSecao22 + 2) + 0.024105);
    dw4_escreverFloat32(arr, dw4_offIndicacaoSecao22 + 6, dw4_lerFloat32(arr, dw4_offIndicacaoSecao22 + 6) - 0.860143);
  }

  // Pilar de borda, par do sentido maior reposicionado (ver bloco irmão logo após
  // dw4_reposicionarTudo, mesma justificativa/fórmula): o retângulo em corte da Seção 2.2 (4
  // cantos, opcode RECT com tail 4.71/4.71 — o mesmo grupo do mecanismo deltaAlturaEstriboX/Y
  // do bug #2) também precisa acompanhar o deslocamento, mas em X (não Y — view girada). Mesma
  // fórmula base (menorDim/2 − posicoesMaior[0]), resíduo "+2,5" em vez de "+3,5" — 2,5 =
  // MAIOR_BITOLA_PILAR_CM, bateu EXATO nos 2 arquivos reais (100x25 e 60x30: -10,5cm e -8,0cm).
  // Fica aqui (depois de dw4_shiftPorNome) porque o offset original (3879+) já é depois do
  // bloco de texto N3-N6 — precisa da mesma correção de deslocamento por tamanho de texto.
  if (inp.tipoPilar === "B" && r.maiorGrupoReposicionado && r.posicoesMaior && r.posicoesMaior.length === 1) {
    const menorDimAtual = r.menorEhX ? inp.ap : inp.bp;
    const boxShiftCm = menorDimAtual / 2 - r.posicoesMaior[0];
    const rectShiftFU = (boxShiftCm + 2.5) / 25;
    for (const offOriginal of [3879, 3907, 3935, 3963]) {
      const offAtual = offOriginal + dw4_shiftPorNome(offOriginal);
      dw4_escreverFloat32(arr, offAtual + 2, dw4_lerFloat32(arr, offAtual + 2) + rectShiftFU);
    }
  }

  // Pilar de borda: uma linha guia (SEG0b04, offset original 4129, depois do bloco de texto
  // N3-N6 — precisa de dw4_shiftPorNome). Sessão 2026-09-14 tinha usado o mesmo deslocamento do
  // N3/N4 (n3n4ShiftFU) por bater nos 2 arquivos de então — sessão 2026-09-15 (arquivo
  // AJUSTADO.DW4 real, hand-corrigido com mais cuidado) mostrou que NÃO é o mesmo: esse registro
  // foi deletado e redesenhado do zero (reapareceu no FIM do arquivo do usuário, não na posição
  // original), valor final -0,9545 (file units) do template — bem diferente do n3n4ShiftFU
  // (~-3,05). Ajustado pro valor certo desse único caso (bp=25); SEM um segundo ponto de dado
  // ainda pra virar fórmula — se aparecer um arquivo de referência com bp≠25, reverificar.
  if (inp.tipoPilar === "B") {
    const offGuiaAtual = 4129 + dw4_shiftPorNome(4129);
    const guiaShiftFU = -0.9545;
    dw4_escreverFloat32(arr, offGuiaAtual + 6, dw4_lerFloat32(arr, offGuiaAtual + 6) + guiaShiftFU);
    dw4_escreverFloat32(arr, offGuiaAtual + 14, dw4_lerFloat32(arr, offGuiaAtual + 14) + guiaShiftFU);
  }

  const xSecao22Atual = dw4_lerFloat32(arr, DW4_OFF_PONTO_SECAO22_X + dw4_shiftPorNome(DW4_OFF_PONTO_SECAO22_X));
  const xPilarSecao22Esq = xSecao22Atual - bpMeio;
  const xPilarSecao22Dir = xSecao22Atual + bpMeio;
  const bordasEsq = [0, 1, 2].map((i) => xPilarSecao22Esq - distCamada(i) / 25);
  const bordasDir = [0, 1, 2].map((i) => xPilarSecao22Dir + distCamada(i) / 25);
  const deltaH25MetadeCota = (inp.h - H_TEMPLATE) / 2 / 25;
  const cotaSecao22Geom = [
    { off: dw4_offCota(6), x1: bordasEsq[2], x2: bordasEsq[1] },
    { off: dw4_offCota(7), x1: bordasEsq[1], x2: bordasEsq[0] },
    { off: dw4_offCota(8), x1: bordasEsq[0], x2: xPilarSecao22Esq },
    { off: dw4_offCota(9), x1: xPilarSecao22Dir, x2: bordasDir[0] },
    { off: dw4_offCota(10), x1: bordasDir[0], x2: bordasDir[1] },
    { off: dw4_offCota(11), x1: bordasDir[1], x2: bordasDir[2] },
  ];
  for (const { off, x1, x2 } of cotaSecao22Geom) {
    dw4_escreverFloat32(arr, off + 2, x1); // p1x
    dw4_escreverFloat32(arr, off + 10, x2); // p2x
    dw4_escreverFloat32(arr, off + 18, x2); // p3x (espelha p2x)
    dw4_escreverFloat32(arr, off + 6, dw4_lerFloat32(arr, off + 6) + deltaH25MetadeCota); // p1y
    dw4_escreverFloat32(arr, off + 14, dw4_lerFloat32(arr, off + 14) + deltaH25MetadeCota); // p2y
    dw4_escreverFloat32(arr, off + 22, dw4_lerFloat32(arr, off + 22) + deltaH25MetadeCota); // p3y
  }
  // +35: dw4_patchTextoNoOffset espera o offset APONTANDO pro prefixo de tamanho (2 bytes) +
  // texto logo em seguida — no registro COTA (0x28,0x06) esse prefixo fica em off+35/+36, não
  // no início do registro (opcode+8 floats = 34 bytes antes dele)
  dw4_patchTextoNoOffset(arr, dw4_offCota(11) + 35, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, dw4_offCota(10) + 35, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, dw4_offCota(9) + 35, "10", cotaCamada);
  dw4_patchTextoNoOffset(arr, dw4_offCota(8) + 35, "10", cotaCamada);
  dw4_patchTextoNoOffset(arr, dw4_offCota(7) + 35, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, dw4_offCota(6) + 35, "15", cotaAdjacente);

  // Seção 1.1: MESMA caixa gêmea (offsets 4896-5091), agora confirmada por arquivo real
  // (sessão 2026-09-12, rodada seguinte: usuário "faltou ajustar as cotas dos estribos na
  // seção 1.1 igual como foi ajustado na 2.2") — a caixa que antes não tinha evidência de bug
  // (mesmo texto nos dois arquivos) finalmente foi confirmada precisando do MESMO fix
  // texto+geometria, só trocando a referência de bp/DW4_OFF_PONTO_SECAO22_X por
  // ap/DW4_OFF_PONTO_SECAO11X_NATIVO (Seção 1.1 usa o eixo X = ap do pilar, Seção 2.2 usa o
  // eixo Y = bp — mesmo centro 39,6165 nos dois casos, só o meio-vão que muda: apMeio vs
  // bpMeio). Mesma ordem near/middle/far por lado confirmada pelo texto nativo do template
  // (4896/4935=Sr, 4974=primeiraCamada do lado esquerdo; 5013=primeiraCamada, 5052/5091=Sr do
  // lado direito — idêntico ao padrão da caixa de 2.2). Verificado com o arquivo real: bate
  // exato (35,217/36,117/37,017/37,617/41,617/42,217/43,117/44,017), y=9,804/10,054
  const xSecao11Atual = dw4_lerFloat32(arr, DW4_OFF_PONTO_SECAO11X_NATIVO + dw4_shiftPorNome(DW4_OFF_PONTO_SECAO11X_NATIVO));
  const xPilarSecao11Esq = xSecao11Atual - apMeio;
  const xPilarSecao11Dir = xSecao11Atual + apMeio;
  const bordasEsq11 = [0, 1, 2].map((i) => xPilarSecao11Esq - distCamada(i) / 25);
  const bordasDir11 = [0, 1, 2].map((i) => xPilarSecao11Dir + distCamada(i) / 25);
  const cotaSecao11Geom = [
    { off: dw4_offCota(0), x1: bordasEsq11[2], x2: bordasEsq11[1] },
    { off: dw4_offCota(1), x1: bordasEsq11[1], x2: bordasEsq11[0] },
    { off: dw4_offCota(2), x1: bordasEsq11[0], x2: xPilarSecao11Esq },
    { off: dw4_offCota(3), x1: xPilarSecao11Dir, x2: bordasDir11[0] },
    { off: dw4_offCota(4), x1: bordasDir11[0], x2: bordasDir11[1] },
    { off: dw4_offCota(5), x1: bordasDir11[1], x2: bordasDir11[2] },
  ];
  for (const { off, x1, x2 } of cotaSecao11Geom) {
    dw4_escreverFloat32(arr, off + 2, x1); // p1x
    dw4_escreverFloat32(arr, off + 10, x2); // p2x
    dw4_escreverFloat32(arr, off + 18, x2); // p3x (espelha p2x)
    dw4_escreverFloat32(arr, off + 6, dw4_lerFloat32(arr, off + 6) + deltaH25MetadeCota); // p1y
    dw4_escreverFloat32(arr, off + 14, dw4_lerFloat32(arr, off + 14) + deltaH25MetadeCota); // p2y
    dw4_escreverFloat32(arr, off + 22, dw4_lerFloat32(arr, off + 22) + deltaH25MetadeCota); // p3y
  }
  dw4_patchTextoNoOffset(arr, dw4_offCota(5) + 35, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, dw4_offCota(4) + 35, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, dw4_offCota(3) + 35, "10", cotaCamada);
  dw4_patchTextoNoOffset(arr, dw4_offCota(2) + 35, "10", cotaCamada);
  dw4_patchTextoNoOffset(arr, dw4_offCota(1) + 35, "15", cotaAdjacente);
  dw4_patchTextoNoOffset(arr, dw4_offCota(0) + 35, "15", cotaAdjacente);

  // Seção 2.2: registro de referência isolado (achado sessão 2026-09-10) — removido por
  // assinatura de bytes (opcode 0b,03 + floats do 1º ponto), não por offset fixo, porque essa
  // região pode deslocar com mudanças de texto mais cedo no arquivo. Rodando aqui no fim (não
  // no meio) pelo mesmo motivo do bloco de pares N2 acima.
  //
  // CORRIGIDO (sessão 2026-09-12): o resto do mecanismo original (remoção de um "colchete" de
  // 3 segmentos em ancora+82/+102/+122, mais até 8 "linhas de hachura" em ancora+142..+406, e
  // uma remoção adicional em ancora+1143 pra Nr alto) foi REMOVIDO — não era hachura nenhuma,
  // era a grade da tabela ARMADURA DE COLAPSO (achado com arquivo real: usuário reportou "a
  // tabela de armadura de colapso foi apagado algumas linhas", enviou o arquivo corrigido à
  // mão no S4CAD com as 3 linhas do canto superior esquerdo da grade de volta). Decodificando
  // ancora+82/+102/.../+406 no template atual, TODOS caem em pontos com x∈[36,43]/y∈[-11,-8] —
  // exatamente a borda da tabela (3 segmentos do canto + 7 linhas horizontais de separação de
  // linha), nada a ver com Seção 2.2. E ancora+1143 nem cai no início de um registro 0b,03 (cai
  // no meio de um float, byte "2a42") — teria corrompido o arquivo se algum teste alguma vez
  // tivesse Nr alto o bastante pra disparar essa remoção (nunca aconteceu até agora). O desenho
  // dessa tabela NUNCA precisou de remoção condicional por Nr — ela sempre mostra as 6 linhas
  // (uma por bitola), e não há evidência de que precise perder linhas pra nenhum Nr; só a
  // remoção do registro de referência isolado (ancora+0) continua confirmada e é mantida.
  {
    // bytes exatos lidos diretamente do template (não reconstruídos a partir do decimal
    // arredondado "18.211"/"10.629" — o float real é 18.21059226989746/10.62945556640625,
    // e reconstruir do literal arredondado dá bytes diferentes, fazendo a busca falhar)
    const hachuraAncoraBytes = [0x0b, 0x03, 0x4b, 0xaf, 0x91, 0x41, 0x40, 0x12, 0x2a, 0x41];
    const hachuraAncoraOff = dw4_encontrarSequencia(arr, hachuraAncoraBytes);
    if (hachuraAncoraOff !== -1) {
      arr.splice(hachuraAncoraOff, 20);
    }
  }

  // pilar circular (sessão 2026-09-14, ver dw4_criarContornoCircular acima pro achado completo)
  // — tem que rodar bem no FINAL, depois de tudo mais: remover DW4_OFF_CONTORNO (offset bem no
  // início do arquivo) mais cedo desalinharia TODOS os offsets fixos usados pelo resto da
  // função (mesmo motivo pelo qual a remoção de hachura/zigzag também só roda aqui). cx0/cy0
  // são os mesmos já lidos do contorno quadrado lá em cima, antes de reposicionarTudo.
  if (inp.formaCircular) {
    arr.splice(DW4_OFF_CONTORNO, 28);
    arr.push(...dw4_criarContornoCircular(cx0, cy0, inp.diametro / 2));
  }

  // pilar de borda (sessão 2026-09-15, ver comentário perto de dw4_reposicionarTudo acima) —
  // remoção de verdade do marcador N2 do lado +Y, confirmada contra AJUSTADO.DW4 real do
  // usuário. Ordem DESCENDENTE (offset maior primeiro), mesmo motivo de sempre: remover o de
  // offset menor (770) primeiro invalidaria o de offset maior (1163). Tamanhos confirmados por
  // decodificação: grupo TXT200e+4×SEG0b0d (1163→1268) = 105 bytes; os 3 PT extras (0.9/1.5/2.1,
  // 770→914) = 144 bytes (48B cada). Os 3 PT do lado -Y (914→1058, y=-2.1/-1.5/-0.9) ficam.
  // pilar de borda: remove o lado DIREITO (sem laje) da Seção 2.2 — o template desenha o corte
  // simétrico dos 2 lados (herdado do pilar central), mas o lado sem laje não deveria ter nem
  // "caixa de corte" nem cota nenhuma ali. Confirmado contra AJUSTADO 1.DW4 real do usuário
  // (sessão 2026-09-15, builds on AJUSTADO): removidos de verdade (arquivo 10 registros mais
  // curto que AJUSTADO). Offsets ORIGINAIS (antes de qualquer shift de nome/N3-N6) confirmados
  // por decodificação de uma geração limpa e cruzados com os offsets 3623/3671 já usados mais
  // acima (deltaAlturaEstriboY, "N4"/"N3") — por isso passam por dw4_shiftPorNome aqui, já que
  // rodam DEPOIS dos patches de texto que podem ter deslocado tudo isso. Roda ANTES do splice do
  // marcador N2 (bloco seguinte) — como os offsets aqui são todos > que os do N2 (770/1163),
  // fazer nessa ordem evita ter que somar o delta do splice do N2 em cima do shiftPorNome.
  if (inp.tipoPilar === "B") {
    // ACHADO 2026-09-15 (arquivo real ap=80/bp=25 travando o S4 real, "comando 139/140" —
    // arquivo danificado): SÓ os 3 registros COTA "15/15/10" da cota de espaçamento (a que fica
    // acima, y~9.6, junto da malha/reforço) ficam DEPOIS do label "{ap}x{bp}" no arquivo — os
    // outros 4 (COTA "25" geral + os 3 PT do corte em X) ficam ANTES dele, então esses 4
    // continuam usando só dw4_shiftPorNome normalmente (confirmado comparando um arquivo limpo
    // ap=100 pré-remoção: label em 4888, COTA "25" em 4797 e os PT em 4653-4749 — todos MENORES
    // que 4888; só as 3 COTA "15/15/10" em 5245-5323 são MAIORES). O comprimento do label varia
    // (6 chars em "100x25", só 5 em "80x25"/"60x30" — igual ao default do template "25x60") e
    // dw4_shiftPorNome não sabia disso (só rastreava nome/N3-N6) — os 3 offsets abaixo
    // (derivados só do caso ap=100) ficavam 1 byte errados pra qualquer ap que não desse
    // exatamente 6 caracteres de label, causando uma cascata de desalinhamento (registros
    // "sumindo" na decodificação, arquivo danificado no S4 real). Corrigido usando
    // dw4_idxLabelApBp/dw4_primeiroOffsetCota (achados por busca de conteúdo — imunes a QUALQUER
    // deslocamento anterior) como âncora só pra esses 3. TENTATIVA ANTERIOR (mesma sessão) usava
    // dw4_idxLabelApBp (o INÍCIO do label) + uma distância fixa "357/396/435" tirada só do caso
    // ap=100 (label de 6 chars) — só que essa distância em si EMBUTIA o comprimento do label
    // (357 = 6 + 351), então continuava ap=100-específica, e continuava quebrando PLANTA BAIXA
    // pra ap=80 (label de 5 chars, offset 1 byte cedo demais). Corrigido usando
    // dw4_primeiroOffsetCota (que JÁ soma dw4_idxLabelApBp + comprimento do label, ver definição
    // acima) — esses 3 registros são literalmente os índices 9/10/11 do MESMO bloco de 12 cotas
    // do bug#1 (stride 39, já usado por dw4_offCota mais abaixo pra ESCREVER os valores) —
    // então reusa dw4_offCota diretamente em vez de reinventar a conta.
    const offCota15b = dw4_offCota(11); // COTA "15" (cota de espaçamento direita)
    const offCota15a = dw4_offCota(10); // COTA "15"
    const offCota10 = dw4_offCota(9); // COTA "10"
    const offCota25 = 4799 + dw4_shiftPorNome(4799); // COTA "25" (cota geral direita) — antes do label
    const offPt417 = 4751 + dw4_shiftPorNome(4751); // PT 41.7,4.068 ("corte em X" direito) — antes do label
    const offPt411 = 4703 + dw4_shiftPorNome(4703); // PT 41.1,4.068 — antes do label
    const offPt405 = 4655 + dw4_shiftPorNome(4655); // PT 40.5,4.068 — antes do label
    // os 3 pontos PT 3623/3671/3719 (mesmos usados por deltaAlturaEstriboY, "N4"/"N3" acima) NÃO
    // são removidos — no arquivo real ficam no lugar, só com X diferente (mesmo Y de sempre),
    // representando o símbolo de "borda livre" (quebra) em vez do X inteiro do corte. Valores
    // exatos tirados do AJUSTADO 1.DW4 real (só X muda, Y confirmado idêntico ao original nos 3).
    const offP1 = 3623 + dw4_shiftPorNome(3623);
    const offP2 = 3671 + dw4_shiftPorNome(3671);
    const offP3 = 3719 + dw4_shiftPorNome(3719);
    const offSeg03baixo = 3603 + dw4_shiftPorNome(3603); // SEG0b03 horizontal direito (baixo)
    const offSeg03cima = 3583 + dw4_shiftPorNome(3583); // SEG0b03 horizontal direito (cima)
    const offSeg2f = 3565 + dw4_shiftPorNome(3565); // SEG2F2f03 vertical direito
    // o segmento vertical em 3444 (3.9079→3.3079) NÃO é removido — em vez disso estende pra
    // cima até onde o segmento-irmão de 3404 (4.9079→5.5079) começa, unindo numa linha só
    // (confirmado no arquivo real: 1 linha contínua em vez de 2 pedaços separados pela "caixa"
    // que só existia por causa do lado direito removido).
    const offSegAcima = 3404 + dw4_shiftPorNome(3404);
    const offSegAbaixo = 3444 + dw4_shiftPorNome(3444);

    // ACHADO 2026-09-15 (2º arquivo real, ap=100/bp=25, pares-extras=2 — "ajustei a Seção 1.1"):
    // a cota de espaçamento junto da malha/reforço (registros 0-5 do MESMO bloco de 12 cotas do
    // bug#1, "15/15/10/10/15/15", logo em seguida ao label "{ap}x{bp}") precisa de deslocamento
    // em X (só X — Y confirmado inalterado) igual e de sinal oposto ao "off" do par NATIVO/
    // template (mesma variável `offParTemplateN2` já usada em outros lugares pro par nativo).
    // ACHADO 2026-09-16 (3º arquivo real, 3 pares): a versão anterior usava um "+0,8" FIXO,
    // que só por coincidência batia com o caso de 2 pares testado até então — com 2 pares o par
    // "template" (índice 0 de 2) fica DESCENTRADO (off≠0), mas com 3 pares o template é o do
    // MEIO (índice 1 de 3, off=0) e não deveria deslocar nada. Generalizado usando o off real do
    // par template em vez de um valor fixo — 0 automaticamente quando ele já está centrado
    // (qualquer nº ÍMPAR de pares), preserva os 2 casos reais já confirmados (+0,8 pra 2 pares,
    // 0 pra 3 pares).
    if (paresN2 > 1) {
      const offParTemplateN2Cota = -offsetsN2[Math.floor((paresN2 - 1) / 2)] / 25;
      for (let idxCota = 0; idxCota <= 5; idxCota++) {
        const offCotaMalha = dw4_offCota(idxCota);
        for (const campo of [2, 10, 18]) { // p1x, p2x, p3x (p1y/p2y/p3y não mudam)
          dw4_escreverFloat32(arr, offCotaMalha + campo, dw4_lerFloat32(arr, offCotaMalha + campo) + offParTemplateN2Cota);
        }
      }
    }

    // agora sim: escreve o valor lido (não muda tamanho, pode rodar em qualquer ordem) e remove
    // tudo mais em ordem DESCENDENTE de offset real.
    dw4_escreverFloat32(arr, offSegAbaixo + 6, dw4_lerFloat32(arr, offSegAcima + 6));
    // ACHADO 2026-09-16 (arquivo real Nr=7, comprimento do porta-estribo Y corrigido pro round
    // anterior de 96 pra 127cm): P1/P2 (símbolo de "borda livre") tinham X fixo (38.0765),
    // calibrado só pro caso C=96 — na verdade acompanha o comprimento (X = 39.9965 - compY/50,
    // achado comparando os 2 valores reais C=96→X=38.0765 e C=127→X=37.4565, mesma âncora exata
    // nos 2). P3 continua fixo (não muda entre as 2 amostras, é de outro eixo).
    const dw4_xBordoLivreY = 39.9965 - compY / 50;
    dw4_escreverFloat32(arr, offP1 + 2, dw4_xBordoLivreY);
    dw4_escreverFloat32(arr, offP2 + 2, dw4_xBordoLivreY);
    dw4_escreverFloat32(arr, offP3 + 2, 39.1965);
    for (const [off, tam] of [
      [offCota15b, 39],
      [offCota15a, 39],
      [offCota10, 39],
      [offCota25, 39],
      [offPt417, 48],
      [offPt411, 48],
      [offPt405, 48],
      [offSeg03baixo, 20],
      [offSeg03cima, 20],
      [offSeg2f, 18],
    ].sort((a, b) => b[0] - a[0])) {
      arr.splice(off, tam);
    }
  }

  // pilar de borda: o marcador "N2" (indicação do estribo no sentido Y) do lado +Y não deve
  // existir — esse lado é a face livre (sem laje), não tem estribo nenhum ali pra apontar. O
  // template (herdado do pilar central) sempre desenha os 2 grupos, incluindo os 3 pontos PT
  // extras (0.9/1.5/2.1) exclusivos desse grupo. CONFIRMADO com arquivo real hand-corrigido pelo
  // usuário (AJUSTADO.DW4, sessão 2026-09-15): o S4CAD de verdade REMOVE esses registros de
  // verdade (arquivo 8 registros mais curto), não deixa "em branco" no lugar.
  if (inp.tipoPilar === "B") {
    // offsets < 770, então imunes ao deslocamento de nome/N3-N6 (ambos > 2947) — mas NÃO imunes
    // à legenda solta N1/N2 (achado sessão 2026-09-23, ver dw4_patchTexto acima, offset original
    // 606/698, ou seja ANTES destes dois splices), que precisa entrar na conta aqui. Achado
    // comparando contra AJUSTADO real: sem essa soma, um PT do lado -Y virava um TXT200e de texto
    // vazio (desalinhamento de 1 byte sempre que C=/Q= mudar de quantidade de dígitos).
    arr.splice(1163 + dw4_deltaN1N2Malha, 105);
    arr.splice(770 + dw4_deltaN1N2Malha, 144);
  }

  arr.push(dw4MarcadorFim); // recoloca o marcador de fim, agora depois de TUDO anexado
  return arr;
}

// Tabela "ARMADURA DE COLAPSO" do template RADIAL — achada sessão 2026-09-26 decodificando o
// template nativo (P10) diretamente, MESMA estrutura/mesmos textos nativos do DW4_TABELA_COLAPSO
// do template interno/cruz (BIT fixo, só QUANT/COMP(X)/COMP(Y) mudam), mas com offsets DIFERENTES
// (template completamente separado). offsets = offset do registro TXT1f13 (opcode 0x1f,0x13) + 23,
// ou seja apontando pro byte de slen (que dw4_patchTextoNoOffset trata como prefixo LE de 2 bytes —
// funciona porque o byte seguinte, de padding, é sempre 0). Um objeto por índice de DIAMS_COL
// (0=6.3 ... 5=20), mesma ordem de r.complementoColapso. Offsets NATIVOS (antes do splice da
// fileira de cotas) — precisam somar deltaCotaRow no uso (ver gerarArquivoS4CircularRadial).
const DW4_TABELA_COLAPSO_RADIAL = [
  { quantOff: 1719 + 23, quantDe: "20", compXOff: 1957 + 23, compXDe: "163 CM", compYOff: 2298 + 23, compYDe: "163 CM" }, // 6.3
  { quantOff: 1746 + 23, quantDe: "13", compXOff: 1988 + 23, compXDe: "174 CM", compYOff: 2267 + 23, compYDe: "174 CM" }, // 8.0
  { quantOff: 1773 + 23, quantDe: "16", compXOff: 2019 + 23, compXDe: "187 CM", compYOff: 2236 + 23, compYDe: "187 CM" }, // 10.0
  { quantOff: 1693 + 23, quantDe: "5", compXOff: 2050 + 23, compXDe: "204 CM", compYOff: 2205 + 23, compYDe: "204 CM" }, // 12.5
  { quantOff: 1667 + 23, quantDe: "4", compXOff: 2081 + 23, compXDe: "227 CM", compYOff: 2174 + 23, compYDe: "227 CM" }, // 16.0
  { quantOff: 1641 + 23, quantDe: "2", compXOff: 2112 + 23, compXDe: "254 CM", compYOff: 2143 + 23, compYDe: "254 CM" }, // 20.0
];

// Pilar circular + padraoArmadura="radial" — achado/implementado sessão 2026-09-25, ver memória
// do projeto (dw4_pilar_circular_radial) pro levantamento completo. Usa um template NOVO e
// SEPARADO (DW4_TEMPLATE_RADIAL_B64, baseado em arquivo real P10 Ø40cm/Nr=4/N=8), não o template
// de pilar interno/cruz — geometria e convenções completamente diferentes, sem RECT de estribo.
// Cobre a planta baixa (raios "barra cobra" + legenda "N1 {N}#{diam} C={C}" + contorno do círculo +
// nome do pilar), a Seção 1.1 (elevação em zigue-zague) e agora também a tabela "ARMADURA DE
// COLAPSO" (sessão 2026-09-26, reaproveitando r.complementoColapso — já calculado e usado pelo
// template interno/cruz). Gaps conhecidos que PERMANECEM: largura da caixa do "corte da laje" e a
// posição da seta "N1" da malha negativa não escalam certo pra h≠20/25 ou Nr≠4 (ver memória do
// projeto) — cosmético, não corrompe o arquivo.
function gerarArquivoS4CircularRadial(inp, r) {
  const arr = dw4_base64ParaBytes(DW4_TEMPLATE_RADIAL_B64);
  const cx0 = 19.78;
  const cy0 = 0.0; // mesma convenção de centro já usada pro pilar circular em cruz

  // contorno do círculo — registro nativo (RECT, tail 03 00) em offset fixo do template; campos
  // f3/f4 (raio, ambos) na mesma convenção de dw4_criarContornoCircular
  const OFF_CIRCULO = 2393;
  const raioCirculoFU = inp.diametro / 2 / 25;
  dw4_escreverFloat32(arr, OFF_CIRCULO + 10, raioCirculoFU);
  dw4_escreverFloat32(arr, OFF_CIRCULO + 14, raioCirculoFU);

  const N = Math.max(1, Math.round(r.nBarrasRadial));
  const Nr = r.Nr;
  const comprimentoRadialCm = 2 * r.primeiraCamada + (Nr - 1) * r.Sr;
  const comprimentoRadialFU = comprimentoRadialCm / 25;
  const alturaRamo = Math.floor((inp.h - 2 * inp.cobrimento - inp.diamMalha / 10) * 2) / 2;

  // caixa do "corte da laje" (envolve o zigue-zague da malha negativa) — só campos Y mudam (X é
  // fixo, achado sessão 2026-09-26), tudo em-lugar (sem mudar tamanho, pode rodar em qualquer
  // ordem). Ver dw4_secao11CorteConstantes.
  const { boxTopY, boxBottomY } = dw4_secao11CorteConstantes(inp.h);
  for (const off of [401, 593]) { dw4_escreverFloat32(arr, off + 6, boxTopY); dw4_escreverFloat32(arr, off + 14, boxTopY); }
  for (const off of [421, 613]) { dw4_escreverFloat32(arr, off + 6, boxBottomY); dw4_escreverFloat32(arr, off + 14, boxBottomY); }
  dw4_escreverFloat32(arr, 441 + 6, boxTopY); dw4_escreverFloat32(arr, 441 + 14, boxBottomY);
  dw4_escreverFloat32(arr, 459 + 6, boxTopY); dw4_escreverFloat32(arr, 459 + 14, boxBottomY);
  for (const off of [477, 497]) { dw4_escreverFloat32(arr, off + 6, boxTopY); dw4_escreverFloat32(arr, off + 14, boxTopY + 0.6); }
  for (const off of [517, 537]) { dw4_escreverFloat32(arr, off + 6, boxBottomY); dw4_escreverFloat32(arr, off + 14, boxBottomY - 0.6); }
  dw4_escreverFloat32(arr, 557 + 6, boxBottomY - 0.6); dw4_escreverFloat32(arr, 557 + 14, boxBottomY - 0.6);
  dw4_escreverFloat32(arr, 575 + 6, boxTopY + 0.6); dw4_escreverFloat32(arr, 575 + 14, boxTopY + 0.6);
  dw4_escreverFloat32(arr, 661 + 6, boxTopY); dw4_escreverFloat32(arr, 661 + 14, boxBottomY); dw4_escreverFloat32(arr, 661 + 22, boxBottomY);
  const hTxt = String(Math.round(inp.h));
  if (hTxt.length === 2) { arr[661 + 37] = hTxt.charCodeAt(0); arr[661 + 38] = hTxt.charCodeAt(1); }

  // título "SEÇÃO 1.1"/"ESC. 1:25" + a linha superior da moldura externa (offsets 699/733/753,
  // todos ANTES do splice da fileira de cotas, então ficam em posição fixa) — achado com o 4º
  // arquivo real (h=30): só sobem quando a caixa PRECISA de mais espaço (boxTopY > o nativo de
  // h=25), nunca descem quando a caixa encolhe (h=20 não mexeu neles, confirmado byte-exato) —
  // aparenta ser um "clamp" real do S4CAD, não uma fórmula contínua.
  const tituloShiftFU = Math.max(0, boxTopY - (7.1041 + 25 / 50));
  if (tituloShiftFU !== 0) {
    dw4_escreverFloat32(arr, 700 + 6, dw4_lerFloat32(arr, 700 + 6) + tituloShiftFU);
    dw4_escreverFloat32(arr, 754 + 6, dw4_lerFloat32(arr, 754 + 6) + tituloShiftFU);
    dw4_escreverFloat32(arr, 734 + 6, dw4_lerFloat32(arr, 734 + 6) + tituloShiftFU);
    dw4_escreverFloat32(arr, 734 + 14, dw4_lerFloat32(arr, 734 + 14) + tituloShiftFU);
  }

  // fileira de cotas acima da caixa (ver dw4_criarFileiraCota) — bloco nativo cobre Nr=4 (6
  // registros, incompletos — só regenerada do zero, mesmo espírito das outras peças da Seção 1.1).
  // Tem que rodar ANTES de tudo que vem depois no arquivo (todos os offsets abaixo somam o delta).
  const OFF_COTA_ROW_NATIVO = 936;
  const TAM_BLOCO_COTA_ROW_NATIVO = 234; // 6×39B (Nr=4 nativo, incompleto)
  const pillarLeftFU0 = CX_ESTRIBO - raioCirculoFU;
  const pillarRightFU0 = CX_ESTRIBO + raioCirculoFU;
  const novaCotaRow = [
    ...dw4_criarFileiraCota(pillarLeftFU0 - comprimentoRadialFU, boxTopY, r.primeiraCamada, r.Sr, Nr, inp.h),
    ...dw4_criarFileiraCota(pillarRightFU0, boxTopY, r.primeiraCamada, r.Sr, Nr, inp.h),
  ];
  arr.splice(OFF_COTA_ROW_NATIVO, TAM_BLOCO_COTA_ROW_NATIVO, ...novaCotaRow);
  const deltaCotaRow = novaCotaRow.length - TAM_BLOCO_COTA_ROW_NATIVO;

  // tabela "ARMADURA DE COLAPSO" — dados calculados (r.complementoColapso, mesma ordem de
  // DIAMS_COL, já usado pelo template interno/cruz). BIT é fixo no template (igual DIAMS_COL), só
  // QUANT/COMP(X)/COMP(Y) mudam. Roda em ordem decrescente de offset dentro da tabela (mesma
  // cautela do template interno/cruz — patches de tamanho variável não podem invalidar os offsets
  // ainda não processados). Precisa rodar DEPOIS do splice da fileira de cotas (soma deltaCotaRow)
  // e ANTES do zigue-zague/malha/leader/raios (que ficam mais adiante no arquivo) — deltaColapso
  // resultante soma nos offsets deles.
  let deltaColapso = 0;
  if (r.complementoColapso && r.complementoColapso.length === DW4_TABELA_COLAPSO_RADIAL.length) {
    const celulasColapso = [];
    DW4_TABELA_COLAPSO_RADIAL.forEach((cel, i) => {
      const dado = r.complementoColapso[i];
      celulasColapso.push({ off: cel.compYOff, de: cel.compYDe, novo: `${Math.round(dado.comprimentoMinY)} CM` });
      celulasColapso.push({ off: cel.compXOff, de: cel.compXDe, novo: `${Math.round(dado.comprimentoMinX)} CM` });
      celulasColapso.push({ off: cel.quantOff, de: cel.quantDe, novo: String(dado.n) });
    });
    celulasColapso.sort((a, b) => b.off - a.off);
    for (const { off, de, novo } of celulasColapso) {
      if (dw4_patchTextoNoOffset(arr, off + deltaCotaRow, de, novo)) deltaColapso += novo.length - de.length;
    }
  }

  // Seção 1.1 (zigue-zague "Estribo") — bloco nativo cobre Nr=4 (9 segmentos + 9 rótulos, ver
  // dw4_criarZigzagEstribo), substituído do zero pra qualquer Nr. Offsets deste ponto em diante
  // somam deltaCotaRow + deltaColapso (splices acima já rodaram e podem ter mudado de tamanho).
  const OFF_ZIGZAG_NATIVO = 2453 + deltaCotaRow + deltaColapso;
  const TAM_BLOCO_ZIGZAG_NATIVO = 423; // 9×20B SEG0b0e + 9×27B TXT1f1e (Nr=4 nativo)
  const novoZigzag = dw4_criarZigzagEstribo(r.primeiraCamada, r.Sr, alturaRamo, Nr);
  arr.splice(OFF_ZIGZAG_NATIVO, TAM_BLOCO_ZIGZAG_NATIVO, ...novoZigzag);
